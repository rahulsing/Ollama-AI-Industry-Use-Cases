<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollama AI Industry Use Cases</title>
<meta name="description" content="Explore simple, local AI agents for Banking, Retail and Insurance: the business problem, how the AI solves it, and the code.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f0f2f5; --text: #1b1f24; --muted: #5b6573;
    --border: #e1e5ea; --accent: #4f46e5; --accent-soft: #eef0ff; --crew: #e8553f; --lc: #1f6f5c;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08); --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --text: #e7eaf0; --muted: #9aa4b2;
      --border: #2a2f3a; --accent: #8b85ff; --accent-soft: #23234a; --crew: #ff7a66; --lc: #4cc3a3;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 18px; color: var(--text); }
  .brand span { color: var(--muted); font-weight: 500; font-size: 14px; margin-left: 6px; }
  .top nav a { margin-left: 16px; font-size: 14px; }
  .hero { padding: 28px 0 20px; }
  .hero h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 34px); line-height: 1.2; }
  .hero p { margin: 0; color: var(--muted); max-width: 760px; }
  .stats { display: flex; gap: 18px; margin-top: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .stats b { color: var(--text); font-size: 18px; margin-right: 4px; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 0; scrollbar-width: none; }
  .tab { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

  .controls { display: flex; gap: 10px; align-items: center; margin: 18px 0 8px; flex-wrap: wrap; }
  .search { flex: 1 1 260px; position: relative; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search::before { content: "🔎"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: .7; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 14px; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .about-link { font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; padding-bottom: 40px; }
  .card { display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); cursor: pointer; color: inherit; font: inherit; transition: transform .12s, border-color .12s; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .card .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .card h3 { margin: 0; font-size: 16px; line-height: 1.35; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
  .badge.CrewAI { color: var(--crew); }
  .badge.LangChain { color: var(--lc); }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; grid-column: 1 / -1; }

  .detail { padding: 22px 0 50px; }
  .back { display: inline-block; margin-bottom: 14px; font-size: 14px; }
  .detail h1 { margin: 0 0 4px; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.25; }
  .crumbs { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
  .panel h2 { margin: 0 0 10px; font-size: 17px; }
  .panel p { margin: 0 0 10px; }
  .panel dl { margin: 0; }
  .panel dt { font-weight: 600; }
  .panel dd { margin: 0 0 12px; color: var(--muted); }
  .full { grid-column: 1 / -1; }
  @media (min-width: 801px) { .terms dl, .glossary-group dl { columns: 2; column-gap: 32px; } .terms dt, .glossary-group dt { break-after: avoid; } .terms dd, .glossary-group dd { break-before: avoid; } }
  .run { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .run code { flex: 1 1 260px; display: block; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
  button.btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  button.btn:hover { border-color: var(--accent); }
  .code-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  pre { margin: 0; max-height: 640px; overflow: auto; border-radius: 10px; border: 1px solid var(--border); }
  pre code { display: block; padding: 14px; font-size: 13px; line-height: 1.5; background: var(--surface-2); white-space: pre; }
  pre code.hljs { background: var(--surface-2); }
  .md ol, .md ul { padding-left: 22px; margin: 6px 0 10px; }
  .glossary-group h3 { margin: 16px 0 6px; font-size: 15px; }
  .glossary-search { margin: 6px 0 4px; }
  .note { font-size: 13px; color: var(--muted); }
  .flow { overflow-x: auto; text-align: center; padding: 6px 0; }
  .flow svg { max-width: 100%; height: auto; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .demo { padding: 0; overflow: hidden; }
  .demo-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); flex-wrap: wrap; }
  .demo-head h2 { margin: 0; font-size: 17px; }
  .demo-head .model { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
  .chat { padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 120px; max-height: 680px; overflow-y: auto; }
  @media (max-width: 600px) { .chat { max-height: 70vh; padding: 14px 12px; } .avatar { width: 26px; height: 26px; font-size: 14px; } }
  .chat .placeholder { margin: auto; color: var(--muted); font-size: 14px; text-align: center; }
  .msg-user { align-self: flex-end; max-width: 85%; background: var(--accent); color: #fff; border-radius: 16px 16px 4px 16px; padding: 9px 14px; }
  .msg-bot { align-self: stretch; display: flex; gap: 10px; max-width: 100%; }
  .avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; background: #1f2937; display: grid; place-items: center; font-size: 17px; }
  .bubble { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; padding: 10px 14px; }
  .bubble .who { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .steps { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .steps:empty { display: none; }
  .step summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 3px 0; display: flex; align-items: center; gap: 6px; }
  .step summary::-webkit-details-marker { display: none; }
  .step summary::after { content: "▸"; margin-left: 2px; opacity: .6; }
  .step[open] summary::after { content: "▾"; }
  .step .st { width: 16px; display: inline-grid; place-items: center; }
  .step .ok { color: #16a34a; font-weight: 700; }
  .step .body { margin: 4px 0 8px 22px; padding: 8px 12px; border-left: 2px solid var(--border); font-size: 13px; }
  .step .body pre { max-height: 280px; }
  .spin { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  .thinking { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .answer.typing > :last-child::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: 0; } }
  .asks { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 18px 0; border-top: 1px solid var(--border); }
  .asks .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.done::before { content: "✓ "; }
  .composer { display: flex; gap: 8px; padding: 12px 18px; flex-wrap: wrap; }
  .asks + .composer { padding-top: 8px; }
  .composer:first-child, .chat + .composer { border-top: 1px solid var(--border); }
  .composer .ask { flex: 1 1 280px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; min-height: 42px; }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0 18px; min-height: 42px; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .6; cursor: progress; }
  .demo-foot { padding: 0 18px 14px; margin: 0; }
  .md pre { margin: 6px 0; }
  @media (prefers-reduced-motion: reduce) { .spin, .answer.typing > :last-child::after { animation: none; } }
  .md h4 { margin: 12px 0 4px; font-size: 15px; }
  .md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .md hr { border: 0; border-top: 1px solid var(--border); }
  details.how { margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; }
  details.how summary { cursor: pointer; font-weight: 600; }
  .lab-banner { display: flex; align-items: center; gap: 14px; background: var(--accent-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin: 14px 0 0; color: var(--text); flex-wrap: wrap; }
  .lab-banner:hover { text-decoration: none; border-color: var(--accent); }
  .lab-banner b { color: var(--accent); }
  .badge.lab { color: var(--accent); }
  .callout { background: var(--accent-soft); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
  .scores { display: grid; grid-template-columns: 28px 1fr; gap: 8px; margin: 6px 0 4px; }
  .yaxis { position: relative; height: 200px; font-size: 12px; color: var(--muted); }
  .yaxis span { position: absolute; right: 0; transform: translateY(50%); }
  .plot { position: relative; height: 200px; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 10px; align-items: end; border-bottom: 1px solid var(--muted); }
  .plot .grid-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); pointer-events: none; }
  .bar { position: relative; height: 100%; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font: inherit; color: var(--text); }
  .bar .fill { width: 100%; max-width: 56px; background: var(--accent); opacity: .45; border-radius: 4px 4px 0 0; transition: opacity .12s; }
  .bar:hover .fill, .bar:focus-visible .fill { opacity: .7; }
  .bar[aria-pressed="true"] .fill { opacity: 1; }
  .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .bar .val { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 700; padding-bottom: 3px; }
  .bar .tip { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .1s; z-index: 2; }
  .bar:hover .tip, .bar:focus-visible .tip { opacity: 1; }
  .bar:hover .val, .bar:focus-visible .val { opacity: 0; }
  .plot .bar:nth-of-type(-n+2) .tip { left: 0; transform: none; }
  .plot .bar:nth-last-of-type(-n+2) .tip { left: auto; right: 0; transform: none; }
  .setup { overflow-wrap: anywhere; }
  .steptable td:nth-child(3) { white-space: nowrap; }
  .xlabels { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 10px; margin-left: 36px; margin-top: 6px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.3; }
  .xlabels .on { color: var(--text); font-weight: 700; }
  @media (max-width: 600px) { .xlabels .nm { display: none; } .plot, .xlabels { gap: 5px; } }
  .stepview { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; align-items: start; }
  @media (max-width: 800px) { .stepview { grid-template-columns: 1fr; } }
  .stepview h3 { margin: 0 0 6px; font-size: 16px; }
  .stepview img { width: 100%; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
  .stepnav { display: flex; gap: 8px; margin-top: 10px; }
  button.btn:disabled { opacity: .5; cursor: default; }
  .steptable tr.on td { background: var(--accent-soft); }
  footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; padding: 18px 0 30px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="#/">🦙 Ollama AI Industry Use Cases <span>CrewAI · LangChain</span></a>
      <nav><a id="repo-link" href="#">GitHub repo</a><a id="readme-link" href="#">README</a></nav>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    Sample data is fictional and calculations are simplified for learning; not professional advice.
    Run any solution locally with Ollama: see the <a id="footer-readme" href="#">README</a>. MIT licensed.
  </div>
</footer>

<script id="data" type="application/json">__DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const IND = Object.fromEntries(DATA.industries.map(d => [d.folder, d]));
const ALL = DATA.industries.flatMap(d => d.use_cases.map(u => ({ ...u, ind: d })));
const LABS = DATA.labs || [];
const RAW = DATA.repo.replace("https://github.com/", "https://raw.githubusercontent.com/") + "/main";  // lab screenshots
const app = document.getElementById("app");
const state = { industry: "all", category: "all", query: "" };

document.getElementById("repo-link").href = DATA.repo;
for (const id of ["readme-link", "footer-readme"]) document.getElementById(id).href = DATA.repo + "#readme";

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Minimal markdown: paragraphs, headings, numbered/bullet lists, tables, rules, **bold**, *italic*, `code`
function md(text) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>");
  const out = [];
  let list = null, table = null;
  const endList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const endTable = () => {
    if (!table) return;
    const rows = table.filter(r => !/^\|?[\s:|-]+\|?$/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim())));
    out.push(`<table>${rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("")}</table>`);
    table = null;
  };
  let fence = null;
  for (const line of text.split("\n")) {
    if (/^\s*```/.test(line)) {
      if (fence) { out.push(`<pre><code>${esc(fence.join("\n"))}</code></pre>`); fence = null; }
      else { endList(); endTable(); fence = []; }
      continue;
    }
    if (fence) { fence.push(line); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) { endList(); (table ??= []).push(line.trim()); continue; }
    endTable();
    const h = line.match(/^\s*#{1,6}\s+(.*)$/);
    if (h) { endList(); out.push(`<h4>${inline(h[1])}</h4>`); continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { endList(); out.push("<hr>"); continue; }
    const m = line.match(/^\s*(\d+\.|[-*•])\s+(.*)$/);
    if (m) {
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (list !== tag) { if (list) out.push(`</${list}>`); out.push(`<${tag}>`); list = tag; }
      out.push(`<li>${inline(m[2])}</li>`);
    } else {
      if (list) { out.push(`</${list}>`); list = null; }
      if (line.trim()) out.push(`<p>${inline(line)}</p>`);
    }
  }
  if (fence) out.push(`<pre><code>${esc(fence.join("\n"))}</code></pre>`);
  endTable();
  endList();
  return `<div class="md">${out.join("")}</div>`;
}

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict",
  fontFamily: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" });
let flowId = 0;
async function drawFlows() {
  for (const el of app.querySelectorAll(".flow[data-src]")) {
    try { el.innerHTML = (await mermaid.render(`flow${++flowId}`, el.dataset.src)).svg; }
    catch { el.innerHTML = `<pre><code>${esc(el.dataset.src)}</code></pre>`; }  // no CDN: show the source
  }
}
const flowBox = (src, label) => `<div class="flow" data-src="${esc(src)}" role="img" aria-label="${esc(label)}"></div>
  <div class="legend">${esc(DATA.legend)}</div>`;

// ------------------------------------------------------------------ "Try it": replay a recorded run
// Everything shown is from a real run of app.py (scripts/capture_samples.py); only the timing is replayed.
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let demo = null;

function demoHtml(d, u) {
  const c = u.chat;
  if (!c) return "";
  const asks = c.turns.length > 1 ? `<div class="asks" role="group" aria-label="Questions">${c.turns.map((t, i) =>
    `<button class="chip" data-turn="${i}" aria-pressed="${i === 0}" title="${esc(t.ask)}">${esc(t.ask)}</button>`).join("")}</div>` : "";
  const took = c.seconds ? `The real run took ${c.seconds} s on a laptop GPU; the replay is sped up. ` : "";
  return `<section class="panel full demo" id="demo">
    <div class="demo-head"><h2>▶ Try it</h2>
      <span class="model"><span class="dot"></span>🦙 Ollama · <code>${esc(c.model)}</code> · local</span></div>
    <div class="chat" id="chat" aria-live="polite">
      <div class="placeholder">Press <strong>▶ Run</strong> to ask the ${esc(u.title)} and watch it work.<br>
        <span class="note">A replay of a real recorded run: the same question, steps and answer you'd get locally.</span></div></div>
    ${asks}
    <div class="composer"><div class="ask" id="ask"></div>
      <button class="primary" id="run">▶ Run</button></div>
    <p class="note demo-foot">${took}LLM wording varies between runs; the numbers from Python don't.
      Run it yourself: <code>python ${esc(d.folder)}/${esc(u.slug)}/app.py</code></p></section>`;
}

function initDemo(u) {
  if (!u.chat) return;
  const turns = u.chat.turns;
  const $ = id => document.getElementById(id);
  const chat = $("chat"), run = $("run"), ask = $("ask");
  const state = demo = { sel: 0, busy: false, skip: null, done: new Set() };
  const alive = () => demo === state && document.body.contains(chat);
  const select = i => {
    state.sel = i;
    ask.textContent = turns[i].ask;
    document.querySelectorAll("#demo .chip").forEach(b => {
      b.setAttribute("aria-pressed", String(+b.dataset.turn === i));
      b.classList.toggle("done", state.done.has(+b.dataset.turn));
    });
  };
  const wait = ms => new Promise(r => {
    if (state.skip === true || reduceMotion) return r();
    const t = setTimeout(r, ms);
    state.skip = () => { clearTimeout(t); r(); };
  });
  const scroll = () => { chat.scrollTop = chat.scrollHeight; };
  const add = html => { chat.insertAdjacentHTML("beforeend", html); scroll(); return chat.lastElementChild; };

  async function play(turn) {
    chat.querySelector(".placeholder")?.remove();
    add(`<div class="msg-user">${esc(turn.ask)}</div>`);
    await wait(350);
    const bot = add(`<div class="msg-bot"><div class="avatar" aria-hidden="true">🦙</div><div class="bubble">
      <div class="who">${esc(u.chat.model)}</div><div class="steps"></div><div class="answer md"></div></div></div>`);
    const steps = bot.querySelector(".steps"), answer = bot.querySelector(".answer");
    for (const st of turn.steps) {
      if (!alive()) return;
      const el = document.createElement("details");
      el.className = "step";
      el.innerHTML = `<summary><span class="st"><span class="spin"></span></span>${esc(st.icon)} ${esc(st.label)}</summary>
        <div class="body">${st.code ? `<pre><code>${esc(st.body)}</code></pre>` : md(st.body)}</div>`;
      steps.append(el); scroll();
      await wait(st.label.includes("agent") ? 1400 : 800);
      el.querySelector(".st").innerHTML = `<span class="ok">✓</span>`;
    }
    if (!turn.steps.length) {
      answer.innerHTML = `<div class="thinking"><span class="spin"></span> Thinking…</div>`;
      await wait(700);
    }
    const tokens = turn.answer.match(/\S+\s*/g) || [];
    const per = Math.max(1, Math.ceil(tokens.length / 180));  // about 5 s of streaming at most
    answer.classList.add("typing");
    for (let i = per; i < tokens.length && alive() && state.skip !== true && !reduceMotion; i += per) {
      answer.innerHTML = md(tokens.slice(0, i).join(""));
      scroll();
      await wait(28);
    }
    answer.classList.remove("typing");
    answer.innerHTML = md(turn.answer);
    scroll();
  }

  run.addEventListener("click", async () => {
    if (state.busy) { const s = state.skip; state.skip = true; if (typeof s === "function") s(); return; }
    if (state.done.size === turns.length) {  // everything played: start over
      state.done.clear();
      chat.innerHTML = "";
      select(0);
    }
    state.busy = true; state.skip = null;
    run.textContent = "⏭ Skip";
    await play(turns[state.sel]);
    if (!alive()) return;
    state.busy = false;
    state.done.add(state.sel);
    const next = turns.findIndex((_, i) => !state.done.has(i));
    run.textContent = next === -1 ? "↻ Replay" : "▶ Run";
    select(next === -1 ? state.sel : next);
  });
  document.querySelectorAll("#demo .chip").forEach(b => b.addEventListener("click", () => { if (!state.busy) select(+b.dataset.turn); }));
  select(0);
}

function renderTabs() {
  const tabs = [{ key: "all", label: `All (${ALL.length})` },
    ...DATA.industries.map(d => ({ key: d.folder, label: `${d.icon} ${d.name} (${d.use_cases.length})` })),
    ...(LABS.length ? [{ key: "labs", label: `🧪 Labs (${LABS.length})` }] : [])];
  document.getElementById("tabs").innerHTML = tabs.map(t =>
    `<button class="tab" role="tab" aria-selected="${state.industry === t.key}" data-ind="${t.key}">${esc(t.label)}</button>`).join("");
  document.querySelector('.tab[aria-selected="true"]')?.scrollIntoView({ block: "nearest", inline: "nearest" });
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  location.hash = b.dataset.ind === "all" ? "#/" : `#/${b.dataset.ind}`;
});

function matches(u) {
  if (state.industry !== "all" && u.ind.folder !== state.industry) return false;
  if (state.category !== "all" && u.category !== state.category) return false;
  if (!state.query) return true;
  const hay = [u.title, u.description, u.how, u.today, u.ind.name, u.ind.categories[u.category], u.framework, u.pattern, ...u.terms]
    .join(" ").toLowerCase();
  return state.query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function card(u) {
  return `<button class="card" data-link="#/${u.ind.folder}/${u.slug}">
    <div class="meta"><span>${u.ind.icon} ${esc(u.ind.name)} · ${esc(u.ind.categories[u.category])}</span><span>#${u.slug.slice(0, 2)}</span></div>
    <h3>${esc(u.title)}</h3>
    <p>${esc(u.description)}</p>
    <div class="badges"><span class="badge ${u.framework}">${u.framework}</span><span class="badge">${esc(u.pattern)}</span></div>
  </button>`;
}

function renderList() {
  const d = IND[state.industry];
  const hero = d
    ? `<div class="hero"><h1>${d.icon} ${esc(d.name)}</h1><p>${esc(d.tagline)}. ${esc(d.description)}</p>
         <p class="about-link" style="margin-top:8px"><a href="#/${d.folder}/about">🎓 New to ${esc(d.name.toLowerCase())}? How the industry works + glossary →</a></p></div>`
    : `<div class="hero"><h1>Simple AI agents for real business problems</h1>
         <p>Pick an industry, read the business problem in plain English, see how the AI solves it, and read the code.
         Every solution runs locally on an open-source model via Ollama.</p>
         <div class="stats"><span><b>${DATA.industries.length}</b>industries</span><span><b>${ALL.length}</b>solutions</span>
         <span><b>${ALL.filter(u => u.framework === "CrewAI").length}</b>CrewAI crews</span>
         <span><b>${ALL.filter(u => u.framework === "LangChain").length}</b>LangChain agents</span></div>
         <details class="how" open><summary>⚙️ How every solution works</summary>
           <p class="note">Python does the maths and rules (auditable), the AI explains and writes, and nothing leaves your machine.</p>
           ${flowBox(DATA.root_flow, "How every solution works")}</details>
         ${LABS.length ? `<a class="lab-banner" href="#/labs"><span aria-hidden="true">🧪</span><span><b>Hands-on labs:</b>
           ${esc(LABS[0].title)}. ${esc(LABS[0].tagline)}.</span><span style="margin-left:auto">Open →</span></a>` : ""}</div>`;
  const cats = d ? Object.entries(d.categories) : [];
  const chips = d ? `<div class="chips">${[["all", "All categories"], ...cats].map(([k, v]) =>
      `<button class="chip" aria-pressed="${state.category === k}" data-cat="${k}">${esc(v)}</button>`).join("")}</div>` : "";
  const items = ALL.filter(matches);
  app.innerHTML = `${hero}
    <div class="controls"><label class="search"><input id="q" type="search" placeholder="Search solutions, e.g. fraud, pricing, KYC, claims" value="${esc(state.query)}" aria-label="Search"></label></div>
    ${chips}
    <div class="grid">${items.length ? items.map(card).join("") : `<div class="empty">No solutions match your search.</div>`}</div>`;
  drawFlows();
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.query = q.value; const pos = q.selectionStart; renderList(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); });
}

app.addEventListener("click", e => {
  const c = e.target.closest("[data-link]"); if (c) { location.hash = c.dataset.link; return; }
  const chip = e.target.closest(".chip"); if (chip) { state.category = chip.dataset.cat; renderList(); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    navigator.clipboard.writeText(copy.dataset.copy).then(() => { copy.textContent = "Copied!"; setTimeout(() => copy.textContent = "Copy", 1500); });
  }
});

function renderDetail(d, u) {
  const run = `python ${d.folder}/${u.slug}/app.py`;
  const folderUrl = `${DATA.repo}/tree/main/${d.folder}/${u.slug}`;
  const terms = u.terms.map(t => `<dt>${esc(t)}</dt><dd>${esc(d.glossary[t][1])}</dd>`).join("");
  app.innerHTML = `<div class="detail">
    <a class="back" href="#/${d.folder}">← All ${esc(d.name)} solutions</a>
    <h1>${esc(u.title)}</h1>
    <div class="crumbs">${d.icon} ${esc(d.name)} · ${esc(d.categories[u.category])} ·
      <span class="badge ${u.framework}">${u.framework}</span> <span class="badge">${esc(u.pattern)}</span></div>
    <div class="cols">
      <section class="panel"><h2>${d.icon} The business problem</h2>
        <p><strong>In the business today:</strong> ${esc(u.today)}</p>
        <p><strong>Who does this work:</strong> ${esc(u.who)}</p>
        <p><strong>Why it's hard:</strong> ${esc(u.why)}</p></section>
      <section class="panel"><h2>🤖 What the AI does</h2>
        ${md(u.description)}
        <p><strong>How it works:</strong></p>${md(u.how)}</section>
      ${demoHtml(d, u)}
      <section class="panel full"><h2>🔀 How it flows</h2>${flowBox(u.flow, "Flow diagram for " + u.title)}</section>
      <section class="panel full terms"><h2>📖 Key terms</h2><dl>${terms}</dl>
        <p class="note" style="margin-top:10px"><a href="#/${d.folder}/about">Full ${esc(d.name)} primer & glossary →</a></p></section>
      <section class="panel full"><h2>▶ Run it locally</h2>
        <div class="run"><code>${esc(run)}</code><button class="btn" data-copy="${esc(run)}">Copy</button></div>
        <p class="note" style="margin-top:8px">Needs Python 3.10–3.13 and <a href="https://ollama.com" target="_blank" rel="noopener">Ollama</a>.
          Setup: <a href="${DATA.repo}#-quick-start" target="_blank" rel="noopener">Quick start</a>.</p></section>
      <section class="panel full"><div class="code-head"><h2 style="margin:0">💻 Implementation: app.py</h2>
          <span><button class="btn" data-copy="${esc(u.code)}">Copy</button> <a href="${folderUrl}" target="_blank" rel="noopener">View on GitHub ↗</a></span></div>
        <pre><code class="language-python">${esc(u.code)}</code></pre></section>
    </div></div>`;
  if (window.hljs) hljs.highlightElement(app.querySelector("pre code.language-python"));
  drawFlows();
  initDemo(u);
  window.scrollTo(0, 0);
}

function renderAbout(d) {
  const groups = {};
  for (const [t, [g, def]] of Object.entries(d.glossary)) (groups[g] ??= []).push([t, def]);
  const areas = d.areas.map(([key, name, what]) => {
    const n = d.use_cases.filter(u => u.category === key).length;
    return `<dt>${esc(d.categories[key].split(" ")[0])} ${esc(name)} <a href="#/${d.folder}" data-cat-link="${key}" class="note">(${n} solution${n === 1 ? "" : "s"})</a></dt><dd>${esc(what)}</dd>`;
  }).join("");
  const glossary = Object.entries(groups).map(([g, items]) => `<div class="glossary-group"><h3>${esc(g)}</h3><dl>${
    items.sort((a, b) => a[0].localeCompare(b[0])).map(([t, def]) => `<dt data-term="${esc((t + " " + def).toLowerCase())}">${esc(t)}</dt><dd>${esc(def)}</dd>`).join("")}</dl></div>`).join("");
  app.innerHTML = `<div class="detail">
    <a class="back" href="#/${d.folder}">← ${esc(d.name)} solutions</a>
    <h1>${d.icon} ${esc(d.name)}: how the industry works</h1>
    <div class="crumbs">A plain-English primer for people new to ${esc(d.name.toLowerCase())}</div>
    <div class="cols">
      <section class="panel">${md(d.industry_101)}</section>
      <section class="panel"><h2>Departments</h2><dl>${areas}</dl></section>
      <section class="panel full"><h2>📖 Glossary (${Object.keys(d.glossary).length} terms)</h2>
        <label class="search glossary-search"><input id="gq" type="search" placeholder="Filter terms" aria-label="Filter glossary"></label>
        <div id="glossary">${glossary}</div></section>
    </div></div>`;
  document.getElementById("gq").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll("#glossary dt").forEach(dt => {
      const show = dt.dataset.term.includes(q);
      dt.style.display = dt.nextElementSibling.style.display = show ? "" : "none";
    });
    document.querySelectorAll(".glossary-group").forEach(g =>
      g.style.display = [...g.querySelectorAll("dt")].some(dt => dt.style.display !== "none") ? "" : "none");
  });
  app.querySelectorAll("[data-cat-link]").forEach(a => a.addEventListener("click", () => { state.category = a.dataset.catLink; }));
  window.scrollTo(0, 0);
}

// ------------------------------------------------------------------ Hands-on labs (labs/catalog.py)
// Steps are [num, name, context added, score, what happened, screenshot]; all from a real recorded run.
const fmtScore = (v, max) => `${v} / ${max}`;

function renderLabs() {
  app.innerHTML = `<div class="hero"><h1>🧪 Hands-on labs</h1>
      <p>Longer, guided exercises that teach one AI engineering idea step by step, with a score after every step.
      Unlike the solutions, labs don't run on Ollama: each one says where it runs.</p></div>
    <div class="grid">${LABS.map(lab => `<button class="card" data-link="#/labs/${lab.slug}">
      <div class="meta"><span>${lab.icon} ${esc(lab.industry)} · 🧪 Lab</span><span>#${lab.slug.slice(0, 2)}</span></div>
      <h3>${esc(lab.title)}</h3><p>${esc(lab.tagline)}.</p>
      <div class="badges"><span class="badge lab">${esc(lab.runs_on)}</span><span class="badge">${lab.steps.length} steps</span><span class="badge">⏱ ${esc(lab.time)}</span></div>
    </button>`).join("")}</div>`;
  window.scrollTo(0, 0);
}

function renderLab(lab) {
  const max = lab.max_score, n = lab.steps.length;
  const folderUrl = `${DATA.repo}/tree/main/labs/${lab.slug}`, blobUrl = `${DATA.repo}/blob/main/labs/${lab.slug}`;
  const ticks = Array.from({ length: max + 1 }, (_, i) => i);
  app.innerHTML = `<div class="detail">
    <a class="back" href="#/labs">← All labs</a>
    <h1>${lab.icon} ${esc(lab.title)}</h1>
    <div class="crumbs">🧪 Hands-on lab · ${esc(lab.industry)} · <span class="badge lab">${esc(lab.runs_on)}</span>
      <span class="badge">${n} steps</span> <span class="badge">⏱ ${esc(lab.time)}</span></div>
    <div class="callout">ℹ️ This lab runs on <strong>${esc(lab.runs_on)}</strong> with ${esc(lab.llm)}.
      Everything below comes from a real run with <code>${esc(lab.model)}</code>, so you can follow it without running anything.</div>
    <div class="cols">
      <section class="panel"><h2>❌ The problem</h2><p>${esc(lab.problem)}</p></section>
      <section class="panel"><h2>💡 The idea</h2><p>${esc(lab.idea)}</p></section>
      <section class="panel full"><h2>📈 Score after each step</h2>
        <p class="note">Same 5 questions, same model, same prompt: only the context changes. Pick a step to see what was added.</p>
        <div class="scores">
          <div class="yaxis" aria-hidden="true">${ticks.map(t => `<span style="bottom:${t / max * 100}%">${t}</span>`).join("")}</div>
          <div class="plot" style="--n:${n}" role="group" aria-label="Score out of ${max} after each step">
            ${ticks.slice(1).map(t => `<div class="grid-line" style="bottom:${t / max * 100}%"></div>`).join("")}
            ${lab.steps.map(([num, name, , score], i) => `<button class="bar" data-step="${i}" aria-pressed="false"
                aria-label="Step ${num} ${esc(name)}: ${fmtScore(score, max)}">
              <span class="tip">${num} ${esc(name)} · ${fmtScore(score, max)}</span>
              <span class="val" style="bottom:${score / max * 100}%"></span><span class="fill" style="height:${score / max * 100}%"></span></button>`).join("")}
          </div></div>
        <div class="xlabels" style="--n:${n}" aria-hidden="true">${lab.steps.map(([num, name]) => `<span>${num}<span class="nm"><br>${esc(name)}</span></span>`).join("")}</div>
        <div class="stepview" id="stepview" aria-live="polite"></div></section>
      <section class="panel full"><h2>❓ The ${lab.questions.length} questions</h2><ol>${lab.questions.map(([topic, q]) =>
        `<li><strong>${esc(topic)}:</strong> ${esc(q)}</li>`).join("")}</ol></section>
      <section class="panel full"><h2>🔀 How the lab works</h2><pre><code>${esc(lab.flow)}</code></pre></section>
      <section class="panel full"><h2>📋 All steps</h2><div class="md"><table class="steptable">
        <tr><th>Step</th><th>Context added</th><th>Score</th><th>What changed</th></tr>
        ${lab.steps.map(([num, name, added, score, result], i) => `<tr data-row="${i}"><td>${num} ${esc(name)}</td><td>${esc(added)}</td>
          <td><strong>${fmtScore(score, max)}</strong></td><td>${esc(result)}</td></tr>`).join("")}</table></div></section>
      <section class="panel full"><h2>▶ Run it yourself</h2><ol class="setup">${lab.setup.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
        <p class="note">Local check of the context files, data traps and grader (no Databricks needed):</p>
        <div class="run"><code>${esc(lab.local_check)}</code><button class="btn" data-copy="${esc(lab.local_check)}">Copy</button></div>
        <p style="margin-top:12px"><a href="${blobUrl}/${lab.walkthrough}" target="_blank" rel="noopener">📸 Full walkthrough with screenshots ↗</a> ·
          <a href="${folderUrl}" target="_blank" rel="noopener">View the lab on GitHub ↗</a></p></section>
    </div></div>`;

  const view = document.getElementById("stepview");
  const show = i => {
    const [num, name, added, score, result, shot] = lab.steps[i];
    app.querySelectorAll(".bar").forEach((b, j) => {
      b.setAttribute("aria-pressed", String(j === i));
      // direct labels only on the start, the end and the selected step; hover shows the rest
      b.querySelector(".val").textContent = j === i || j === 0 || j === n - 1 ? String(lab.steps[j][3]) : "";
    });
    app.querySelectorAll(".xlabels > span").forEach((x, j) => x.classList.toggle("on", j === i));
    app.querySelectorAll(".steptable tr[data-row]").forEach(r => r.classList.toggle("on", +r.dataset.row === i));
    view.innerHTML = `<div><h3>Step ${num} · ${esc(name)}</h3>
        <p><strong>Score:</strong> ${fmtScore(score, max)}</p>
        <p><strong>Context added:</strong> ${esc(added)}</p>
        <p><strong>What happened:</strong> ${esc(result)}</p>
        <div class="stepnav"><button class="btn" data-go="${i - 1}" ${i === 0 ? "disabled" : ""}>← Previous</button>
          <button class="btn" data-go="${i + 1}" ${i === n - 1 ? "disabled" : ""}>Next →</button></div></div>
      <figure style="margin:0"><img src="${RAW}/labs/${lab.slug}/${lab.shots_dir}/${shot}" alt="Scorecard after step ${num} ${esc(name)}" loading="lazy">
        <figcaption class="note">Scorecard from the real run after step ${num}.</figcaption></figure>`;
  };
  app.querySelectorAll(".bar").forEach(b => b.addEventListener("click", () => show(+b.dataset.step)));
  view.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g && !g.disabled) show(+g.dataset.go); });
  show(n - 1);
  window.scrollTo(0, 0);
}

function route() {
  const [folder = "", slug = ""] = location.hash.replace(/^#\/?/, "").split("/");  // "#/<industry>/<use case>"
  if (folder === "labs" && LABS.length) {  // "#/labs/<lab>"
    state.industry = "labs";
    renderTabs();
    const lab = LABS.find(x => x.slug === slug);
    return lab ? renderLab(lab) : renderLabs();
  }
  const d = IND[folder];
  const prev = state.industry;
  state.industry = d ? folder : "all";
  if (state.industry !== prev && !(d && slug)) state.category = "all";
  renderTabs();
  if (d && slug === "about") return renderAbout(d);
  const u = d && d.use_cases.find(x => x.slug === slug);
  if (u) return renderDetail(d, { ...u, ind: d });
  renderList();
}
window.addEventListener("hashchange", route);
route();
</script>
