n s and c[\"travel_spend_pct\"] > 5: s[\"travel_card\"] += 0.4\n    if \"term_insurance\" in s and 25 <= c[\"age\"] <= 50: s[\"term_insurance\"] += 0.3\n    if any(\"Salary increased\" in e for e in c[\"events\"]): s[\"mutual_fund_sip\"] = s.get(\"mutual_fund_sip\", 0.1) + 0.3\n    return dict(sorted(((k, round(v, 2)) for k, v in s.items()), key=lambda x: -x[1])[:3])\n\n\ndef main():\n    banner(\"36 - Next Best Offer (CrewAI)\")\n    scores = {c[\"id\"]: propensity(c) for c in CUSTOMERS}\n    section(\"Propensity (top 3)\", json.dumps(scores, indent=2))\n    marketer = make_agent(\"Marketing Analyst\", \"Pick the single best offer per customer and the best channel and timing\",\n                          \"CRM analytics lead; you prioritise customer need over product push.\")\n    writer = make_agent(\"Compliance-aware Copywriter\", \"Write short personalised, fair and non-pushy offer messages\",\n                        \"You write bank marketing copy that is clear, not misleading and includes key terms.\")\n    t1 = make_task(\"Customers:\\n{customers}\\n\\nPropensity scores:\\n{scores}\\n\\nChoose next best offer, channel (app push, email, RM call) and timing.\",\n                   \"Per customer: offer, why, channel, timing.\", marketer)\n    t2 = make_task(\"Write the message for each customer (max 40 words, include an opt-out note).\",\n                   \"Per customer message ready to send.\", writer, context=[t1])\n    section(\"Campaign\", run_crew([marketer, writer], [t1, t2], {\"customers\": json.dumps(CUSTOMERS, indent=2),\n                                                                 \"scores\": json.dumps(scores, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Customers + product catalogue\"] --> PY[\"🐍 Python<br/>Product propensity scores\"]\n    subgraph CREW[\"🤖 CrewAI crew: agents work in turn\"]\n        A1[\"🧑‍💼 Marketing Analyst\"]\n        A2[\"✍️ Compliance-aware Copywriter\"]\n        A1 alised save actions within budget\",\n                         \"You decide retention offers (fee waivers, rate matches, RM outreach) proportional to customer value.\")\n    t1 = make_task(\"Customers:\\n{customers}\\n\\nRisk:\\n{risks}\\n\\nDiagnose likely churn drivers for MEDIUM/HIGH risk customers.\",\n                   \"Per-customer diagnosis.\", analyst)\n    t2 = make_task(\"Design a retention play per at-risk customer: action, offer, owner, channel, script opener (1 sentence), success metric.\",\n                   \"Retention plan.\", success, context=[t1])\n    section(\"Retention plan\", run_crew([analyst, success], [t1, t2], {\"customers\": json.dumps(CUSTOMERS, indent=2),\n                                                                       \"risks\": json.dumps(risks, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Customer activity signals\"] --> PY[\"🐍 Python<br/>Churn risk score\"]\n    subgraph CREW[\"🤖 CrewAI crew: agents work in turn\"]\n        A1[\"🧑‍💼 Retention Analyst\"]\n        A2[\"👔 Customer Success Manager\"]\n        A1 -->|\"hands over\"| A2\n    end\n    style CREW fill:none,stroke:#7c3aed,stroke-dasharray:5 4\n    PY -->|\"✅ facts\"| A1\n    CREW <-.->|\"💬 prompts\"| LLM([\"🦙 Ollama\"])\n    A2 --> OUT[\"📝 Retention plan + save offers\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class A1,A2 ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 27, "turns": [{"ask": "Which customers are at risk of leaving, and how do we keep pp.py \"I cancelled my gym membership but TX-903 still charged me\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nTRANSACTIONS = {\n    \"TX-901\": {\"date\": \"2026-09-18\", \"merchant\": \"SkyHigh Airlines\", \"amount\": 640.00, \"network\": \"Visa\", \"status\": \"posted\"},\n    \"TX-902\": {\"date\": \"2026-09-22\", \"merchant\": \"TechMart Online\", \"amount\": 899.00, \"network\": \"Mastercard\", \"status\": \"posted\"},\n    \"TX-903\": {\"date\": \"2026-10-01\", \"merchant\": \"FitLife Gym\", \"amount\": 49.99, \"network\": \"Visa\", \"status\": \"posted\"},\n}\n\nREASON_CODES = {  # simplified\n    \"goods_not_received\": {\"Visa\": \"13.1\", \"Mastercard\": \"4855\", \"evidence\": \"Expected delivery date, merchant contact attempts\", \"window_days\": 120},\n    \"cancelled_recurring\": {\"Visa\": \"13.2\", \"Mastercard\": \"4841\", \"evidence\": \"Cancellation confirmation/date\", \"window_days\": 120},\n    \"not_as_described\": {\"Visa\": \"13.3\", \"Mastercard\": \"4853\", \"evidence\": \"Description vs. received item, return proof\", \"window_days\": 120},\n    \"duplicate_charge\": {\"Visa\": \"12.6.1\", \"Mastercard\": \"4834\", \"evidence\": \"Both transaction references\", \"window_days\": 120},\n    \"fraud_card_absent\": {\"Visa\": \"10.4\", \"Mastercard\": \"4837\", \"evidence\": \"Customer declaration, card blocked\", \"window_days\": 120},\n}\n\n\n@tool\ndef lookup_transaction(txn_id: str) -> dict:\n    \"\"\"Look up a card transaction by id (e.g. TX-901).\"\"\"\n    return TRANSACTIONS.get(txn_id.upper(), {\"error\": \"not found\"})\n\n\n@tool\ndef reason_code_rules(dispute_type: str, network: str) -> dict:\n    \"\"\"Get chargeback reason code, required evidence and time window. dispute_type is one of:\n    goods_not_received, cancelled_recurring, not_as_described, duplicate_charge, fraud_card_absent.\"\"\"\n    r = REASON_CODES.get(dispute_type)\n    return {\"reason_code\": r[network], \"evidence_required\": r[\"evidence\"], \"window_days\": r[\"window_days\"]} if r else {\"error\": \"unknown type\"}\n\n\nSYSTEM = (\n    \"You are a card disputes specialist. Look up the transaction, classify the dispute type, get the reason code rules, \"\n    \"then reply with: dispute type, reason code, evidence the customer must provide, whether a temporary credit applies, \"\n    \"and a short dispute case summary for the back office. If the merchant should be contacted first, say so.\"\n)\n\n\ndef main():\n    banner(\"38 - Dispute & Chargeback Assistant (LangChain agent)\")\n    q = sys.argv[1] if len(sys.argv) > 1 else (\n        \"I ordered a laptop from TechMart Online (TX-902) on 22 Sept, it was due 29 Sept and never arrived. The merchant ignores my emails.\")\n    section(\"Customer\", q)\n    section(\"Assistant\", run_agent(SYSTEM, [lookup_transaction, reason_code_rules], q))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    QU[\"💬 Your question\"] --> AG[\"🤖 LangChain agent<br/>decides which tool to call\"]\n    AG <-->|\"🔧 calls & results\"| T[\"🐍 Python tools<br/>lookup_transaction()<br/>reason_code_rules()\"]\n    IN[\"📄 Card transactions + reason codes\"] --> T\n    AG <-.->|\"💬 reasoning\"| LLM([\"🦙 Ollama\"])\n    AG --> OUT[\"📝 Dispute summary + next steps\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN,QU data\n    class T rules\n    class AG ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 7, "turns": [{"ask": "I ordered a laptop from TechMart Online (TX-902) on 22 Sept, it was due 29 Sept and never arrived. The merchant ignores my emails.", "steps": [{"icon": "🔧", "label": "Tool calls", "body": "lookup_transaction(txn_id='TX-902') -> {\"date\": \"2026-09-22\", \"merchant\": \"TechMart Online\", \"amount\": 899.0, \"network\": \"Mastercard\", \"status\": \"posted\"}\nreason_code_rules(dispute_type='goods_not_received', network='Mastercard') -> {\"reason_code\": \"4855\", \"evidence_required\": \"Expected delivery date, merchant contact attempts\", \"window_days\": 120}", "code": true}], "answer": "Based on the provided information and the lookup results, here is the dispute classification and necessary details:\n\n- **Dispute Type:** Goods Not Received\n- **Reason Code:** 4855\n- **Evidence Required:** Expected delivery date, merchant contact attempts\n- **Temporary Credit:** Typically applies within the network's guidelines, but this will be determined by the issuing bank.\n- **Summary for Back Office:** The customer ordered a laptop from TechMart Online on 22 September, expecting delivery by 29 September. The laptop was never received, and the merchant has not responded to the customer's emails. The customer is requesting a resolution through the dispute process. The merchant should be contacted first to attempt resolution before proceeding with the dispute.\n\nPlease contact the merchant first to resolve the issue. If no resolution is reached, the customer will need to provide the expected delivery date and evidence of their attempts to contact the merchant."}]}}, {"slug": "39_multilingual_faq_rag", "title": "Multilingual Banking FAQ (RAG)", "category": "retail", "framework": "LangChain", "pattern": "RAG", "description": "Answers product FAQs in the customer's language (e.g. Hindi, Spanish, French).", "how": "Translates the question to English, retrieves matching FAQ content, and answers in the language the question was asked in.", "today": "Customers ask the same product questions (fees, limits, PIN reset) in many languages.", "who": "Customer service and digital channels.", "why": "Maintaining FAQs and staff in every language is expensive.", "terms": ["Retail banking"], "code": "\"\"\"Multilingual Banking FAQ (RAG) — LangChain + Ollama.\n\nRun:  python 01_banking/39_multilingual_faq_rag/app.py\n      python 01_banking/39_multilingual_faq_rag/app.py \"¿Cuál es el límite diario de retiro en cajero?\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import SimpleRetriever, banner, run_chain, section\n\nFAQ = [\n    \"Daily ATM withdrawal limit: 1,000 on Classic debit cards and 2,500 on Platinum debit cards.\",\n    \"International transfers (SWIFT) cost 15 per transfer and arrive in 1-3 working days. Cut-off time is 3 pm.\",\n    \"To reset your mobile banking PIN: open the app, tap 'Forgot PIN', verify with your debit card and OTP.\",\n    \"Savings account interest is 3.5% per year, calculated daily and paid quarterly.\",\n    \"Minimum average monthly balance for a regular savings account is 1,000; a fee of 10 applies if not maintained.\",\n    \"Fixed deposits can be broken early with a 1% penalty on the applicable interest rate.\",\n    \"Lost or stolen cards can be blocked 24/7 in the app under Cards > Block, or by calling 0800 123 456.\",\n    \"Home loan pre-approval needs ID proof, last 3 payslips, 6 months bank statements and the property details.\",\n]\n\nSYSTEM = (\n    \"You are a multilingual bank assistant. Detect the language of the question and answer ONLY in that language, \"\n    \"using ONLY the FAQ context. If the context doesn't contain the answer, say so politely in that language and \"\n    \"suggest calling 0800 123 456. Keep answers under 80 words.\"\n)\n\n\ndef main():\n    banner(\"39 - Multilingual Banking FAQ (LangChain RAG)\")\n    retriever = SimpleRetriever(FAQ)\n    questions = sys.argv[1:] or [\n        \"ATM se ek din mein kitna paisa nikaal sakte hain?\",           # Hinglish\n        \"¿Cuánto cuesta una transferencia internacional?\",            # Spanish\n        \"Comment réinitialiser mon code PIN de l'application ?\",       # French\n        \"मेरा कार्ड खो गया है, क्या करूं?\",                                 # Hindi\n    ]\n    for q in questions:\n        # Translate to English for retrieval: the FAQ is English and the keyword fallback is English-only\n        english_q = run_chain(\"Translate the user's text to English. Output only the translation.\", \"{q}\", q=q)\n        ctx = \"\\n\".join(retriever.search(english_q, k=3))\n        section(f\"Q: {q}\", run_chain(SYSTEM, \"FAQ context:\\n{ctx}\\n\\nQuestion: {q}\", ctx=ctx, q=q))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    QU[\"❓ Your question\"] --> R[\"🔎 Retriever<br/>finds the most relevant passages\"]\n    IN[\"📚 Bank FAQ\"] -->|\"🧮 embeddings\"| R\n    R -->|\"📎 top passages\"| G[\"🔗 LangChain<br/>answer only from passages\"]\n    G <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    G --> OUT[\"📝 Answer in the customer's language\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN,QU data\n    class R,G ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 12, "turns": [{"ask": "ATM se ek din mein kitna paisa nikaal sakte hain?", "steps": [], "answer": "Daily ATM withdrawal limit is 1,000 for Classic debit cards and 2,500 for Platinum debit cards."}, {"ask": "¿Cuánto cuesta una transferencia internacional?", "steps": [], "answer": "Una transferencia i spute/fraud claim, explain next steps & timelines | \"Agent: Okay, blocked. New card in 5 days.\" | 10/25 |\n| 5. Accurate information, no assumptions | \"Agent: Yes I see it. It's probably a subscription you forgot. Not much I can do really.\" | 5/10 (Partial Fail) |\n| 6. Ownership & resolution | \"Agent: Okay, blocked. New card in 5 days.\" | 10/10 |\n| 7. Closing: summary, reference number, anything else | \"Agent: Okay, blocked. New card in 5 days. Bye.\" | 10/10 |\n\n**Total Score: 65/100**\n\n**Critical Fails:**\n- Secure verification - must NEVER ask for full card number, CVV, PIN or OTP (25 points)\n\n**Overall: FAIL**\n\nThe call failed due to a critical security breach where the agent asked for the full card number and CVV, which is strictly prohibited. The agent should have used alternative verification methods and not requested sensitive information.", "code": false}], "answer": "### Coaching Feedback for the Agent\n\n**Strengths:**\n- **Greeting & Identification:** The agent greeted the customer professionally and identified themselves correctly.\n- **Ownership & Resolution:** The agent handled the situation by blocking the card and informing the customer about the new card issuance timeline.\n- **Closing:** The agent provided a clear summary and reference number at the end of the call.\n\n**Top 3 Improvements with Better Phrasing Examples:**\n\n1. **Secure Verification:**\n   - **Current:** \"Agent: Okay. Can you give me your full card number and the CVV so I can check?\"\n   - **Improved:** \"Agent: I understand you're concerned about your account. To ensure your security, could you please provide your last four digits of the card and your date of birth? This will help me verify your identity without needing your full card number or CVV.\"\n\n2. **Listening & Empathy:**\n   - **Current:** \"Agent: Yes I see it. It's probably a subscription you forgot. Not much I can do really.\"\n   - **Improved:** \"Agent: I understand you're worried. Let me check your account to see if there's any activity that might explain this. Could you please provide your date of birth and postcode? This will help me verify your identity and understand the situation better.\"\n\n3. **Correct Handling of Suspected Fraud:**\n   - **Current:** \"Agent: Okay, blocked. New card in 5 days.\"\n   - **Improved:** \"Agent: I've blocked your card for your safety. A new card will be issued in 5 days. I'll also be raising a fraud alert on your account to prevent any further unauthorized activity. Is there anything else you need assistance with?\"\n\n**Compliance Escalation Needed:**\n- The agent must be reminded of the strict security protocols and the importance of never asking for full card numbers, CVV, PINs, or OTPs. This is a critical compliance issue that needs to be addressed immediately. The agent should be trained on alternative verification methods and the importance of maintaining customer data security.\n\nBy implementing these improvements, the agent will not only enhance their customer service but also ensure the highest level of security and compliance."}]}}, {"slug": "41_swift_payment_validator", "title": "SWIFT Payment Repair Assistant", "category": "ops", "framework": "LangChain", "pattern": "Chain", "description": "Validates MT103 payment messages and suggests repairs for failed STP.", "how": "Python parses fields and validates BIC/IBAN/amount format; the LLM explains failures and proposes repairs.", "today": "International payments travel as SWIFT messages. If a field is wrong (bad BIC, invalid IBAN), the payment fails automatic processing and someone must repair it by hand.", "who": "Payments operations teams.", "why": "Manual repairs are slow and costly, and some repairs need customer confirmation.", "terms": ["SWIFT / MT103", "STP (Straight-Through Processing)", "BIC / IBAN / IFSC", "Charges code (OUR/SHA/BEN)"], "code": "\"\"\"SWIFT Payment Repair Assistant — Python validation + LangChain chain.\n\nRun:  python 01_banking/41_swift_payment_validator/app.py\n\"\"\"\n\nimport json\nimport re\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\nMT103 = \"\"\"{1:F01BANKGB2LAXXX0000000000}{2:I103DEUTDEFFXXXXN}{4:\n:20:REF20261012-001\n:23B:CRED\n:32A:261012EUR15000,5\n:50K:/GB29NWBK60161331926819\nACME TRADING LTD\n1 HIGH STREET LONDON\n:59:/DE89370400440532013001\nMULLER MASCHINENBAU GMBH\n:57A:DEUTDEFFX\n:70:INVOICE 4471 MACHINE PARTS\n:71A:SHAR\n-}\"\"\"\n\n\ndef iban_valid(iban: str) -> bool:\n    s = iban[4:] + iban[:4]\n    digits = \"\".join(str(int(c, 36)) for c in s)\n    return int(digits) % 97 == 1\n\n\ndef validate(msg: str) -> dict:\n    fields = dict(re.findall(r\":(\\d{2}[A-Z]?):([^:]*?)(?=\\n:|\\n-})\", msg, re.S))\n    issues = []\n    for tag in [\"20\", \"23B\", \"32A\", \"50K\", \"59\", \"71A\"]:\n        if tag not in fields:\n            issues.append(f\"Mandatory field :{tag}: missing\")\n    m = re.match(r\"(\\d{6})([A-Z]{3})([\\d,]+)$\", fields.get(\"32A\", \"\").strip())\n    if not m:\n        issues.append(\":32A: format must be YYMMDD + CCY + amount\")\n    elif m.group(2) == \"EUR\" and len(m.group(3).split(\",\")[-1]) > 2:\n        issues.append(f\":32A: amount {m.group(3)} has more than 2 decimals\")\n    if bic := fields.get(\"57A\", \"\").strip():\n        if not re.fullmatch(r\"[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?\", bic):\n            issues.append(f\":57A: BIC '{bic}' must be 8 or 11 characters (got {len(bic)})\")\n    for tag in [\"50K\", \"59\"]:\n        acct = fields.get(tag, \"\").strip().splitlines()[0].lstrip(\"/\") if tag in fields else \"\"\n        if acct and not iban_valid(acct):\n            issues.append(f\":{tag}: IBAN {acct} fails checksum\")\n    if fields.get(\"71A\", \"\").strip() not in {\"OUR\", \"SHA\", \"BEN\"}:\n        issues.append(f\":71A: charges code '{fields.get('71A', '').strip()}' invalid (OUR/SHA/BEN)\")\n    return {\"fields\": {k: v.strip() for k, v in fields.items()}, \"issues\": issues}\n\n\nSYSTEM = (\n    \"You are a payments operations specialist. For each validation issue explain why the MT103 would fail STP and \"\n    \"propose the exact corrected field value. Only obvious typos are safe to repair without the customer \"\n    \"(e.g. 'SHAR' -> 'SHA', a BIC with one stray character). Never change who bears charges, amounts, accounts or \"\n    \"IBANs: mark those 'Needs customer confirmation'. Finish with the repaired field list.\"\n)\n\n\ndef main():\n    banner(\"41 - SWIFT Payment Repair Assistant (LangChain)\")\n    v = validate(MT103)\n    section(\"Validation\", json.dumps(v, indent=2))\n    if v[\"issues\"]:\n        section(\"Repair suggestions\", run_chain(SYSTEM, \"Message:\\n{msg}\\n\\nIssues:\\n{issues}\", msg=MT103, issues=\"\\n\".join(v[\"issues\"])))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 SWIFT payment message\"] --> PY[\"🐍 Python<br/>BIC / IBAN / amount validation\"]\n    PY -->|\"✅ decision & numbers\"| CH[\"🔗 LangChain prompt<br/>explain, don't decide\"]\n    CH <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    CH --> OUT[\"📝 Repair suggestions\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class CH ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 11, "turns": [{"ask": "This MT103 payment failed straight-through processing. What's wrong and how do we repair it?", "steps": [{"icon": "🐍", "label": "Python · Validation", "body": "{\n  \"fields\": {\n    \"20\": \"REF20261012-001\",\n    \"23B\": \"CRED\",\n    \"32A\": \"261012EUR15000,5\",\n    \"50K\": \"/GB29NWBK60161331926819\\nACME TRADING LTD\\n1 HIGH STREET LONDON\",\n    \"59\": \"/DE89370400440532013001\\nMULLER MASCHINENBAU GMBH\",\n    \"57A\": \"DEUTDEFFX\",\n    \"70\": \"INVOICE 4471 MACHINE PARTS\",\n    \"71A\": \"SHAR\"\n  },\n  \"issues\": [\n    \":57A: BIC 'DEUTDEFFX' must be 8 or 11 characters (got 9)\",\n    \":59: IBAN DE89370400440532013001 fails checksum\",\n    \":71A: charges code 'SHAR' invalid (OUR/SHA/BEN)\"\n  ]\n}", "code": true}], "answer": "### Issues and Corrections:\n\n1. **:57A: BIC 'DEUTDEFFX' must be 8 or 11 characters (got 9)**\n   - The BIC provided is incorrect as it is 9 characters long. The correct BIC should be 8 or 11 characters.\n   - **Needs customer confirmation**: The exact BIC needs to be confirmed by the customer.\n\n2. **:59: IBAN DE89370400440532013001 fails checksum**\n   - The provided IBAN is invalid due to a failed checksum. The correct IBAN needs to be provided.\n   - **Needs customer confirmation**: The exact correct IBAN needs to be confirmed by the customer.\n\n3. **:71A: charges code 'SHAR' invalid (OUR/SHA/BEN)**\n   - The charges code 'SHAR' is invalid. The correct charges code should be 'OUR', 'SHA', or 'BEN'.\n   - **Corrected field value**: 'SHA'\n\n### Repaired Field List:\n```\n{1:F01BANKGB2LAXXX0000000000}{2:I103DEUTDEFFXXXXN}{4:\n:20:REF20261012-001\n:23B:CRED\n:32A:261012EUR15000,5\n:50K:/GB29NWBK60161331926819\nACME TRADING LTD\n1 HIGH STREET LONDON\n:59:/DE89370400440532013001\nMULLER MASCHINENBAU GMBH\n:57A:DEUTDEFFXX\n:70:INVOICE 4471 MACHINE PARTS\n:71A:SHA\n}\n```\n\nNote: The BIC and IBAN fields need to be confirmed by the customer."}]}}, {"slug": "42_cash_flow_forecaster", "title": "Corporate Cash Flow Forecaster", "category": "ops", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Forecasts a corporate client's 13-week cash position and highlights funding gaps.", "how": "Agent uses `forecast_cash` and `funding_gap` tools on historical inflows/outflows.", "today": "Corporate bankers help business clients forecast cash for the coming weeks to spot shortfalls and arrange funding in time.", "who": "Corporate relationship managers and transaction banking / treasury advisers.", "why": "Running out of cash, even for a week, can sink a profitable business.", "terms": ["Cash flow forecasting", "Working capital"], "code": "\"\"\"Corporate Cash Flow Forecaster — LangChain tool-calling agent + Ollama.\n\nRun:  python 01_banking/42_cash_flow_forecaster/app.py\n\"\"\"\n\nimport statistics\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nOPENING_CASH = 1_200_000\nOVERDRAFT_LIMIT = 500_000\n# last 12 weeks of history (thousands)\nINFLOWS = [820, 760, 910, 700, 880, 790, 640, 610, 590, 650, 600, 580]\nOUTFLOWS = [780, 800, 820, 760, 850, 900, 780, 720, 750, 690, 740, 760]\nKNOWN_EVENTS = {5: (\"Payroll bonus\", -450), 9: (\"Tax payment\", -380), 11: (\"Large customer receipt\", 300)}  # week: (desc, k)\n\n\n@tool\ndef forecast_cash(weeks: int = 13) -> list:\n    \"\"\"13-week cash forecast (thousands) using recent trend plus known events; returns week, net flow, closing cash.\"\"\"\n    trend_in = statistics.mean(INFLOWS[-4:])\n    trend_out = statistics.mean(OUTFLOWS[-4:])\n    cash, rows = OPENING_CASH / 1000, []\n    for w in range(1, weeks + 1):\n        event = KNOWN_EVENTS.get(w, (\"\", 0))\n        net = trend_in - trend_out + event[1]\n        cash += net\n        rows.append({\"week\": w, \"net_flow\": round(net), \"closing_cash\": round(cash), \"event\": event[0]})\n    return rows\n\n\n@tool\ndef funding_gap() -> dict:\n    \"\"\"Identify the lowest projected cash point and whether the overdraft limit covers it.\"\"\"\n    rows = forecast_cash.invoke({\"weeks\": 13})\n    low = min(rows, key=lambda r: r[\"closing_cash\"])\n    headroom = low[\"closing_cash\"] + OVERDRAFT_LIMIT / 1000\n    return {\"lowest_week\": low[\"week\"], \"lowest_cash_k\": low[\"closing_cash\"], \"overdraft_limit_k\": OVERDRAFT_LIMIT / 1000,\n            \"headroom_k\": round(headroom), \"breach\": headroom < 0}\n\n\nSYSTEM = (\n    \"You are a corporate banking treasury advisor. Use forecast_cash and funding_gap. Report: trend of inflows vs \"\n    \"outflows, the week cash turns negative (if any), funding gap vs overdraft, and recommend actions (working capital \"\n    \"line, invoice discounting, payables timing, sweeping surplus). Figures are in thousands.\"\n)\n\n\ndef main():\n    banner(\"42 - Corporate Cash Flow Forecaster (LangChain agent)\")\n    section(\"Treasury view\", run_agent(SYSTEM, [forecast_cash, funding_gap], \"Give me the 13-week cash outlook and any funding needs.\"))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    QU[\"💬 Your question\"] --> AG[\"🤖 LangChain agent<br/>decides which tool to call\"]\n    AG <-->|\"🔧 calls & results\"| T[\"🐍 Python tools<br/>forecast_cash()<br/>funding_gap()\"]\n    IN[\"📄 Inflows, outflows + known events\"] --> T\n    AG <-.->|\"💬 reasoning\"| LLM([\"🦙 Ollama\"])\n    AG --> OUT[\"📝 13-week cash view + funding gap\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN,QU data\n    class T rules\n    class AG ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 13, "turns": [{"ask": "Give me the 13-week cash outlook and any funding needs.", "steps": [{"icon": "🔧", "label": "Tool calls", "body": "forecast_cash(weeks=13) -> [{\"week\": 1, \"net_flow\": -130, \"closing_cash\": 1070, \"event\": \"\"}, {\"week\": 2, \"net_flow\": -130, \"closing_cash\": 940, \"event\": \"\"}, {\"week\": 3, \"net_flow\": -130, \"closing_cash\": 810, \"event\": \"\"}, {\"week\": 4, \"net_flow\": -130, \"closing_cash\": 680, \"event\": \"\"}, {\"week\": 5, \"net_flow\": -580, \"closing_cash\": 100, \"event\": \"Payroll bonus\"}, {\"week\": 6, \"net_flow\": -130, \"closing_cash\": -30, \"event\": \nfunding_gap() -> {\"lowest_week\": 13, \"lowest_cash_k\": -1020, \"overdraft_limit_k\": 500.0, \"headroom_k\": -520, \"breach\": true}", "code": true}], "answer": "Based on the 13-week cash forecast, here is the summary of the trends and funding needs:\n\n### Inflows vs Outflows Trend\n- **Weeks 1-5**: The company experiences consistent outflows of $130,000 per week, with closing cash levels decreasing from $1,070,000 to $100,000.\n- **Week 6**: The company faces a significant outflow of $580,000 due to payroll bonuses, resulting in negative cash of $30,000.\n- **Weeks 7-9**: Cash levels continue to decline, reaching a low of $-800,000 in Week 9 due to a large tax payment.\n- **Week 10-11**: Cash levels remain negative, but there is a slight improvement in Week 11 with a large customer receipt.\n- **Weeks 12-13**: Cash levels continue to decline, with the lowest point in Week 13 at $-1,020,000.\n\n### Week Cash Turns Negative\n- The company's cash balance turns negative in Week 6, with a closing cash balance of $-30,000.\n\n### Funding Gap vs Overdraft\n- The lowest projected cash point is in Week 13 at $-1,020,000.\n- The overdraft limit is $500,000, which is insufficient to cover the funding gap of $520,000.\n- There is a funding gap breach in Week 13.\n\n### Recommendations\n1. **Working Capital Line**: Consider increasing the working capital line to $1,520,000 to cover the funding gap.\n2. **Invoice Discounting**: Utilize invoice discounting to free up cash from receivables, potentially reducing the need for additional funding.\n3. **Payables Timing**: Negotiate with suppliers to extend payment terms, allowing for better cash flow management.\n4. **Sweeping Surplus**: Implement a cash sweep mechanism to transfer surplus funds from non-core accounts to the primary account to maintain positive cash levels.\n\nThese actions can help mitigate the risk of cash shortages and ensure the company remains financially stable throughout the forecast period."}]}}, {"slug": "43_reconciliation_exception_agent", "title": "Reconciliation Exception Agent", "category": "ops", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Matches ledger vs. bank statement entries and investigates the breaks.", "how": "Python matches by amount/reference/date; a Recon Analyst agent classifies breaks and an Ops Lead agent assigns actions.", "today": "Operations teams match every entry in the bank's ledger against bank statements daily. Anything that does not match (a 'break') must be investigated.", "who": "Reconciliation / operations teams.", "why": "Breaks pile up quickly; unresolved ones can hide errors, fraud or losses.", "terms": ["Reconciliation", "Nostro account"], "code": "\"\"\"Reconciliation Exception Agent — CrewAI + Ollama.\n\nRun:  python 01_banking/43_reconciliation_exception_agent/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom datetime import date\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nLEDGER = [\n    {\"id\": \"GL-1\", \"date\": \"2026-10-01\", \"ref\": \"INV-1001\", \"amount\": 12500.00},\n    {\"id\": \"GL-2\", \"date\": \"2026-10-02\", \"ref\": \"INV-1002\", \"amount\": 8400.00},\n    {\"id\": \"GL-3\", \"date\": \"2026-10-03\", \"ref\": \"INV-1003\", \"amount\": 3150.00},\n    {\"id\": \"GL-4\", \"date\": \"2026-10-03\", \"ref\": \"PAY-SUP-77\", \"amount\": -9200.00},\n    {\"id\": \"GL-5\", \"date\": \"2026-10-05\", \"ref\": \"INV-1005\", \"amount\": 4999.00},\n]\nBANK = [\n    {\"id\": \"BK-1\", \"date\": \"2026-10-01\", \"ref\": \"INV-1001\", \"amount\": 12500.00},\n    {\"id\": \"BK-2\", \"date\": \"2026-10-04\", \"ref\": \"INV1002\", \"amount\": 8400.00},\n    {\"id\": \"BK-3\", \"date\": \"2026-10-03\", \"ref\": \"INV-1003\", \"amount\": 3135.00},\n    {\"id\": \"BK-4\", \"date\": \"2026-10-04\", \"ref\": \"PAY-SUP-77\", \"amount\": -9200.00},\n    {\"id\": \"BK-5\", \"date\": \"2026-10-04\", \"ref\": \"PAY-SUP-77\", \"amount\": -9200.00},\n    {\"id\": \"BK-6\", \"date\": \"2026-10-06\", \"ref\": \"BANK CHARGES\", \"amount\": -45.00},\n]\n\n\ndef norm(ref: str) -> str:\n    return ref.replace(\"-\", \"\").upper()\n\n\ndef reconcile():\n    matched, unmatched_bank = [], list(BANK)\n    breaks = []\n    for g in LEDGER:\n        hit = next((b for b in unmatched_bank if norm(b[\"ref\"]) == norm(g[\"ref\"]) and b[\"amount\"] == g[\"amount\"]), None)\n        if hit:\n            lag = (date.fromisoformat(hit[\"date\"]) - date.fromisoformat(g[\"date\"])).days\n            matched.append({\"gl\": g[\"id\"], \"bank\": hit[\"id\"], \"date_lag_days\": lag})\n            unmatched_bank.remove(hit)\n            continue\n        near = next((b for b in unmatched_bank if norm(b[\"ref\"]) == norm(g[\"ref\"])), None)\n        if near:\n            breaks.append({\"type\": \"AMOUNT_MISMATCH\", \"gl\": g, \"bank\": near, \"difference\": round(g[\"amount\"] - near[\"amount\"], 2)})\n            unmatched_bank.remove(near)\n        else:\n            breaks.append({\"type\": \"MISSING_IN_BANK\", \"gl\": g})\n    breaks += [{\"type\": \"MISSING_IN_LEDGER\", \"bank\": b} for b in unmatched_bank]\n    return matched, breaks\n\n\ndef main():\n    banner(\"43 - Reconciliation Exception Agent (CrewAI)\")\n    matched, breaks = reconcile()\n    section(\"Auto-matched\", json.dumps(matched, indent=2))\n    section(\"Breaks\", json.dumps(breaks, indent=2))\n    analyst = make_agent(\"Reconciliation Analyst\", [\"tolerance_pct\"] / 100)\n    if inv[\"amount\"] > max_amt: d.append(f\"Invoice amount {inv['amount']:,} exceeds LC amount + tolerance {max_amt:,.0f}\")\n    if inv[\"goods\"] != LC[\"goods\"]: d.append(\"Goods description on invoice differs from LC\")\n    if bl[\"on_board_date\"] > LC[\"latest_shipment\"]: d.append(\"Late shipment\")\n    if not bl[\"clean\"]: d.append(f\"B/L is claused: '{bl['clause']}' (LC requires clean on-board B/L)\")\n    if ins[\"date\"] > bl[\"on_board_date\"]: d.append(f\"Insurance dated {ins['date']} after shipment date {bl['on_board_date']}\")\n    if ins[\"coverage\"] < 1.1 * inv[\"amount\"]: d.append(f\"Insurance cover {ins['coverage']:,} < 110% of invoice ({1.1 * inv['amount']:,.0f})\")\n    days = (date.fromisoformat(PRESENTATION[\"presented_on\"]) - date.fromisoformat(bl[\"on_board_date\"])).days\n    if days > LC[\"presentation_days\"]: d.append(f\"Presented {days} days after shipment (> {LC['presentation_days']})\")\n    if PRESENTATION[\"presented_on\"] > LC[\"expiry\"]: d.append(\"Presented after LC expiry\")\n    return d\n\n\ndef main():\n    banner(\"44 - Letter of Credit Document Checker (CrewAI)\")\n    disc = check()\n    section(\"Discrepancies found\", \"\\n\".join(disc) or \"None\")\n    checker = make_agent(\"LC Document Checker\", \"Examine documents strictly per UCP 600 and ISBP\",\n                         \"Senior trade documentation checker; you cite the relevant UCP 600 article where possible.\")\n    ops = make_agent(\"Trade Operations Manager\", \"Decide how to handle the presentation\",\n                     \"You decide between paying, refusing, or seeking applicant waiver, and draft the SWIFT MT734 refusal notice.\")\n    t1 = make_task(\"LC terms:\\n{lc}\\n\\nPresentation:\\n{pres}\\n\\nAutomated discrepancies:\\n{disc}\\n\\n\"\n                   \"Confirm each discrepancy, add any others, and classify as major/minor.\", \"Discrepancy list with UCP references.\", checker)\n    t2 = make_task(\"Recommend dging Advisor", "category": "ops", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Measures a corporate's FX exposure and suggests a hedging approach.", "how": "Agent uses `net_exposure` and `forward_rate` tools and compares forward vs. unhedged outcomes.", "today": "Companies that buy or sell abroad face currency risk. Bank FX sales teams help them measure it and lock in rates with forwards or options.", "who": "FX sales / treasury advisers for corporate clients.", "why": "Clients need clear explanations of risk in their own currency, and advice must be about protection, not speculation.", "terms": ["FX exposure / hedging", "FX forward"], "code": "\"\"\"FX Hedging Advisor — LangChain tool-calling agent + Ollama.\n\nRun:  python 01_banking/45_fx_hedging_advisor/app.py\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\n# Corporate client (home currency INR): foreign currency cash flows over next 6 months\nEXPOSURES = [\n    {\"currency\": \"USD\", \"type\": \"receivable\", \"amount\": 2_000_000, \"months\": 3},\n    {\"currency\": \"USD\", \"type\": \"payable\", \"amount\": 800_000, \"months\": 3},\n    {\"currency\": \"EUR\", \"type\": \"payable\", \"amount\": 1_200_000, \"months\": 6},\n]\nSPOT = {\"USD\": 84.20, \"EUR\": 91.50}\nRATES = {\"INR\": 6.5, \"USD\": 4.25, \"EUR\": 2.5}  # annual interest rates %\nVOL = {\"USD\": 4.5, \"EUR\": 6.5}  # annualised volatility %\n\n\n@tool\ndef net_exposure() -> dict:\n    \"\"\"Net foreign-currency exposure per currency and tenor (positive = net long / receivable).\"\"\"\n    out = {}\n    for e in EXPOSURES:\n        key = f\"{e['currency']}_{e['months']}m\"\n        out[key] = out.get(key, 0) + (e[\"amount\"] if e[\"type\"] == \"receivable\" else -e[\"amount\"])\n    return out\n\n\n@tool\ndef forward_rate(currency: str, months: int) -> str:\n    \"\"\"Forward rate (INR per unit) via covered interest parity, plus a 1-sigma move range for the unhedged spot.\"\"\"\n    s, t = SPOT[currency], months / 12\n    fwd = s * (1 + RATES[\"INR\"] / 100 * t) / (1 + RATES[currency] / 100 * t)\n    sigma = s * VOL[currency] / 100 * t ** 0.5\n    return f\"{currency} {months}m forward: {fwd:.2f} (spot {s}); 1-sigma spot range at maturity {s - sigma:.2f} - {s + sigma:.2f}\"\n\n\nSYSTEM = (\n    \"You are an FX sales advisor at a bank for a corporate client whose home currency is INR. The client's exposures \"\n    \"are already in the system: never ask the user for data. Always start by calling net_exposure, then call \"\n    \"forward_rate for each net exposure. Explain the risk of being unhedged in INR terms (use the 1-sigma range), and \"\n    \"recommend a hedge ratio and instrument (forward vs option) for each exposure, noting natural hedges. \"\n    \"Remind that hedging is for risk management, not speculation.\"\n)\n\n\ndef main():\n    banner(\"45 - FX Hedging Advisor (LangChain agent)\")\n    section(\"Advice\", run_agent(SYSTEM, [net_exposure, forward_rate], \"Analyse our FX exposures and recommend a hedging plan.\"))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    QU[\"💬 Your question\"] --> AG[\"🤖 LangChain agent<br/>decides which tool to call\"]\n    AG <-->|\"🔧 calls & results\"| T[\"🐍 Python tools<br/>net_exposure()<br/>forward_rate()\"]\n    IN[\"📄 FX exposures + market rates\"] --> T\n    AG <-.->|\"💬 reasoning\"| LLM([\"🦙 Ollama\"])\n    AG --> OUT[\"📝 Hedging advice\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN, C: SBIN0001234\n                                                     Date: 1 2 1 0 2 0 2 6\nPay  RAVI KUMAR ENTERPRISES                                  or Bearer\nRupees  Forty Five Thousand Six Hundred Only                 Rs. 45,600/-\nA/c No. 30012345678\n                                             For SUNRISE TRADERS  (Authorised Signatory)\nCheque No. 004512\n\"\"\"\n\nINVOICE_OCR = \"\"\"\nTAX INVOICE  No: SRT/26-27/0193   Date: 05/10/2026\nSeller: Sunrise Traders, GSTIN 27AAACS1234F1Z5\nBuyer: Ravi Kumar Enterprises, GSTIN 27AABCR5678K1Z2\n1. Steel brackets  200 x 150.00 = 30,000.00\n2. Fasteners box    40 x 236.00 =  9,440.00\nTaxable value 39,440.00   CGST 9% 3,549.60   SGST 9% 3,549.60\nInvoice Total 46,539.20\n\"\"\"\n\n\nclass Cheque(BaseModel):\n    bank: str\n    ifsc: str\n    cheque_number: str\n    date: str = Field(description=\"DD-MM-YYYY\")\n    payee: str\n    amount_in_words: str\n    amount_in_figures: float\n    account_number: str\n\n\nclass Invoice(BaseModel):\n    invoice_number: str\n    date: str\n    seller_gstin: str\n    buyer_gstin: str\n    taxable_value: float\n    total_tax: float\n    invoice_total: float\n\n\nWORDS = {\"one\": 1, \"two\": 2, \"three\": 3, \"four\": 4, \"five\": 5, \"six\": 6, \"seven\": 7, \"eight\": 8, \"nine\": 9, \"ten\": 10,\n         \"eleven\": 11, \"twelve\": 12, \"fifteen\": 15, \"twenty\": 20, \"thirty\": 30, \"forty\": 40, \"fifty\": 50, \"sixty\": 60,\n         \"seventy\": 70, \"eighty\": 80, \"ninety\": 90}\nSCALES = {\"hundred\": 100, \"thousand\": 1000, \"lakh\": 100_000, \"crore\": 10_000_000}\n\n\ndef words_to_number(text: str) -> int:\n    total = cur = 0\n    for w in re.findall(r\"[a-z]+\", text.lower()):\n        if w in WORDS:\n            cur += WORDS[w]\n        elif w == \"hundred\":\n            cur *= 100\n        elif w in SCALES:\n            total += cur * SCALES[w]\n            cur = 0\n    return total + cur\n\n\ndef main():\n    banner(\"46 - Invoice & Cheque Data Extractor (LangChain structured output)\")\n    sys_prompt = \"Extract fields exactly as printed. Remove spaces inside dates. Amounts as plain numbers.\"\n    c = run_structured(sys_prompt, CHEQUE_OCR, Cheque)\n    i = run_structured(sys_prompt, INVOICE_OCR, Invoice)\n    section(\"Cheque\", c.model_dump_json(indent=2))\n    section(\"Invoice\", i.model_dump_json(indent=2))\n\n    checks = {\n        \"cheque_words_match_figures\": words_to_number(c.amount_in_words) == round(c.amount_in_figures),\n        \"ifsc_format_valid\": bool(re.fullmatch(r\"[A-Z]{4}0[A-Z0-9]{6}\", c.ifsc)),\n        \"gstin_format_valid\": all(re.fullmatch(r\"\\d{2}[A-Z]{5}\\d{4}[A-Z]\\d[Z][A-Z0-9]\", g) for g in (i.seller_gstin, i.buyer_gstin)),\n        \"invoice_total_adds_up\": abs(i.taxable_value + i.total_tax - i.invoice_total) < 1,\n        \"cheque_vs_invoice_difference\": round(i.invoice_total - c.amount_in_figures, 2),\n    }\n    section(\"Validation\", checks)\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 OCR text of cheque & invoice\"] --> EX[\"🧾 LangChain structured output<br/>text → Pydantic schema\"]\n    EX -->|\"validated fields\"| PY[\"🐍 Python<br/>Words vs. figures · dates · IFSC\"]\n    PY --> OUT[\"📝 Validated payment data\"]\n    EX <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class EX ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 7, "turns": [{"ask": "Extract the data from this scanned cheque and invoice, and check it is valid.", "steps": [{"icon": 100, 1) for k in (\"revenue\", \"net_income\", \"total_debt\", \"inventory\", \"receivables\")}\n    return out\n\n\ndef main():\n    banner(\"47 - Financial Statement Analyzer (CrewAI)\")\n    a = analyse(FS)\n    section(\"Ratios\", json.dumps(a, indent=2))\n    analyst = make_agent(\"Financial Analyst\", \"Interpret ratios and trends, spotting quality-of-earnings issues\",\n                         \"CFA charterholder who looks beyond headline growth to margins, working capital and cash.\")\n    writer = make_agent(\"Research Report Writer\", \"Write a clear, balanced company analysis\",\n                        \"You write concise research notes for credit and equity committees.\")\n    t1 = make_task(\"Company: {company}\\n\\nStatements:\\n{fs}\\n\\nRatios:\\n{ratios}\\n\\nAnalyse profitability, efficiency, liquidity, \"\n                   \"leverage and cash flow quality. Flag concerns.\", \"Analytical notes.\", analyst)\n    t2 = make_task(\"Write the report on {company}.\\n\\nExact ratios (quote these; never invent numbers):\\n{ratios}\", \"Sections: Summary (3 bullets), Performance, Balance sheet & liquidity, Cash flow, \"\n                   \"Key risks / red flags, Questions for management, Overall view (Positive / Neutral / Negative).\",\n                   writer, context=[t1])\n    section(\"Report\", run_crew([analyst, writer], [t1, t2], {\"company\": COMPANY, \"fs\": json.dumps(FS, indent=2), \"ratios\": json.dumps(a, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Company financial statements\"] --> PY[\"🐍 Python<br/>Ratios · YoY growth\"]\n    subgraph CREW[\"🤖 CrewAI crew: agents work in turn\"]\n        A1[\"🧑‍💼 Financial Analyst\"]\n        A2[\"✍️ Research Report Writer\"]\n        A1 -->|\"hands over\"| A2\n    end\n    style CREW fill:none,stroke:#7c3aed,stroke-dasharray:5 4\n    PY -->|\"✅ facts\"| A1\n    CREW <-.->|\"💬 prompts\"| LLM([\"🦙 Ollama\"])\n    A2 --> OUT[\"📝 Research report\"]\n \", \"detail\": \"Payee not in approved vendor master\"})\n    near = [r[\"id\"] for r in rows if 0.95 * APPROVAL_LIMITS[\"officer\"] <= r[\"amount\"] < APPROVAL_LIMITS[\"officer\"]]\n    if len(near) >= 2:\n        exc.append({\"id\": \",\".join(near), \"control\": \"Limit splitting\", \"detail\": \"Multiple payments just below officer limit\"})\n    return {\"sample_size\": len(rows), \"exceptions\": exc}\n\n\ndef main():\n    banner(\"49 - Internal Audit Assistant (CrewAI)\")\n    results = test_controls(SAMPLE)\n    section(\"Control testing\", json.dumps(results, indent=2))\n    auditor = make_agent(\"Internal Auditor\", \"Evaluate control exceptions and their root causes\",\n                         \"IIA-certified auditor focusing on payments and fraud risk.\")\n    manager = make_agent(\"Audit Manager\", \"Write audit findings with ratings and agreed actions\",\n                         \"You write findings in Condition / Criteria / Cause / Effect / Recommendation format.\")\n    t1 = make_task(\"Sample:\\n{sample}\\n\\nResults:\\n{results}\\n\\nEvaluate each exception, note patterns (e.g. same users), possible fraud indicators.\",\n                   \"Exception evaluation.\", auditor)\n    t2 = make_task(\"Write the audit findings.\\n\\nControl test exceptions (quote these exactly):\\n{results}\", \"Findings (Condition, Criteria, Cause, Effect, Recommendation, Rating High/Medium/Low), \"\n                   \"overall control environment opinion (Satisfactory / Needs improvement / Unsatisfactory).\", manager, context=[t1])\n    section(\"Audit report\", run_crew([auditor, manager], [t1, t2], {\"sample\": json.dumps(SAMPLE, indent=2), \"results\": json.dumps(results, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Payment sample + approval limits\"] --> PY[\"🐍 Python<br/>Control tests: maker-checker, limits, SoD\"]\n    subgraph CREW[\"🤖 CrewAI crew: agents work in turn\"]\n        A1[\"🔍 Internal Auditor\"]\n  user made and approved the payment.\n- **Pattern**: This is a common control exception where the maker and checker roles are not segregated, which can lead to potential fraud or errors.\n- **Possible Fraud Indicators**: \n  - **Conflict of Interest**: The same individual is responsible for both making and approving the payment, which can lead to self-approval or manipulation.\n  - **Lack of Independent Review**: Without a separate reviewer, there is no independent check on the payment process.\n- **Root Cause**: \n  - **Inadequate Segregation of Duties**: The organization may not have properly segregated the maker and checker roles.\n  - **User Role Assignment**: The user \"u12\" may have been assigned both roles, possibly due to a lack of role-based access control or a staffing shortage.\n\n#### 2. Exception: P-03 - Delegation of Authority\n- **Control Violation**: Payment amount exceeds the manager's approval limit.\n- **Pattern**: This exception indicates that the payment amount is above the manager's authority limit, which should have required higher-level approval.\n- **Possible Fraud Indicators**: \n  - **Excessive Authority**: The manager may have abused their authority by approving a payment that should have required additional approval.\n  - **Risk of Overpayment**: There is a risk that the payment could be excessive or unnecessary.\n- **Root Cause**: \n  - **Inadequate Approval Limits**: The approval limits for the manager may be too high, allowing them to approve large payments without additional oversight.\n  - **Lack of Control Over Large Payments**: There may be a lack of controls to ensure that large payments are properly reviewed and approved.\n\n#### 3. Exception: P-04 - Vendor Master\n- **Control Violation**: Payee not in approved vendor master.\n- **Pattern**: This exception indicates that the vendor is not listed in the approved vendor master, which is a critical control to ensure that payments are made only to authorized vendors.\n- **Possible Fraud Indicators**: \n  - **Unapproved Vendor**: The payment may be made to an unauthorized vendor, which could be a sign of fraud.\n  - **Risk of Payment to Non-Existent Vendor**: There is a risk that the payment could be made to a non-existent or fraudulent vendor.\n- **Root Cause**: \n  - **Inadequate Vendor Master Management**: The vendor master may not be properly maintained or updated, leading to unauthorized payments.\n  - **Lack of Vendor Approval Process**: There may be a lack of a formal process to approve vendors, which could lead to unauthorized payments.\n\n#### 4. Exception: P-05 - Vendor Master\n- **Control Violation**: Payee not in approved vendor master.\n- **Pattern**: This exception is similar to P-04, indicating that the vendor is not listed in the approved vendor master.\n- **Possible Fraud Indicators**: \n  - **Unapproved Vendor**: The payment may be made to an unauthorized vendor, which could be a sign of fraud.\n  - **Risk of Payment to Non-Existent Vendor**: There is a risk that the payment could be made to a non-existent or fraudulent vendor.\n- **Root Cause**: \n  - **Inadequate Vendor Master Management**: The vendor master may not be properly maintained or updated, leading to unauthorized payments.\n  - **Lack of Vendor Approval Process**: There may be a lack of a formal process to approve vendors, which could lead to unauthorized payments.\n\n#### 5. Exception: P-04, P-05 - Limit Splitting\n- **Control Violation**: Multiple payments just below officer limit.\n- **Pattern**: These payments are just below the officer's approval limit, suggesting that the payments may have been split to avoid higher-level approval.\n- **Possible Fraud Indicators**: \n  - **Avoiding Approval**: The payments may be split to avoid the need for higher-level approval, which could be a sign of fraud.\n  - **Risk of Overpayment**: There is a risk that the payments could be excessive or unnecessary.\n- **Root Cause**: \n  - **Inadequate Approval Limits**: The approval limits for the officer may be too high, allowing payments to be split to avoid higher-level approval.\n  - **Lack of Control Over Large Payments**: There may be a lack of controls to ensure that large payments are properly reviewed and approved.\n\n### Summary of Patterns and Root Causes\n- **Segregation of Duties**: Inadequate segregation of maker and checker roles.\n- **Approval Limits**: Inadequate approval limits for managers and officers.\n- **Vendor Master Management**: Inadequate maintenance and approval of the vendor master.\n- **Limit Splitting**: Inadequate controls over large payments, leading to potential avoidance of higher-level approval.\n\n### Recommendations\n1. **Segregation of Duties**: Ensure that maker and checker roles are properly segregated.\n2. **Approval Limits**: Review and adjust approval limits to ensure they are appropriate and enforceable.\n3. **Vendor Master Management**: Implement and maintain a robust vendor approval process.\n4. **Limit Splitting**: Strengthen controls over large payments to prevent splitting and avoid higher-level approval.\n\nThese recommendations should help address the identified control weaknesses and reduce the risk of fraud and errors.", "code": false}], "answer": "### Audit Findings\n\n#### Finding 1: Maker-Checker / Segregation of Duties (P-02)\n- **Condition**: Same user made and approved the payment.\n- **Criteria**: Maker-checker / segregation of duties control is not properly enforced.\n- **Cause**: Inadequate segregation of duties, possibly due to user role assignment or staffing shortages.\n- **Effect**: Potential for self-approval or manipulation, lack of independent review.\n- **Recommendation**: Ensure proper segregation of maker and checker roles. Review and adjust user roles to prevent conflicts of interest.\n- **Rating**: High\n\n#### Finding 2: Delegation of Authority (P-03)\n- **Condition**: Payment amount exceeds the manager's approval limit.\n- **Criteria**: Delegation of authority control is not properly enforced.\n- **Cause**: Inadequate approval limits for managers, lack of control over large payments.\n- **Effect**: Risk of overpayment and potential abuse of authority.\n- **Recommendation**: Review and adjust approval limits for managers. Implement additional controls to ensure large payments are properly reviewed and approved.\n- **Rating**: High\n\n#### Finding 3: Vendor Master (P-04)\n- **Condition**: Payee not in approved vendor master.\n- **Criteria**: Vendor master control is not properly maintained.\n- **Cause**: Inadequate vendor master management, lack of formal vendor approval process.\n- **Effect**: Risk of unauthorized payments and potential fraud.\n- **Recommendation**: Implement and maintain a robust vendor approval process. Regularly update and review the vendor master.\n- **Rating**: High\n\n#### Finding 4: Vendor Master (P-05)\n- **Condition**: Payee not in approved vendor master.\n- **Criteria**: Vendor master control is not properly maintained.\n- **Cause**: Inadequate vendor master management, lack of formal vendor approval process.\n- **Effect**: Risk of unauthorized payments and potential fraud.\n- **Recommendation**: Implement and maintain a robust vendor approval process. Regularly update and review the vendor master.\n- **Rating**: High\n\n#### Finding 5: Limit Splitting (P-04, P-05)\n- **Condition**: Multiple payments just below officer limit.\n- **Criteria**: Control over large payments is inadequate.\n- **Cause**: Inadequate approval limits for officers, lack of controls to prevent splitting payments.\n- **Effect**: Risk of overpayment and potential avoidance of higher-level approval.\n- **Recommendation**: Review and adjust approval limits for officers. Implement additional controls to ensure large payments are properly reviewed and approved.\n- **Rating**: High\n\n### Overall Control Environment Opinion\n- **Opinion**: Needs Improvement\n\n### Agreed Actions\n1. **Segregation of Duties**: Ensure proper segregation of maker and checker roles. Review and adjust user roles to prevent conflicts of interest.\n2. **Approval Limits**: Review and adjust approval limits for managers and officers. Implement additional controls to ensure large payments are properly reviewed and approved.\n3. **Vendor Master Management**: Implement and maintain a robust vendor approval process. Regularly update and review the vendor master.\n4. **Limit Splitting**: Review and adjust approval limits for officers. Implement additional controls to ensure large payments are properly reviewed and approved.\n\nThese actions should help address the identified control weaknesses and reduce the risk of fraud and errors."}]}}, {"slug": "50_operational_risk_analyzer", "title": "Operational Risk Incident Analyzer", "category": "enterprise", "framework": "LangChain", "pattern": "Structured extraction", "description": "Classifies operational-loss incidents into Basel event types and suggests root cause and controls.", "how": "Each incident is mapped to a structured schema (Basel event type, root cause, severity, control).", "today": "Every operational loss or near miss (an IT outage, a keying error, a forged signature) is logged, classified and analysed to prevent repeats.", "who": "Operational risk teams (Risk department).", "why": "Inconsistent classification makes loss data unreliable for reporting and capital calculations.", "terms": ["Operational risk", "Basel event types"], "code": "\"\"\"Operational Risk Incident Analyzer — LangChain structured output + Ollama.\n\nRun:  python 01_banking/50_operational_risk_analyzer/app.py\n\"\"\"\n\nimport sys\nfrom collections import Counter\nfrom pathlib import Path\nfrom typing import Literal\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import banner, run_structured, section\n\nINCIDENTS = [\n    (\"INC-101\", 42_000, \"Teller processed a withdrawal on a forged signature; customer reported unauthorised debit next day.\"),\n    (\"INC-102\", 180_000, \"Core banking batch job failed overnight; 12,000 salary credits delayed by 6 hours, compensation paid.\"),\n    (\"INC-103\", 7_500, \"Wrong FX rate keyed manually for a corporate remittance; difference absorbed by the bank.\"),\n    (\"INC-104\", 0, \"Phishing email led an employee to enter credentials; account locked by SOC within 20 minutes, no loss.\"),\n    (\"INC-105\", 250_000, \"Regulator fined the bank for late filing of currency transaction reports for two quarters.\"),\n    (\"INC-106\", 15_000, \"Branch ATM damaged by flood water; cash written off and repairs required.\"),\n]\n\n\nclass Incident(BaseModel):\n    basel_event_type: Literal[\"Internal Fraud\", \"External Fraud\", \"Employment Practices & Workplace Safety\",\n                              \"Clients, Products & Business Practices\", \"Damage to Physical Assets\",\n                              \"Business Disruption & System Failures\", \"Execution, Delivery & Process Management\"]\n    root_cause: Literal[\"people\", \"process\", \"systems\", \"external\"]\n    severity: Literal[\"low\", \"medium\", \"high\"]\n    near_miss: bool = Field(description=\"True if no financial loss occurred\")\n    control_failure: str = Field(description=\"Which control failed, one sentence\")\n    recommended_control: str = Field(description=\"Preventive or detective control to add, one sentence\")\n\n\ndef main():\n    banner(\"50 - Operational Risk Incident Analyzer (LangChain structured output)\")\n    system = (\n        \"You are an operational risk analyst. Classify the incident using the Basel II level-1 event types:\\n\"\n        \"- Internal Fraud: dishonest acts by employees for personal gain\\n\"\n        \"- External Fraud: theft, forgery, hacking or scams by third parties\\n\"\n        \"- Employment Practices & Workplace Safety: HR, discrimination, injury\\n\"\n        \"- Clients, Products & Business Practices: mis-selling, regulatory breaches, fines\\n\"\n        \"- Damage to Physical Assets: natural disasters, fire, flood, vandalism\\n\"\n        \"- Business Disruption & System Failures: IT outages, batch failures, utilities\\n\"\n        \"- Execution, Delivery & Process Management: keying errors, failed processing, data entry mistakes\\n\"\n        \"Honest mistakes and outages are never fraud. Describe the control failure in words, not yes/no.\"\n    )\n    results = []\n    for iid, loss, text in INCIDENTS:\n        r = run_structured(system, f\"Loss: {loss}. {text}\", Incident)\n        results.append((iid, loss, r))\n        section(f\"{iid} (loss {loss:,})\", f\"{text}\\n{r.model_dump_json(indent=2)}\")\n\n    by_type = Counter(r.basel_event_type for _, _, r in results)\n    loss_by_type = Counter()\n    for _, loss, r in results:\n        loss_by_type[r.basel_event_type] += loss\n    section(\"Summary\", \"\\n\".join(f\"{t}: {n} incident(s), loss {loss_by_type[t]:,}\" for t, n in by_type.most_common()))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Operational risk incidents\"] --> EX[\"🧾 LangChain structured output<br/>text → Pydantic schema\"]\n    EX -->|\"validated fields\"| PY[\"🐍 Python<br/>Aggregate losses by event type\"]\n    PY --> OUT[\"📝 Incident summary\"]\n    EX <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class EX ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 24, "turns": [{"ask": "Classify these operational risk incidents by Basel event type and summarise the losses.", "steps": [{"icon": "🧾", "label": "Extracted · INC-101 (loss 42,000)", "body": "Teller processed a withdrawal on a forged signature; customer reported unauthorised debit next day.\n{\n  \"basel_event_type\": \"Internal Fraud\",\n  \"root_cause\": \"process\",\n  \"severity\": \"high\",\n  \"near_miss\": false,\n  \"control_failure\": \"The control failure lies in the inadequate verification process for transactions. Specifically, there was a lack of robust signature verification procedures, which allowed the transaction to be processed based on a forged signature. This indicates that the internal controls designed to prevent unauthorized transactions were not effective.\",\n  \"recommended_control\": \"Implement more stringent signature verification procedures, including the use of additional authentication methods such as signature comparison with a known sample or the use of digital signatures. Additionally, regular training for tellers on recognizing and preventing fraud attempts should be conducted.\"\n}", "code": true}, {"icon": "🧾", "label": "Extracted · INC-102 (loss 180,000)", "body": "Core banking batch job failed overnight; 12,000 salary credits delayed by 6 hours, compensation paid.\n{\n  \"basel_event_type\": \"Business Disruption & System Failures\",\n  \"root_cause\": \"systems\",\n  \"severity\": \"high\",\n  \"near_miss\": false,\n  \"control_failure\": \"The control failure in this incident lies in the inadequate testing and validation processes for the core banking batch job. The failure to identify and address potential issues during the testing phase led to a critical system outage that delayed salary credits for 12,000 employees. This highlights a gap in the organization's change management and system maintenance procedures, which failed to ensure the robustness and reliability of the batch processing system.\",\n  \"recommended_control\": \"Implement a more rigorous testing and validation framework for batch jobs, including stress testing and regular audits. Establish a robust change management process to ensure all changes to the system are thoroughly tested before deployment. Enhance monitoring and alert systems to detect and respond to issues in real-time.\"\n}", "code": true}, {"icon": "🧾", "label": "Extracted · INC-103 (loss 7,500)", "body": "Wrong FX rate keyed manually for a corporate remittance; difference absorbed by the bank.\n{\n  \"basel_event_type\": \"Execution, Delivery & Process Management\",\n  \"root_cause\": \"process\",\n  \"severity\": \"medium\",\n  \"near_miss\": false,\n  \"control_failure\": \"Manual keying of foreign exchange (FX) rates was not integrated into the automated systems, leading to human error. The lack of a robust process to verify and cross-check the manually entered rates contributed to the incident. Additionally, there was no clear procedure or control in place to escalate or review such manual entries, which allowed the error to go unnoticed and result in a loss.\",\n  \"recommended_control\": \"Implement automated FX rate lookup and verification systems to reduce manual errors. Establish a review and approval process for manual rate entries. Train staff on the importance of double-checking and verifying all manual entries.\"\n}", "code": true}, {"icon": "🧾", "label": "Extracted · INC-104 (loss 0)", "body": "Phishing email led an employee to enter credentials; account locked by SOC within 20 minutes, no loss.\n{\n  \"basel_event_type\": \"External Fraud\",\n  \"root_cause\": \"systems\",\n  \"severity\": \"low\",\n  \"near_miss\": true,\n  \"control_failure\": \"The security awareness and phishing training for employees were insufficient, leading to the employee falling for the phishing email. Additionally, the incident response time could have been faster, as the account was locked within 20 minutes, but this quick action mitigated the potential impact.\",\n  \"recommended_control\": \"Enhance phishing training programs for employees to better recognize and respond to phishing attempts. Implement more robust email filtering and monitoring systems to detect and block suspicious emails more effectively.\"\n}", "code": true}, {"icon": "🧾", "label": "Extracted · INC-105 (loss 250,000)", "body": "Regulator fined the bank for late filing of currency transaction reports for two quarters.\n{\n  \"basel_event_type\": \"Clients, Products & Business Practices\",\n  \"root_cause\": \"process\",\n  \"severity\": \"medium\",\n  \"near_miss\": false,\n  \"control_failure\": \"The control failure in this incident lies in the inadequate process and oversight for timely submission of currency transaction reports. There was a lack of robust monitoring and alert systems to ensure compliance with regulatory deadlines. Additionally, there may have been insufficient training or communication regarding the importance and timing of these reports, leading to the oversight in filing them on time for two quarters.\",\n  \"recommended_control\": \"Implementing a more rigorous and automated process for tracking and submitting currency transaction reports, along with regular training and reminders for relevant staff, can help prevent such incidents in the future.\"\n}", "code": true}, {"icon": "🧾", "label": "Extracted · INC-106 (loss 15,000)", "body": "Branch ATM damaged by flood water; cash written off and repairs required.\n{\n  \"basel_event_type\": \"Damage to Physical Assets\",\n  \"root_cause\": \"external\",\n  \"severity\": \"high\",\n  \"near_miss\": false,\n  \"control_failure\": \"The incident highlights a control failure in the physical security and disaster recovery planning of the branch. The ATM was not adequately protected against flood risks, indicating a gap in the risk assessment and mitigation strategies. Additionally, the lack of a robust backup or alternative cash supply system contributed to the loss of cash and the need for repairs.\",\n  \"recommended_control\": \"Implement enhanced physical security measures for critical assets, including flood barriers and waterproof enclosures. Develop and regularly test a comprehensive disaster recovery plan that includes alternative cash supply mechanisms and backup systems for critical operations.\"\n}", "code": true}], "answer": "Internal Fraud: 1 incident(s), loss 42,000\nBusiness Disruption & System Failures: 1 incident(s), loss 180,000\nExecution, Delivery & Process Management: 1 incident(s), loss 7,500\nExternal Fraud: 1 incident(s), loss 0\nClients, Products & Business Practices: 1 incident(s), loss 250,000\nDamage to Physical Assets: 1 incident(s), loss 15,000"}]}}]}, {"folder": "02_retail", "name": "Retail", "icon": "🛒", "tagline": "Stores, e-commerce and consumer brands", "description": "AI agents for forecasting, pricing, ranging, customer service and store operations in stores and e-commerce.", "industry_101": "**How a retailer makes money:** it buys products from suppliers (*cost*) and sells them for more (*price*). The\ndifference is the *gross margin*. Profit comes from selling enough volume at a healthy margin, while keeping stores,\nwarehouses and delivery costs under control.\n\n**What makes it hard:**\n1. **Inventory** is cash sitting on shelves. Too little means empty shelves and lost sales; too much means markdowns and waste.\n2. **Pricing** must beat competitors without destroying margin, and customers notice price swings.\n3. **Customers** compare everything online; reviews and service quality directly drive sales.\n4. **Margins are thin.** A supermarket may keep only 2-4p of profit from every 1 of sales, so promotions that lose money,\n   products that don't earn their shelf space, or 1-2% of stock lost to theft and waste (*shrink*) make a real difference.\n", "categories": {"supply": "📦 Supply Chain & Inventory", "customer": "🙋 Customer Insight", "merch": "🏷️ Merchandising & Pricing", "service": "💬 E-commerce & Customer Service", "store": "🏬 Store Operations & Loss Prevention"}, "areas": [["supply", "Supply Chain & Inventory", "Forecasts demand, orders from suppliers and keeps the right stock in the right place."], ["customer", "Customer Insight", "Listens to customers (reviews, complaints, behaviour) to improve products and service."], ["merch", "Merchandising & Pricing", "Decides what to sell, at what price and with which promotions."], ["service", "E-commerce & Customer Service", "Helps customers find, buy and return products online, in the app and in store."], ["store", "Store Operations & Loss Prevention", "Runs the stores day to day and protects stock from theft, damage and waste."]], "glossary": {"Demand forecasting": ["Supply chain", "Predicting how many units will sell in future weeks, using past sales, trends, seasons and promotions."], "Replenishment": ["Supply chain", "Re-ordering stock from suppliers so shelves don't run empty."], "Lead time": ["Supply chain", "How long a supplier takes to deliver after an order is placed."], "Weeks of cover": ["Supply chain", "How many weeks current stock will last at forecast sales."], "Safety stock": ["Supply chain", "Extra stock held to protect against forecast errors and late deliveries."], "Reorder point": ["Supply chain", "The stock level at which a new order must be placed to arrive before running out."], "Stock-out": ["Supply chain", "When a product is unavailable: a lost sale and an unhappy customer."], "Promotion uplift": ["Supply chain", "The extra sales a promotion generates over normal demand."], "Customer reviews / sentiment": ["Customer", "Star ratings and comments; sentiment is whether they are positive, neutral or negative."], "Product defect": ["Customer", "A fault in the product itself (leaks, breakage), as opposed to a matter of taste."], "Product recall": ["Customer", "Withdrawing an unsafe product from sale and from customers. Safety complaints must be escalated fast."], "Gross margin": ["Pricing", "(Price - cost) / price. A 30% margin means 30p of every 1 of sales is left after paying for the product."], "Price elasticity": ["Pricing", "How much volume changes when price changes. Elasticity of -2 means a 1% price cut lifts volume about 2%."], "Competitive price index": ["Pricing", "Our price compared to competitors' average for the same product."], "Markdown": ["Pricing", "A permanent price cut, usually to clear excess or seasonal stock."], "Category manager": ["Pricing", "The person who owns a product category's range, pricing and profit."], "Purchase order (PO)": ["Supply chain", "A formal order to a supplier: which products, how many, at what price and when to deliver."], "Short shipment": ["Supply chain", "A delivery with fewer units than were ordered."], "Shrinkflation": ["Supply chain", "A smaller pack sold at the same price: a hidden price increase."], "Incremental profit": ["Promotions & range", "The extra profit a promotion earns on top of what normal sales would have made, after all its side effects."], "Post-promotion dip": ["Promotions & range", "Customers stock up during a promotion (pantry loading), so sales fall below normal for a few weeks afterwards."], "Cannibalisation": ["Promotions & range", "When a promotion takes sales from our own similar products instead of winning new ones."], "Supplier funding": ["Promotions & range", "Money a supplier pays per unit sold on promotion, to share the cost of the discount."], "Range review": ["Promotions & range", "A regular review of which products a category should stock, drop or add."], "Facing": ["Promotions & range", "One product's width at the front of the shelf. More facings means more space, visibility and stock on display."], "Transferable demand": ["Promotions & range", "The share of a product's buyers who would buy something else in the range if it were removed."], "Delist": ["Promotions & range", "To stop stocking a product."], "Click-and-collect": ["Service", "Order online, then pick the item up in a store."], "Restocking fee": ["Service", "A share of the price kept back on some opened returns s. Seasonal products (sunscreen in summer, scarves in winter) change fast, and both empty shelves and overstock cost money.", "terms": ["Demand forecasting", "Replenishment", "Lead time", "Weeks of cover", "Safety stock", "Reorder point", "Stock-out", "Promotion uplift"], "code": "\"\"\"Demand Forecasting & Replenishment Agent — LangChain tool-calling agent + Ollama.\n\nRun:  python 02_retail/01_demand_forecasting_agent/app.py\n      python 02_retail/01_demand_forecasting_agent/app.py \"Will SKU-102 run out before the next delivery?\"\n\"\"\"\n\nimport math\nimport statistics\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\n# Last 8 weeks of unit sales, current stock, supplier lead time and planned promotions\nPRODUCTS = {\n    \"SKU-101\": {\"name\": \"Organic oat milk 1L\", \"sales\": [410, 395, 430, 420, 445, 460, 452, 470], \"stock\": 900,\n                \"on_order\": 0, \"lead_time_weeks\": 1, \"case_size\": 12, \"promo_next_week\": False},\n    \"SKU-102\": {\"name\": \"Sunscreen SPF50 200ml\", \"sales\": [80, 95, 120, 150, 175, 210, 240, 260], \"stock\": 380,\n                \"on_order\": 0, \"lead_time_weeks\": 2, \"case_size\": 24, \"promo_next_week\": True},\n    \"SKU-103\": {\"name\": \"Wool scarf (grey)\", \"sales\": [60, 52, 41, 35, 30, 22, 18, 15], \"stock\": 640,\n                \"on_order\": 200, \"lead_time_weeks\": 4, \"case_size\": 10, \"promo_next_week\": False},\n}\nPROMO_UPLIFT = 0.35   # promotions lift demand ~35%\nSERVICE_Z = 1.65      # ~95% service level\n\n\n@tool\ndef list_products() -> dict:\n    \"\"\"List SKUs with product names.\"\"\"\n    return {sku: p[\"name\"] for sku, p in PRODUCTS.items()}\n\n\n@tool\ndef forecast_demand(sku: str, weeks: int = 4) -> dict:\n    \"\"\"Forecast weekly unit demand for a SKU using the recent trend, plus promotion uplift.\"\"\"\n    p = PRODUCTS[sku]\n    recent = p[\"sales\"][-4:]\n    trend = (recent[-1] - recent[0]) / 3  # units per week\n    base = statistics.mean(recent)\n    forecast = []\n    for w in range(1, weeks + 1):\n        f = max(base + trend * (w + 1.5), 0)\n        if w == 1 and p[\"promo_next_week\"]:\n            f *= 1 + PROMO_UPLIFT\n        forecast.append(round(f))\n    return {\"sku\": sku, \"trend_units_per_week\": round(trend, 1), \"weekly_forecast\": forecast,\n            \"promo_next_week\": p[\"promo_next_week\"]}\n\n\n@tool\ndef reorder_plan(sku: str) -> dict:\n    \"\"\"Weeks of stock cover, reorder point and recommended order quantity (rounded to full cases).\"\"\"\n    p = PRODUCTS[sku]\n    fc_info = forecast_demand.invoke({\"sku\": sku, \"weeks\": 12})\n    fc = fc_info[\"weekly_forecast\"]\n    lead, horizon = p[\"lead_time_weeks\"], p[\"lead_time_weeks\"] + 2   # order covers lead time + 2 weeks\n    lead_demand = sum(fc[:lead])\n    safety = SERVICE_Z * statistics.stdev(p[\"sales\"]) * math.sqrt(lead)\n    reorder_point = lead_demand + safety\n    available = p[\"stock\"] + p[\"on_order\"]\n    cover_weeks, left = 0.0, available\n    for f in fc:\n        if left >= f:\n            cover_weeks, left = cover_weeks + 1, left - f\n        else:\n            cover_weeks += left / f if f else 0\n            break\n    order_now = available < reorder_point\n    need = reorder_point + sum(fc[lead:horizon]) - available if order_now else 0\n    qty = math.ceil(need / p[\"case_size\"]) * p[\"case_size\"] if need > 0 else 0\n    trend = fc_info[\"trend_units_per_week\"]\n    if trend < 0 and cover_weeks >= 6:\n        status = \"SLOW SELLER / OVERSTOCK (consider markdown or cancelling open orders)\"\n    elif trend > 0.05 * statistics.mean(p[\"sales\"][-4:]):\n        status = \"GROWING DEMAND (do not discount)\"\n    else:\n        status = \"STEADY\"\n    return {\"sku\": sku, \"available_units\": available,\n            \"weeks_of_cover\": f\"{cover_weeks:.1f}\" if cover_weeks < 12 else
