ption": "Scores a retail loan applicant and writes a credit decision memo with risk grade and conditions.", "how": "Python computes DTI, LTI, PD-style score and policy breaches; a Credit Analyst agent interprets the numbers and a Chief Risk Officer agent issues approve / decline / refer with rationale.", "today": "When someone applies for a personal loan, the bank must decide: will this person pay us back? Credit analysts look at income, existing debts, credit bureau history and the bank's lending policy, then a more senior approver signs off.", "who": "Retail credit analysts and credit approvers (Risk department).", "why": "Thousands of applications arrive daily. Decisions must be fast, consistent and explainable to the customer and the regulator.", "terms": ["Credit risk", "DTI (Debt-to-Income)", "LTI (Loan-to-Income)", "EMI", "Credit score / bureau score", "Risk grade"], "code": "\"\"\"Credit Risk Assessment Agent — CrewAI + Ollama.\n\nPython computes the hard numbers (DTI, LTI, score, policy breaches) so they are\nauditable; two agents interpret them and issue a decision memo.\n\nRun:  python 01_banking/01_credit_risk_assessment/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nAPPLICANT = {\n    \"name\": \"Priya Sharma\",\n    \"age\": 34,\n    \"employment\": \"Salaried - IT services, 6 years\",\n    \"annual_income\": 1_800_000,\n    \"existing_monthly_emi\": 18_000,\n    \"requested_loan\": 1_200_000,\n    \"tenure_months\": 60,\n    \"interest_rate_pct\": 11.5,\n    \"credit_score\": 742,\n    \"delinquencies_24m\": 0,\n    \"credit_utilisation_pct\": 38,\n    \"purpose\": \"Home renovation\",\n}\n\nPOLICY = {\"max_dti_pct\": 50, \"max_lti\": 5, \"min_score\": 680, \"max_delinquencies\": 1}\n\n\ndef emi(principal: float, annual_rate_pct: float, months: int) -> float:\n    r = annual_rate_pct / 12 / 100\n    return principal * r * (1 + r) ** months / ((1 + r) ** months - 1)\n\n\ndef assess(a: dict) -> dict:\n    new_emi = emi(a[\"requested_loan\"], a[\"interest_rate_pct\"], a[\"tenure_months\"])\n    monthly_income = a[\"annual_income\"] / 12\n    dti = (a[\"existing_monthly_emi\"] + new_emi) / monthly_income * 100\n    lti = a[\"requested_loan\"] / a[\"annual_income\"]\n\n    # Simple, transparent scorecard (0-100). Replace with your PD model.\n    score = 50\n    score += (a[\"credit_score\"] - 650) / 5\n    score -= max(0, dti - 35) * 0.8\n    score -= a[\"delinquencies_24m\"] * 10\n    score -= max(0, a[\"credit_utilisation_pct\"] - 30) * 0.3\n    score = round(max(0, min(100, score)), 1)\n    grade = \"A\" if score >= 75 else \"B\" if score >= 60 else \"C\" if score >= 45 else \"D\"\n\n    breaches = []\n    if dti > POLICY[\"max_dti_pct\"]:\n        breaches.append(f\"DTI {dti:.1f}% > {POLICY['max_dti_pct']}%\")\n    if lti > POLICY[\"max_lti\"]:\n        breaches.append(f\"LTI {lti:.2f}x > {POLICY['max_lti']}x\")\n    if a[\"credit_score\"] < POLICY[\"min_score\"]:\n        breaches.append(f\"Bureau score {a['credit_score']} < {POLICY['min_score']}\")\n    if a[\"delinquencies_24m\"] > POLICY[\"max_delinquencies\"]:\n        breaches.append(\"Too many delinquencies in 24 months\")\n\n    def headroom(value: float, limit: float) -> str:\n        used = value / limit\n        return \"BREACH\" if used > 1 else \"NEAR LIMIT\" if used > 0.85 else \"WITHIN LIMIT (comfortable)\"\n\n    return {\n        \"policy_assessment\": {\n            \"dti\": f\"{dti:.1f}% vs max {POLICY['max_dti_pct']}% -> {headroom(dti, POLICY['max_dti_pct'])}\",\n            \"lti\": f\"{lti:.2f}x vs max {POLICY['max_lti']}x -> {headroom(lti, POLICY['max_lti'])}\",\n            \"credit_score\": f\"{a['credit_score']} vs min {POLICY['min_score']} -> \"\n                            f\"{'PASS' if a['credit_score'] >= POLICY['min_score'] else 'FAIL'}\",\n        },\n        \"new_emi\": round(new_emi),\n        \"dti_pct\": round(dti, 1),\n        \"lti\": round(lti, 2),\n        \"risk_score\": score,\n        \"risk_grade\": grade,\n        \"policy_breaches\": breaches or [\"None\"],\n    }\n\n\ndef main():\n    banner(\"01 - Credit Risk Assessment Agent (CrewAI)\")\n    metrics = assess(APPLICANT)\n    section(\"Computed metrics\", json.dumps(metrics, indent=2))\n\n    analyst = make_agent(\n        \"Retail Credit Analyst\",\n        \"Analyse applicant data and computed risk metrics objectively\",\n        \"10 years of retail lending experience; you explain risk drivers clearly and never invent data.\",\n    )\n    cro = make_agent(\n        \"Chief Risk Officer\",\n        \"Make a final, policy-compliant credit decision\",\n        \"You chair the credit committee and balance growth with prudent risk management.\",\n    )\n\n    analysis = make_task(\n        \"Applicant:\\n{applicant}\\n\\nComputed metrics:\\n{metrics}\\n\\nBank policy:\\n{policy}\\n\\n\"\n        \"Identify the key strengths, weaknesses and risk drivers of this application.\",\n        \"Bullet list of strengths, weaknesses and key risk drivers referencing the numbers.\",\n        analyst,\n    )\n    decision = make_task(\n        \"Using the analyst's review, issue a credit decision memo.\\n\\n\"\n        \"Exact computed metrics (quote these; never invent numbers):\\n{metrics}\\n\\n\"\n        \"Bank policy limits (compare each metric to its limit before judging it):\\n{policy}\",\n        \"Memo with: Decision (APPROVE / APPROVE WITH CONDITIONS / REFER / DECLINE), risk grade, \"\n        \"3-line rationale, conditions or covenants, and recommended pricing adjustment.\",\n        cro,\n        context=[analysis],\n    )\n\n    result = run_crew(\n        [analyst, cro],\n        [analysis, decision],\n        {\"applicant\": json.dumps(APPLICANT, indent=2), \"metrics\": json.dumps(metrics, indent=2),\n         \"policy\": json.dumps(POLICY, indent=2)},\n    )\n    section(\"Credit decision memo\", result)\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "02_loan_underwriting_assistant", "title": "Loan Underwriting Assistant", "category": "credit", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Underwriter copilot that checks DTI, LTV and policy rules through tools before recommending a decision.", "how": "A LangChain agent calls `calculate_dti`, `calculate_ltv` and `check_policy` tools against the application and explains which rules pass or fail.", "today": "Mortgage underwriters check every application against a rulebook: can the borrower afford the payments, is the deposit big enough, is their job stable? They then approve, decline or approve with conditions.", "who": "Mortgage underwriters (Retail Lending).", "why": "Rules are detailed and easy to misapply under time pressure; every decision must be traceable to a rule.", "terms": ["Underwriting", "DTI (Debt-to-Income)", "LTV (Loan-to-Value)", "Credit score / bureau score"], "code": "\"\"\"Loan Underwriting Assistant — LangChain tool-calling agent + Ollama.\n\nRun:  python 01_banking/02_loan_underwriting_assistant/app.py\n      python 01_banking/02_loan_underwriting_assistant/app.py \"Can APP-1002 be approved?\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nAPPLICATIONS = {\n    \"APP-1001\": {\"monthly_income\": 9500, \"monthly_debt\": 1800, \"loan_amount\": 320000,\n                 \"property_value\": 400000, \"credit_score\": 728, \"employment_years\": 5, \"loan_type\": \"mortgage\"},\n    \"APP-1002\": {\"monthly_income\": 6000, \"monthly_debt\": 2600, \"loan_amount\": 285000,\n                 \"property_value\": 300000, \"credit_score\": 655, \"employment_years\": 1, \"loan_type\": \"mortgage\"},\n}\n\nPOLICY = {\"max_dti\": 0.43, \"max_ltv\": 0.80, \"min_score\": 680, \"min_employment_years\": 2}\n\n\n@tool\ndef get_application(app_id: str) -> dict:\n    \"\"\"Fetch a loan application by id, e.g. APP-1001.\"\"\"\n    return APPLICATIONS.get(app_id.upper(), {\"error\": f\"{app_id} not found\"})\n\n\n@tool\ndef calculate_dti(monthly_debt: float, monthly_income: float, new_monthly_payment: float = 0) -> str:\n    \"\"\"Debt-to-income ratio including an optional new monthly payment.\"\"\"\n    dti = (monthly_debt + new_monthly_payment) / monthly_income\n    return f\"DTI = {dti:.1%} (policy max {POLICY['max_dti']:.0%})\"\n\n\n@tool\ndef calculate_ltv(loan_amount: float, property_value: float) -> str:\n    \"\"\"Loan-to-value ratio for secured lending.\"\"\"\n    ltv = loan_amount / property_value\n    return f\"LTV = {ltv:.1%} (policy max {POLICY['max_ltv']:.0%}; above this requires mortgage insurance)\"\n\n\n@tool\ndef check_policy(app_id: str) -> dict:\n    \"\"\"Run all underwriting policy rules for an application; returns value, threshold and pass/fail per rule.\"\"\"\n    a = APPLICATIONS.get(app_id.upper())\n    if not a:\n        return {\"error\": \"not found\"}\n    dti = a[\"monthly_debt\"] / a[\"monthly_income\"]\n    ltv = a[\"loan_amount\"] / a[\"property_value\"]\n    return {\n        \"dti\": {\"value\": round(dti, 3), \"max\": POLICY[\"max_dti\"], \"pass\": dti <= POLICY[\"max_dti\"]},\n        \"ltv\": {\"value\": round(ltv, 3), \"max\": POLICY[\"max_ltv\"], \"pass\": ltv <= POLICY[\"max_ltv\"]},\n        \"credit_score\": {\"value\": a[\"credit_score\"], \"min\": POLICY[\"min_score\"],\n                         \"pass\": a[\"credit_score\"] >= POLICY[\"min_score\"]},\n        \"employment_years\": {\"value\": a[\"employment_years\"], \"min\": POLICY[\"min_employment_years\"],\n                             \"pass\": a[\"employment_years\"] >= POLICY[\"min_employment_years\"]},\n    }\n\n\nSYSTEM = (\n    \"You are a mortgage underwriting assistant at a bank. Always use the tools to fetch data and \"\n    \"compute ratios - never guess numbers. Give: a summary table of ratios, which policy rules pass \"\n    \"or fail, a recommendation (Approve / Approve with conditions / Decline) and any conditions.\"\n)\n\n\ndef main():\n    banner(\"02 - Loan Underwriting Assistant (LangChain agent)\")\n    question = sys.argv[1] if len(sys.argv) > 1 else \"Underwrite APP-1001 and APP-1002 and compare them.\"\n    section(\"Question\", question)\n    section(\"Answer\", run_agent(SYSTEM, [get_application, calculate_dti, calculate_ltv, check_policy], question))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "03_sme_credit_memo_writer", "title": "SME Credit Memo Writer", "category": "credit", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Turns SME financials into a bank-style credit memo (business profile, ratios, risks, mitigants).", "how": "Ratios (DSCR, current ratio, leverage, margins) are computed in Python; a Financial Analyst agent analyses them and a Credit Writer agent drafts the memo.", "today": "Before lending to a small or mid-sized business, a relationship manager and credit analyst write a 'credit memo': who the business is, how it is performing, whether it can repay, and what protections the bank will take.", "who": "Corporate/SME relationship managers and credit analysts.", "why": "Writing a memo takes days of spreadsheet work and drafting; analysts spend more time writing than analysing.", "terms": ["Credit memo", "DSCR (Debt Service Coverage Ratio)", "EBITDA / EBIT", "Leverage (debt-to-equity)", "Covenant", "Collateral"], "code": "\"\"\"SME Credit Memo Writer — CrewAI + Ollama.\n\nRun:  python 01_banking/03_sme_credit_memo_writer/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nBORROWER = {\n    \"name\": \"GreenLeaf Foods Pvt Ltd\",\n    \"industry\": \"Packaged food manufacturing\",\n    \"years_in_business\": 9,\n    \"facility_requested\": \"Working capital line 25,000,000 + term loan 15,000,000 for new packaging unit\",\n    \"collateral\": \"Factory land & building (valued 60,000,000), stock and receivables hypothecation\",\n}\n\nFINANCIALS = {  # in thousands\n    \"FY2024\": {\"revenue\": 210_000, \"ebitda\": 25_200, \"net_profit\": 9_800, \"interest\": 5_100, \"principal_repaid\": 6_000,\n               \"current_assets\": 78_000, \"current_liabilities\": 52_000, \"total_debt\": 64_000, \"equity\": 58_000},\n    \"FY2025\": {\"revenue\": 246_000, \"ebitda\": 28_300, \"net_profit\": 11_200, \"interest\": 5_900, \"principal_repaid\": 7_000,\n               \"current_assets\": 92_000, \"current_liabilities\": 66_000, \"total_debt\": 71_000, \"equity\": 69_000},\n}\n\n\ndef ratios(f: dict) -> dict:\n    out = {}\n    for year, d in f.items():\n        out[year] = {\n            \"ebitda_margin_pct\": round(d[\"ebitda\"] / d[\"revenue\"] * 100, 1),\n            \"net_margin_pct\": round(d[\"net_profit\"] / d[\"revenue\"] * 100, 1),\n            \"dscr\": round(d[\"ebitda\"] / (d[\"interest\"] + d[\"principal_repaid\"]), 2),\n            \"current_ratio\": round(d[\"current_assets\"] / d[\"current_liabilities\"], 2),\n            \"debt_to_equity\": round(d[\"total_debt\"] / d[\"equity\"], 2),\n            \"debt_to_ebitda\": round(d[\"total_debt\"] / d[\"ebitda\"], 2),\n        }\n    y0, y1 = list(f)\n    out[\"revenue_growth_pct\"] = round((f[y1][\"revenue\"] / f[y0][\"revenue\"] - 1) * 100, 1)\n    return out\n\n\ndef main():\n    banner(\"03 - SME Credit Memo Writer (CrewAI)\")\n    r = ratios(FINANCIALS)\n    section(\"Computed ratios\", json.dumps(r, indent=2))\n\n    analyst = make_agent(\"SME Financial Analyst\", \"Interpret the borrower's financial performance and trends\",\n                         \"Corporate banking analyst who focuses on cash-flow repayment capacity.\")\n    writer = make_agent(\"Credit Memo Writer\", \"Write a concise, bank-standard credit memo\",\n                        \"You write credit papers for the credit committee. Structured, factual, no fluff.\")\n\n    t1 = make_task(\n        \"Borrower:\\n{borrower}\\n\\nFinancials (thousands):\\n{financials}\\n\\nRatios:\\n{ratios}\\n\\n\"\n        \"Assess profitability, liquidity, leverage and repayment capacity. Note trends and red flags.\",\n        \"Analytical notes under Profitability, Liquidity, Leverage, Repayment Capacity, Red Flags.\",\n        analyst,\n    )\n    t2 = make_task(\n        \"Write the credit memo using the analysis.\\n\\nBorrower:\\n{borrower}\\n\\n\"\n        \"Exact ratios (quote these; never invent numbers):\\n{ratios}\",\n        \"Credit memo with sections: 1. Borrower Overview 2. Facility Request 3. Financial Analysis \"\n        \"(with key ratios) 4. Key Risks & Mitigants 5. Covenants 6. Recommendation.\",\n        writer,\n        context=[t1],\n    )\n    memo = run_crew([analyst, writer], [t1, t2], {\n        \"borrower\": json.dumps(BORROWER, indent=2),\n        \"financials\": json.dumps(FINANCIALS, indent=2),\n        \"ratios\": json.dumps(r, indent=2),\n    })\n    section(\"Credit memo\", memo)\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "04_credit_limit_optimizer", "title": "Credit Card Limit Optimizer", "category": "credit", "framework": "LangChain", "pattern": "Chain", "description": "Recommends credit-limit increases or decreases per card holder with an explainable reason.", "how": "Rule-based eligibility and utilisation bands feed an LLM chain that produces a recommended limit and customer-friendly explanation.", "today": "Card issuers regularly review limits: raise them for good customers who need more room, and reduce them for customers showing signs of stress, to manage risk.", "who": "Card portfolio managers (Cards / Unsecured Lending).", "why": "Limit changes affect revenue, risk and customer trust. Each one needs a clear reason, especially a decrease.", "terms": ["Credit limit / utilisation", "Credit score / bureau score", "Credit risk"], "code": "\"\"\"Credit Card Limit Optimizer — LangChain chain + Ollama.\n\nRules decide the action and the new limit; the LLM explains it.\n\nRun:  python 01_banking/04_credit_limit_optimizer/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\nCARDHOLDERS = [\n    {\"id\": \"C-201\", \"limit\": 5000, \"avg_balance_6m\": 4300, \"on_time_payments_12m\": 12, \"income\": 85000, \"bureau_score\": 760, \"months_on_book\": 30},\n    {\"id\": \"C-202\", \"limit\": 8000, \"avg_balance_6m\": 900, \"on_time_payments_12m\": 12, \"income\": 60000, \"bureau_score\": 710, \"months_on_book\": 48},\n    {\"id\": \"C-203\", \"limit\": 6000, \"avg_balance_6m\": 5900, \"on_time_payments_12m\": 8, \"income\": 40000, \"bureau_score\": 640, \"months_on_book\": 14},\n]\n\n\ndef recommend(c: dict) -> dict:\n    util = c[\"avg_balance_6m\"] / c[\"limit\"]\n    max_limit = c[\"income\"] * 0.25  # exposure cap: 25% of annual income\n    if c[\"on_time_payments_12m\"] < 10 or c[\"bureau_score\"] < 660:\n        # never cut below the current balance; if that means no cut, freeze further increases\n        new = min(c[\"limit\"], max(c[\"avg_balance_6m\"], c[\"limit\"] * 0.8))\n        action = \"DECREASE\" if new < c[\"limit\"] else \"FREEZE\"\n    elif util > 0.7 and c[\"months_on_book\"] >= 12:\n        action, new = \"INCREASE\", min(c[\"limit\"] * 1.5, max_limit)\n    elif util < 0.2:\n        action, new = \"HOLD\", c[\"limit\"]\n    else:\n        action, new = \"INCREASE\", min(c[\"limit\"] * 1.2, max_limit)\n    return {**c, \"utilisation_pct\": round(util * 100), \"action\": action, \"new_limit\": round(new, -2)}\n\n\nSYSTEM = (\n    \"You are a card portfolio manager. For each card holder, explain the limit decision in 2 sentences \"\n    \"for the internal file, then write one friendly, compliant sentence for the customer notification. \"\n    \"Do not change the decided numbers.\"\n)\n\n\ndef main():\n    banner(\"04 - Credit Card Limit Optimizer (LangChain)\")\n    decisions = [recommend(c) for c in CARDHOLDERS]\n    section(\"Rule-based decisions\", json.dumps(decisions, indent=2))\n    section(\"Explanations\", run_chain(SYSTEM, \"Decisions:\\n{decisions}\", decisions=json.dumps(decisions, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "05_collections_strategy_agent", "title": "Collections & Recovery Strategist", "category": "credit", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Segments delinquent accounts and designs a compliant, empathetic collection strategy per segment.", "how": "Accounts are bucketed by DPD and propensity-to-pay; a Collections Strategist agent designs treatments and a Conduct Reviewer agent checks for fair-treatment issues.", "today": "When customers miss loan payments, the collections team decides who to contact, how (SMS, call, letter), how often, and what to offer (payment plan, settlement).", "who": "Collections strategy and operations teams.", "why": "Too soft loses money; too aggressive harms customers and breaks conduct rules, especially for customers in hardship.", "terms": ["Collections", "DPD (Days Past Due)", "Delinquency / NPA / NPL", "Propensity to pay", "Vulnerable customer"], "code": "\"\"\"Collections & Recovery Strategist — CrewAI + Ollama.\n\nRun:  python 01_banking/05_collections_strategy_agent/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom collections import defaultdict\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nACCOUNTS = [\n    {\"id\": \"L-01\", \"dpd\": 12, \"outstanding\": 2400, \"promises_broken\": 0, \"contact_rate\": 0.9, \"hardship_flag\": False},\n    {\"id\": \"L-02\", \"dpd\": 45, \"outstanding\": 8100, \"promises_broken\": 2, \"contact_rate\": 0.4, \"hardship_flag\": False},\n    {\"id\": \"L-03\", \"dpd\": 75, \"outstanding\": 15200, \"promises_broken\": 1, \"contact_rate\": 0.2, \"hardship_flag\": True},\n    {\"id\": \"L-04\", \"dpd\": 5, \"outstanding\": 900, \"promises_broken\": 0, \"contact_rate\": 1.0, \"hardship_flag\": False},\n    {\"id\": \"L-05\", \"dpd\": 120, \"outstanding\": 22000, \"promises_broken\": 3, \"contact_rate\": 0.1, \"hardship_flag\": False},\n    {\"id\": \"L-06\", \"dpd\": 35, \"outstanding\": 4300, \"promises_broken\": 0, \"contact_rate\": 0.7, \"hardship_flag\": True},\n]\n\n\ndef bucket(dpd: int) -> str:\n    return \"1-29 (early)\" if dpd < 30 else \"30-59\" if dpd < 60 else \"60-89\" if dpd < 90 else \"90+ (NPA)\"\n\n\ndef propensity(a: dict) -> str:\n    p = 0.8 - a[\"dpd\"] / 200 - a[\"promises_broken\"] * 0.1 + a[\"contact_rate\"] * 0.2\n    return \"High\" if p > 0.6 else \"Medium\" if p > 0.35 else \"Low\"\n\n\ndef segment(accounts: list) -> dict:\n    seg = defaultdict(list)\n    for a in accounts:\n        seg[f\"{bucket(a['dpd'])} | PTP {propensity(a)}\"].append(\n            {\"id\": a[\"id\"], \"outstanding\": a[\"outstanding\"], \"hardship\": a[\"hardship_flag\"]})\n    return dict(seg)\n\n\ndef main():\n    banner(\"05 - Collections & Recovery Strategist (CrewAI)\")\n    segments = segment(ACCOUNTS)\n    section(\"Segments\", json.dumps(segments, indent=2))\n\n    strategist = make_agent(\"Collections Strategist\", \"Design the most effective treatment per segment\",\n                            \"You run a collections department and optimise recovery and cost-to-collect.\")\n    conduct = make_agent(\"Conduct & Fair Treatment Reviewer\", \"Ensure strategies treat customers fairly\",\n                         \"You apply consumer-duty and fair debt collection principles, protecting vulnerable customers.\")\n    t1 = make_task(\n        \"Segments (DPD bucket | propensity-to-pay):\\n{segments}\\n\\n\"\n        \"For each segment propose channel, contact frequency, offer (e.g. payment plan, settlement), and escalation.\",\n        \"Table-like list per segment: channel, frequency, offer, escalation trigger.\", strategist)\n    t2 = make_task(\n        \"Review the strategy for fair treatment. Accounts flagged hardship=true need special handling. \"\n        \"Amend anything aggressive and produce the final strategy.\",\n        \"Final strategy per segment plus a 'Conduct notes' section.\", conduct, context=[t1])\n    section(\"Collections strategy\", run_crew([strategist, conduct], [t1, t2], {\"segments\": json.dumps(segments, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "06_early_warning_signals", "title": "Early Warning Signals (EWS) Monitor", "category": "credit", "framework": "LangChain", "pattern": "Chain", "description": "Detects early signs of stress in a corporate loan book and drafts watch-list commentary.", "how": "Python flags triggers (overdraft breaches, cheque returns, rating downgrades, late financials); an LLM chain writes a watch-list note per borrower.", "today": "For business loans, banks watch for warning signs (overdraft breaches, bounced cheques, falling sales, rating downgrades) so they can act before the borrower defaults.", "who": "Credit monitoring teams and relationship managers.", "why": "Signals are spread across many systems; spotting them early is what makes a recovery possible.", "terms": ["Early Warning Signals (EWS)", "SMA / watch-list", "Credit risk", "Covenant"], "code": "\"\"\"Early Warning Signals (EWS) Monitor — LangChain chain + Ollama.\n\nRun:  python 01_banking/06_early_warning_signals/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\nBORROWERS = [\n    {\"name\": \"Apex Textiles\", \"exposure\": 45_000_000, \"od_limit_breach_days_90d\": 18, \"cheque_returns_90d\": 3,\n     \"rating_change\": \"BBB -> BB\", \"financials_overdue_days\": 60, \"gst_turnover_change_pct\": -28, \"promoter_pledge_pct\": 45},\n    {\"name\": \"Nova Logistics\", \"exposure\": 30_000_000, \"od_limit_breach_days_90d\": 0, \"cheque_returns_90d\": 0,\n     \"rating_change\": \"A (stable)\", \"financials_overdue_days\": 0, \"gst_turnover_change_pct\": 12, \"promoter_pledge_pct\": 0},\n    {\"name\": \"Sunrise Builders\", \"exposure\": 80_000_000, \"od_limit_breach_days_90d\": 7, \"cheque_returns_90d\": 1,\n     \"rating_change\": \"BBB (negative watch)\", \"financials_overdue_days\": 30, \"gst_turnover_change_pct\": -9, \"promoter_pledge_pct\": 20},\n]\n\nRULES = [\n    (\"od_limit_breach_days_90d\", lambda v: v > 10, \"Persistent overdraft limit breaches\"),\n    (\"cheque_returns_90d\", lambda v: v >= 2, \"Repeated cheque returns\"),\n    (\"rating_change\", lambda v: \"->\" in v or \"negative\" in v, \"External rating downgrade / negative outlook\"),\n    (\"financials_overdue_days\", lambda v: v >= 30, \"Delay in submitting financials\"),\n    (\"gst_turnover_change_pct\", lambda v: v < -15, \"Sharp fall in GST turnover\"),\n    (\"promoter_pledge_pct\", lambda v: v > 30, \"High promoter share pledge\"),\n]\n\n\ndef scan(b: dict) -> dict:\n    triggers = [msg for key, test, msg in RULES if test(b[key])]\n    status = \"RED\" if len(triggers) >= 3 else \"AMBER\" if triggers else \"GREEN\"\n    return {\"name\": b[\"name\"], \"exposure\": b[\"exposure\"], \"status\": status, \"triggers\": triggers}\n\n\nSYSTEM = (\n    \"You are a credit monitoring officer. For each AMBER or RED borrower write a watch-list note: \"\n    \"situation, likely cause, recommended actions (e.g. client call, stock audit, tighten limits, SMA classification), \"\n    \"and review date. For GREEN borrowers just say 'No action'.\"\n)\n\n\ndef main():\n    banner(\"06 - Early Warning Signals Monitor (LangChain)\")\n    results = [scan(b) for b in BORROWERS]\n    section(\"EWS scan\", json.dumps(results, indent=2))\n    section(\"Watch-list notes\", run_chain(SYSTEM, \"EWS results:\\n{r}\\n\\nRaw data:\\n{raw}\",\n                                          r=json.dumps(results, indent=2), raw=json.dumps(BORROWERS, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "07_mortgage_prequalification_bot", "title": "Mortgage Pre-Qualification Bot", "category": "credit", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Conversational assistant that estimates how much a customer can borrow and the monthly EMI.", "how": "Agent uses `max_affordable_loan` and `monthly_emi` tools and answers in plain language with assumptions stated.", "today": "Before a full mortgage application, customers want a quick answer to 'how much can I borrow?' so they know which homes to look at.", "who": "Mortgage advisers, branch staff and digital channels.", "why": "Customers expect instant answers at any hour; staff time is better spent on serious applications.", "terms": ["Pre-qualification", "DTI (Debt-to-Income)", "EMI", "LTV (Loan-to-Value)"], "code": "\"\"\"Mortgage Pre-Qualification Bot — LangChain tool-calling agent + Ollama.\n\nRun:  python 01_banking/07_mortgage_prequalification_bot/app.py\n      python 01_banking/07_mortgage_prequalification_bot/app.py \"I earn 7000/month, pay 500 car loan. How much can I borrow?\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nMAX_DTI = 0.40\nDEFAULT_RATE = 6.5\nDEFAULT_YEARS = 30\n\n\n@tool\ndef monthly_emi(loan_amount: float, annual_rate_pct: float = DEFAULT_RATE, years: int = DEFAULT_YEARS) -> str:\n    \"\"\"Monthly repayment for a loan amount, annual interest rate (%) and term in years.\"\"\"\n    r, n = annual_rate_pct / 1200, years * 12\n    pay = loan_amount * r * (1 + r) ** n / ((1 + r) ** n - 1)\n    return f\"Monthly payment: {pay:,.0f} for {loan_amount:,.0f} at {annual_rate_pct}% over {years} years\"\n\n\n@tool\ndef max_affordable_loan(monthly_income: float, monthly_debts: float = 0,\n                        annual_rate_pct: float = DEFAULT_RATE, years: int = DEFAULT_YEARS) -> str:\n    \"\"\"Maximum loan a customer can afford, keeping total debt payments within the bank's 40% DTI limit.\"\"\"\n    budget = monthly_income * MAX_DTI - monthly_debts\n    if budget <= 0:\n        return \"Existing debts already exceed the 40% DTI limit; no additional borrowing capacity.\"\n    r, n = annual_rate_pct / 1200, years * 12\n    loan = budget * ((1 + r) ** n - 1) / (r * (1 + r) ** n)\n    return f\"Max loan ~{loan:,.0f} (monthly payment budget {budget:,.0f}, {annual_rate_pct}% over {years}y)\"\n\n\nSYSTEM = (\n    \"You are a friendly mortgage pre-qualification assistant. Use the tools for every calculation. \"\n    \"State assumptions (rate, term, 40% DTI) clearly, mention this is an indicative estimate and not a \"\n    \"loan offer, and suggest a sensible down payment (20%) to estimate an affordable property price.\"\n)\n\n\ndef main():\n    banner(\"07 - Mortgage Pre-Qualification Bot (LangChain agent)\")\n    q = sys.argv[1] if len(sys.argv) > 1 else (\n        \"I earn 8,500 a month and pay 650 a month on a car loan. How much can I borrow, and what would \"\n        \"the monthly payment be on a 25 year term at 6.2%?\")\n    section(\"Customer\", q)\n    section(\"Assistant\", run_agent(SYSTEM, [max_affordable_loan, monthly_emi], q))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "08_loan_document_extractor", "title": "Loan Document Extractor", "category": "credit", "framework": "LangChain", "pattern": "Structured extraction", "description": "Extracts structured fields from payslips and bank statements for loan processing.", "how": "`with_structured_output` maps unstructured text into a Pydantic schema; Python cross-checks salary vs. statement credits.", "today": "Loan processors read payslips and bank statements to verify income and existing debts, and re-type the figures into the loan system.", "who": "Loan operations / processing teams.", "why": "Manual data entry is slow and error-prone, and mismatches between documents can signal fraud.", "terms": ["Underwriting", "EMI", "DTI (Debt-to-Income)"], "code": "\"\"\"Loan Document Extractor — LangChain structured output + Ollama.\n\nRun:  python 01_banking/08_loan_document_extractor/app.py\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import banner, run_structured, section\n\nPAYSLIP = \"\"\"\nACME TECHNOLOGIES LTD          PAYSLIP FOR THE MONTH OF AUGUST 2026\nEmployee Name: Rohan Mehta     Employee ID: E10442    Designation: Senior Engineer\nDate of Joining: 14-Mar-2019   PAN: ABCPM1234K\nBasic: 60,000   HRA: 24,000   Special Allowance: 21,000   Gross Earnings: 105,000\nPF: 7,200  Professional Tax: 200  Income Tax: 12,600   Total Deductions: 20,000\nNET PAY: 85,000   Paid to A/c XXXX4521 HDFC Bank\n\"\"\"\n\nSTATEMENT = \"\"\"\nHDFC BANK - Statement of Account  A/c No: XXXX4521  Name: ROHAN MEHTA  Period: 01-Aug-2026 to 31-Aug-2026\nOpening balance 142,300.55\n01-Aug  SALARY ACME TECHNOLOGIES   CR 85,000.00\n03-Aug  HOME LOAN EMI ICICI        DR 32,500.00\n05-Aug  CREDIT CARD PAYMENT        DR 18,240.00\n12-Aug  UPI-GROCERY                DR 6,410.00\n20-Aug  SIP MUTUAL FUND            DR 10,000.00\n28-Aug  ATM WITHDRAWAL             DR 5,000.00\nClosing balance 155,150.55\n\"\"\"\n\n\nclass Payslip(BaseModel):\n    employee_name: str\n    employer: str = Field(description=\"Company name printed in the payslip header, not the employee ID\")\n    month: str = Field(description=\"Pay month and year, e.g. 'August 2026'\")\n    gross_salary: float\n    total_deductions: float\n    net_pay: float\n    date_of_joining: str = Field(description=\"As written on the payslip\")\n\n\nclass BankStatement(BaseModel):\n    account_holder: str\n    period: str\n    opening_balance: float\n    closing_balance: float\n    salary_credits: float = Field(description=\"Sum of salary credits\")\n    existing_emi_debits: float = Field(description=\"Sum of loan EMI debits only\")\n\n\ndef main():\n    banner(\"08 - Loan Document Extractor (LangChain structured output)\")\n    sys_prompt = \"Extract the fields exactly from the document. Numbers as plain floats without commas.\"\n    p = run_structured(sys_prompt, PAYSLIP, Payslip)\n    s = run_structured(sys_prompt, STATEMENT, BankStatement)\n    section(\"Payslip\", p.model_dump_json(indent=2))\n    section(\"Bank statement\", s.model_dump_json(indent=2))\n\n    checks = {\n        \"name_match\": p.employee_name.lower() == s.account_holder.lower(),\n        \"salary_credit_matches_net_pay\": abs(p.net_pay - s.salary_credits) < 1,\n        \"existing_emi_to_net_pay_pct\": round(s.existing_emi_debits / p.net_pay * 100, 1),\n    }\n    section(\"Cross-document checks\", checks)\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "09_aml_transaction_monitoring", "title": "AML Transaction Monitoring Agent", "category": "fincrime", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Detects structuring, rapid movement and high-risk-geography patterns and triages the alert.", "how": "Python rules raise alerts; an AML Investigator agent reviews the evidence and a Compliance Officer agent decides close / escalate / file SAR.", "today": "Banks must monitor transactions for money laundering. Rules generate alerts (e.g. repeated cash deposits just under the reporting limit); investigators review each alert and decide whether to report it.", "who": "AML transaction monitoring analysts and the MLRO (Compliance / Financial Crime).", "why": "Most alerts are false positives, yet missing a real case can bring huge fines. Investigation is slow and manual.", "terms": ["AML (Anti-Money Laundering)", "Money laundering stages", "Structuring (smurfing)", "CTR (Currency Transaction Report)", "SAR / STR", "MLRO", "False positive"], "code": "\"\"\"AML Transaction Monitoring Agent — CrewAI + Ollama.\n\nDeterministic AML rules raise alerts (auditable); agents investigate and triage.\n\nRun:  python 01_banking/09_aml_transaction_monitoring/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom collections import defaultdict\nfrom datetime import datetime, timedelta\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nCUSTOMER = {\"id\": \"CUST-7781\", \"name\": \"Marco Rinaldi\", \"occupation\": \"Restaurant owner\",\n            \"expected_monthly_turnover\": 15_000, \"risk_rating\": \"Medium\", \"country\": \"IT\"}\n\nTXNS = [  # date, type, amount, counterparty, country\n    (\"2026-09-01\", \"cash_deposit\", 9_500, \"Branch 12\", \"IT\"),\n    (\"2026-09-02\", \"cash_deposit\", 9_800, \"Branch 07\", \"IT\"),\n    (\"2026-09-03\", \"cash_deposit\", 9_700, \"Branch 12\", \"IT\"),\n    (\"2026-09-04\", \"wire_out\", 27_000, \"Oceanic Trading FZE\", \"AE\"),\n    (\"2026-09-10\", \"card_payment\", 230, \"Metro Cash&Carry\", \"IT\"),\n    (\"2026-09-15\", \"wire_in\", 48_000, \"Lindell Holdings Ltd\", \"VG\"),\n    (\"2026-09-16\", \"wire_out\", 47_500, \"Kestrel Imports\", \"HK\"),\n    (\"2026-09-20\", \"cash_deposit\", 3_200, \"Branch 12\", \"IT\"),\n]\n\nHIGH_RISK = {\"VG\", \"KY\", \"PA\", \"IR\", \"KP\"}\nCTR_THRESHOLD = 10_000\n\n\ndef detect(txns) -> list[dict]:\n    alerts, rows = [], [dict(zip([\"date\", \"type\", \"amount\", \"cp\", \"country\"], t)) for t in txns]\n    for r in rows:\n        r[\"d\"] = datetime.fromisoformat(r[\"date\"])\n\n    # 1. Structuring: >=3 cash deposits just under the threshold in 7 days\n    near = [r for r in rows if r[\"type\"] == \"cash_deposit\" and 0.9 * CTR_THRESHOLD <= r[\"amount\"] < CTR_THRESHOLD]\n    if len(near) >= 3 and near[-1][\"d\"] - near[0][\"d\"] <= timedelta(days=7):\n        alerts.append({\"rule\": \"STRUCTURING\", \"evidence\": [(r[\"date\"], r[\"amount\"]) for r in near]})\n\n    # 2. Rapid movement: inbound wire followed by >=90% outbound within 2 days\n    for i in (r for r in rows if r[\"type\"] == \"wire_in\"):\n        for o in (r for r in rows if r[\"type\"] == \"wire_out\"):\n            if timedelta(0) <= o[\"d\"] - i[\"d\"] <= timedelta(days=2) and o[\"amount\"] >= 0.9 * i[\"amount\"]:\n                alerts.append({\"rule\": \"RAPID_PASS_THROUGH\", \"evidence\": [(i[\"date\"], i[\"amount\"], i[\"cp\"]),\n                                                                           (o[\"date\"], o[\"amount\"], o[\"cp\"])]})\n\n    # 3. High-risk jurisdiction\n    hr = [(r[\"date\"], r[\"amount\"], r[\"country\"]) for r in rows if r[\"country\"] in HIGH_RISK]\n    if hr:\n        alerts.append({\"rule\": \"HIGH_RISK_JURISDICTION\", \"evidence\": hr})\n\n    # 4. Turnover vs. profile\n    monthly = defaultdict(float)\n    for r in rows:\n        monthly[r[\"date\"][:7]] += r[\"amount\"]\n    for m, v in monthly.items():\n        if v > 3 * CUSTOMER[\"expected_monthly_turnover\"]:\n            alerts.append({\"rule\": \"PROFILE_DEVIATION\", \"evidence\": f\"{m} turnover {v:,.0f} vs expected \"\n                                                                    f\"{CUSTOMER['expected_monthly_turnover']:,}\"})\n    return alerts\n\n\ndef main():\n    banner(\"09 - AML Transaction Monitoring Agent (CrewAI)\")\n    alerts = detect(TXNS)\n    section(\"Rule alerts\", json.dumps(alerts, indent=2))\n\n    investigator = make_agent(\"AML Investigator\", \"Investigate alerts and assess whether activity is suspicious\",\n                              \"Certified AML specialist (CAMS) experienced in typologies: structuring, layering, trade-based ML.\")\n    officer = make_agent(\"MLRO / Compliance Officer\", \"Decide the alert outcome in line with regulation\",\n                         \"Money Laundering Reporting Officer accountable for SAR filing decisions.\")\n    t1 = make_task(\n        \"Customer profile:\\n{customer}\\n\\nTransactions:\\n{txns}\\n\\nAlerts:\\n{alerts}\\n\\n\"\n        \"Investigate. Link the alerts into a coherent picture, list typologies, and note any innocent explanations to check.\",\n        \"Investigation summary with typologies, risk indicators and open questions for the customer.\", investigator)\n    t2 = make_task(\n        \"Decide the outcome.\",\n        \"First line 'Decision: <CODE>' where CODE is exactly one of CLOSE_FALSE_POSITIVE, ENHANCED_MONITORING, FILE_SAR \"\n        \"(if a SAR is filed the account is also monitored, so choose FILE_SAR). Then risk score 1-10, \"\n        \"justification and next steps (RFI to customer, EDD, account restrictions).\", officer, context=[t1])\n    section(\"Alert triage\", run_crew([investigator, officer], [t1, t2], {\n        \"customer\": json.dumps(CUSTOMER, indent=2), \"txns\": json.dumps(TXNS, indent=2),\n        \"alerts\": json.dumps(alerts, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "10_kyc_onboarding_verifier", "title": "KYC Onboarding Verifier", "category": "fincrime", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Checks customer onboarding data for completeness, document validity and consistency.", "how": "Agent uses `check_document_expiry`, `validate_id_format` and `compare_fields` tools and returns a KYC checklist with pass/fail.", "today": "Before opening an account, the bank must verify identity and address documents and check they match the application.", "who": "KYC / onboarding operations teams.", "why": "Checks are repetitive; small mismatches (spelling, expired IDs) are easy to miss and delay customers.", "terms": ["KYC (Know Your Customer)", "CDD / EDD"], "code": "\"\"\"KYC Onboarding Verifier — LangChain tool-calling agent + Ollama.\n\nRun:  python 01_banking/10_kyc_onboarding_verifier/app.py\n\"\"\"\n\nimport re\nimport sys\nfrom datetime import date\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nAPPLICATION = {\n    \"form\": {\"full_name\": \"Ananya R. Iyer\", \"dob\": \"1991-04-22\", \"address\": \"14 Lake View Rd, Bengaluru 560001\",\n             \"pan\": \"AKPPI4521L\", \"occupation\": \"Architect\", \"source_of_funds\": \"Salary\"},\n    \"id_document\": {\"type\": \"Passport\", \"number\": \"Z4829175\", \"name\": \"ANANYA RAMESH IYER\",\n                    \"dob\": \"1991-04-22\", \"expiry\": \"2026-08-30\"},\n    \"address_proof\": {\"type\": \"Utility bill\", \"address\": \"14 Lakeview Road, Bangalore 560001\", \"issue_date\": \"2026-06-10\"},\n}\n\nID_FORMATS = {\"PAN\": r\"^[A-Z]{5}[0-9]{4}[A-Z]$\", \"Passport\": r\"^[A-Z][0-9]{7}$\"}\n\n\n@tool\ndef get_application() -> dict:\n    \"\"\"Return the onboarding application: form data, ID document and address proof.\"\"\"\n    return APPLICATION\n\n\n@tool\ndef validate_id_format(id_type: str, number: str) -> str:\n    \"\"\"Validate the format of an ID number. id_type is PAN or Passport.\"\"\"\n    pat = ID_FORMATS.get(id_type)\n    if not pat:\n        return f\"No format rule for {id_type}\"\n    return f\"{id_type} {number}: {'VALID' if re.match(pat, number) else 'INVALID'} format\"\n\n\n@tool\ndef check_document_expiry(expiry: str) -> str:\n    \"\"\"Check whether a document (YYYY-MM-DD expiry) is still valid today.\"\"\"\n    days = (date.fromisoformat(expiry) - date.today()).days\n    return f\"Expired {abs(days)} days ago\" if days < 0 else f\"Valid, {days} days remaining\"\n\n\n@tool\ndef address_proof_recency(issue_date: str, max_age_days: int = 90) -> str:\n    \"\"\"Check the address proof was issued within max_age_days.\"\"\"\n    age = (date.today() - date.fromisoformat(issue_date)).days\n    return f\"Issued {age} days ago - {'OK' if age <= max_age_days else 'TOO OLD'} (limit {max_age_days})\"\n\n\nSYSTEM = (\n    \"You are a KYC analyst. Use the tools to verify the application. Check: ID format, ID expiry, name match \"\n    \"between form and ID (allow middle-name/initial differences), DOB match, address match (allow spelling and \"\n    \"abbreviation variants like Bangalore/Bengaluru), and address-proof recency. Output a checklist with \"\n    \"PASS / FAIL / REVIEW per item and a final status: APPROVED, PENDING (list documents needed) or REJECTED.\"\n)\n\n\ndef main():\n    banner(\"10 - KYC Onboarding Verifier (LangChain agent)\")\n    tools = [get_application, validate_id_format, check_document_expiry, address_proof_recency]\n    section(\"KYC result\", run_agent(SYSTEM, tools, \"Verify the current onboarding application.\"))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "11_sanctions_screening_assistant", "title": "Sanctions Screening Assistant", "category": "fincrime", "framework": "LangChain", "pattern": "Chain", "description": "Reduces false positives in name screening by adjudicating fuzzy matches with secondary identifiers.", "how": "`difflib` fuzzy-matches against a watchlist; the LLM compares DOB, nationality and address to recommend true match / false positive.", "today": "Every customer and international payment is screened against sanctions lists. A similar name triggers an alert that an analyst must clear or escalate before money moves.", "who": "Sanctions screening analysts (Financial Crime Compliance).", "why": "Name matching produces many false positives that delay payments, while a missed true match is a serious legal breach.", "terms": ["Sanctions screening", "False positive", "PEP"], "code": "\"\"\"Sanctions Screening Assistant — fuzzy matching + LangChain adjudication.\n\nRun:  python 01_banking/11_sanctions_screening_assistant/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom difflib import SequenceMatcher\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\n# Fictional watchlist for demo purposes only\nWATCHLIST = [\n    {\"name\": \"Viktor Aleksandrovich Petrov\", \"dob\": \"1965-03-12\", \"nationality\": \"RU\", \"program\": \"SDN-UKRAINE\"},\n    {\"name\": \"Hassan Al-Rashid\", \"dob\": \"1972-11-02\", \"nationality\": \"SY\", \"program\": \"SDGT\"},\n    {\"name\": \"Golden Crescent Shipping LLC\", \"dob\": None, \"nationality\": \"IR\", \"program\": \"IRAN\"},\n]\n\nPARTIES = [\n    {\"name\": \"Victor A. Petrov\", \"dob\": \"1988-07-19\", \"nationality\": \"CA\", \"address\": \"Toronto, Canada\", \"role\": \"Remitter\"},\n    {\"name\": \"Hasan Al Rashid\", \"dob\": \"1972-11-02\", \"nationality\": \"SY\", \"address\": \"Dubai, UAE\", \"role\": \"Beneficiary\"},\n    {\"name\": \"Golden Crescent Shipping\", \"dob\": None, \"nationality\": \"AE\", \"address\": \"Jebel Ali, UAE\", \"role\": \"Beneficiary\"},\n]\n\n\ndef norm(s: str) -> str:\n    return \" \".join(s.lower().replace(\"-\", \" \").replace(\".\", \"\").split())\n\n\ndef token_score(a: str, b: str) -> float:\n    \"\"\"Average best match of each token in `a` against `b`; single letters match as initials.\"\"\"\n    ta, tb = norm(a).split(), norm(b).split()\n    best = [max(1.0 if len(t) == 1 and u.startswith(t) else SequenceMatcher(None, t, u).ratio() for u in tb) for t in ta]\n    return sum(best) / len(best)\n\n\ndef screen(party: dict, threshold: float = 0.75) -> list[dict]:\n    hits = []\n    for w in WATCHLIST:\n        score = max(SequenceMatcher(None, norm(party[\"name\"]), norm(w[\"name\"])).ratio(), token_score(party[\"name\"], w[\"name\"]))\n        if score >= threshold:\n            hits.append({\"party\": party, \"watchlist_entry\": w, \"name_score\": round(score, 2)})\n    return hits\n\n\nSYSTEM = (\n    \"You are a sanctions screening analyst. For each potential match, compare secondary identifiers \"\n    \"(DOB, nationality, entity type, location). Decide TRUE MATCH, POSSIBLE MATCH (escalate) or FALSE POSITIVE, \"\n    \"with a one-line reason. Be conservative: if identifiers support the match, do not discount it. \"\n    \"For persons, a clearly different DOB is strong evidence of a false positive. For entities, a different \"\n    \"country of registration does NOT clear a near-identical name (front companies are common) - escalate. \"\n    \"Finish with whether the payment can be released or must be held.\"\n)\n\n\ndef main():\n    banner(\"11 - Sanctions Screening Assistant (LangChain)\")\n    hits = [h for p in PARTIES for h in screen(p)]\n    section(\"Fuzzy-match hits\", json.dumps(hits, indent=2))\n    section(\"Adjudication\", run_chain(SYSTEM, \"Potential matches:\\n{hits}\", hits=json.dumps(hits, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "12_sar_narrative_generator", "title": "SAR Narrative Generator", "category": "fincrime", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Drafts a Suspicious Activity Report narrative (who, what, when, where, why) from case facts.", "how": "A Case Analyst agent builds the timeline and a SAR Writer agent produces the regulator-ready narrative.", "today": "When an investigation concludes activity is suspicious, the bank files a SAR with a written narrative explaining who, what, when, where and why.", "who": "AML investigators and the MLRO.", "why": "Narratives must be precise, factual and complete; writing them takes hours per case.", "terms": ["SAR / STR", "MLRO", "Typology", "Money mule", "APP fraud"], "code": "\"\"\"SAR Narrative Generator — CrewAI + Ollama.\n\nRun:  python 01_banking/12_sar_narrative_generator/app.py\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nCASE_FACTS = \"\"\"\nCase ID: INV-2026-0912     Subject: Daniel Okafor (DOB 1985-02-14), personal current account opened 2026-05-03\nStated occupation: Freelance graphic designer, expected monthly income ~4,000.\nActivity reviewed: 2026-07-01 to 2026-09-30.\n- 46 incoming P2P transfers from 31 unrelated individuals, values 300-1,900, total 41,250.\n  Payment references include 'loan', 'gift', 'crypto', 'invest'.\n- Within 24 hours of receipt, 92% of funds sent to two crypto exchanges (CoinPeak, BitHarbor), total 37,950.\n- 4 incoming payments recalled by sending banks as authorised push payment (APP) fraud victims.\n- Login IP addresses from 3 countries in the same week; device changed 5 times.\n- Customer did not respond to two requests for information (sent 2026-09-10 and 2026-09-20).\nActions taken: account restricted 2026-09-25.\n\"\"\"\n\n\ndef main():\n    banner(\"12 - SAR Narrative Generator (CrewAI)\")\n    analyst = make_agent(\"Financial Crime Case Analyst\", \"Turn raw case facts into a clear chronology and typology assessment\",\n                         \"You prepare cases for SAR filing and are meticulous about dates, amounts and sources.\")\n    writer = make_agent(\"SAR Narrative Writer\", \"Write a regulator-ready SAR narrative\",\n                        \"You write SAR narratives that are factual, objective, chronological and answer who/what/when/where/why/how.\")\n    t1 = make_task(\"Case facts:\\n{facts}\\n\\nBuild a chronology and identify typologies and red flags.\",\n                   \"Chronology table, typology (e.g. money mule, APP fraud proceeds) and red-flag list.\", analyst)\n    t2 = make_task(\n        \"Write the SAR narrative using the analysis. Do not speculate beyond the facts; avoid accusatory language.\",\n        \"SAR narrative with paragraphs: Introduction (summary & amount), Subject information, Suspicious activity \"\n        \"(chronological), Red flags & typology, Actions taken, Conclusion.\", writer, context=[t1])\n    section(\"SAR narrative\", run_crew([analyst, writer], [t1, t2], {\"facts\": CASE_FACTS}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "13_card_fraud_explainer", "title": "Card Fraud Detection Explainer", "category": "fincrime", "framework": "LangChain", "pattern": "Chain", "description": "Scores card transactions for fraud and explains each alert for analysts and customers.", "how": "Feature-based risk score (velocity, geo-jump, MCC, amount z-score) plus an LLM explanation and suggested action.", "today": "Card transactions are scored for fraud in real time. Suspicious ones are blocked or held, and the customer is asked to confirm.", "who": "Fraud operations analysts.", "why": "Blocking genuine spending annoys customers; letting fraud through costs money. Analysts need to see why a transaction was flagged.", "terms": ["Card fraud / CNP", "MCC", "False positive"], "code": "\"\"\"Card Fraud Detection Explainer — rule score + LangChain explanation.\n\nRun:  python 01_banking/13_card_fraud_explainer/app.py\n\"\"\"\n\nimport json\nimport statistics\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\nHISTORY_AMOUNTS = [42, 18, 65, 120, 33, 54, 75, 22, 90, 47, 38, 61]  # customer's usual spend\nHOME_COUNTRY = \"GB\"\nHIGH_RISK_MCC = {\"6051\": \"Quasi-cash / crypto\", \"7995\": \"Gambling\", \"5967\": \"Direct marketing\"}\n\nTRANSACTIONS = [\n    {\"id\": \"T1\", \"time\": \"2026-10-10 12:04\", \"amount\": 58, \"merchant\": \"Tesco\", \"mcc\": \"5411\", \"country\": \"GB\", \"card_present\": True, \"txns_last_hour\": 1},\n    {\"id\": \"T2\", \"time\": \"2026-10-10 02:13\", \"amount\": 1450, \"merchant\": \"CoinFast\", \"mcc\": \"6051\", \"country\": \"LT\", \"card_present\": False, \"txns_last_hour\": 4},\n    {\"id\": \"T3\", \"time\": \"2026-10-10 02:19\", \"amount\": 980, \"merchant\": \"LuckySpin\", \"mcc\": \"7995\", \"country\": \"MT\", \"card_present\": False, \"txns_last_hour\": 5},\n    {\"id\": \"T4\", \"time\": \"2026-10-10 18:40\", \"amount\": 240, \"merchant\": \"Ryanair\", \"mcc\": \"4511\", \"country\": \"IE\", \"card_present\": False, \"txns_last_hour\": 1},\n]\n\n\ndef score(t: dict) -> dict:\n    mu, sd = statistics.mean(HISTORY_AMOUNTS), statistics.stdev(HISTORY_AMOUNTS)\n    z = (t[\"amount\"] - mu) / sd\n    hour = int(t[\"time\"][11:13])\n    reasons, s = [], 0\n    if z > 3: s += 30; reasons.append(f\"amount z-score {z:.1f}\")\n    if t[\"mcc\"] in HIGH_RISK_MCC: s += 25; reasons.append(f\"high-risk MCC ({HIGH_RISK_MCC[t['mcc']]})\")\n    if t[\"country\"] != HOME_COUNTRY: s += 15; reasons.append(f\"foreign country {t['country']}\")\n    if not t[\"card_present\"]: s += 10; reasons.append(\"card-not-present\")\n    if t[\"txns_last_hour\"] >= 3: s += 20; reasons.append(f\"velocity {t['txns_last_hour']} txns/hour\")\n    if hour < 5: s += 10; reasons.append(\"unusual hour\")\n    band = \"BLOCK\" if s >= 70 else \"REVIEW\" if s >= 40 else \"APPROVE\"\n    return {\"id\": t[\"id\"], \"merchant\": t[\"merchant\"], \"amount\": t[\"amount\"], \"score\": s, \"action\": band, \"reasons\": reasons}\n\n\nSYSTEM = (\n    \"You are a card fraud analyst. For each scored transaction write (a) a 1-2 sentence analyst explanation and \"\n    \"(b) for BLOCK/REVIEW, a short SMS to the customer asking them to confirm the transaction (never ask for PIN, \"\n    \"OTP or full card number). Keep the decided actions.\"\n)\n\n\ndef main():\n    banner(\"13 - Card Fraud Detection Explainer (LangChain)\")\n    scored = [score(t) for t in TRANSACTIONS]\n    section(\"Scores\", json.dumps(scored, indent=2))\n    section(\"Explanations\", run_chain(SYSTEM, \"Scored transactions:\\n{s}\", s=json.dumps(scored, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "14_tbml_detector", "title": "Trade-Based Money Laundering Detector", "category": "fincrime", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Flags over/under-invoicing and suspicious trade routes in trade finance transactions.", "how": "Python compares unit prices to benchmarks; a Trade Finance Analyst and a TBML Specialist agent assess red flags.", "today": "Trade finance teams check that goods, prices and shipping routes make commercial sense, because criminals use fake trade invoices to move money across borders.", "who": "Trade finance operations and financial crime specialists.", "why": "Requires knowing what goods normally cost and how they normally ship; red flags are subtle.", "terms": ["TBML (Trade-Based Money Laundering)", "Trade finance", "Letter of Credit (LC)"], "code": "\"\"\"Trade-Based Money Laundering Detector — CrewAI + Ollama.\n\nRun:  python 01_banking/14_tbml_detector/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nBENCHMARK_UNIT_PRICE = {\"Cotton T-shirts\": 3.2, \"Used laptops\": 180.0, \"Frozen shrimp (kg)\": 9.5}  # USD\nTRANSHIPMENT_HUBS = {\"AE\", \"HK\", \"PA\"}\n\nTRADES = [\n    {\"lc\": \"LC-301\", \"goods\": \"Cotton T-shirts\", \"qty\": 20000, \"invoice_value\": 66000, \"origin\": \"BD\", \"via\": None, \"dest\": \"DE\",\n     \"applicant\": \"Nordmode GmbH\", \"beneficiary\": \"Dhaka Knit Ltd\"},\n    {\"lc\": \"LC-302\", \"goods\": \"Used laptops\", \"qty\": 500, \"invoice_value\": 412000, \"origin\": \"CN\", \"via\": \"AE\", \"dest\": \"NG\",\n     \"applicant\": \"Lagos Tech Hub\", \"beneficiary\": \"Gulf Star Trading FZE\"},\n    {\"lc\": \"LC-303\", \"goods\": \"Frozen shrimp (kg)\", \"qty\": 40000, \"invoice_value\": 98000, \"origin\": \"VN\", \"via\": \"PA\", \"dest\": \"US\",\n     \"applicant\": \"Coastline Foods\", \"beneficiary\": \"Saigon Seafood Co\"},\n]\n\n\ndef analyse(t: dict) -> dict:\n    unit = t[\"invoice_value\"] / t[\"qty\"]\n    bench = BENCHMARK_UNIT_PRICE[t[\"goods\"]]\n    dev = (unit / bench - 1) * 100\n    flags = []\n    if dev > 50: flags.append(f\"Over-invoicing: unit price {unit:.2f} vs benchmark {bench} (+{dev:.0f}%)\")\n    if dev < -40: flags.append(f\"Under-invoicing: unit price {unit:.2f} vs benchmark {bench} ({dev:.0f}%)\")\n    if t[\"via\"] in TRANSHIPMENT_HUBS: flags.append(f\"Transhipment via {t['via']} not required for route\")\n    if \"FZE\" in t[\"beneficiary\"] and t[\"origin\"] != \"AE\": flags.append(\"Beneficiary free-zone entity, not the manufacturer\")\n    return {\"lc\": t[\"lc\"], \"unit_price\": round(unit, 2), \"deviation_pct\": round(dev), \"flags\": flags}\n\n\ndef main():\n    banner(\"14 - Trade-Based Money Laundering Detector (CrewAI)\")\n    results = [analyse(t) for t in TRADES]\n    section(\"Pricing & route analysis\", json.dumps(results, indent=2))\n\n    trade_analyst = make_agent(\"Trade Finance Analyst\", \"Assess commercial plausibility of each trade\",\n                               \"Trade operations expert who knows typical goods, pricing and shipping routes.\")\n    tbml = make_agent(\"TBML Specialist\", \"Identify trade-based money laundering risks and recommend actions\",\n                      \"Financial-crime specialist following FATF/Wolfsberg TBML red-flag guidance.\")\n    t1 = make_task(\"Trades:\\n{trades}\\n\\nAnalysis:\\n{analysis}\\n\\nComment on the commercial rationale of each trade.\",\n                   \"Per-LC commercial assessment.\", trade_analyst)\n    t2 = make_task(\"Rate each LC LOW / MEDIUM / HIGH TBML risk and recommend actions \"\n                   \"(e.g. request price justification, verify shipment via vessel tracking, EDD on beneficiary).\",\n                   \"Per-LC risk rating, red flags and recommended actions.\", tbml, context=[t1])\n    section(\"TBML assessment\", run_crew([trade_analyst, tbml], [t1, t2],\n                                        {\"trades\": json.dumps(TRADES, indent=2), \"analysis\": json.dumps(results, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "15_adverse_media_screening", "title": "Adverse Media Screening", "category": "fincrime", "framework": "LangChain", "pattern": "Structured extraction", "description": "Classifies news articles about a customer for financial-crime relevance and severity.", "how": "Each article is classified into a Pydantic schema (relevant, category, severity, summary) and aggregated.", "today": "During onboarding and periodic reviews, banks search news for negative stories about customers (fraud, corruption, investigations).", "who": "KYC / Enhanced Due Diligence analysts.", "why": "Searches return many irrelevant hits, including people who just share a name. Reading them all is time-consuming.", "terms": ["Adverse media", "CDD / EDD", "KYC (Know Your Customer)"], "code": "\"\"\"Adverse Media Screening — LangChain structured output + Ollama.\n\nRun:  python 01_banking/15_adverse_media_screening/app.py\n\"\"\"\n\nimport sys\nfrom pathlib import Path\nfrom typing import Literal\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import banner, run_structured, section\n\nSUBJECT = \"Rajiv Malhotra, MD of Horizon Infra Projects\"\n\nARTICLES = [  # fictional headlines/snippets\n    \"Horizon Infra Projects wins 2,400 crore highway contract; MD Rajiv Malhotra says execution starts Q1.\",\n    \"Enforcement agency raids Horizon Infra offices in money laundering probe linked to bid-rigging; \"\n    \"MD Rajiv Malhotra questioned for 9 hours, no charges filed yet.\",\n    \"Rajiv Malhotra, a Mumbai-based chef, opens new restaurant in Bandra.\",\n    \"Court grants bail to Horizon Infra MD Rajiv Malhotra after arrest on bribery charges involving state officials.\",\n]\n\n\nclass MediaAssessment(BaseModel):\n    summary: str = Field(description=\"One-sentence summary of the article\")\n    about_subject: bool = Field(description=\"True if the article names the subject person or their company \"\n                                            \"(same name + same company/role). False for a different person with the same name.\")\n    category: Literal[\"none\", \"fraud\", \"bribery_corruption\", \"money_laundering\", \"sanctions\", \"tax_evasion\",\n                      \"terrorism\", \"organised_crime\", \"other_financial_crime\"] = Field(\n        description=\"'none' only for positive/neutral news; arrests, raids, probes and charges are never 'none'\")\n    severity: Literal[\"none\", \"low\", \"medium\", \"high\"] = Field(description=\"'none' if category is 'none'\")\n    status: Literal[\"n/a\", \"allegation\", \"investigation\", \"charged\", \"convicted\", \"acquitted\"] = Field(\n        description=\"'n/a' if category is 'none'; 'charged' covers arrests and bail\")\n\n\ndef main():\n    banner(\"15 - Adverse Media Screening (LangChain structured output)\")\n    system = (f\"You screen news for financial-crime adverse media about: {SUBJECT}. \"\n              \"First summarise the article, then decide whether it is about the subject, then classify. \"\n              \"Positive or neutral business news is category 'none'. A different person with the same name \"\n              \"(e.g. a different job or company) is not about the subject.\")\n    results = []\n    for i, art in enumerate(ARTICLES, 1):\n        a = run_structured(system, art, MediaAssessment)\n        results.append(a)\n        section(f\"Article {i}\", f\"{art}\\n-> {a.model_dump()}\")\n\n    relevant = [r for r in results if r.about_subject and r.category != \"none\"]\n    worst = max((r.severity for r in relevant), key=[\"none\", \"low\", \"medium\", \"high\"].index, default=\"none\")\n    section(\"Overall\", f\"{len(relevant)} relevant adverse articles; highest severity: {worst.upper()} \"\n                       f\"-> {'Escalate for EDD' if worst in ('medium', 'high') else 'No action'}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "16_customer_risk_rating", "title": "Customer Risk Rating (CRR)", "category": "fincrime", "framework": "LangChain", "pattern": "Chain", "description": "Computes a customer ML/TF risk rating and justifies it for periodic KYC review.", "how": "Weighted factor model (occupation, geography, product, channel, PEP) gives Low/Medium/High; LLM writes the justification.", "today": "Each customer gets a money-laundering risk rating based on factors like occupation, countries, products and PEP status. It decides how much checking and how frequent reviews they need.", "who": "KYC / AML compliance teams.", "why": "Ratings must be consistent and justified in writing for auditors and regulators.", "terms": ["Customer Risk Rating (CRR)", "PEP", "CDD / EDD", "KYC (Know Your Customer)"], "code": "\"\"\"Customer Risk Rating (CRR) — weighted factor model + LangChain justification.\n\nRun:  python 01_banking/16_customer_risk_rating/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\nFACTORS = {  # factor -> (weight, {value: score 1-3})\n    \"occupation\": (0.25, {\"salaried\": 1, \"self_employed\": 2, \"jeweller\": 3, \"real_estate\": 3, \"money_service_business\": 3}),\n    \"geography\": (0.25, {\"domestic\": 1, \"fatf_compliant\": 1, \"medium_risk\": 2, \"high_risk\": 3}),\n    \"product\": (0.20, {\"savings\": 1, \"credit_card\": 1, \"current_account\": 2, \"trade_finance\": 3, \"private_banking\": 3}),\n    \"channel\": (0.10, {\"branch\": 1, \"digital_verified\": 2, \"non_face_to_face\": 3}),\n    \"pep\": (0.20, {\"no\": 1, \"domestic_pep\": 3, \"foreign_pep\": 3, \"pep_associate\": 2}),\n}\n\nCUSTOMERS = [\n    {\"id\": \"K-01\", \"occupation\": \"salaried\", \"geography\": \"domestic\", \"product\": \"savings\", \"channel\": \"branch\", \"pep\": \"no\"},\n    {\"id\": \"K-02\", \"occupation\": \"jeweller\", \"geography\": \"medium_risk\", \"product\": \"current_account\", \"channel\": \"digital_verified\", \"pep\": \"no\"},\n    {\"id\": \"K-03\", \"occupation\": \"real_estate\", \"geography\": \"high_risk\", \"product\": \"private_banking\", \"channel\": \"non_face_to_face\", \"pep\": \"foreign_pep\"},\n]\n\n\ndef rate(c: dict) -> dict:\n    breakdown = {f: FACTORS[f][1][c[f]] for f in FACTORS}\n    score = sum(FACTORS[f][0] * s for f, s in breakdown.items())\n    rating = \"HIGH\" if score >= 2.2 or c[\"pep\"] != \"no\" else \"MEDIUM\" if score >= 1.6 else \"LOW\"\n    review = {\"HIGH\": \"12 months\", \"MEDIUM\": \"24 months\", \"LOW\": \"36 months\"}[rating]\n    return {\"id\": c[\"id\"], \"factor_scores\": breakdown, \"weighted_score\": round(score, 2), \"rating\": rating, \"next_review\": review}\n\n\nSYSTEM = (\n    \"You are a KYC/AML analyst. For each customer write a 3-4 sentence risk-rating justification for the KYC file, \"\n    \"naming the main drivers, and list due-diligence measures (SDD / CDD / EDD, source of wealth, senior approval for PEPs).\"\n)\n\n\ndef main():\n    banner(\"16 - Customer Risk Rating (LangChain)\")\n    ratings = [rate(c) for c in CUSTOMERS]\n    section(\"Ratings\", json.dumps(ratings, indent=2))\n    section(\"Justifications\", run_chain(SYSTEM, \"Customers:\\n{c}\\n\\nRatings:\\n{r}\",\n                                        c=json.dumps(CUSTOMERS, indent=2), r=json.dumps(ratings, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "17_mule_account_detector", "title": "Money Mule Account Detector", "category": "fincrime", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Identifies likely mule accounts from pass-through behaviour and new-account signals.", "how": "Python computes pass-through ratio, account age and counterparties; Fraud Analyst and Investigator agents rank and recommend actions.", "today": "Fraudsters use 'mule' accounts to receive stolen money and pass it on quickly. Banks look for accounts where money comes in from many people and leaves almost immediately.", "who": "Fraud and financial crime teams.", "why": "Mules are often young people being exploited, so action must stop the fraud and also protect them.", "terms": ["Money mule", "APP fraud", "Typology"], "code": "\"\"\"Money Mule Account Detector — CrewAI + Ollama.\n\nRun:  python 01_banking/17_mule_account_detector/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nACCOUNTS = [  # 30-day aggregates\n    {\"acct\": \"A-100\", \"age_days\": 21, \"inflow\": 18400, \"outflow\": 18100, \"unique_senders\": 27, \"avg_hold_hours\": 3,\n     \"age_of_holder\": 19, \"device_shared_with\": 2, \"crypto_or_cash_out_pct\": 85},\n    {\"acct\": \"A-101\", \"age_days\": 1400, \"inflow\": 5200, \"outflow\": 4700, \"unique_senders\": 2, \"avg_hold_hours\": 240,\n     \"age_of_holder\": 41, \"device_shared_with\": 0, \"crypto_or_cash_out_pct\": 5},\n    {\"acct\": \"A-102\", \"age_days\": 60, \"inflow\": 9100, \"outflow\": 8900, \"unique_senders\": 11, \"avg_hold_hours\": 12,\n     \"age_of_holder\": 22, \"device_shared_with\": 1, \"crypto_or_cash_out_pct\": 60},\n    {\"acct\": \"A-103\", \"age_days\": 700, \"inflow\": 30000, \"outflow\": 12000, \"unique_senders\": 4, \"avg_hold_hours\": 500,\n     \"age_of_holder\": 55, \"device_shared_with\": 0, \"crypto_or_cash_out_pct\": 0},\n]\n\n\ndef mule_score(a: dict) -> dict:\n    pass_through = a[\"outflow\"] / a[\"inflow\"] if a[\"inflow\"] else 0\n    s = 0\n    s += 25 if pass_through > 0.9 else 0\n    s += 20 if a[\"age_days\"] < 90 else 0\n    s += 15 if a[\"unique_senders\"] > 10 else 0\n    s += 15 if a[\"avg_hold_hours\"] < 24 else 0\n    s += 10 if a[\"age_of_holder\"] < 25 else 0\n    s += 10 if a[\"device_shared_with\"] > 0 else 0\n    s += 5 if a[\"crypto_or_cash_out_pct\"] > 50 else 0\n    return {\"acct\": a[\"acct\"], \"pass_through_ratio\": round(pass_through, 2), \"mule_score\": s,\n            \"tier\": \"HIGH\" if s >= 70 else \"MEDIUM\" if s >= 40 else \"LOW\"}\n\n\ndef main():\n    banner(\"17 - Money Mule Account Detector (CrewAI)\")\n    scores = sorted((mule_score(a) for a in ACCOUNTS), key=lambda x: -x[\"mule_score\"])\n    section(\"Mule scores\", json.dumps(scores, indent=2))\n\n    analyst = make_agent(\"Fraud Analyst\", \"Explain why accounts look like money mules\",\n                         \"Specialist in mule networks recruited via social media 'easy money' scams.\")\n    investigator = make_agent(\"Fraud Investigator\", \"Recommend proportionate actions per account\",\n                              \"You balance stopping fraud with avoiding harm to genuine customers and young people being exploited.\")\n    t1 = make_task(\"Account data:\\n{accounts}\\n\\nScores:\\n{scores}\\n\\nExplain the mule indicators for each account.\",\n                   \"Per-account explanation.\", analyst)\n    t2 = make_task(\"Recommend actions per account (e.g. freeze outbound, contact customer, close & report, \"\n                   \"safeguarding message for possibly-exploited young holders, network link analysis).\",\n                   \"Prioritised action list.\", investigator, context=[t1])\n    section(\"Recommendations\", run_crew([analyst, investigator], [t1, t2],\n                                        {\"accounts\": json.dumps(ACCOUNTS, indent=2), \"scores\": json.dumps(scores, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "18_regulatory_reporting_agent", "title": "Regulatory Reporting Agent", "category": "regulatory", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Validates a regulatory return, explains period-on-period movements and drafts the submission commentary.", "how": "Python runs validation and variance checks; a Data Quality agent reviews breaks and a Regulatory Reporting agent writes commentary.", "today": "Each quarter, banks submit returns to the regulator on capital, liquidity and asset quality, with commentary explaining big movements.", "who": "Regulatory reporting team (Finance), signed off by the CFO.", "why": "Data comes from many systems; errors or unexplained movements trigger regulator questions or fines.", "terms": ["Regulatory reporting", "Capital (CET1, Tier 1, Tier 2)", "RWA (Risk-Weighted Assets)", "Capital ratio", "LCR (Liquidity Coverage Ratio)", "Delinquency / NPA / NPL"], "code": "\"\"\"Regulatory Reporting Agent — CrewAI + Ollama.\n\nValidates a (simplified) capital & liquidity return, explains quarter-on-quarter\nmovements and drafts the submission commentary.\n\nRun:  python 01_banking/18_regulatory_reporting_agent/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\n# Figures in millions\nRETURN = {\n    \"Q2-2026\": {\"cet1_capital\": 4_850, \"at1_capital\": 600, \"tier2_capital\": 900, \"rwa_credit\": 31_200, \"rwa_market\": 2_100,\n                \"rwa_operational\": 3_900, \"hqla\": 9_800, \"net_outflows_30d\": 7_000, \"total_loans\": 52_000, \"npl\": 1_560},\n    \"Q3-2026\": {\"cet1_capital\": 4_910, \"at1_capital\": 600, \"tier2_capital\": 880, \"rwa_credit\": 34_900, \"rwa_market\": 2_600,\n                \"rwa_operational\": 3_900, \"hqla\": 9_100, \"net_outflows_30d\": 7_600, \"total_loans\": 57_300, \"npl\": 1_830},\n}\nMINIMUMS = {\"cet1_ratio\": 7.0, \"tier1_ratio\": 8.5, \"total_capital_ratio\": 10.5, \"lcr\": 100}\nADJ = {\"Q3-2026\": [\"Large corporate loan growth in construction sector\", \"New FX trading desk launched in August\"]}\n\n\ndef metrics(d: dict) -> dict:\n    rwa = d[\"rwa_credit\"] + d[\"rwa_market\"] + d[\"rwa_operational\"]\n    t1 = d[\"cet1_capital\"] + d[\"at1_capital\"]\n    return {\"total_rwa\": rwa, \"cet1_ratio\": round(d[\"cet1_capital\"] / rwa * 100, 2),\n            \"tier1_ratio\": round(t1 / rwa * 100, 2), \"total_capital_ratio\": round((t1 + d[\"tier2_capital\"]) / rwa * 100, 2),\n            \"lcr\": round(d[\"hqla\"] / d[\"net_outflows_30d\"] * 100, 1), \"npl_ratio\": round(d[\"npl\"] / d[\"total_loans\"] * 100, 2)}\n\n\ndef validate(d: dict, m: dict) -> list[str]:\n    issues = [f\"{k} {m[k]} below minimum {v}\" for k, v in MINIMUMS.items() if m[k] < v]\n    if any(v < 0 for v in d.values()):\n        issues.append(\"Negative values present\")\n    if d[\"npl\"] > d[\"total_loans\"]:\n        issues.append(\"NPL exceeds total loans\")\n    return issues or [\"All validation checks passed\"]\n\n\ndef main():\n    banner(\"18 - Regulatory Reporting Agent (CrewAI)\")\n    m = {q: metrics(d) for q, d in RETURN.items()}\n    q0, q1 = list(RETURN)\n    variance = {k: round(m[q1][k] - m[q0][k], 2) for k in m[q1]}\n    checks = validate(RETURN[q1], m[q1])\n    section(\"Metrics\", json.dumps(m, indent=2))\n    section(\"QoQ variance\", json.dumps(variance, indent=2))\n    section(\"Validation\", \"\\n\".join(checks))\n\n    dq = make_agent(\"Regulatory Data Quality Analyst\", \"Confirm the return is complete, consistent and within thresholds\",\n                    \"You run pre-submission controls on prudential returns and flag anything a regulator would query.\")\n    reporter = make_agent(\"Regulatory Reporting Manager\", \"Write the submission commentary for the regulator and CFO sign-off\",\n                          \"Experienced in Basel III / COREP-style reporting; precise, neutral tone.\")\n    t1 = make_task(\"Return data:\\n{data}\\n\\nMetrics:\\n{metrics}\\n\\nVariance:\\n{variance}\\n\\nValidation:\\n{checks}\\n\\n\"\n                   \"Business events this quarter:\\n{events}\\n\\nReview data quality and identify movements needing explanation (>5% or ratio change >0.25pp).\",\n                   \"List of material movements and data-quality observations.\", dq)\n    t2 = make_task(\"Draft the regulatory submission commentary.\\n\\nExact metrics by quarter (quote these; never invent \"\n                   \"or recalculate numbers):\\n{metrics}\\n\\nQoQ variance:\\n{variance}\\n\\nMinimums: CET1 7.0%, Tier 1 8.5%, \"\n                   \"Total capital 10.5%, LCR 100%.\",\n                   \"Commentary: 1. Executive summary 2. Capital adequacy (ratios vs minimums & drivers) \"\n                   \"3. Liquidity (LCR) 4. Asset quality 5. Data quality statement 6. Items for CFO attention.\",\n                   reporter, context=[t1])\n    section(\"Submission commentary\", run_crew([dq, reporter], [t1, t2], {\n        \"data\": json.dumps(RETURN, indent=2), \"metrics\": json.dumps(m, indent=2), \"variance\": json.dumps(variance, indent=2),\n        \"checks\": \"\\n\".join(checks), \"events\": json.dumps(ADJ, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "19_basel_capital_calculator", "title": "Basel III Capital Calculator Assistant", "category": "regulatory", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Answers capital-adequacy questions by computing RWA, CET1, Tier 1 and total capital ratios.", "how": "Agent uses `compute_rwa` and `capital_ratios` tools on the sample balance sheet and explains headroom vs. minimums.", "today": "Banks must hold enough capital against risky assets. Treasury and risk teams constantly ask: what are our ratios, and what happens if we lend more?", "who": "Capital management (Treasury / Finance / Risk).", "why": "Capital is expensive and limited; every lending decision consumes some, so quick what-if answers matter.", "terms": ["Basel III", "Capital (CET1, Tier 1, Tier 2)", "RWA (Risk-Weighted Assets)", "Capital ratio"], "code": "\"\"\"Basel III Capital Calculator Assistant — LangChain tool-calling agent + Ollama.\n\nSimplified standardised-approach risk weights for illustration.\n\nRun:  python 01_banking/19_basel_capital_calculator/app.py\n      python 01_banking/19_basel_capital_calculator/app.py \"What if corporate exposures grow by 2,000?\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nEXPOSURES = {  # millions\n    \"sovereign_AAA\": 8_000, \"banks_A\": 2_500, \"corporate_unrated\": 14_000, \"corporate_BBB\": 6_000,\n    \"retail\": 9_000, \"residential_mortgage\": 12_000, \"commercial_real_estate\": 3_000, \"past_due\": 800,\n}\nRISK_WEIGHTS = {\"sovereign_AAA\": 0.0, \"banks_A\": 0.5, \"corporate_unrated\": 1.0, \"corporate_BBB\": 1.0,\n                \"retail\": 0.75, \"residential_mortgage\": 0.35, \"commercial_real_estate\": 1.0, \"past_due\": 1.5}\nCAPITAL = {\"cet1\": 3_900, \"at1\": 500, \"tier2\": 700}\nOTHER_RWA = {\"market\": 1_800, \"operational\": 3_400}\nMIN = {\"cet1\": 4.5 + 2.5, \"tier1\": 6.0 + 2.5, \"total\": 8.0 + 2.5}  # incl. conservation buffer\n\n\n@tool\ndef compute_rwa(extra_exposure_class: str = \"\", extra_amount: float = 0) -> dict:\n    \"\"\"Compute credit RWA by exposure class and total RWA. Optionally add a hypothetical extra exposure\n    (exposure class name and amount in millions) for what-if analysis.\"\"\"\n    exp = dict(EXPOSURES)\n    if extra_exposure_class in exp:\n        exp[extra_exposure_class] += extra_amount\n    credit = {k: v * RISK_WEIGHTS[k] for k, v in exp.items()}\n    total = sum(credit.values()) + sum(OTHER_RWA.values())\n    return {\"credit_rwa_by_class\": credit, \"market_rwa\": OTHER_RWA[\"market\"],\n            \"operational_rwa\": OTHER_RWA[\"operational\"], \"total_rwa\": total}\n\n\n@tool\ndef capital_ratios(total_rwa: float) -> dict:\n    \"\"\"Compute CET1, Tier 1 and Total capital ratios (%) for a given total RWA, with minimums incl. buffers.\"\"\"\n    t1 = CAPITAL[\"cet1\"] + CAPITAL[\"at1\"]\n    r = {\"cet1\": CAPITAL[\"cet1\"] / total_rwa * 100, \"tier1\": t1 / total_rwa * 100,\n         \"total\": (t1 + CAPITAL[\"tier2\"]) / total_rwa * 100}\n    return {k: {\"ratio_pct\": round(v, 2), \"minimum_pct\": MIN[k], \"headroom_pp\": round(v - MIN[k], 2)} for k, v in r.items()}\n\n\nSYSTEM = (\n    \"You are a capital management analyst. Always call compute_rwa first, then capital_ratios with its total_rwa. \"\n    \"Exposure classes: \" + \", \".join(EXPOSURES) + \". Present ratios in a table, comment on headroom and the \"\n    \"largest RWA drivers, and suggest RWA optimisation ideas if headroom is under 2pp.\"\n)\n\n\ndef main():\n    banner(\"19 - Basel III Capital Calculator (LangChain agent)\")\n    q = sys.argv[1] if len(sys.argv) > 1 else (\n        \"What are our current capital ratios? Then: what happens if unrated corporate exposure grows by 3,000 million?\")\n    section(\"Question\", q)\n    section(\"Answer\", run_agent(SYSTEM, [compute_rwa, capital_ratios], q))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "20_liquidity_lcr_nsfr_monitor", "title": "Liquidity LCR / NSFR Monitor", "category": "regulatory", "framework": "LangChain", "pattern": "Chain", "description": "Calculates LCR and NSFR and produces an ALCO liquidity commentary.", "how": "HQLA haircuts and outflow run-off rates are applied in Python; an LLM writes the ALCO note and actions.", "today": "Treasury tracks whether the bank has enough liquid assets to survive a 30-day stress (LCR) and stable funding for the next year (NSFR), and reports to ALCO.", "who": "Treasury / liquidity risk team, reporting to ALCO.", "why": "Liquidity can disappear fast (as in bank runs); positions must be monitored and explained frequently.", "terms": ["Liquidity", "LCR (Liquidity Coverage Ratio)", "NSFR (Net Stable Funding Ratio)", "HQLA", "ALCO"], "code": "\"\"\"Liquidity LCR / NSFR Monitor — LangChain chain + Ollama.\n\nSimplified Basel III factors for illustration.\n\nRun:  python 01_banking/20_liquidity_lcr_nsfr_monitor/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\nHQLA = {\"cash_central_bank\": (3_200, 1.0), \"govt_bonds_L1\": (5_400, 1.0), \"covered_bonds_L2A\": (1_500, 0.85), \"corp_bonds_L2B\": (800, 0.50)}\nOUTFLOW
