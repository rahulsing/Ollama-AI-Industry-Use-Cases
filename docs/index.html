    ? `<div class="hero"><h1>${d.icon} ${esc(d.name)}</h1><p>${esc(d.tagline)}. ${esc(d.description)}</p>
         <p class="about-link" style="margin-top:8px"><a href="#/${d.folder}/about">🎓 New to ${esc(d.name.toLowerCase())}? How the industry works + glossary →</a></p></div>`
    : `<div class="hero"><h1>Simple AI agents for real business problems</h1>
         <p>Pick an industry, read the business problem in plain English, see how the AI solves it, and read the code.
         Every solution runs locally on an open-source model via Ollama.</p>
         <div class="stats"><span><b>${DATA.industries.length}</b>industries</span><span><b>${ALL.length}</b>solutions</span>
         <span><b>${ALL.filter(u => u.framework === "CrewAI").length}</b>CrewAI crews</span>
         <span><b>${ALL.filter(u => u.framework === "LangChain").length}</b>LangChain agents</span></div></div>`;
  const cats = d ? Object.entries(d.categories) : [];
  const chips = d ? `<div class="chips">${[["all", "All categories"], ...cats].map(([k, v]) =>
      `<button class="chip" aria-pressed="${state.category === k}" data-cat="${k}">${esc(v)}</button>`).join("")}</div>` : "";
  const items = ALL.filter(matches);
  app.innerHTML = `${hero}
    <div class="controls"><label class="search"><input id="q" type="search" placeholder="Search solutions, e.g. fraud, pricing, KYC, claims" value="${esc(state.query)}" aria-label="Search"></label></div>
    ${chips}
    <div class="grid">${items.length ? items.map(card).join("") : `<div class="empty">No solutions match your search.</div>`}</div>`;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.query = q.value; const pos = q.selectionStart; renderList(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); });
}

app.addEventListener("click", e => {
  const c = e.target.closest("[data-link]"); if (c) { location.hash = c.dataset.link; return; }
  const chip = e.target.closest(".chip"); if (chip) { state.category = chip.dataset.cat; renderList(); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    navigator.clipboard.writeText(copy.dataset.copy).then(() => { copy.textContent = "Copied!"; setTimeout(() => copy.textContent = "Copy", 1500); });
  }
});

function renderDetail(d, u) {
  const run = `python ${d.folder}/${u.slug}/app.py`;
  const folderUrl = `${DATA.repo}/tree/main/${d.folder}/${u.slug}`;
  const terms = u.terms.map(t => `<dt>${esc(t)}</dt><dd>${esc(d.glossary[t][1])}</dd>`).join("");
  app.innerHTML = `<div class="detail">
    <a class="back" href="#/${d.folder}">← All ${esc(d.name)} solutions</a>
    <h1>${esc(u.title)}</h1>
    <div class="crumbs">${d.icon} ${esc(d.name)} · ${esc(d.categories[u.category])} ·
      <span class="badge ${u.framework}">${u.framework}</span> <span class="badge">${esc(u.pattern)}</span></div>
    <div class="cols">
      <section class="panel"><h2>${d.icon} The business problem</h2>
        <p><strong>In the business today:</strong> ${esc(u.today)}</p>
        <p><strong>Who does this work:</strong> ${esc(u.who)}</p>
        <p><strong>Why it's hard:</strong> ${esc(u.why)}</p></section>
      <section class="panel"><h2>🤖 What the AI does</h2>
        ${md(u.description)}
        <p><strong>How it works:</strong></p>${md(u.how)}</section>
      <section class="panel full terms"><h2>📖 Key terms</h2><dl>${terms}</dl>
        <p class="note" style="margin-top:10px"><a href="#/${d.folder}/about">Full ${esc(d.name)} primer & glossary →</a></p></section>
      <section class="panel full"><h2>▶ Run it locally</h2>
        <div class="run"><code>${esc(run)}</code><button class="btn" data-copy="${esc(run)}">Copy</button></div>
        <p class="note" style="margin-top:8px">Needs Python 3.10–3.13 and <a href="https://ollama.com" target="_blank" rel="noopener">Ollama</a>.
          Setup: <a href="${DATA.repo}#-quick-start" target="_blank" rel="noopener">Quick start</a>.</p></section>
      <section class="panel full"><div class="code-head"><h2 style="margin:0">💻 Implementation: app.py</h2>
          <span><button class="btn" data-copy="${esc(u.code)}">Copy</button> <a href="${folderUrl}" target="_blank" rel="noopener">View on GitHub ↗</a></span></div>
        <pre><code class="language-python">${esc(u.code)}</code></pre></section>
    </div></div>`;
  if (window.hljs) hljs.highlightElement(app.querySelector("pre code"));
  window.scrollTo(0, 0);
}

function renderAbout(d) {
  const groups = {};
  for (const [t, [g, def]] of Object.entries(d.glossary)) (groups[g] ??= []).push([t, def]);
  const areas = d.areas.map(([key, name, what]) => {
    const n = d.use_cases.filter(u => u.category === key).length;
    return `<dt>${esc(d.categories[key].split(" ")[0])} ${esc(name)} <a href="#/${d.folder}" data-cat-link="${key}" class="note">(${n} solution${n === 1 ? "" : "s"})</a></dt><dd>${esc(what)}</dd>`;
  }).join("");
  const glossary = Object.entries(groups).map(([g, items]) => `<div class="glossary-group"><h3>${esc(g)}</h3><dl>${
    items.sort((a, b) => a[0].localeCompare(b[0])).map(([t, def]) => `<dt data-term="${esc((t + " " + def).toLowerCase())}">${esc(t)}</dt><dd>${esc(def)}</dd>`).join("")}</dl></div>`).join("");
  app.innerHTML = `<div class="detail">
    <a class="back" href="#/${d.folder}">← ${esc(d.name)} solutions</a>
    <h1>${d.icon} ${esc(d.name)}: how the industry works</h1>
    <div class="crumbs">A plain-English primer for people new to ${esc(d.name.toLowerCase())}</div>
    <div class="cols">
      <section class="panel">${md(d.industry_101)}</section>
      <section class="panel"><h2>Departments</h2><dl>${areas}</dl></section>
      <section class="panel full"><h2>📖 Glossary (${Object.keys(d.glossary).length} terms)</h2>
        <label class="search glossary-search"><input id="gq" type="search" placeholder="Filter terms" aria-label="Filter glossary"></label>
        <div id="glossary">${glossary}</div></section>
    </div></div>`;
  document.getElementById("gq").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll("#glossary dt").forEach(dt => {
      const show = dt.dataset.term.includes(q);
      dt.style.display = dt.nextElementSibling.style.display = show ? "" : "none";
    });
    document.querySelectorAll(".glossary-group").forEach(g =>
      g.style.display = [...g.querySelectorAll("dt")].some(dt => dt.style.display !== "none") ? "" : "none");
  });
  app.querySelectorAll("[data-cat-link]").forEach(a => a.addEventListener("click", () => { state.category = a.dataset.catLink; }));
  window.scrollTo(0, 0);
}

function route() {
  const [folder = "", slug = ""] = location.hash.replace(/^#\/?/, "").split("/");  // "#/<industry>/<use case>"
  const d = IND[folder];
  const prev = state.industry;
  state.industry = d ? folder : "all";
  if (state.industry !== prev && !(d && slug)) state.category = "all";
  renderTabs();
  if (d && slug === "about") return renderAbout(d);
  const u = d && d.use_cases.find(x => x.slug === slug);
  if (u) return renderDetail(d, { ...u, ind: d });
  renderList();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
