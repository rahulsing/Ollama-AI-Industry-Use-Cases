r. These can be used to trial a new product or give best sellers more space. Given the current proposals, we can consider adding a facing to the \"Honey oat clusters 500g\" or \"Fruit muesli 1kg\" to further boost their sales and profitability.\n\n---\n\n**Weekly Profit at Risk from Delists:**\n\nThe weekly profit at risk from delisting the products is $25. This includes the profit kept by switching to other products and the profit at risk from the delisted products. We will need to communicate this to the suppliers of the delisted products to ensure they are aware of the potential impact.\n\n---\n\n**Talking Points for Suppliers of Delisted Products:**\n\n1. **Bran flakes 500g:**\n   - We appreciate your contribution to our cereal aisle. However, due to the low profit per facing and high transferable demand, we have decided to delist this product. We will continue to support your brand and will keep you informed of any future opportunities.\n   - We will work with you to explore other avenues for your product, such as online sales or alternative retail partners.\n\n2. **Frosted rings 300g:**\n   - We understand that this product has been a favorite among our customers. Unfortunately, due to the low profit per facing and high transferable demand, we have decided to delist this product. We will continue to support your brand and will keep you informed of any future opportunities.\n   - We will work with you to explore other avenues for your product, such as online sales or alternative retail partners.\n\n---\n\n**Conclusion:**\n\nBased on the criteria and the current sales data, we have made the following decisions. We will continue to monitor the performance of the remaining products and make adjustments as necessary. We will also work closely with our suppliers to ensure a smooth transition and to explore new opportunities for their products.\n\n---\n\n**End of Memo**"}]}}, {"slug": "06_online_shopping_assistant", "title": "Online Shopping Assistant", "category": "service", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Helps shoppers find the right product, then checks store stock for click-and-collect and delivery options.", "how": "Tools search the catalog with price and size filters, check live stock by store and city, and quote delivery; the agent recommends only what the tools return, so it never invents products, prices or stock.", "today": "Shoppers on the website or app ask what to buy and whether they can get it today. Store and contact-centre staff answer by checking the catalog and the stock system.", "who": "E-commerce and customer service teams, and store colleagues.", "why": "Customers want a fast, personal answer. A wrong answer about price or stock, like promising an item is in store when it isn't, loses the sale and the customer's trust.", "terms": ["Click-and-collect", "Stock-out"], "code": "\"\"\"Online Shopping Assistant — LangChain tool-calling agent + Ollama.\n\nThe agent searches the catalog, then checks store stock for click-and-collect and the delivery options.\nIt can only recommend what the tools return, so it never invents products, prices or stock.\n\nRun:  python 02_retail/06_online_shopping_assistant/app.py\n      python 02_retail/06_online_shopping_assistant/app.py \"Do you have trail shoes in size 9 under 130?\"\n\"\"\"\n\nimport re\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nCATALOG = {\n    \"RS-01\": {\"name\": \"Stridewell Stability 5\", \"price\": 94.99, \"rating\": 4.6, \"sizes\": [8, 8.5, 9, 9.5, 10, 10.5, 11, 12],\n              \"tags\": \"running shoe road stability support flat feet overpronation\"},\n    \"RS-02\": {\"name\": \"CloudLite Neutral Runner\", \"price\": 79.99, \"rating\": 4.4, \"sizes\": [7, 8, 9, 10, 11],\n              \"tags\": \"running shoe road neutral cushioned lightweight high arches\"},\n    \"RS-03\": {\"name\": \"TrailGrip Pro\", \"price\": 119.99, \"rating\": 4.5, \"sizes\": [8, 9, 10, 11],\n              \"tags\": \"running shoe trail grip waterproof\"},\n    \"RS-04\": {\"name\": \"Stridewell Stability 5 Wide\", \"price\": 99.99, \"rating\": 4.5, \"sizes\": [9, 10, 11],\n              \"tags\": \"running shoe road stability support flat feet overpronation wide fit\"},\n    \"RS-05\": {\"name\": \"ArchGuard Motion Control\", \"price\": 109.99, \"rating\": 4.3, \"sizes\": [9, 10, 11, 12],\n              \"tags\": \"running shoe road motion control flat feet severe overpronation\"},\n    \"AC-01\": {\"name\": \"ArchFit support insoles\", \"price\": 24.99, \"rating\": 4.2, \"sizes\": [8, 9, 10, 11, 12],\n              \"tags\": \"insoles arch support flat feet running\"},\n}\n# units on hand by store and size (normally a live inventory API)\nSTORE_STOCK = {\n    \"RS-01\": {\"Austin - South Congress\": {10: 1, 11: 2}, \"Austin - Domain\": {9: 3}, \"Dallas - Uptown\": {10: 4}},\n    \"RS-04\": {\"Dallas - Uptown\": {10: 2}},\n    \"AC-01\": {\"Austin - Domain\": {10: 6}, \"Austin - South Congress\": {10: 3}},\n}\nWAREHOUSE = {\"RS-01\": {10: 25}, \"RS-02\": {10: 40}, \"RS-04\": {10: 8}, \"RS-05\": {10: 12}, \"AC-01\": {10: 60}}\n\n\n@tool\ndef search_products(query: str, max_price: float = 0, size: float = 0) -> list:\n    \"\"\"Search the catalog by keywords (e.g. 'running shoes flat feet'). Optional max_price and shoe size filters.\"\"\"\n    words = set(re.findall(r\"[a-z]+\", query.lower())) - {\"for\", \"and\", \"the\", \"with\", \"shoe\", \"shoes\"}\n    hits = []\n    for sku, p in CATALOG.items():\n        score = len(words & set((p[\"name\"] + \" \" + p[\"tags\"]).lower().split()))\n        if score and (not max_price or p[\"price\"] <= max_price) and (not size or size in p[\"sizes\"]):\n            hits.append((score, p[\"rating\"], {\"sku\": sku, \"name\": p[\"name\"], \"price\": p[\"price\"],\n                                              \"rating\": p[\"rating\"], \"suits\": p[\"tags\"]}))\n    return [h[2] for h in sorted(hits, key=lambda h: (h[0], h[1]), reverse=True)] or [\"no matching products\"]\n\n\ndef delivery(sku: str, size: float) -> dict:\n    \"\"\"Home delivery options for a SKU and size from the online warehouse.\"\"\"\n    if not WAREHOUSE.get(sku, {}).get(size, 0):\n        return {\"home_delivery\": \"out of stock online\"}\n    return {\"standard_delivery\": \"3-5 days, \" + (\"free\" if CATALOG[sku][\"price\"] >= 50 else \"4.99\"),\n            \"express_delivery\": \"next day if ordered before 8pm, 7.99\"}\n\n\n@tool\ndef check_availability(sku: str, size: float, city: str) -> dict:\n    \"\"\"Click-and-collect stock at each store in a city today, plus home delivery options, for a SKU and size.\"\"\"\n    if sku not in CATALOG:  # small models sometimes invent codes: send them back to the search results\n        return {\"error\": f\"Unknown SKU {sku!r}. Use a sku exactly as returned by search_products, e.g. 'RS-01'.\"}\n    stores = {store: sizes.get(size, 0) for store, sizes in STORE_STOCK.get(sku, {}).items()\n              if store.lower().startswith(city.lower())}\n    ready = [s for s, units in stores.items() if units > 0]\n    return {\"sku\": sku, \"size\": size, \"units_by_store\": stores or f\"no stores in {city} stock it\",\n            \"collect_today\": f\"ready in 1 hour at {', '.join(ready)}\" if ready else \"not available to collect today\",\n            **delivery(sku, size)}\n\n\nSYSTEM = (\n    \"You are a friendly online shopping assistant for a sports retailer. Work in two steps. Step 1: call \"\n    \"search_products on its own and wait for the results. Step 2: call check_availability for each of the top 3 \"\n    \"results, using the sku values exactly as search_products returned them. Then answer. Only mention products you \"\n    \"checked in step 2, with the prices, stock and delivery options the tools returned. For each give the price, why \"\n    \"it suits the customer, and whether they can collect today or get delivery. If something is over budget, say so. Don't \"\n    \"give medical advice: for foot pain suggest the free in-store gait analysis.\"\n)\n\n\ndef main():\n    banner(\"Retail 06 - Online Shopping Assistant (LangChain agent)\")\n    q = sys.argv[1] if len(sys.argv) > 1 else (\n        \"I need running shoes for flat feet, size 10, under 100. Can I pick them up in Austin today?\")\n    section(\"Question\", q)\n    section(\"Answer\", run_agent(SYSTEM, [search_products, check_availability], q))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    QU[\"💬 Your question\"] --> AG[\"🤖 LangChain agent<br/>decides which tool to call\"]\n    AG <-->|\"🔧 calls & results\"| T[\"🐍 Python tools<br/>search_products()<br/>check_availability()\"]\n    IN[\"📄 Catalog, store & warehouse stock\"] --> T\n    AG <-.->|\"💬 reasoning\"| LLM([\"🦙 Ollama\"])\n    AG --> OUT[\"📝 Product picks + collect / delivery\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN,QU data\n    class T rules\n    class AG ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 12, "turns": [{"ask": "I need running shoes for flat feet, size 10, under 100. Can I pick them up in Austin today?", "steps": [{"icon": "🔧", "label": "Tool calls", "body": "search_products(query='running shoes flat feet', size=10, max_price=100) -> [{\"sku\": \"RS-01\", \"name\": \"Stridewell Stability 5\", \"price\": 94.99, \"rating\": 4.6, \"suits\": \"running shoe road stability support flat feet overpronation\"}, {\"sku\": \"RS-04\", \"name\": \"Stridewell Stability 5 Wide\", \"price\": 99.99, \"rating\": 4.5, \"suits\": \"running shoe road stability support flat feet overpronation wide fit\"}, {\"sku\": \"AC-01\", \"name\": \"ArchFit support insoles\", \"price\": 24.99, \"rating\ncheck_availability(city='Austin', sku='RS-01', size=10) -> {\"sku\": \"RS-01\", \"size\": 10.0, \"units_by_store\": {\"Austin - South Congress\": 1, \"Austin - Domain\": 0}, \"collect_today\": \"ready in 1 hour at Austin - South Congress\", \"standard_delivery\": \"3-5 days, free\", \"express_delivery\": \"next day if ordered before 8pm, 7.99\"}\ncheck_availability(sku='RS-04', size=10, city='Austin') -> {\"sku\": \"RS-04\", \"size\": 10.0, \"units_by_store\": \"no stores in Austin stock it\", \"collect_today\": \"not available to collect today\", \"standard_delivery\": \"3-5 days, free\", \"express_delivery\": \"next day if ordered before 8pm, 7.99\"}\ncheck_availability(sku='AC-01', size=10, city='Austin') -> {\"sku\": \"AC-01\", \"size\": 10.0, \"units_by_store\": {\"Austin - Domain\": 6, \"Austin - South Congress\": 3}, \"collect_today\": \"ready in 1 hour at Austin - Domain, Austin - South Congress\", \"standard_delivery\": \"3-5 days, 4.99\", \"express_delivery\": \"next day if ordered before 8pm, 7.99\"}", "code": true}], "answer": "Here are the options for running shoes for flat feet, size 10, under $100:\n\n1. **Stridewell Stability 5 (SKU: RS-01)**\n   - Price: $94.99\n   - Why it suits you: This shoe is designed for stability and support, making it ideal for flat feet and overpronation.\n   - Collection: Ready in 1 hour at Austin - South Congress.\n   - Delivery: Free standard delivery in 3-5 days.\n\n2. **Stridewell Stability 5 Wide (SKU: RS-04)**\n   - Price: $99.99\n   - Unfortunately, this shoe is not available to collect in Austin today. However, you can order it for standard delivery in 3-5 days for free or express delivery the next day for $7.99.\n\n3. **ArchFit support insoles (SKU: AC-01)**\n   - Price: $24.99\n   - While not a shoe, these insoles can provide additional support for your flat feet. They are available for collection at both Austin - Domain and Austin - South Congress in 1 hour.\n   - Delivery: Standard delivery is $4.99 for 3-5 days.\n\nThe Stridewell Stability 5 (SKU: RS-01) is the best option for you, as it fits your budget and provides the necessary support for your flat feet. You can collect it today from Austin - South Congress. If you need more support, consider the ArchFit insoles as well."}]}}, {"slug": "07_returns_policy_assistant", "title": "Returns & Refund Policy Assistant (RAG)", "category": "service", "framework": "LangChain", "pattern": "RAG", "description": "Answers \"can I return this?\" questions with a decision based on the store's returns policy.", "how": "Retrieval finds the relevant policy sections, the LLM turns the customer's message into a returns checklist, Python applies the rules (return windows, restocking fee, final sale, proof of purchase) and the LLM explains.", "today": "Customers ask whether they can return an item and how they'll be refunded. Service staff look up the returns policy, check the dates and proof of purchase, and explain the decision.", "who": "Customer service agents and store customer-desk staff.", "why": "Returns policies have many rules (time windows, electronics, final sale, hygiene, faulty items) and staff apply them inconsistently. Customers must get the same correct answer everywhere.", "terms": ["Restocking fee", "Final sale", "Proof of purchase"], "code": "\"\"\"Returns & Refund Policy Assistant (RAG) — LangChain + Ollama.\n\nRetrieval finds the relevant policy sections, the LLM turns the customer's message into a returns checklist,\nPython applies the policy rules (windows, fees, proof of purchase) and the LLM explains the decision.\n\nTip: `ollama pull nomic-embed-text` for semantic retrieval (falls back to keywords).\n\nRun:  python 02_retail/07_returns_policy_assistant/app.py\n      python 02_retail/07_returns_policy_assistant/app.py \"Can I return headphones I opened 20 days ago?\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\nfrom typing import Literal\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import SimpleRetriever, banner, run_chain, run_structured, section\n\n# Sample returns policy (fictional) - replace with chunks of your own policy pages\nPOLICY = [\n    (\"Section 1 Standard returns\", \"Most items can be returned within 30 days of purchase in their original \"\n     \"condition for a full refund to the original payment method.\"),\n    (\"Section 2 Electronics\", \"Electronics (laptops, phones, headphones, cameras) can be returned within 15 days of \"\n     \"purchase. Opened electronics carry a 15% restocking fee unless they are faulty.\"),\n    (\"Section 3 Final sale\", \"Items marked final sale, including all clearance items, cannot be returned or \"\n     \"exchanged unless they are faulty.\"),\n    (\"Section 4 Faulty items\", \"If an item develops a fault within 1 year of purchase we will repair, replace or \"\n     \"refund it, with no restocking fee.\"),\n    (\"Section 5 Proof of purchase\", \"We accept a receipt, an order confirmation email, or the payment card used, \"\n     \"which we can look up for purchases in the last 90 days. Without proof of purchase we can only offer store \"\n     \"credit at the item's lowest selling price in the last 30 days.\"),\n    (\"Section 6 Hygiene items\", \"For hygiene reasons, swimwear, earrings and underwear can only be returned unopened \"\n     \"with the hygiene seal intact.\"),\n    (\"Section 7 Gift cards\", \"Gift cards cannot be returned or exchanged for cash.\"),\n]\nSTANDARD_DAYS, ELECTRONICS_DAYS, FAULTY_DAYS, CARD_LOOKUP_DAYS = 30, 15, 365, 90\nRESTOCKING_FEE = 0.15\n# The policy's own product lists (Sections 2 and 6), applied by Python rather than guessed by the model\nELECTRONICS = {\"laptop\", \"phone\", \"smartphone\", \"headphones\", \"earbuds\", \"camera\", \"tablet\", \"tv\"}\nHYGIENE = {\"swimsuit\", \"swimwear\", \"bikini\", \"earrings\", \"underwear\"}\n\n\nclass ReturnRequest(BaseModel):\n    item: str = Field(description=\"The product, in one or two words, e.g. 'laptop', 'swimsuit', 'jacket'\")\n    final_sale: bool = Field(description=\"True ONLY if the customer says it was bought on clearance or as final sale\")\n    faulty: bool = Field(description=\"True only if the item is broken or stopped working, not if they just dislike it\")\n    opened_or_used: bool = Field(description=\"True if opened, tried on, worn or used\")\n    days_since_purchase: int = Field(description=\"Approximate days since purchase (1 month = 30 days)\")\n    proof: Literal[\"receipt\", \"card\", \"none\"] = Field(\n        description=\"receipt = receipt or order confirmation email; card = only the payment card; none = no proof\")\n\n\ndef category(item: str) -> str:\n    words = set(item.lower().replace(\"-\", \" \").split())\n    return \"electronics\" if words & ELECTRONICS else \"hygiene\" if words & HYGIENE else \"other\"\n\n\ndef decide(r: ReturnRequest) -> dict:\n    \"\"\"Apply the returns policy. Returns the decision and the sections it relied on.\"\"\"\n    fee, kind = 0.0, category(r.item)\n    if r.faulty:  # faults override final sale and hygiene rules\n        rule, window, outcome = \"Section 4 Faulty items\", FAULTY_DAYS, \"repair, replacement or refund\"\n    elif r.final_sale:\n        rule, window, outcome = \"Section 3 Final sale\", None, \"final sale: not returnable\"\n    elif kind == \"hygiene\" and r.opened_or_used:\n        rule, window, outcome = \"Section 6 Hygiene items\", None, \"opened hygiene item: not returnable\"\n    elif kind == \"electronics\":\n        rule, window, outcome = \"Section 2 Electronics\", ELECTRONICS_DAYS, \"refund\"\n        fee = RESTOCKING_FEE if r.opened_or_used else 0.0\n    else:\n        rule, window, outcome = \"Section 1 Standard returns\", STANDARD_DAYS, \"refund\"\n    ok = window is not None and r.days_since_purchase <= window\n    if window and not ok:\n        outcome = f\"outside the {window}-day return window\"\n    sections, refund_to, proof = [rule], None, None\n    if ok:\n        sections.append(\"Section 5 Proof of purchase\")\n        card_found = r.proof == \"card\" and r.days_since_purchase <= CARD_LOOKUP_DAYS\n        proof = (\"receipt or order confirmation\" if r.proof == \"receipt\" else\n                 f\"payment card lookup (accepted for purchases in the last {CARD_LOOKUP_DAYS} days)\" if card_found\n                 else \"none\")\n        refund_to = (\"original payment method\" if r.proof == \"receipt\" or card_found\n                     else \"store credit at the lowest selling price in the last 30 days\")\n    return {\"item\": r.item, \"category\": kind, \"decision\": \"RETURN ACCEPTED\" if ok else \"RETURN DECLINED\", \"outcome\": outcome,\n            \"days_since_purchase\": r.days_since_purchase, \"return_window_days\": window,\n            \"restocking_fee\": f\"{fee:.0%}\" if ok and fee else \"none\", \"proof_of_purchase\": proof,\n            \"refund_to\": refund_to, \"policy_sections\": sections}\n\n\nEXTRACT = (\n    \"Fill in the returns checklist from the customer's message. Read each field's description carefully. \"\n    \"final_sale is false unless the message mentions clearance or final sale. faulty is false if the customer \"\n    \"simply doesn't like the item. Do not guess facts they didn't give.\"\n)\nEXPLAIN = (\n    \"You are a friendly customer service assistant for a retailer. The returns decision below is FINAL. Explain it \"\n    \"to the customer in 3-4 sentences, citing the policy section in square brackets, and say how they will be \"\n    \"refunded and any fee. If declined, offer a helpful alternative from the policy. Do not change the decision.\"\n)\n\n\ndef main():\n    banner(\"Retail 07 - Returns & Refund Policy Assistant (LangChain RAG)\")\n    retriever = SimpleRetriever([f\"[{s}] {t}\" for s, t in POLICY])\n    questions = sys.argv[1:] or [\n        \"I bought a laptop 10 days ago and opened it, but I don't like it. Can I return it? I have the receipt.\",\n        \"Can I return a swimsuit I bought on clearance 5 days ago? I tried it on.\",\n        \"My blender stopped working after 3 months. I have the order confirmation email.\",\n        \"I lost the receipt for a jacket I bought 20 days ago, but I paid with my debit card. It still has the tags.\",\n    ]\n    for q in questions:\n        request = run_structured(EXTRACT, q, ReturnRequest)\n        decision = decide(request)\n        passages = retriever.search(q, k=3)\n        passages += [f\"[{s}] {t}\" for s, t in POLICY if s in decision[\"policy_sections\"] and f\"[{s}] {t}\" not in passages]\n        answer = run_chain(EXPLAIN, \"Decision: {d}\\n\\nPolicy extracts:\\n{ctx}\\n\\nCustomer message: {q}\",\n                           d=decision, ctx=\"\\n\".join(passages), q=q)\n        section(f\"Q: {q}\", f\"**{decision['decision']}** ({', '.join(decision['policy_sections'])})\\n\\n{answer}\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    QU[\"❓ Your question\"] --> R[\"🔎 Retriever<br/>finds the most relevant passages\"]\n    IN[\"📚 Returns policy\"] -->|\"🧮 embeddings\"| R\n    R -->|\"📎 top passages\"| G[\"🔗 LangChain<br/>answer only from passages\"]\n    G <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    G -->|\"📋 checklist\"| PY[\"🐍 Python<br/>Return windows, fees & proof-of-purchase rules\"]\n    PY -->|\"✍️ explained\"| OUT[\"📝 Returns decision + explanation\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN,QU data\n    class PY rules\n    class R,G ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 16, "turns": [{"ask": "I bought a laptop 10 days ago and opened it, but I don't like it. Can I return it? I have the receipt.", "steps": [], "answer": "**RETURN ACCEPTED** (Section 2 Electronics, Section 5 Proof of purchase)\n\nAccording to our policy, you can return the laptop within 15 days of purchase, and since you have the receipt, we can process your return. However, as the laptop was opened, a 15% restocking fee will apply. You will be refunded via your original payment method. If you need any further assistance or have other options, please let us know."}, {"ask": "Can I return a swimsuit I bought on clearance 5 days ago? I tried it on.", "steps": [], "answer": "**RETURN DECLINED** (Section 3 Final sale)\n\nI understand you'd like to return the swimsuit you purchased on clearance. According to our policy, [Section 3 Final sale] items marked as final sale, like clearance items, cannot be returned or exchanged unless they are faulty. Since your swimsuit is marked as a final sale, it cannot be returned. However, if the swimsuit is faulty, please contact us and we can assist you further."}, {"ask": "My blender stopped working after 3 months. I have the order confirmation email.", "steps": [], "answer": "**RETURN ACCEPTED** (Section 4 Faulty items, Section 5 Proof of purchase)\n\nThank you for reaching out. According to our policy, as your blender developed a fault within the first year of purchase, we can accept a return and offer a repair, replacement, or refund for the blender. Since you have the order confirmation email, which is acceptable proof of purchase, we can proceed with this. There will be no restocking fee. Please let us know if you'd like to proceed with a repair or replacement, or if you prefer a refund."}, {"ask": "I lost the receipt for a jacket I bought 20 days ago, but I paid with my debit card. It still has the tags.", "steps": [], "answer": "**RETURN ACCEPTED** (Section 1 Standard returns, Section 5 Proof of purchase)\n\nThank you for understanding, [Section 5 Proof of purchase] allows us to accept your debit card as proof of purchase since your purchase was within the last 90 days. Therefore, we can process a refund for your jacket. The refund will be returned to your original payment method. If you need any further assistance or an alternative like store credit, please let us know."}]}}, {"slug": "08_shrink_loss_analyzer", "title": "Store Shrink & Loss Prevention Analyzer", "category": "store", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Finds why stores lose more stock than they should and writes a 30-day action plan.", "how": "Python splits shrink into known loss (waste, damage) and unknown loss (theft, errors), compares stores to the 1.5% benchmark and flags unusual till refunds and voids for review; a Loss Prevention Analyst agent finds the causes and a Regional Operations Manager agent writes the plan.", "today": "Every quarter, stock counts show how much stock was lost. The loss prevention team works out where and why, and agrees actions with store managers.", "who": "Loss prevention analysts, regional and store managers.", "why": "Losses mix theft, damage, waste and paperwork errors, and each needs a different fix. Unusual till activity must be reviewed fairly, without accusing staff on numbers alone.", "terms": ["Shrink", "Known vs unknown loss", "Till exceptions"], "code": "\"\"\"Store Shrink & Loss Prevention Analyzer — CrewAI + Ollama.\n\nPython splits each store's shrink into known loss (waste, damage) and unknown loss (theft, errors), compares it\nto the benchmark and flags unusual till activity; agents find the likely causes and write the action plan.\n\nRun:  python 02_retail/08_shrink_loss_analyzer/app.py\n\"\"\"\n\nimport json\nimport statistics\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\n# Last quarter. known = recorded waste and damage; unknown = gap found by stock counts (theft, admin errors)\nSTORES = [\n    {\"store\": \"S-01 Downtown\", \"sales\": 2_400_000, \"known\": {\"expired fresh\": 9_000, \"damaged\": 5_000},\n     \"unknown\": {\"health & beauty\": 6_000, \"electronics accessories\": 4_000, \"grocery\": 3_500, \"other\": 2_500}},\n    {\"store\": \"S-02 Riverside\", \"sales\": 1_800_000, \"known\": {\"expired fresh\": 8_000, \"damaged\": 4_500},\n     \"unknown\": {\"health & beauty\": 4_000, \"electronics accessories\": 2_500, \"grocery\": 2_500, \"other\": 2_000}},\n    {\"store\": \"S-03 Airport Mall\", \"sales\": 2_100_000, \"known\": {\"expired fresh\": 9_500, \"damaged\": 5_500},\n     \"unknown\": {\"health & beauty\": 18_500, \"electronics accessories\": 12_000, \"grocery\": 4_000, \"other\": 6_500}},\n    {\"store\": \"S-04 Lakeside\", \"sales\": 1_500_000, \"known\": {\"expired fresh\": 24_000, \"damaged\": 7_000},\n     \"unknown\": {\"health & beauty\": 2_000, \"electronics accessories\": 1_500, \"grocery\": 1_500, \"other\": 1_000}},\n]\n# Till exceptions per cashier ID: refunds without a receipt and voids after the total was shown\nTILLS = [\n    (\"S-01 Downtown\", \"C-101\", 6100, 7, 10), (\"S-01 Downtown\", \"C-102\", 5900, 8, 9),\n    (\"S-02 Riverside\", \"C-201\", 4700, 5, 6), (\"S-02 Riverside\", \"C-202\", 4500, 4, 8),\n    (\"S-03 Airport Mall\", \"C-311\", 5200, 6, 9), (\"S-03 Airport Mall\", \"C-312\", 4800, 41, 38),\n    (\"S-03 Airport Mall\", \"C-313\", 5100, 5, 7),\n    (\"S-04 Lakeside\", \"C-401\", 3900, 3, 5), (\"S-04 Lakeside\", \"C-402\", 4100, 4, 6),\n]\nBENCHMARK = 0.015      # total shrink above 1.5% of sales needs action\nTILL_FLAG = 3          # exception rate above 3x the chain median gets reviewed\n\n\ndef store_facts(s: dict) -> dict:\n    known, unknown = sum(s[\"known\"].values()), sum(s[\"unknown\"].values())\n    total_pct = (known + unknown) / s[\"sales\"]\n    main = \"unknown loss (theft or admin errors)\" if unknown > known else \"known loss (waste and damage)\"\n    excess = max(round(known + unknown - BENCHMARK * s[\"sales\"]), 0)\n    return {\"store\": s[\"store\"], \"shrink_pct\": round(total_pct * 100, 2), \"known_loss\": known, \"unknown_loss\": unknown,\n            \"status\": \"ABOVE BENCHMARK\" if excess else \"OK\", \"main_driver\": main,\n            \"loss_reduction_needed_per_quarter\": excess,\n            \"target\": f\"cut losses by {excess:,} a quarter to get back to {BENCHMARK:.1%} of sales\" if excess\n                      else \"stay at or below the benchmark\",\n            \"top_loss_lines\": dict(sorted({**s[\"known\"], **s[\"unknown\"]}.items(), key=lambda kv: -kv[1])[:2])}\n\n\ndef till_flags() -> list[dict]:\n    rates = [(st, cid, refunds / tx * 1000, voids / tx * 1000) for st, cid, tx, refunds, voids in TILLS]\n    med_refund = statistics.median(r[2] for r in rates)\n    med_void = statistics.median(r[3] for r in rates)\n    return [{\"store\": st, \"cashier_id\": cid, \"no_receipt_refunds_per_1000\": round(rf, 1),\n             \"post_total_voids_per_1000\": round(vd, 1), \"chain_median_refunds\": round(med_refund, 1),\n             \"chain_median_voids\": round(med_void, 1)}\n            for st, cid, rf, vd in rates if rf > TILL_FLAG * med_refund or vd > TILL_FLAG * med_void]\n\n\ndef main():\n    banner(\"Retail 08 - Store Shrink & Loss Prevention Analyzer (CrewAI)\")\n    facts = {\"benchmark_shrink_pct\": BENCHMARK * 100, \"stores\": [store_facts(s) for s in STORES],\n             \"till_exceptions_to_review\": till_flags(),\n             \"note\": \"Till flags are a reason to review CCTV and till logs, not proof of wrongdoing.\"}\n    section(\"Shrink facts\", json.dumps(facts, indent=2))\n\n    analyst = make_agent(\"Loss Prevention Analyst\", \"Find the most likely cause of excess shrink at each store\",\n                         \"Retail loss prevention analyst. You separate theft, admin errors and waste, and you never \"\n                         \"accuse an individual: unusual till activity only triggers a review.\")\n    manager = make_agent(\"Regional Operations Manager\", \"Turn the findings into a practical 30-day action plan\",\n                         \"You run these stores and balance loss prevention with customer experience and staff morale.\")\n    t1 = make_task(\"Shrink facts (exact figures):\\n{facts}\\n\\nFor each ABOVE BENCHMARK store, explain the main driver \"\n                   \"and the likely causes for its top loss lines. Mention the till exceptions as items to review.\",\n                   \"Findings per store.\", analyst)\n    t2 = make_task(\"Shrink facts (exact figures; quote these, never recalculate):\\n{facts}\\n\\n\"\n                   \"Write the 30-day action plan for the stores above benchmark.\",\n                   \"Plan: per store, 3-4 actions (e.g. protective packaging or tagging for high-theft lines, fresh \"\n                   \"ordering and rotation fixes, till-log review), each with an owner role and fitting that store's \"\n                   \"main driver. End each store's section with 'Target:' followed by its target field quoted exactly. \"\n                   \"Do not give each action its own money target.\",\n                   manager, context=[t1])\n    section(\"Action plan\", run_crew([analyst, manager], [t1, t2], {\"facts\": json.dumps(facts, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Stock losses & till logs\"] --> PY[\"🐍 Python<br/>Shrink vs 1.5% benchmark + till flags\"]\n    subgraph CREW[\"🤖 CrewAI crew: agents work in turn\"]\n        A1[\"🧑‍💼 Loss Prevention Analyst\"]\n        A2[\"👔 Regional Operations Manager\"]\n        A1 -->|\"hands over\"| A2\n    end\n    style CREW fill:none,stroke:#7c3aed,stroke-dasharray:5 4\n    PY -->|\"✅ facts\"| A1\n    CREW <-.->|\"💬 prompts\"| LLM([\"🦙 Ollama\"])\n    A2 --> OUT[\"📝 30-day action plan\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class A1,A2 ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 26, "turns": [{"ask": "Why is shrink above target at some stores this quarter, and what should we do about it?", "steps": [{"icon": "🐍", "label": "Python · Shrink facts", "body": "{\n  \"benchmark_shrink_pct\": 1.5,\n  \"stores\": [\n    {\n      \"store\": \"S-01 Downtown\",\n      \"shrink_pct\": 1.25,\n      \"known_loss\": 14000,\n      \"unknown_loss\": 16000,\n      \"status\": \"OK\",\n      \"main_driver\": \"unknown loss (theft or admin errors)\",\n      \"loss_reduction_needed_per_quarter\": 0,\n      \"target\": \"stay at or below the benchmark\",\n      \"top_loss_lines\": {\n        \"expired fresh\": 9000,\n        \"health & beauty\": 6000\n      }\n    },\n    {\n      \"store\": \"S-02 Riverside\",\n      \"shrink_pct\": 1.31,\n      \"known_loss\": 12500,\n      \"unknown_loss\": 11000,\n      \"status\": \"OK\",\n      \"main_driver\": \"known loss (waste and damage)\",\n      \"loss_reduction_needed_per_quarter\": 0,\n      \"target\": \"stay at or below the benchmark\",\n      \"top_loss_lines\": {\n        \"expired fresh\": 8000,\n        \"damaged\": 4500\n      }\n    },\n    {\n      \"store\": \"S-03 Airport Mall\",\n      \"shrink_pct\": 2.67,\n      \"known_loss\": 15000,\n      \"unknown_loss\": 41000,\n      \"status\": \"ABOVE BENCHMARK\",\n      \"main_driver\": \"unknown loss (theft or admin errors)\",\n      \"loss_reduction_needed_per_quarter\": 24500,\n      \"target\": \"cut losses by 24,500 a quarter to get back to 1.5% of sales\",\n      \"top_loss_lines\": {\n        \"health & beauty\": 18500,\n        \"electronics accessories\": 12000\n      }\n    },\n    {\n      \"store\": \"S-04 Lakeside\",\n      \"shrink_pct\": 2.47,\n      \"known_loss\": 31000,\n      \"unknown_loss\": 6000,\n      \"status\": \"ABOVE BENCHMARK\",\n      \"main_driver\": \"known loss (waste and damage)\",\n      \"loss_reduction_needed_per_quarter\": 14500,\n      \"target\": \"cut losses by 14,500 a quarter to get back to 1.5% of sales\",\n      \"top_loss_lines\": {\n        \"expired fresh\": 24000,\n        \"damaged\": 7000\n      }\n    }\n  ],\n  \"till_exceptions_to_review\": [\n    {\n      \"store\": \"S-03 Airport Mall\",\n      \"cashier_id\": \"C-312\",\n      \"no_receipt_refunds_per_1000\": 8.5,\n      \"post_total_voids_per_1000\": 7.9,\n      \"chain_median_refunds\": 1.1,\n      \"chain_median_voids\": 1.5\n    }\n  ],\n  \"note\": \"Till flags are a reason to review CCTV and till logs, not proof of wrongdoing.\"\n}", "code": true}, {"icon": "🧑‍💼", "label": "Loss Prevention Analyst (agent)", "body": "Findings per store:\n\n### S-03 Airport Mall\n- **Main Driver:** Unknown loss (theft or admin errors)\n- **Top Loss Lines:**\n  - **Health & Beauty:** 18,500\n  - **Electronics Accessories:** 12,000\n- **Till Exceptions to Review:**\n  - **Cashier ID:** C-312\n  - **No Receipt Refunds per 1000:** 8.5\n  - **Post Total Voids per 1000:** 7.9\n  - **Chain Median Refunds:** 1.1\n  - **Chain Median Voids:** 1.5\n\n### S-04 Lakeside\n- **Main Driver:** Known loss (waste and damage)\n- **Top Loss Lines:**\n  - **Expired Fresh:** 24,000\n  - **Damaged:** 7,000\n- **Till Exceptions to Review:**\n  - **No further till exceptions provided for S-04 Lakeside.**\n\n### Summary of Likely Causes:\n- **S-03 Airport Mall:**\n  - **Health & Beauty:** This category might be prone to theft or admin errors, such as incorrect pricing, misplacement, or unauthorized returns.\n  - **Electronics Accessories:** This category could also be a target for theft, especially if items are easily accessible or have a high perceived value.\n  - **Till Exceptions:** The high rate of no receipt refunds and post-total voids could indicate potential issues with cashier practices or system errors, which should be reviewed through CCTV and till logs.\n\n- **S-04 Lakeside:**\n  - **Expired Fresh:** This category is likely experiencing waste due to expiration or damage, possibly due to poor inventory management or handling practices.\n  - **Damaged:** Items that are damaged might be written off or discarded, leading to shrinkage.\n  - **Till Exceptions:** No specific till exceptions were provided for S-04 Lakeside, but if any were present, they should be reviewed similarly to S-03 Airport Mall.\n\n### Recommendations:\n- Conduct a thorough review of the top loss lines to identify any patterns or discrepancies.\n- Investigate the till exceptions to ensure there are no system or procedural issues.\n- Implement additional training for staff handling high-value or perishable items.\n- Review and update inventory management practices to reduce waste.\n- Monitor and address any unusual activity in the till to prevent potential losses.", "code": false}], "answer": "### 30-Day Action Plan for Stores Above Benchmark\n\n#### S-03 Airport Mall\n1. **Action:** Conduct a detailed review of the health & beauty and electronics accessories sections to identify any discrepancies in pricing, stock levels, and handling procedures.  \n   **Owner:** Store Manager  \n2. **Action:** Implement protective packaging and tagging for high-theft items in the health & beauty and electronics accessories sections to reduce the risk of theft.  \n   **Owner:** Loss Prevention Team  \n3. **Action:** Review CCTV footage and till logs for cashier ID C-312 to identify any potential issues with no receipt refunds and post-total voids.  \n   **Owner:** IT and Security Team  \n4. **Action:** Provide additional training for staff on handling high-value and sensitive items to ensure proper procedures are followed.  \n   **Owner:** HR and Training Team\n\n**Target:** \"cut losses by 24,500 a quarter to get back to 1.5% of sales\"\n\n---\n\n#### S-04 Lakeside\n1. **Action:** Conduct a thorough review of the expired fresh and damaged sections to identify any issues with inventory management and handling practices.  \n   **Owner:** Store Manager  \n2. **Action:** Implement protective packaging and regular rotation of fresh items to minimize waste and ensure freshness.  \n   **Owner:** Loss Prevention Team  \n3. **Action:** Review and update inventory management practices to reduce waste and ensure proper handling of damaged items.  \n   **Owner:** Inventory Management Team  \n4. **Action:** Monitor and address any unusual activity in the till to prevent potential losses.  \n   **Owner:** IT and Security Team\n\n**Target:** \"cut losses by 14,500 a quarter to get back to 1.5% of sales\""}]}}, {"slug": "09_supplier_notice_extractor", "title": "Supplier Notice Extractor", "category": "supply", "framework": "LangChain", "pattern": "Structured extraction", "description": "Turns supplier emails about delays, price rises, short shipments and pack changes into a buyer's action list.", "how": "Each email is first classified (delay, price change, short shipment, substitution), then the details for that type are extracted into a small Pydantic schema; Python checks them against stock cover and the supplier contract (stock-out risk, notice period, price cap, hidden pack-size increases); an LLM chain writes the actions.", "today": "Buyers receive a steady stream of supplier emails: late deliveries, price rises, short shipments and pack changes. Each one has to be read, checked and acted on.", "who": "Buyers and supply chain planners.", "why": "The important details are buried in free text, and the impact depends on our own stock and contract terms. Missing one email can mean empty shelves or paying more than the contract allows.", "terms": ["Purchase order (PO)", "Short shipment", "Shrinkflation", "Lead time", "Weeks of cover", "Stock-out"], "code": "\"\"\"Supplier Notice Extractor — LangChain structured output + Ollama.\n\nThe LLM classifies each free-text supplier email, then extracts the details for that kind of notice; Python\nchecks each one against stock cover, open orders and the supplier contract; the LLM writes the buyer's action list.\n\nRun:  python 02_retail/09_supplier_notice_extractor/app.py\n\"\"\"\n\nimport json\nimport re\nimport sys\nfrom datetime import date, datetime\nfrom pathlib import Path\nfrom typing import Literal\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import banner, run_chain, run_structured, section\n\nTODAY = date(2026, 10, 10)\nEMAILS = [\n    (\"Nordic Dairy Co\", \"Hi team, PO 4471: due to a tanker shortage, delivery of Organic oat milk 1L (SKU-101) \"\n     \"moves from 14 Oct 2026 to 21 Oct 2026. Quantity unchanged at 1,200 units. Apologies for the trouble.\"),\n    (\"SunShield Labs\", \"Please note that from 1 Nov 2026 the cost price of Sunscreen SPF50 200ml (SKU-102) will \"\n     \"increase from 4.80 to 5.30 per unit, due to higher raw material costs.\"),\n    (\"WoolWorks Ltd\", \"Re PO 4485: we can only ship 120 of the 200 Wool scarf (grey) units ordered (SKU-103) this \"\n     \"week. The balance of 80 will follow in about 3 weeks.\"),\n    (\"PastaPrima\", \"Good news! From the next order (PO 4490), Pasta sauce 500g (SKU-210) is replaced by our new \"\n     \"450g jar, at the same cost price of 1.60 per unit.\"),\n]\n# What our systems know (normally ERP / inventory / contract database)\nSTOCK = {\"SKU-101\": {\"units\": 600, \"weekly_sales\": 470}, \"SKU-102\": {\"units\": 380, \"weekly_sales\": 260},\n         \"SKU-103\": {\"units\": 640, \"weekly_sales\": 15}, \"SKU-210\": {\"units\": 1100, \"weekly_sales\": 300}}\nCONTRACT = {\"max_increase_pct\": 3.0, \"min_notice_days\": 60}\n\n\n# Step 1: what kind of notice is it?\nclass NoticeType(BaseModel):\n    notice_type: Literal[\"delay\", \"price_change\", \"short_shipment\", \"substitution\", \"other\"] = Field(\n        description=\"delay = delivery date moved; price_change = cost price going up or down for the same product; \"\n                    \"short_shipment = fewer units shipped than ordered; substitution = product replaced by a \"\n                    \"different product or pack size, even if the price stays the same\")\n    sku: str = Field(description=\"SKU code, e.g. SKU-101\")\n\n\n# Step 2: a small schema per notice type (small models fill short, specific schemas far more reliably)\nclass Delay(BaseModel):\n    original_date: str = Field(description=\"Original delivery date, e.g. 14 Oct 2026\")\n    new_date: str = Field(description=\"New delivery date, e.g. 21 Oct 2026\")\n\n\nclass PriceChange(BaseModel):\n    old_cost: float = Field(description=\"Current cost price per unit\")\n    new_cost: float = Field(description=\"New cost price per unit\")\n    effective_date: str = Field(description=\"Date the new price starts, e.g. 1 Nov 2026\")\n\n\nclass ShortShipment(BaseModel):\n    qty_ordered: int = Field(description=\"Units ordered on the purchase order\")\n    qty_shipped: int = Field(description=\"Units the supplier is shipping now\")\n\n\nclass Substitution(BaseModel):\n    old_pack_size: float = Field(description=\"Old pack size in g or ml, e.g. 500\")\n    new_pack_size: float = Field(description=\"New pack size in g or ml, e.g. 450\")\n\n\nDETAILS = {\"delay\": Delay, \"price_change\": PriceChange, \"short_shipment\": ShortShipment, \"substitution\": Substitution}\n\n\ndef days_until(text: str | None) -> int | None:\n    \"\"\"Days from today to the date found in the model's text ('2026-10-21...', '21 Oct 2026', '21 October 2026').\"\"\"\n    if m := re.search(r\"\\d{4}-\\d{2}-\\d{2}\", text or \"\"):\n        return (date.fromisoformat(m.group()) - TODAY).days\n    if m := re.search(r\"(\\d{1,2}) ([A-Za-z]{3})[a-z]* (\\d{4})\", text or \"\"):\n        return (datetime.strptime(\" \".join(m.groups()), \"%d %b %Y\").date() - TODAY).days\n    return None\n\n\ndef check(supplier: str, kind: str, sku: str, d: dict) -> dict:\n    \"\"\"Business impact of one notice, from stock cover and contract terms.\"\"\"\n    s = STOCK.get(sku, {\"units\": 0, \"weekly_sales\": 0})\n    cover_days = round(s[\"units\"] / s[\"weekly_sales\"] * 7, 1) if s[\"weekly_sales\"] else None\n    out = {\"supplier\": supplier, \"sku\": sku, \"type\": kind, \"days_of_stock_cover\": cover_days}\n    if kind == \"delay\" and (days := days_until(d[\"new_date\"])) is not None:\n        out |= {\"delivery_in_days\": days, \"stockout_risk\": cover_days is not None and days > cover_days,\n                \"days_without_stock\": max(round(days - cover_days), 0) if cover_days else None}\n    elif kind == \"price_change\":\n        pct = (d[\"new_cost\"] / d[\"old_cost\"] - 1) * 100\n        notice = days_until(d[\"effective_date\"])\n        short_notice = notice is not None and notice < CONTRACT[\"min_notice_days\"]\n        out |= {\"increase_pct\": round(pct, 1), \"notice_days\": notice,\n                \"breaches_contract\": pct > CONTRACT[\"max_increase_pct\"] or (pct > 0 and short_notice),\n                \"contract_terms\": f\"max {CONTRACT['max_increase_pct']}% increase, {CONTRACT['min_notice_days']} days notice\",\n                \"extra_cost_per_year\": round((d[\"new_cost\"] - d[\"old_cost\"]) * s[\"weekly_sales\"] * 52)}\n    elif kind == \"short_shipment\":\n        out |= {\"shortfall_units\": d[\"qty_ordered\"] - d[\"qty_shipped\"],\n                \"stockout_risk\": cover_days is not None and cover_days < 21,   # balance arrives in ~3 weeks\n                \"overstocked_so_cancel_balance\": cover_days is not None and cover_days > 120}\n    elif kind == \"substitution\":\n        out |= {\"pack_change\": f\"{d['old_pack_size']:g} -> {d['new_pack_size']:g}\",\n                \"hidden_cost_increase_pct\": round((d[\"old_pack_size\"] / d[\"new_pack_size\"] - 1) * 100, 1),\n                \"needs\": \"new barcode, product listing and shelf-edge unit price\"}\n    return out\n\n\nCLASSIFY = (\"Classify this supplier email and find the SKU it is about. A new pack size or replacement product is \"\n            \"a substitution, not a price change.\")\nSYSTEM = (\n    \"You are a retail buyer's assistant. From the checked supplier notices, write a prioritised action list: \"\n    \"stock-out risks first, then contract breaches, then everything else. For each: what happened, the impact \"\n    \"(quote the numbers given, never recalculate) and the action (e.g. expedite or find another supplier, push \"\n    \"back on the price citing the contract terms, cancel the balance of an order we don't need, update listings \"\n    \"and shelf labels). Under 250 words.\"\n)\n\n\ndef main():\n    banner(\"Retail 09 - Supplier Notice Extractor (LangChain structured output)\")\n    checks = []\n    for supplier, text in EMAILS:\n        email = f\"From: {supplier}\\n\\n{text}\"\n        head = run_structured(CLASSIFY, email, NoticeType)\n        details = {}\n        if head.notice_type in DETAILS:\n            details = run_structured(\"Extract these details from the supplier email.\", email,\n                                     DETAILS[head.notice_type]).model_dump()\n        section(supplier, json.dumps({**head.model_dump(), **details}, indent=2))\n        checks.append(check(supplier, head.notice_type, head.sku, details))\n    section(\"Validation\", json.dumps(checks, indent=2))\n    section(\"Action list\", run_chain(SYSTEM, \"Checked notices:\\n{c}\", c=json.dumps(checks, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Supplier emails\"] --> EX[\"🧾 LangChain structured output<br/>text → Pydantic schema\"]\n    EX -->|\"validated fields\"| PY[\"🐍 Python<br/>Check stock cover, orders & contract terms\"]\n    PY --> OUT[\"📝 Buyer's action list\"]\n    EX <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class EX ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 19, "turns": [{"ask": "We've had four supplier emails this morning. What do they mean for our stock and costs?", "steps": [{"icon": "🧾", "label": "Extracted · Nordic Dairy Co", "body": "{\n  \"notice_type\": \"delay\",\n  \"sku\": \"SKU-101\",\n  \"original_date\": \"14 Oct 2026\",\n  \"new_date\": \"21 Oct 2026 product_name: Organic oat milk 1L (SKU-101), quantity: 1,200 units, supplier: Nordic Dairy Co\"\n}", "code": true}, {"icon": "🧾", "label": "Extracted · SunShield Labs", "body": "{\n  \"notice_type\": \"price_change\",\n  \"sku\": \"SKU-102\",\n  \"old_cost\": 4.8,\n  \"new_cost\": 5.3,\n  \"effective_date\": \"2026-11-01T00:00:00Z+00:00\"\n}", "code": true}, {"icon": "🧾", "label": "Extracted · WoolWorks Ltd", "body": "{\n  \"notice_type\": \"short_shipment\",\n  \"sku\": \"SKU-103\",\n  \"qty_ordered\": 200,\n  \"qty_shipped\": 120\n}", "code": true}, {"icon": "🧾", "label": "Extracted · PastaPrima", "body": "{\n  \"notice_type\": \"substitution\",\n  \"sku\": \"SKU-210\",\n  \"old_pack_size\": 500.0,\n  \"new_pack_size\": 450.0\n}", "code": true}, {"icon": "🐍", "label": "Python · Validation", "body": "[\n  {\n    \"supplier\": \"Nordic Dairy Co\",\n    \"sku\": \"SKU-101\",\n    \"type\": \"delay\",\n    \"days_of_stock_cover\": 8.9,\n    \"delivery_in_days\": 11,\n    \"stockout_risk\": true,\n    \"days_without_stock\": 2\n  },\n  {\n    \"supplier\": \"SunShield Labs\",\n    \"sku\": \"SKU-102\",\n    \"type\": \"price_change\",\n    \"days_of_stock_cover\": 10.2,\n    \"increase_pct\": 10.4,\n    \"notice_days\": 22,\n    \"breaches_contract\": true,\n    \"contract_terms\": \"max 3.0% increase, 60 days notice\",\n    \"extra_cost_per_year\": 6760\n  },\n  {\n    \"supplier\": \"WoolWorks Ltd\",\n    \"sku\": \"SKU-103\",\n    \"type\": \"short_shipment\",\n    \"days_of_stock_cover\": 298.7,\n    \"shortfall_units\": 80,\n    \"stockout_risk\": false,\n    \"overstocked_so_cancel_balance\": true\n  },\n  {\n    \"supplier\": \"PastaPrima\",\n    \"sku\": \"SKU-210\",\n    \"type\": \"substitution\",\n    \"days_of_stock_cover\": 25.7,\n    \"pack_change\": \"500 -> 450\",\n    \"hidden_cost_increase_pct\": 11.1,\n    \"needs\": \"new barcode, product listing and shelf-edge unit price\"\n  }\n]", "code": true}], "answer": "**Action List:**\n\n1. **Nordic Dairy Co (SKU-101) - Stock-out Risk**\n   - **What Happened:** Expected delivery in 11 days, but only 8.9 days of stock cover.\n   - **Impact:** 2 days without stock.\n   - **Action:** Expedite the order to ensure stock is replenished within 2 days.\n\n2. **SunShield Labs (SKU-102) - Contract Breach**\n   - **What Happened:** Price increase of 10.4%, exceeding the contract terms of a maximum 3.0% increase with 60 days notice.\n   - **Impact:** Additional cost of $6,760 per year.\n   - **Action:** Push back on the price increase citing the contract terms. Negotiate a reduction or seek alternative suppliers.\n\n3. **WoolWorks Ltd (SKU-103) - Short Shipment**\n   - **What Happened:** Short shipment of 80 units, with 298.7 days of stock cover.\n   - **Impact:** No immediate stockout risk.\n   - **Action:** Cancel the balance of the order and update inventory records to reflect the shortfall.\n\n4. **PastaPrima (SKU-210) - Substitution**\n   - **What Happened:** Pack size changed from 500 to 450, with a hidden cost increase of 11.1%.\n   - **Impact:** Requires new barcode, product listing, and shelf-edge unit price updates.\n   - **Action:** Update product listings, shelf labels, and barcodes to reflect the new pack size and price."}]}}, {"slug": "10_customer_segmentation", "title": "Customer Segmentation & Campaign Planner", "category": "customer", "framework": "LangChain", "pattern": "Chain", "description": "Groups loyalty customers into segments and plans a marketing campaign for each.", "how": "Python scores customers on recency, frequency and spend (RFM), sizes each segment's share of revenue and sets its discount limit; an LLM chain writes the offer, channel and message for every segment within those limits.", "today": "The CRM team groups loyalty-card customers by how they shop and sends each group a different campaign.", "who": "CRM and loyalty marketing teams.", "why": "Sending the same discount to everyone wastes money on customers who would buy anyway and does too little for those about to leave.", "terms": ["RFM", "Customer segment", "Win-back campaign", "Control group"], "code": "\"\"\"Customer Segmentation & Campaign Planner — LangChain chain + Ollama.\n\nPython segments loyalty customers by recency, frequency and spend (RFM) and sets each segment's discount\nlimit; the LLM writes a campaign plan for every segment within those limits.\n\nRun:  python 02_retail/10_customer_segmentation/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\n# Loyalty members, last 12 months: (customer ID, days since last order, orders, spend). IDs only, no personal data.\nCUSTOMERS = [\n    (\"CU-01\", 5, 18, 2400), (\"CU-02\", 12, 14, 1900), (\"CU-03\", 25, 11, 1300), (\"CU-04\", 40, 7, 820),\n    (\"CU-05\", 55, 6, 640), (\"CU-06\", 18, 8, 900), (\"CU-07\", 8, 1, 60), (\"CU-08\", 20, 2, 140),\n    (\"CU-09\", 3, 1, 45), (\"CU-10\", 95, 9, 1100), (\"CU-11\", 120, 6, 700), (\"CU-12\", 150, 12, 1600),\n    (\"CU-13\", 240, 3, 210), (\"CU-14\", 310, 1, 35), (\"CU-15\", 200, 4, 300), (\"CU-16\", 75, 3, 260),\n]\n# Marketing guardrails per segment: the most we will discount, and why\nMAX_DISCOUNT = {\"Champions\": (0, \"they buy anyway: reward with early access, not discounts\"),\n                \"Loyal\": (5, \"nudge toward Champions with bonus points\"),\n                \"New\": (10, \"win the second purchase\"),\n                \"At risk\": (15, \"win back valuable customers before they lapse\"),\n                \"Hibernating\": (0, \"low-cost email only; don't spend on customers unlikely to return\")}\n\n\ndef segment(days: int, orders: int) -> str:\n    if days <= 30 and orders >= 10:\n        return \"Champions\"\n    if days <= 60 and orders >= 5:\n        return \"Loyal\"\n    if days <= 30 and orders <= 2:\n        return \"New\"\n    if days <= 180 and orders >= 5:\n        return \"At risk\"\n    return \"Hibernating\"\n\n\ndef profile() -> list[dict]:\n    total = sum(c[3] for c in CUSTOMERS)\n    groups: dict[str, list] = {name: [] for name in MAX_DISCOUNT}\n    for cid, days, orders, spend in CUSTOMERS:\n        groups[segment(days, orders)].append((cid, days, orders, spend))\n    rows = []\n    for name, members in groups.items():\n        n = len(members)\n        rows.append({\"segment\": name, \"customers\": n, \"share_of_revenue_pct\": round(sum(m[3] for m in members) / total * 100),\n                     \"avg_spend\": round(sum(m[3] for m in members) / n) if n else 0,\n                     \"avg_orders\": round(sum(m[2] for m in members) / n, 1) if n else 0,\n                     \"avg_days_since_last_order\": round(sum(m[1] for m in members) / n) if n else 0,\n                     \"max_discount_pct\": MAX_DISCOUNT[name][0], \"guardrail\": MAX_DISCOUNT[name][1],\n                     \"customer_ids\": [m[0] for m in members]})\n    return rows\n\n\nSYSTEM = (\n    \"You are a retail CRM marketing manager. For each customer segment write a campaign: goal, offer, channel \"\n    \"(email, app push, SMS or direct mail) and a one-line message idea. Never exceed max_discount_pct and follow the \"\n    \"guardrail. Quote the figures given; never recalculate. Start with the segment that matters most for revenue \"\n    \"next quarter and say why. End with how to measure success (e.g. a control group). Under 300 words.\"\n)\n\n\ndef main():\n    banner(\"Retail 10 - Customer Segmentation & Campaign Planner (LangChain chain)\")\n    rows = profile()\n    section(\"RFM segments\", json.dumps(rows, indent=2))\n    section(\"Campaign plan\", run_chain(SYSTEM, \"Segments:\\n{s}\", s=json.dumps(rows, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Loyalty customer history\"] --> PY[\"🐍 Python<br/>RFM segments + discount limits\"]\n    PY -->|\"✅ decision & numbers\"| CH[\"🔗 LangChain prompt<br/>explain, don't decide\"]\n    CH <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    CH --> OUT[\"📝 Campaign plan per segment\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class CH ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 15, "turns": [{"ask": "Who are our customer segments, and what campaign should each one get?", "steps": [{"icon": "🐍", "label": "Python · RFM segments", "body": "[\n  {\n    \"segment\": \"Champions\",\n    \"customers\": 3,\n    \"share_of_revenue_pct\": 45,\n    \"avg_spend\": 1867,\n    \"avg_orders\": 14.3,\n    \"avg_days_since_last_order\": 14,\n    \"max_discount_pct\": 0,\n    \"guardrail\": \"they buy anyway: reward with early access, not discounts\",\n    \"customer_ids\": [\n      \"CU-01\",\n      \"CU-02\",\n      \"CU-03\"\n    ]\n  },\n  {\n    \"segment\": \"Loyal\",\n    \"customers\": 3,\n    \"share_of_revenue_pct\": 19,\n    \"avg_spend\": 787,\n    \"avg_orders\": 7.0,\n    \"avg_days_since_last_order\": 38,\n    \"max_discount_pct\": 5,\n    \"guardrail\": \"nudge toward Champions with bonus points\",\n    \"customer_ids\": [\n      \"CU-04\",\n      \"CU-05\",\n      \"CU-06\"\n    ]\n  },\n  {\n    \"segment\": \"New\",\n    \"customers\": 3,\n    \"share_of_revenue_pct\": 2,\n    \"avg_spend\": 82,\n    \"avg_orders\": 1.3,\n    \"avg_days_since_last_order\": 10,\n    \"max_discount_pct\": 10,\n    \"guardrail\": \"win the second purchase\",\n    \"customer_ids\": [\n      \"CU-07\",\n      \"CU-08\",\n      \"CU-09\"\n    ]\n  },\n  {\n    \"segment\": \"At risk\",\n    \"customers\": 3,\n    \"share_of_revenue_pct\": 27,\n    \"avg_spend\": 1133,\n    \"avg_orders\": 9.0,\n    \"avg_days_since_last_order\": 122,\n    \"max_discount_pct\": 15,\n    \"guardrail\": \"win back valuable customers before they lapse\",\n    \"customer_ids\": [\n      \"CU-10\",\n      \"CU-11\",\n      \"CU-12\"\n    ]\n  },\n  {\n    \"segment\": \"Hibernating\",\n    \"customers\": 4,\n    \"share_of_revenue_pct\": 6,\n    \"avg_spend\": 201,\n    \"avg_orders\": 2.8,\n    \"avg_days_since_last_order\": 206,\n    \"max_discount_pct\": 0,\n    \"guardrail\": \"low-cost email only; don't spend on customers unlikely to return\",\n    \"customer_ids\": [\n      \"CU-13\",\n      \"CU-14\",\n      \"CU-15\",\n      \"CU-16\"\n    ]\n  }\n]", "code": true}], "answer": "### Segment: At Risk\n**Goal:** To re-engage customers who are at risk of lapsing by offering a compelling incentive to return.\n\n**Offer:** 15% off their next purchase.\n\n**Channel:** Email\n\n**One-Line Message Idea:** \"Don't let us go cold! Get 15% off your next order and stay warm with us.\"\n\n**Why:** This segment represents 27% of the revenue and has a high average spend, making them valuable to retain. Offering a significant discount can incentivize them to make another purchase before they lapse.\n\n### Segment: Champions\n**Goal:** To reward loyal customers with early access to new products or services.\n\n**Offer:** Early access to a new product launch.\n\n**Channel:** App Push Notification\n\n**One-Line Message Idea:** \"Be the first to try our new [product name]! Get early access now.\"\n\n**Why:** Champions already buy frequently and in high volumes. Rewarding them with exclusive access can further cement their loyalty and encourage repeat purchases.\n\n### Segment: Loyal\n**Goal:** To nudge loyal customers toward the Champions tier by offering bonus points.\n\n**Offer:** 5% bonus points on their next purchase.\n\n**Channel:** App Push Notification\n\n**One-Line Message Idea:** \"Stay loyal and earn more! Get 5% bonus points on your next order.\"\n\n**Why:** This segment has a 19% share of revenue and is close to the Champions tier. Offering bonus points can motivate them to increase their spend and frequency, moving them closer to the Champions level.\n\n### Segment: New\n**Goal:** To incentivize new customers to make a second purchase.\n\n**Offer:** 10% off their second purchase.\n\n**Channel:** Email\n\n**One-Line Message Idea:** \"Love what you bought? Get 10% off your second purchase!\"\n\n**Why:** This segment has a low share of revenue but represents potential future high-value customers. Encouraging them to make a second purchase can significantly increase their lifetime value.\n\n### Segment: Hibernating\n**Goal:** To maintain low-cost engagement with customers unlikely to return.\n\n**Offer:** None; focus on re-engagement through content.\n\n**Channel:** Email\n\n**One-Line Message Idea:** \"We miss you! Stay connected with our latest news and offers.\"\n\n**Why:** This segment has a low share of revenue and is unlikely to return. The focus is on maintaining a low-cost engagement strategy to keep the possibility of future purchases open.\n\n### Measuring Success:\n- **At Risk:** Track the number of re-engaged customers and their subsequent purchase behavior.\n- **Champions:** Monitor the frequency and value of their purchases post-campaign.\n- **Loyal:** Measure the increase in spend and frequency among these customers.\n- **New:** Track the conversion rate of new customers to repeat customers.\n- **Hibernating:** Assess the engagement level and any potential future purchases.\n\nBy implementing these targeted campaigns, we can effectively manage and grow our customer base, ensuring the highest return on investment."}]}}]}, {"folder": "03_insurance", "name": "Insurance", "icon": "🛡️", "tagline": "Property & casualty, motor and home insurers", "description": "AI agents for claims handling, fraud detection, coverage questions and pricing.", "industry_101": "**How an insurer makes money:** customers pay a *premium* to transfer a risk (a car crash, a burglary) to the\ninsurer. The insurer pools many customers' premiums and pays the *claims* of the few who suffer a loss. Profit comes\nfrom pricing risk correctly (premiums > claims + costs) and from investing premiums before claims are paid.\n\n**What makes it hard:**\n1. **Pricing (underwriting):** charge each customer the right premium for their risk. Too low loses money; too high loses customers.\n2. **Claims:** pay genuine claims quickly and fairly, while catching fraud, which adds costs for every honest customer.\n3. **Clarity:** policies are long legal documents. Customers need clear answers about what they are covered for.\n", "categories": {"claims": "🧾 Claims & Fraud", "policy": "🙋 Policy & Customer Service", "underwriting": "📝 Underwriting & Pricing"}, "areas": [["claims", "Claims & Fraud", "Handles losses reported by customers, pays valid claims and investigates suspicious ones."], ["policy", "Policy & Customer Service", "Answers customers' questions about their cover and handles policy changes."], ["underwriting", "Underwriting & Pricing", "Decides which risks to accept and at what premium."]], "glossary": {"Premium": ["Basics", "The price a customer pays for an insurance policy, usually yearly or monthly."], "Policy wording / schedule": ["Basics", "The wording is the full contract (what is and isn't covered); the schedule lists this customer's chosen covers and limits."], "Excess (deductible)": ["Basics", "The amount the customer pays towards each claim before the insurer pays the rest."], "Sum insured": ["Basics", "The maximum the insurer will pay for a policy or item."], "Exclusion": ["Basics", "Something the policy specifically does not cover, e.g. wear and tear."], "Add-on cover": ["Basics", "Optional extra cover bought on top of the core policy, e.g. accidental damage."], "Claim": ["Claims", "A customer's request for payment after a loss covered by the policy."], "FNOL": ["Claims", "First Notice of Loss: the first report of a claim to the insurer."], "Claims triage": ["Claims", "Sorting new claims by complexity and risk: fast-track simple ones, send complex ones to experts."], "Adjuster": ["Claims", "The claims professional who assesses a claim and decides what the insurer pays."], "Insurance fraud": ["Claims", "Exaggerating or inventing a claim. Fraud costs insurers billions, raising premiums for everyone."], "Red flag": ["Claims", "A warning sign of possible fraud, e.g. a claim soon after the policy started or no proof of ownership."], "SIU": ["Claims", "Special Investigations Unit: the team that investigates suspected fraud."], "Subrogation": ["Claims", "Recovering what the insurer paid from a third party who caused the loss, e.g. the at-fault driver's insurer."], "Underwriting": ["Pricing", "Assessing a risk and deciding whether to insure it and on what terms."], "Rating factor": ["Pricing", "A characteristic that changes the premium, e.g. driver age, car group or postcode."], "Rating engine": ["Pricing", "The system that calculates a premium from a base rate and rating factors."], "Vehicle (insurance) group": ["Pricing", "A 1-50 scale ranking cars by repair cost, performance and security. Higher groups cost more to insure."], "Voluntary excess": ["Pricing", "An extra excess the customer chooses to pay on claims in exchange for a lower premium."]}, "use_cases": [{"slug": "01_claims_triage_fraud", "title": "Claims Triage & Fraud Detection", "category": "claims", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Triages new claims into fast-track, adjuster review or fraud investigation, and spots recovery opportunities.", "how": "Python applies red-flag rules (new policy, late reporting, near sum insured, prior claims) and decides the handling (pay, adjuster review, SIU referral), so no honest customer is flagged by the AI; a Claims Adjuster agent assesses each claim and an SIU Investigator agent writes evidence requests, customer messages and recovery actions.", "today": "When a customer reports a loss, claims handlers decide how to handle it: pay simple claims fast, send complex ones to an adjuster, and refer suspicious ones to the fraud team.", "who": "Claims handlers, adjusters and the Special Investigations Unit (SIU).", "why": "Honest customers expect quick payment, but fraud is expensive. Handlers must spot red flags without treating genuine customers as suspects, and must not miss chances to recover costs from at-fault third parties.", "terms": ["FNOL", "Claims triage", "Adjuster", "Insurance fraud", "Red flag", "SIU", "Subrogation", "Sum insured"], "code": "\"\"\"Claims Triage & Fraud Detection — CrewAI + Ollama.\n\nPython applies triage and fraud red-flag rules (auditable); agents assess and decide.\n\nRun:  python 03_insurance/01_claims_triage_fraud/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom datetime import date\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nCLAIMS = [\n    {\"id\": \"CLM-501\", \"type\": \"Home - escape of water\", \"policy_start\": \"2021-03-01\", \"loss_date\": \"2026-09-28\",\n     \"reported\": \"2026-09-29\", \"amount\": 1_850, \"sum_insured\": 250_000, \"prior_claims_3y\": 0,\n     \"description\": \"Washing machine hose burst, kitchen floor and cabinet plinths damaged. Plumber invoice attached.\"},\n    {\"id\": \"CLM-502\", \"type\": \"Home - theft\", \"policy_start\": \"2026-08-20\", \"loss_date\": \"2026-09-12\",\n     \"reported\": \"2026-10-03\", \"amount\": 14_200, \"sum_insured\": 15_000, \"prior_claims_3y\": 2,\n     \"description\": \"Burglary while on holiday. Laptop, two watches and jewellery taken. No receipts, no sign of forced entry.\"},\n    {\"id\": \"CLM-503\", \"type\": \"Motor - collision\", \"policy_start\": \"2024-06-10\", \"loss_date\": \"2026-10-01\",\n     \"reported\": \"2026-10-01\", \"amount\": 6_400, \"sum_insured\": 18_000, \"prior_claims_3y\": 1,\n     \"description\": \"Rear-ended at traffic lights. Third party admitted fault at scene; dashcam footage available.\"},\n]\n\n\ndef triage(c: dict) -> dict:\n    flags = []\n    policy_age = (date.fromisoformat(c[\"loss_date\"]) - date.fromisoformat(c[\"policy_start\"])).days\n    delay = (date.fromisoformat(c[\"reported\"]) - date.fromisoformat(c[\"loss_date\"])).days\n    if policy_age < 60: flags.append(f\"Loss {policy_age} days after policy start\")\n    if delay > 14: flags.append(f\"Reported {delay} days after loss\")\n    if c[\"amount\"] > 0.8 * c[\"sum_insured\"]: flags.append(\"Claim close to sum insured\")\n    if c[\"prior_claims_3y\"] >= 2: flags.append(f\"{c['prior_claims_3y']} prior claims in 3 years\")\n    if \"no receipts\" in c[\"description\"].lower(): flags.append(\"No proof of ownership\")\n    if \"no sign of forced entry\" in c[\"description\"].lower(): flags.append(\"No forced entry on a burglary claim\")\n    fraud_score = min(len(flags) * 20, 100)\n    if fraud_score >= 60:\n        route = \"SIU referral\"\n    elif c[\"amount\"] < 2_500 and not flags:\n        route = \"Fast-track payment\"\n    else:\n        route = \"Adjuster review\"\n    recovery = \"third party admitted fault\" in c[\"description\"].lower()\n    handling = {\"Fast-track payment\": \"PAY\", \"Adjuster review\": \"ADJUSTER REVIEW, THEN PAY IF VALID\",\n                \"SIU referral\": \"REFER TO SIU\"}[route]\n    return {\"id\": c[\"id\"], \"fraud_score\": fraud_score, \"red_flags\": flags or [\"none\"], \"route\": route,\n            \"final_handling\": handling, \"subrogation_opportunity\": recovery}\n\n\ndef main():\n    banner(\"Insurance 01 - Claims Triage & Fraud Detection (CrewAI)\")\n    results = [triage(c) for c in CLAIMS]\n    section(\"Triage (rules)\", json.dumps(results, indent=2))\n\n    adjuster = make_agent(\"Claims Adjuster\", \"Assess each claim's validity, coverage questions and next steps\",\n                          \"Experienced property and motor adjuster who treats honest customers fairly and quickly.\")\n    siu = make_agent(\"SIU Investigator\", \"Decide the handling of each claim, especially suspected fraud\",\n                     \"Special Investigations Unit lead; you never accuse customers, you gather evidence proportionately.\")\n    t1 = make_task(\"Claims:\\n{claims}\\n\\nRule-based triage (final, do not change the scores or routes):\\n{triage}\\n\\n\"\n                   \"For each claim: summarise it, note coverage questions and the evidence needed.\",\n                   \"Per-claim assessment.\", adjuster)\n    t2 = make_task(\"Triage (exact; final_handling is already decided by the rules and must be copied unchanged):\\n\"\n                   \"{triage}\\n\\nFor each claim state its final_handling, then the evidence to request, a polite customer \"\n                   \"message (never mention fraud or suspicion), and a recovery action against the third party only \"\n                   \"where subrogation_opportunity is true. Claims with no red flags must not be treated as suspicious.\",\n                   \"Per claim: final_handling (copied), evidence list, customer message, recovery action.\", siu, context=[t1])\n    section(\"Claims decisions\", run_crew([adjuster, siu], [t1, t2], {\"claims\": json.dumps(CLAIMS, indent=2),\n                                                                     \"triage\": json.dumps(results, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 New claims\"] --> PY[\"🐍 Python<br/>Red-flag rules → pay / adjuster / SIU\"]\n    subgraph CREW[\"🤖 CrewAI crew: agents work in turn\"]\n        A1[\"🧑‍💼 Claims Adjuster\"]\n        A2[\"🕵️ SIU Investigator\"]\n        A1 -->|\"hands over\"| A2\n    end\n    style CREW fill:none,stroke:#7c3aed,stroke-dasharray:5 4\n    PY -->|\"✅ facts\"| A1\n    CREW <-.->|\"💬 prompts\"| LLM([\"🦙 Ollama\"])\n    A2 --> OUT[\"📝 Claim decisions + customer messages\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class A1,A2 ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 30, "turns": [{"ask": "Triage this morning's new claims. Which can we pay, and which need an adjuster or a
