  .plot .grid-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); pointer-events: none; }
  .bar { position: relative; height: 100%; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font: inherit; color: var(--text); }
  .bar .fill { width: 100%; max-width: 56px; background: var(--accent); opacity: .45; border-radius: 4px 4px 0 0; transition: opacity .12s; }

  .bar:hover .tip, .bar:focus-visible .tip { opacity: 1; }
  .bar:hover .val, .bar:focus-visible .val { opacity: 0; }
  .plot .bar:nth-of-type(-n+2) .tip { left: 0; transform: none; }
  .plot .bar:nth-last-of-type(-n+2) .tip { left: auto; right: 0; transform: none; }
  .setup { overflow-wrap: anywhere; }
  .steptable td:nth-child(3) { white-space: nowrap; }

  footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; padding: 18px 0 30px; }

ocesses, people or systems fail (*operational risk*).\n2. **Heavily regulated.** Banks hold other people's money and are central to the economy, so regulators set rules on capital, liquidity, fighting financial crime and treating customers fairly. Much of a bank's work (and many use cases here) exists to meet these rules.\n", "categories": {"credit": "🏦 Credit & Lending", "fincrime": "🕵️ Financial Crime & Compliance", "regulatory": "📜 Regulatory & Risk Reporting", "wealth": "📈 Wealth & Investment Management", "retail": "🙋 Retail Banking & Customer Experience", "ops": "💱 Treasury, Payments & Operations", "enterprise": "🏢 Enterprise Analytics & Audit"}, "areas": [["credit", "Lending (Credit)", "The bank's main business: it takes deposits and lends them out at a higher interest rate. The difference is its profit. The skill is lending to people and businesses who will pay back, so credit teams assess, approve, monitor and collect loans."], ["fincrime", "Financial Crime Compliance", "Banks are legally required to stop criminals using them to launder money, finance terrorism, evade sanctions or commit fraud. They must know their customers, monitor transactions and report suspicions. Failures lead to multi-billion fines."], ["regulatory", "Regulation, Risk & Finance", "Because bank failures hurt everyone, regulators require banks to hold enough capital (to absorb losses) and liquidity (to pay what is due), provision for expected loan losses, validate their models, and report regularly. Risk and Finance teams run this."], ["wealth", "Wealth & Investment Management", "Fee-earning advice and investment services: understanding clients' goals and risk appetite, building portfolios and making sure every recommendation is suitable."], ["retail", "Retail Banking & Customer Experience", "Day-to-day banking for individuals: accounts, cards, loans and support through branches, apps and contact centres. Here the focus is service, fair treatment of customers and growing the relationship."], ["ops", "Treasury, Payments & Operations", "The 'plumbing': moving money domestically and internationally, trade finance for importers and exporters, FX, cash management for companies, and back-office matching and checking that keeps everything accurate."], ["enterprise", "Analytics, Research & Audit", "Functions that analyse companies (for lending or investing), and internal audit and operational risk, which check that the bank's own controls work."]], "glossary": {"Credit risk": ["Lending & credit", "The risk that a borrower does not pay back what they owe. Managing it is the core skill of any lender."], "Underwriting": ["Lending & credit", "Checking a loan application against the bank's rules and deciding whether to lend, how much and at what price."], "DTI (Debt-to-Income)": ["Lending & credit", "Monthly debt payments divided by monthly income. A DTI of 40% means 40% of income already goes to repayments."], "LTI (Loan-to-Income)": ["Lending & credit", "Loan amount divided by annual income. Caps how big a loan is relative to what the borrower earns."], "LTV (Loan-to-Value)": ["Lending & credit", "Loan amount divided by the value of the property. 80% LTV means a 20% deposit; higher LTV means less cushion if prices fall."], "EMI": ["Lending & credit", "Equated Monthly Instalment: the fixed monthly repayment on a loan, covering interest and principal."], "Credit score / bureau score": ["Lending & credit", "A number (e.g. 300-900) from a credit bureau summarising a person's repayment history. Higher means lower risk."], "Risk grade": ["Lending & credit", "An internal rating (A, B, C...) that groups borrowers by riskiness and drives approval and pricing."], "Credit memo": ["Lending & credit", "The written paper a credit committee reads before approving a business loan: who the borrower is, the numbers, risks and recommendation."], "DSCR (Debt Service Coverage Ratio)": ["Lending & credit", "Cash profit (EBITDA) divided by loan repayments due. Below 1.0x the business cannot cover its debt from operations."], "Covenant": ["Lending & credit", "A promise in a loan agreement, e.g. 'keep debt below 3x EBITDA'. Breaking it lets the bank act early."], "Collateral": ["Lending & credit", "An asset the bank can take if the loan is not repaid, e.g. property or stock."], "Credit limit / utilisation": ["Lending & credit", "The maximum a customer can borrow on a card or line, and how much of it they are using (balance / limit)."], "DPD (Days Past Due)": ["Lending & credit", "How many days a payment is late. 30, 60 and 90 DPD are the standard warning milestones."], "Delinquency / NPA / NPL": ["Lending & credit", "A delinquent loan is behind on payments. After about 90 DPD it becomes a Non-Performing Asset / Loan."], "Collections": ["Lending & credit", "The team that contacts customers who have missed payments and agrees ways to pay, e.g. payment plans."], "Propensity to pay": ["Lending & credit", "A prediction of how likely a late customer is to pay, used to choose the right collection approach."], "Early Warning Signals (EWS)": ["Lending & credit", "Signs that a healthy borrower may get into trouble, spotted before they miss payments."], "SMA / watch-list": ["Lending & credit", "Special Mention Account / watch-list: loans showing stress that get closer monitoring."], "Pre-qualification": ["Lending & credit", "A quick, non-binding estimate of how much a customer could borrow, before a full application."], "AML (Anti-Money Laundering)": ["Financial crime", "Laws and controls that stop criminals disguising illegal money as legitimate. Banks must monitor and report suspicious activity."], "Money laundering stages": ["Financial crime", "Placement (getting cash into the system), layering (moving it to hide the trail), integration (using it as 'clean' money)."], "Structuring (smurfing)": ["Financial crime", "Splitting cash deposits into amounts just under a reporting threshold to avoid triggering a report. Itself an offence."], "CTR (Currency Transaction Report)": ["Financial crime", "A report banks file for large cash transactions (e.g. 10,000 or more)."], "SAR / STR": ["Financial crime", "Suspicious Activity (or Transaction) Report: what a bank files with the financial intelligence unit when it suspects money laundering."], "MLRO": ["Financial crime", "Money Laundering Reporting Officer: the senior person accountable for deciding whether to file SARs."], "Typology": ["Financial crime", "A known pattern of financial crime, e.g. structuring, mule accounts or trade-based laundering."], "KYC (Know Your Customer)": ["Financial crime", "Verifying who a customer is (ID, address) and understanding what they do, before and during the relationship."], "CDD / EDD": ["Financial crime", "Customer Due Diligence (standard checks) and Enhanced Due Diligence (deeper checks for high-risk customers, such as source of wealth)."], "PEP": ["Financial crime", "Politically Exposed Person: someone with a prominent public role (or their family/associates). Higher bribery and corruption risk, so EDD is required."], "Sanctions screening": ["Financial crime", "Checking customers and payments against government lists of banned people, companies and countries."], "False positive": ["Financial crime", "An alert that turns out to be innocent, e.g. a name that looks like a sanctioned person but is someone else. Usually most alerts are false positives."], "Adverse media": ["Financial crime", "Negative news linking a customer to crime (fraud, bribery, laundering). Checked during onboarding and reviews."], "Customer Risk Rating (CRR)": ["Financial crime", "A Low / Medium / High money-laundering risk score per customer that decides how much due diligence and monitoring they get."], "Money mule": ["Financial crime", "A person whose account is used to receive and quickly pass on stolen money, often recruited with 'easy money' offers."], "APP fraud": ["Financial crime", "Authorised Push Payment fraud: victims are tricked into sending money themselves, e.g. a fake investment."], "TBML (Trade-Based Money Laundering)": ["Financial crime", "Disguising criminal money as trade, e.g. invoicing goods at fake prices to move value across borders."], "Card fraud / CNP": ["Financial crime", "Unauthorised card use. Card-Not-Present (online/phone) fraud is the most common type."], "MCC": ["Financial crime", "Merchant Category Code: a 4-digit code describing what kind of business a card merchant is, e.g. 5411 grocery, 7995 gambling."], "Regulatory reporting": ["Regulation & risk", "Regular returns banks must send to their regulator (capital, liquidity, large exposures...). Errors can mean fines."], "Basel III": ["Regulation & risk", "The global rulebook for how much capital and liquidity banks must hold, set by the Basel Committee."], "Capital (CET1, Tier 1, Tier 2)": ["Regulation & risk", "The bank's own money that absorbs losses. CET1 (mostly shareholders' equity) is the highest-quality layer."], "RWA (Risk-Weighted Assets)": ["Regulation & risk", "Assets adjusted for risk: a government bond might count 0%, an unrated corporate loan 100%. Capital requirements are a % of RWA."], "Capital ratio": ["Regulation & risk", "Capital / RWA. E.g. a CET1 ratio of 12% vs a 7% minimum means 5 percentage points of headroom."], "Liquidity": ["Regulation & risk", "Having enough cash to pay what is due, even under stress. Banks can be solvent but still fail from lack of liquidity."], "LCR (Liquidity Coverage Ratio)": ["Regulation & risk", "High-quality liquid assets / expected net cash outflows over 30 days of stress. Must be at least 100%."], "NSFR (Net Stable Funding Ratio)": ["Regulation & risk", "Stable funding available / stable funding required over one year. Must be at least 100%."], "HQLA": ["Regulation & risk", "High-Quality Liquid Assets: cash and assets (like government bonds) that can be sold quickly without big losses."], "ALCO": ["Regulation & risk", "Asset-Liability Committee: senior managers who oversee the bank's liquidity, funding and interest-rate risk."], "Stress testing": ["Regulation & risk", "Simulating a severe recession (GDP down, unemployment up) to check the bank would still have enough capital."], "ICAAP": ["Regulation & risk", "Internal Capital Adequacy Assessment Process: the bank's own assessment of the capital it needs, reviewed by the regulator."], "IFRS 9": ["Regulation & risk", "The accounting standard that makes banks set aside provisions for expected (not just actual) loan losses."], "ECL (Expected Credit Loss)": ["Regulation & risk", "The loss a bank expects on a loan: PD x LGD x EAD. Booked as a provision in the accounts."], "PD / LGD / EAD": ["Regulation & risk", "Probability of Default, Loss Given Default (% lost if default happens) and Exposure at Default (amount owed)."], "IFRS 9 stages": ["Regulation & risk", "Stage 1 performing (12-month ECL), Stage 2 significant increase in credit risk (lifetime ECL), Stage 3 credit-impaired."], "SICR": ["Regulation & risk", "Significant Increase in Credit Risk since the loan was made. Moves a loan from Stage 1 to Stage 2."], "Model risk": ["Regulation & risk", "The risk of losses from a model that is wrong or misused. Regulators (e.g. SR 11-7) require independent model validation."], "Gini / KS / PSI": ["Regulation & risk", "Model metrics: Gini and KS measure how well a score separates good and bad customers; PSI measures how much the population has shifted."], "Regulatory circular": ["Regulation & risk", "A notice from a regulator introducing new rules that banks must implement by a deadline."], "Operational risk": ["Regulation & risk", "Losses from failed processes, people, systems or external events, e.g. IT outages, errors, fraud, floods."], "Basel event types": ["Regulation & risk", "The 7 standard categories of operational loss (internal fraud, external fraud, system failures, process errors...)."], "Internal audit": ["Regulation & risk", "The independent team that tests whether the bank's controls work and reports to the board's audit committee."], "Maker-checker": ["Regulation & risk", "A control where one person enters a transaction and a different person approves it (segregation of duties)."], "Wealth management": ["Wealth & investment", "Advice and investment services for individuals, from mass affluent to private banking clients."], "Asset allocation": ["Wealth & investment", "How a portfolio is split between asset classes (equity, bonds, gold, cash). The biggest driver of risk and return."], "Risk profile": ["Wealth & investment", "How much investment risk a client is willing and able to take, usually from a questionnaire."], "Suitability": ["Wealth & investment", "The rule that a recommended product must fit the client's risk profile, knowledge, goals and time horizon."], "Mis-selling": ["Wealth & investment", "Selling a product that is unsuitable or not properly explained. Leads to compensation and regulatory fines."], "Rebalancing": ["Wealth & investment", "Buying and selling to bring a portfolio back to its target allocation after markets move it."], "SIP": ["Wealth & investment", "Systematic Investment Plan: investing a fixed amount every month into a fund."], "Capital gains tax": ["Wealth & investment", "Tax on profit from selling an investment. Often lower for long-term holdings, so trade timing matters."], "ESG": ["Wealth & investment", "Environmental, Social and Governance factors used to screen investments for sustainability."], "Relationship Manager (RM)": ["Wealth & investment", "The banker who owns a client relationship and is their main point of contact."], "Retirement corpus": ["Wealth & investment", "The total savings needed at retirement to fund living costs for the rest of one's life."], "Retail banking": ["Retail & customer", "Banking for individuals: accounts, cards, loans, mortgages and savings."], "Customer complaint handling": ["Retail & customer", "Regulators set deadlines (e.g. resolve within 30 days) and require reporting of complaint trends."], "Vulnerable customer": ["Retail & customer", "Someone more likely to suffer harm (e.g. due to age, illness, bereavement). Banks must take extra care with them."], "Chargeback": ["Retail & customer", "Reversing a card payment through the card network (Visa/Mastercard) when a customer has a valid dispute."], "Reason code": ["Retail & customer", "The card network's code for why a chargeback is raised (fraud, goods not received...), each with its own evidence rules."], "Cross-sell / Next Best Offer": ["Retail & customer", "Offering an existing customer the product they most likely need next."], "Churn / attrition": ["Retail & customer", "Customers leaving the bank or moving their main banking elsewhere."], "50/30/20 rule": ["Retail & customer", "A budgeting rule: 50% of income on needs, 30% on wants, 20% on savings."], "Call quality assurance (QA)": ["Retail & customer", "Reviewing a sample of calls to check staff follow security, compliance and service standards."], "SWIFT / MT103": ["Payments & operations", "SWIFT is the network banks use for international payments; MT103 is the message format for a customer transfer."], "STP (Straight-Through Processing)": ["Payments & operations", "A payment that is processed end-to-end with no manual intervention. Failures need costly manual repair."], "BIC / IBAN / IFSC": ["Payments & operations", "Bank and account identifiers: BIC (bank code, 8 or 11 characters), IBAN (international account number with a checksum), IFSC (Indian branch code)."], "Charges code (OUR/SHA/BEN)": ["Payments & operations", "Who pays the transfer fees: OUR = sender, SHA = shared, BEN = beneficiary."], "Reconciliation": ["Payments & operations", "Matching the bank's internal ledger against external statements to make sure every entry agrees. Mismatches are 'breaks'."], "Nostro account": ["Payments & operations", "An account a bank holds with another bank in a foreign currency, used to settle payments."], "Trade finance": ["Payments & operations", "Bank services that help importers and exporters trade safely, e.g. Letters of Credit and guarantees."], "Letter of Credit (LC)": ["Payments & operations", "A bank's promise to pay an exporter if they present documents that exactly match the LC's terms."], "UCP 600": ["Payments & operations", "The international rules (from the ICC) that govern how Letters of Credit work and how documents are checked."], "Discrepancy": ["Payments & operations", "A mismatch between presented documents and LC terms. Any discrepancy lets the bank refuse to pay."], "Bill of Lading (B/L)": ["Payments & operations", "The shipping document issued by the carrier: a receipt for goods and proof of shipment. A 'clean' B/L has no damage notes."], "Incoterms (e.g. CIF)": ["Payments & operations", "Standard trade terms defining who pays for shipping and insurance. CIF = seller pays Cost, Insurance and Freight."], "Cash flow forecasting": ["Payments & operations", "Projecting future cash in and out (often 13 weeks) so a company can plan funding."], "Working capital": ["Payments & operations", "Money tied up in day-to-day operations (stock, receivables minus payables). Banks fund it with overdrafts and credit lines."], "FX exposure / hedging": ["Payments & operations", "Risk that currency moves change the home-currency value of foreign receipts or payments; hedging locks in a rate."], "FX forward": ["Payments & operations", "A contract to exchange currency at a fixed rate on a future date. Removes uncertainty for a known cash flow."], "GSTIN": ["Payments & operations", "India's 15-character Goods and Services Tax identification number for a business."], "Cheque truncation / OCR": ["Payments & operations", "Processing cheques from scanned images; OCR reads the printed and handwritten fields."], "Financial statements": ["Corporate finance", "Income statement (profit), balance sheet (what is owned and owed) and cash flow statement."], "EBITDA / EBIT": ["Corporate finance", "Earnings before interest, tax, depreciation and amortisation (EBITDA), or before interest and tax (EBIT): a measure of operating profit."], "Margins": ["Corporate finance", "Profit as a % of revenue (gross, operating, net). Falling margins signal pricing pressure or rising costs."], "Leverage (debt-to-equity)": ["Corporate finance", "How much a company relies on borrowing. Higher leverage means higher risk if earnings fall."], "Liquidity ratios (current ratio)": ["Corporate finance", "Current assets / current liabilities: can the company pay its bills due within a year?"], "Free cash flow": ["Corporate finance", "Operating cash flow minus capital expenditure: the cash really available to repay debt or pay dividends."], "NIM (Net Interest Margin)": ["Corporate finance", "A bank's interest income minus interest paid, as a % of assets. The core measure of lending profitability."], "Guidance": ["Corporate finance", "Management's forecast of future results. Investors watch closely for upgrades, downgrades or softer wording."]}, "use_cases": [{"slug": "01_credit_risk_assessment", "title": "Credit Risk Assessment Agent", "category": "credit", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Scores a retail loan applicant and writes a credit decision memo with risk grade and conditions.", "how": "Python computes DTI, LTI, PD-style score and policy breaches; a Credit Analyst agent interprets the numbers and a Chief Risk Officer agent issues approve / decline / refer with rationale.", "today": "When someone applies for a personal loan, the bank must decide: will this person pay us back? Credit analysts look at income, existing debts, credit bureau history and the bank's lending policy, then a more senior approver signs off.", "who": "Retail credit analysts and credit approvers (Risk department).", "why": "Thousands of applications arrive daily. Decisions must be fast, consistent and explainable to the customer and the regulator.", "terms": ["Credit risk", "DTI (Debt-to-Income)", "LTI (Loan-to-Income)", "EMI", "Credit score / bureau score", "Risk grade"], "code": "\"\"\"Credit Risk Assessment Agent — CrewAI + Ollama.\n\nPython computes the hard numbers (DTI, LTI, score, policy breaches) so they are\nauditable; two agents interpret them and issue a decision memo.\n\nRun:  python 01_banking/01_credit_risk_assessment/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nAPPLICANT = {\n    \"name\": \"Priya Sharma\",\n    \"age\": 34,\n    \"employment\": \"Salaried - IT services, 6 years\",\n    \"annual_income\": 1_800_000,\n    \"existing_monthly_emi\": 18_000,\n    \"requested_loan\": 1_200_000,\n    \"tenure_months\": 60,\n    \"interest_rate_pct\": 11.5,\n    \"credit_score\": 742,\n    \"delinquencies_24m\": 0,\n    \"credit_utilisation_pct\": 38,\n    \"purpose\": \"Home renovation\",\n}\n\nPOLICY = {\"max_dti_pct\": 50, \"max_lti\": 5, \"min_score\": 680, \"max_delinquencies\": 1}\n\n\ndef emi(principal: float, annual_rate_pct: float, months: int) -> float:\n    r = annual_rate_pct / 12 / 100\n    return principal * r * (1 + r) ** months / ((1 + r) ** months - 1)\n\n\ndef assess(a: dict) -> dict:\n    new_emi = emi(a[\"requested_loan\"], a[\"interest_rate_pct\"], a[\"tenure_months\"])\n    monthly_income = a[\"annual_income\"] / 12\n    dti = (a[\"existing_monthly_emi\"] + new_emi) / monthly_income * 100\n    lti = a[\"requested_loan\"] / a[\"annual_income\"]\n\n    # Simple, transparent scorecard (0-100). Replace with your PD model.\n    score = 50\n    score += (a[\"credit_score\"] - 650) / 5\n    score -= max(0, dti - 35) * 0.8\n    score -= a[\"delinquencies_24m\"] * 10\n    score -= max(0, a[\"credit_utilisation_pct\"] - 30) * 0.3\n    score = round(max(0, min(100, score)), 1)\n    grade = \"A\" if score >= 75 else \"B\" if score >= 60 else \"C\" if score >= 45 else \"D\"\n\n    breaches = []\n    if dti > POLICY[\"max_dti_pct\"]:\n        breaches.append(f\"DTI {dti:.1f}% > {POLICY['max_dti_pct']}%\")\n    if lti > POLICY[\"max_lti\"]:\n        breaches.append(f\"LTI {lti:.2f}x > {POLICY['max_lti']}x\")\n    if a[\"credit_score\"] < POLICY[\"min_score\"]:\n        breaches.append(f\"Bureau score {a['credit_score']} < {POLICY['min_score']}\")\n    if a[\"delinquencies_24m\"] > POLICY[\"max_delinquencies\"]:\n        breaches.append(\"Too many delinquencies in 24 months\")\n\n    def headroom(value: float, limit: float) -> str:\n        used = value / limit\n        return \"BREACH\" if used > 1 else \"NEAR LIMIT\" if used > 0.85 else \"WITHIN LIMIT (comfortable)\"\n\n    return {\n        \"policy_assessment\": {\n            \"dti\": f\"{dti:.1f}% vs max {POLICY['max_dti_pct']}% -> {headroom(dti, POLICY['max_dti_pct'])}\",\n            \"lti\": f\"{lti:.2f}x vs max {POLICY['max_lti']}x -> {headroom(lti, POLICY['max_lti'])}\",\n            \"credit_score\": f\"{a['credit_score']} vs min {POLICY['min_score']} -> \"\n                            f\"{'PASS' if a['credit_score'] >= POLICY['min_score'] else 'FAIL'}\",\n        },\n        \"requested_loan\": f\"{a['requested_loan']:,}\",  # formatted, so the LLM quotes it instead of misreading digits\n        \"new_emi\": round(new_emi),\n        \"dti_pct\": round(dti, 1),\n        \"lti\": round(lti, 2),\n        \"risk_score\": score,\n        \"risk_grade\": grade,\n        \"policy_breaches\": breaches or [\"None\"],\n    }\n\n\ndef main():\n    banner(\"01 - Credit Risk Assessment Agent (CrewAI)\")\n    metrics = assess(APPLICANT)\n    section(\"Computed metrics\", json.dumps(metrics, indent=2))\n\n    analyst = make_agent(\n        \"Retail Credit Analyst\",\n        \"Analyse applicant data and computed risk metrics objectively\",\n        \"10 years of retail lending experience; you explain risk drivers clearly and never invent data.\",\n    )\n    cro = make_agent(\n        \"Chief Risk Officer\",\n        \"Make a final, policy-compliant credit decision\",\n        \"You chair the credit committee and balance growth with prudent risk management.\",\n    )\n\n    analysis = make_task(\n        \"Applicant:\\n{applicant}\\n\\nComputed metrics:\\n{metrics}\\n\\nBank policy:\\n{policy}\\n\\n\"\n        \"Identify the key strengths, weaknesses and risk drivers of this application.\",\n        \"Bullet list of strengths, weaknesses and key risk drivers referencing the numbers.\",\n        analyst,\n    )\n    decision = make_task(\n        \"Using the analyst's review, issue a credit decision memo.\\n\\n\"\n        \"Exact computed metrics (quote these; never invent numbers):\\n{metrics}\\n\\n\"\n        \"Bank policy limits (compare each metric to its limit before judging it):\\n{policy}\",\n        \"Memo with: Decision (APPROVE / APPROVE WITH CONDITIONS / REFER / DECLINE), risk grade, \"\n        \"3-line rationale, conditions or covenants, and recommended pricing adjustment.\",\n        cro,\n        context=[analysis],\n    )\n\n    result = run_crew(\n        [analyst, cro],\n        [analysis, decision],\n        {\"applicant\": json.dumps(APPLICANT, indent=2), \"metrics\": json.dumps(metrics, indent=2),\n         \"policy\": json.dumps(POLICY, indent=2)},\n    )\n    section(\"Credit decision memo\", result)\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Loan application + lending policy\"] --> PY[\"🐍 Python<br/>DTI · LTI · risk score · policy breaches\"]\n    subgraph CREW[\"🤖 CrewAI crew: agents work in turn\"]\n        A1[\"🧑‍💼 Retail Credit Analyst\"]\n        A2[\"👔 Chief Risk Officer\"]\n        A1 -->|\"hands over\"| A2\n    end\n    style CREW fill:none,stroke:#7c3aed,stroke-dasharray:5 4\n    PY -->|\"✅ facts\"| A1\n    CREW <-.->|\"💬 prompts\"| LLM([\"🦙 Ollama\"])\n    A2 --> OUT[\"📝 Credit decision memo\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    cla ed loan amount of 1,200,000 is significant, which could be a financial burden if the applicant's income and expenses do not support it.\n\n**Key Risk Drivers:**\n- **High DTI and Proposed EMIs:** The DTI of 29.6% is within the limit but the proposed EMI of 26,391 is high, which could indicate potential strain on the applicant's finances.\n- **Significant Loan Request:** The large loan amount of 1,200,000 could pose a risk if the applicant's income and expenses do not adequately cover the monthly payments.\n- **Existing Monthly EMIs:** The applicant already has a monthly EMI of 18,000, which, combined with the proposed EMI, could lead to financial stress if the loan is approved.", "code": false}], "answer": "**Credit Decision Memo**\n\n**Decision:** APPROVE WITH CONDITIONS\n\n**Risk Grade:** B\n\n**Rationale:** The applicant's financial profile meets most of the bank's policy criteria, with a debt-to-income ratio (DTI) of 29.6% and a loan-to-income (LTI) ratio of 0.67x, both within the acceptable limits. The credit score of 742 also meets the minimum requirement. However, the proposed monthly EMI of 26,391 is relatively high, and the significant loan amount of 1,200,000 could pose a financial burden. The applicant already has an existing monthly EMI of 18,000, which could lead to financial strain if the loan is approved.\n\n**Conditions and Covenants:**\n1. **Debt Service Coverage Ratio (DSCR):** The applicant must maintain a DSCR of at least 1.2x to ensure that the monthly income is sufficient to cover the proposed EMI and existing EMIs.\n2. **Regular Income Verification:** The applicant must provide updated income statements every six months to ensure that the income remains stable and sufficient to cover the loan obligations.\n3. **Loan Utilization Monitoring:** The applicant must keep the loan utilization below 60% to avoid over-leveraging.\n\n**Recommended Pricing Adjustment:** Given the high proposed EMI and the significant loan amount, a higher interest rate o s\": 5, \"loan_type\": \"mortgage\"},\n    \"APP-1002\": {\"monthly_income\": 6000, \"monthly_debt\": 2600, \"loan_amount\": 285000,\n                 \"property_value\": 300000, \"credit_score\": 655, \"employment_years\": 1, \"loan_type\": \"mortgage\"},\n}\n\nPOLICY = {\"max_dti\": 0.43, \"max_ltv\": 0.80, \"min_score\": 680, \"min_employment_years\": 2}\n\n\n@tool\ndef get_application(app_id: str) -> dict:\n    \"\"\"Fetch a loan application by id, e.g. APP-1001.\"\"\"\n    return APPLICATIONS.get(app_id.upper(), {\"error\": f\"{app_id} not found\"})\n\n\n@tool\ndef calculate_dti(monthly_debt: float, monthly_income: float, new_monthly_payment: float = 0) -> str:\n    \"\"\"Debt-to-income ratio including an optional new monthly payment.\"\"\"\n    dti = (monthly_debt + new_monthly_payment) / monthly_income\n    return f\"DTI = {dti:.1%} (policy max {POLICY['max_dti']:.0%})\"\n\n\n@tool\ndef calculate_ltv(loan_amount: float, property_value: float) -> str:\n    \"\"\"Loan-to-value ratio for secured lending.\"\"\"\n    ltv = loan_amount / property_value\n    return f\"LTV = {ltv:.1%} (policy max {POLICY['max_ltv']:.0%}; above this requires mortgage insurance)\"\n\n\n@tool\ndef check_policy(app_id: str) -> dict:\n    \"\"\"Run all underwriting policy rules for an application; returns value, threshold and pass/fail per rule.\"\"\"\n    a = APPLICATIONS.get(app_id.upper())\n    if not a:\n        return {\"error\": \"not found\"}\n    dti = a[\"monthly_debt\"] / a[\"monthly_income\"]\n    ltv = a[\"loan_amount\"] / a[\"property_value\"]\n    return {\n        \"dti\": {\"value\": round(dti, 3), \"max\": POLICY[\"max_dti\"], \"pass\": dti <= POLICY[\"max_dti\"]},\n        \"ltv\": {\"value\": round(ltv, 3), \"max\": POLICY[\"max_ltv\"], \"pass\": ltv <= POLICY[\"max_ltv\"]},\n        \"credit_score\": {\"value\": a[\"credit_score\"], \"min\": POLICY[\"min_score\"],\n                         \"pass\": a[\"credit_score\"] >= POLICY[\"min_score\"]},\n        \"employment_years\": {\"value\": a[\"employment_years\"], \"min\": POLICY[\"min_employment_years\"],\n                             \"pass\": a[\"employment_years\"] >= POLICY[\"min_employment_years\"]},\n    }\n\n\nSYSTEM = (\n    \"You are a mortgage underwriting assistant at a bank. Always use the tools to fetch data and \"\n    \"compute ratios - never guess numbers. Give: a summary table of ratios, which policy rules pass \"\n    \"or fail, a recommendation (Approve / Approve with conditions / Decline) and any conditions.\"\n)\n\n\ndef main():\n    banner(\"02 - Loan Underwriting Assistant (LangChain agent)\")\n    question = sys.argv[1] if len(sys.argv) > 1 else \"Underwrite APP-1001 and APP-1002 and compare them.\"\n    section(\"Question\", question)\n    section(\"Answer\", run_agent(SYSTEM, [get_application, calculate_dti, calculate_ltv, check_policy], question))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    QU[\"💬 Your question\"] --> AG[\"🤖 LangChain agent<br/>decides which tool to call\"]\n    AG <-->|\"🔧 calls & results\"| T[\"🐍 Python tools<br/>get_application()<br/>calculate_dti()<br/>calculate_ltv()<br/>check_policy()\"]\n    IN[\"📄 Loan applications + policy\"] --> T\n    AG <-.->|\"💬 reasoning\"| LLM([\"🦙 Ollama\"])\n    AG --> OUT[\"📝 Underwriting recommendation\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN,QU data\n    class T rules\n    class AG ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 9, "turns": [{"ask": "Underwrite APP-1001 and APP-1002 and compare them.", "steps": [{"icon": "🔧", "labe nt Capacity\n- **Debt Service Coverage Ratio (DSCR):** The DSCR decreased from 2.27 in FY2024 to 2.19 in FY2025. This indicates a slight reduction in the company's ability to cover its debt obligations with its EBITDA. However, a DSCR of 2.19 is still considered healthy, as it is above 2, which is generally the minimum threshold for lenders.\n- **Principal Repaid:** The principal repayment increased from 6,000 to 7,000, which is a positive sign, indicating that the company is managing its debt effectively.\n\n#### Red Flags\n- **EBITDA Margin Decline:** The slight decrease in EBITDA margin could be a red flag, as it suggests potential operational or cost issues that need to be addressed.\n- **Current Ratio Decrease:** The decrease in the current ratio is a concern, as it indicates a reduction in short-term liquidity. This could be a sign of potential cash flow issues or increased working capital needs.\n- **Slight DSCR Decrease:** The slight decrease in DSCR is a minor red flag, but the company still has a healthy DSCR, which is reassuring.\n\n### Conclusion\nGreenLeaf Foods Pvt Ltd appears to be in a relatively strong financial position, with consistent profitability, improved capital structure, and the ability to manage its debt obligations. However, there are some areas of concern, particularly the slight decrease in EBITDA margin and current ratio. These issues should be monitored closely, and the company should focus on maintaining operational efficiency and managing working capital effectively.", "code": false}], "answer": "**Credit Memo**\n\n**1. Borrower Overview**\nGreenLeaf Foods Pvt Ltd is a packaged food manufacturing company with 9 years of operational history. The company has requested a working capital line of 25,000,000 and a term loan of 15,000,000 for the establishment of a new packaging unit. The company's primary assets include factory land and building (valued at 60,000,000), stock, and receivables, which will be hypothecated as collateral.\n\n* er — LangChain chain + Ollama.\n\nRules decide the action and the new limit; the LLM explains it.\n\nRun:  python 01_banking/04_credit_limit_optimizer/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\nCARDHOLDERS = [\n    {\"id\": \"C-201\", \"limit\": 5000, \"avg_balance_6m\": 4300, \"on_time_payments_12m\": 12, \"income\": 85000, \"bureau_score\": 760, \"months_on_book\": 30},\n    {\"id\": \"C-202\", \"limit\": 8000, \"avg_balance_6m\": 900, \"on_time_payments_12m\": 12, \"income\": 60000, \"bureau_score\": 710, \"months_on_book\": 48},\n    {\"id\": \"C-203\", \"limit\": 6000, \"avg_balance_6m\": 5900, \"on_time_payments_12m\": 8, \"income\": 40000, \"bureau_score\": 640, \"months_on_book\": 14},\n]\n\n\ndef recommend(c: dict) -> dict:\n    util = c[\"avg_balance_6m\"] / c[\"limit\"]\n    max_limit = c[\"income\"] * 0.25  # exposure cap: 25% of annual income\n    if c[\"on_time_payments_12m\"] < 10 or c[\"bureau_score\"] < 660:\n        # never cut below the current balance; if that means no cut, freeze further increases\n        new = min(c[\"limit\"], max(c[\"avg_balance_6m\"], c[\"limit\"] * 0.8))\n        action = \"DECREASE\" if new < c[\"limit\"] else \"FREEZE\"\n    elif util > 0.7 and c[\"months_on_book\"] >= 12:\n        action, new = \"INCREASE\", min(c[\"limit\"] * 1.5, max_limit)\n    elif util < 0.2:\n        action, new = \"HOLD\", c[\"limit\"]\n    else:\n        action, new = \"INCREASE\", min(c[\"limit\"] * 1.2, max_limit)\n    return {**c, \"utilisation_pct\": round(util * 100), \"action\": action, \"new_limit\": round(new, -2)}\n\n\nSYSTEM = (\n    \"You are a card portfolio manager. For each card holder, explain the limit decision in 2 sentences \"\n    \"for the internal file, then write one friendly, compliant sentence for the customer notification. \"\n    \"Do not change the decided numbers.\"\n)\n\n\ndef main() "Chain", "description": "Detects early signs of stress in a corporate loan book and drafts watch-list commentary.", "how": "Python flags triggers (overdraft breaches, cheque returns, rating downgrades, late financials); an LLM chain writes a watch-list note per borrower.", "today": "For business loans, banks watch for warning signs (overdraft breaches, bounced cheques, falling sales, rating downgrades) so they can act before the borrower defaults.", "who": "Credit monitoring teams and relationship managers.", "why": "Signals are spread across many systems; spotting them early is what makes a recovery possible.", "terms": ["Early Warning Signals (EWS)", "SMA / watch-list", "Credit risk", "Covenant"], "code": "\"\"\"Early Warning Signals (EWS) Monitor — LangChain chain + Ollama.\n\nRun:  python 01_banking/06_early_warning_signals/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\nBORROWERS = [\n    {\"name\": \"Apex Textiles\", \"exposure\": 45_000_000, \"od_limit_breach_days_90d\": 18, \"cheque_returns_90d\": 3,\n     \"rating_change\": \"BBB -> BB\", \"financials_overdue_days\": 60, \"gst_turnover_change_pct\": -28, \"promoter_pledge_pct\": 45},\n    {\"name\": \"Nova Logistics\", \"exposure\": 30_000_000, \"od_limit_breach_days_90d\": 0, \"cheque_returns_90d\": 0,\n     \"rating_change\": \"A (stable)\", \"financials_overdue_days\": 0, \"gst_turnover_change_pct\": 12, \"promoter_pledge_pct\": 0},\n    {\"name\": \"Sunrise Builders\", \"exposure\": 80_000_000, \"od_limit_breach_days_90d\": 7, \"cheque_returns_90d\": 1,\n     \"rating_change\": \"BBB (negative watch)\", \"financials_overdue_days\": 30, \"gst_turnover_change_pct\": -9, \"promoter_pledge_pct\": 20},\n]\n\nRULES = [\n    (\"od_limit_breach_days_90d\", lambda v: v > 10, \"Persistent overdraft limit breaches\"),\n    (\"cheque_returns_90d\", lambda v: v >= 2, \"Repeated cheque returns\"),\n    (\"rating_change\", lambda v: \"->\" in v or \"negative\" in v, \"External rating downgrade / negative outlook\"),\n    (\"financials_overdue_days\", lambda v: v >= 30, \"Delay in submitting financials\"),\n    (\"gst_turnover_change_pct\", lambda v: v < -15, \"Sharp fall in GST turnover\"),\n    (\"promoter_pledge_pct\", lambda v: v > 30, \"High promoter share pledge\"),\n]\n\n\ndef scan(b: dict) -> dict:\n    triggers = [msg for key, test, msg in RULES if test(b[key])]\n    status = \"RED\" if len(triggers) >= 3 else \"AMBER\" if triggers else \"GREEN\"\n    return {\"name\": b[\"name\"], \"exposure\": b[\"exposure\"], \"status\": status, \"triggers\": triggers}\n\n\nSYSTEM = (\n    \"You are a credit monitoring officer. For each AMBER or RED borrower write a watch-list note: \"\n    \"situation, likely cause, recommended actions (e.g. client call, stock audit, tighten limits, SMA classification), \"\n    \"and review date. For GREEN borrowers just say 'No action'.\"\n)\n\n\ndef main():\n    banner(\"06 - Early Warning Signals Monitor (LangChain)\")\n    results = [scan(b) for b in BORROWERS]\n    section(\"EWS scan\", json.dumps(results, indent=2))\n    section(\"Watch-list notes\", run_chain(SYSTEM, \"EWS results:\\n{r}\\n\\nRaw data:\\n{raw}\",\n                                          r=json.dumps(results, indent=2), raw=json.dumps(BORROWERS, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Borrower account behaviour\"] --> PY[\"🐍 Python<br/>Trigger rules: overdrafts, bounces, downgrades\"]\n    PY -->|\"✅ decision & numbers\"| CH[\"🔗 LangChain prompt<br/>explain, don't decide\"]\n    CH <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    CH --> OUT[\"📝 Watch-list note per borrower\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    class w much a customer can borrow and the monthly EMI.", "how": "Agent uses `max_affordable_loan` and `monthly_emi` tools and answers in plain language with assumptions stated.", "today": "Before a full mortgage application, customers want a quick answer to 'how much can I borrow?' so they know which homes to look at.", "who": "Mortgage advisers, branch staff and digital channels.", "why": "Customers expect instant answers at any hour; staff time is better spent on serious applications.", "terms": ["Pre-qualification", "DTI (Debt-to-Income)", "EMI", "LTV (Loan-to-Value)"], "code": "\"\"\"Mortgage Pre-Qualification Bot — LangChain tool-calling agent + Ollama.\n\nRun:  python 01_banking/07_mortgage_prequalification_bot/app.py\n      python 01_banking/07_mortgage_prequalification_bot/app.py \"I earn 7000/month, pay 500 car loan. How much can I borrow?\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nMAX_DTI = 0.40\nDEFAULT_RATE = 6.5\nDEFAULT_YEARS = 30\n\n\n@tool\ndef monthly_emi(loan_amount: float, annual_rate_pct: float = DEFAULT_RATE, years: int = DEFAULT_YEARS) -> str:\n    \"\"\"Monthly repayment for a loan amount, annual interest rate (%) and term in years.\"\"\"\n    r, n = annual_rate_pct / 1200, years * 12\n    pay = loan_amount * r * (1 + r) ** n / ((1 + r) ** n - 1)\n    return f\"Monthly payment: {pay:,.0f} for {loan_amount:,.0f} at {annual_rate_pct}% over {years} years\"\n\n\n@tool\ndef max_affordable_loan(monthly_income: float, monthly_debts: float = 0,\n                        annual_rate_pct: float = DEFAULT_RATE, years: int = DEFAULT_YEARS) -> str:\n    \"\"\"Maximum loan a customer can afford, keeping total debt payments within the bank's 40% DTI limit.\"\"\"\n    budget = monthly_income * MAX_DTI - monthly_debts\n    if budget <= 0:\n        return \"Existing debts already exceed the 40% DTI limit; no additional borrowing capacity.\"\n    r, n = annual_rate_pct / 1200, years * 12\n    loan = budget * ((1 + r) ** n - 1) / (r * (1 + r) ** n)\n    return f\"Max loan ~{loan:,.0f} (monthly payment budget {budget:,.0f}, {annual_rate_pct}% over {years}y)\"\n\n\nSYSTEM = (\n    \"You are a friendly mortgage pre-qualification assistant. Use the tools for every calculation. \"\n    \"State assumptions (rate, term, 40% DTI) clearly, mention this is an indicative estimate and not a \"\n    \"loan offer, and suggest a sensible down payment (20%) to estimate an affordable property price.\"\n)\n\n\ndef main():\n    banner(\"07 - Mortgage Pre-Qualification Bot (LangChain agent)\")\n    q = sys.argv[1] if len(sys.argv) > 1 else (\n        \"I earn 8,500 a month and pay 650 a month on a car loan. How much can I borrow, and what would \"\n        \"the monthly payment be on a 25 year term at 6.2%?\")\n    section(\"Customer\", q)\n    section(\"Assistant\", run_agent(SYSTEM, [max_affordable_loan, monthly_emi], q))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    QU[\"💬 Your question\"] --> AG[\"🤖 LangChain agent<br/>decides which tool to call\"]\n    AG <-->|\"🔧 calls & results\"| T[\"🐍 Python tools<br/>monthly_emi()<br/>max_affordable_loan()\"]\n    IN[\"📄 Customer's income & debts\"] --> T\n    AG <-.->|\"💬 reasoning\"| LLM([\"🦙 Ollama\"])\n    AG --> OUT[\"📝 How much you can borrow + EMI\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN,QU data\n    class T rules\n    class AG ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": ructured output + Ollama.\n\nRun:  python 01_banking/08_loan_document_extractor/app.py\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import banner, run_structured, section\n\nPAYSLIP = \"\"\"\nACME TECHNOLOGIES LTD          PAYSLIP FOR THE MONTH OF AUGUST 2026\nEmployee Name: Rohan Mehta     Employee ID: E10442    Designation: Senior Engineer\nDate of Joining: 14-Mar-2019   PAN: ABCPM1234K\nBasic: 60,000   HRA: 24,000   Special Allowance: 21,000   Gross Earnings: 105,000\nPF: 7,200  Professional Tax: 200  Income Tax: 12,600   Total Deductions: 20,000\nNET PAY: 85,000   Paid to A/c XXXX4521 HDFC Bank\n\"\"\"\n\nSTATEMENT = \"\"\"\nHDFC BANK - Statement of Account  A/c No: XXXX4521  Name: ROHAN MEHTA  Period: 01-Aug-2026 to 31-Aug-2026\nOpening balance 142,300.55\n01-Aug  SALARY ACME TECHNOLOGIES   CR 85,000.00\n03-Aug  HOME LOAN EMI ICICI        DR 32,500.00\n05-Aug  CREDIT CARD PAYMENT        DR 18,240.00\n12-Aug  UPI-GROCERY                DR 6,410.00\n20-Aug  SIP MUTUAL FUND            DR 10,000.00\n28-Aug  ATM WITHDRAWAL             DR 5,000.00\nClosing balance 155,150.55\n\"\"\"\n\n\nclass Payslip(BaseModel):\n    employee_name: str\n    employer: str = Field(description=\"Company name printed in the payslip header, not the employee ID\")\n    month: str = Field(description=\"Pay month and year, e.g. 'August 2026'\")\n    gross_salary: float\n    total_deductions: float\n    net_pay: float\n    date_of_joining: str = Field(description=\"As written on the payslip\")\n\n\nclass BankStatement(BaseModel):\n    account_holder: str\n    period: str\n    opening_balance: float\n    closing_balance: float\n    salary_credits: float = Field(description=\"Sum of salary credits\")\n    existing_emi_debits: float = Field(description=\"Sum of loan EMI debits only\")\n\n\ndef main():\n    banner(\"08 - Loan Document Extractor (LangChain structured output)\")\n    sys_prompt = \"Extract the fields exactly from the document. Numbers as plain floats without commas.\"\n    p = run_structured(sys_prompt, PAYSLIP, Payslip)\n    s = run_structured(sys_prompt, STATEMENT, BankStatement)\n    section(\"Payslip\", p.model_dump_json(indent=2))\n    section(\"Bank statement\", s.model_dump_json(indent=2))\n\n    checks = {\n        \"name_match\": p.employee_name.lower() == s.account_holder.lower(),\n        \"salary_credit_matches_net_pay\": abs(p.net_pay - s.salary_credits) < 1,\n        \"existing_emi_to_net_pay_pct\": round(s.existing_emi_debits / p.net_pay * 100, 1),\n    }\n    section(\"Cross-document checks\", checks)\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Payslip + bank statement text\"] --> EX[\"🧾 LangChain structured output<br/>text → Pydantic schema\"]\n    EX -->|\"validated fields\"| PY[\"🐍 Python<br/>Salary vs. statement credit check\"]\n    PY --> OUT[\"📝 Validated fields + mismatches\"]\n    EX <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class EX ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 7, "turns": [{"ask": "Here are Rohan Mehta's payslip and bank statement. Extract the details and check they match.", "steps": [{"icon": "🧾", "label": "Extracted · Payslip", "body": "{\n  \"employee_name\": \"Rohan Mehta\",\n  \"employer\": \"E10442\",\n  \"month\": \"s August 2026\",\n  \"gross_salary\": 105000.0,\n  \"total_deductions\": 20000.0,\n  \"net_pay\": 85000.0,\n  \"date_of_joining\": \"14-Mar-2019\"\n}", "code": true}, {"icon": "🧾", "label": "Extracted · Bank statement", "body": "{\n  \"account_holder\": \"ROHAN MEHTA\",\n  \"period\": \"01-Aug-2026 to 31-Aug-2026\",\n  \"opening_balance\": 142300.55,\n  \"closing_balance\": 155150.55,\n  \"salary_credits\": 85000.0,\n  \"existing_emi_debits\": 32500.0\n}", "code": true}], "answer": "{'name_match': True, 'salary_credit_matches_net_pay': True, 'existing_emi_to_net_pay_pct': 38.2}"}]}}, {"slug": "09_aml_transaction_monitoring", "title": "AML Transaction Monitoring Agent", "category": "fincrime", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Detects structuring, rapid movement and high-risk-geography patterns and triages the alert.", "how": "Python rules raise alerts; an AML Investigator agent reviews the evidence and a Compliance Officer agent decides close / escalate / file SAR.", "today": "Banks must monitor transactions for money laundering. Rules generate alerts (e.g. repeated cash deposits just under the reporting limit); investigators review each alert and decide whether to report it.", "who": "AML transaction monitoring analysts and the MLRO (Compliance / Financial Crime).", "why": "Most alerts are false positives, yet missing a real case can bring huge fines. Investigation is slow and manual.", "terms": ["AML (Anti-Money Laundering)", "Money laundering stages", "Structuring (smurfing)", "CTR (Currency Transaction Report)", "SAR / STR", "MLRO", "False positive"], "code": "\"\"\"AML Transaction Monitoring Agent — CrewAI + Ollama.\n\nDeterministic AML rules raise alerts (auditable); agents investigate and triage.\n\nRun:  python 01_banking/09_aml_transaction_monitoring/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom collections import defaultdict\nfrom datetime import datetime, timedelta\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nCUSTOMER = {\"id\": \"CUST-7781\", \"name\": \"Marco Rinaldi\", \"occupation\": \"Restaurant owner\",\n            \"expected_monthly_turnover\": 15_000, \"risk_rating\": \"Medium\", \"country\": \"IT\"}\n\nTXNS = [  # date, type, amount, counterparty, country\n    (\"2026-09-01\", \"cash_deposit\", 9_500, \"Branch 12\", \"IT\"),\n    (\"2026-09-02\", \"cash_deposit\", 9_800, \"Branch 07\", \"IT\"),\n    (\"2026-09-03\", \"cash_deposit\", 9_700, \"Branch 12\", \"IT\"),\n    (\"2026-09-04\", \"wire_out\", 27_000, \"Oceanic Trading FZE\", \"AE\"),\n    (\"2026-09-10\", \"card_payment\", 230, \"Metro Cash&Carry\", \"IT\"),\n    (\"2026-09-15\", \"wire_in\", 48_000, \"Lindell Holdings Ltd\", \"VG\"),\n    (\"2026-09-16\", \"wire_out\", 47_500, \"Kestrel Imports\", \"HK\"),\n    (\"2026-09-20\", \"cash_deposit\", 3_200, \"Branch 12\", \"IT\"),\n]\n\nHIGH_RISK = {\"VG\", \"KY\", \"PA\", \"IR\", \"KP\"}\nCTR_THRESHOLD = 10_000\n\n\ndef detect(txns) -> list[dict]:\n    alerts, rows = [], [dict(zip([\"date\", \"type\", \"amount\", \"cp\", \"country\"], t)) for t in txns]\n    for r in rows:\n        r[\"d\"] = datetime.fromisoformat(r[\"date\"])\n\n    # 1. Structuring: >=3 cash deposits just under the threshold in 7 days\n    near = [r for r in rows if r[\"type\"] == \"cash_deposit\" and 0.9 * CTR_THRESHOLD <= r[\"amount\"] < CTR_THRESHOLD]\n    if len(near) >= 3 and near[-1][\"d\"] - near[0][\"d\"] <= timedelta(days=7):\n        alerts.append({\"rule\": \"STRUCTURING\", \"evidence\": [(r[\"date\"], r[\"amount\"]) for r in near]})\n\n    # 2. Rapid movement: inbound wire followed by >=90% outbound within 2 days\n    for i in (r for r in rows if r[\"type\"] == \"wire_in\"):\n        for o in (r for r in rows if r[\"type\"] == \"wire_out\"):\n            if timedelta(0) <= o[\"d\"] - i[\"d\"] <= timedelta(days=2) and o[\"amount\"] >= 0.9 * i[\"amount\"]:\n                alerts.append({\"rule\": \"RAPID_PASS_THROUGH\", \"evidence\": [(i[\"date\"], i[\"amount\"], i[\"cp\"]),\n                                                                           (o[\"date\"], o[\"amount\"], o[\"cp\"])]})\n\n    # 3. High-risk jurisdiction\n    hr = [(r[\"date\"], r[\"amount\"], r[\"country\"]) for r in rows if r[\"country\"] in HIGH_RISK]\n    if hr:\n        alerts.append({\"rule\": \"HIGH_RISK_JURISDICTION\", \"evidence\": hr})\n\n    # 4. Turnover vs. profile\n    monthly = defaultdict(float)\n    for r in rows:\n        monthly[r[\"date\"][:7]] += r[\"amount\"]\n    for m, v in monthly.items():\n        if v > 3 * CUSTOMER[\"expected_monthly_turnover\"]:\n            alerts.append({\"rule\": \"PROFILE_DEVIATION\", \"evidence\": f\"{m} turnover {v:,.0f} vs expected \"\n                                                                    f\"{CUSTOMER['expected_monthly_turnover']:,}\"})\n    return alerts\n\n\ndef main():\n    banner(\"09 - AML Transaction Monitoring Agent (CrewAI)\")\n    alerts = detect(TXNS)\n    section(\"Rule alerts\", json.dumps(alerts, indent=2))\n\n    investigator = make_agent(\"AML Investigator\", \"Investigate alerts and assess whether activity is suspicious\",\n                              \"Certified AML specialist (CAMS) experienced in typologies: structuring, layering, trade-based ML.\")\n    officer = make_agent(\"MLRO / Compliance Officer\", \"Decide the alert outcome in line with regulation\",\n                         \"Money Laundering Reporting Officer accountable for SAR filing decisions.\")\n    t1 = make_task(\n        \"Customer profile:\\n{customer}\\n\\nTransactions:\\n{txns}\\n\\nAlerts:\\n{alerts}\\n\\n\"\n        \"Investigate. Link the alerts into a coherent picture, list typologies, and note any innocent explanations to check.\",\n        \"Investigation summary with typologies, risk indicators and open questions for the customer.\", investigator)\n    t2 = make_task(\n        \"Decide the outcome.\",\n        \"First line 'Decision: <CODE>' where CODE is exactly one of CLOSE_FALSE_POSITIVE, ENHANCED_MONITORING, FILE_SAR \"\n ctivities, indicating a high risk of money laundering or fraud.\n\n#### Actions Taken\n- **Initial Monitoring**: The account was monitored for any unusual activity.\n- **Information Requests**: Two requests for information were sent to Daniel Okafor, but no response was received.\n- **Account Restriction**: Due to the non-response and the suspicious activity, the account was restricted on September 25, 2026.\n\n#### Conclusion\nThe account of Daniel Okafor, opened on May 3, 2026, has shown clear signs of suspicious activity, consistent with the behavior of a money mule. The high volume of P2P transfers, quick turnaround to crypto exchanges, and the failure to respond to information requests all contribute to the suspicion. The account was ultimately restricted to mitigate the risk of financial crime. Further investigation may be warranted to determine the exact nature of the activity and to identify any potential victims or perpetrators."}]}}, {"slug": "13_card_fraud_explainer", "title": "Card Fraud Detection Explainer", "category": "fincrime", "framework": "LangChain", "pattern": "Chain", "description": "Scores card transactions for fraud and explains each alert for analysts and customers.", "how": "Feature-based risk score (velocity, geo-jump, MCC, amount z-score) plus an LLM explanation and suggested action.", "today": "Card transactions are scored for fraud in real time. Suspicious ones are blocked or held, and the customer is asked to confirm.", "who": "Fraud operations analysts.", "why": "Blocking genuine spending annoys customers; letting fraud through costs money. Analysts need to see why a transaction was flagged.", "terms": ["Card fraud / CNP", "MCC", "False positive"], "code": "\"\"\"Card Fraud Detection Explainer — rule score + LangChain explanation.\n\nRun:  python 01_banking/13_card_fraud_explainer/app.py\n\"\"\"\n\nimport json\nimport statistics\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\nHISTORY_AMOUNTS = [42, 18, 65, 120, 33, 54, 75, 22, 90, 47, 38, 61]  # customer's usual spend\nHOME_COUNTRY = \"GB\"\nHIGH_RISK_MCC = {\"6051\": \"Quasi-cash / crypto\", \"7995\": \"Gambling\", \"5967\": \"Direct marketing\"}\n\nTRANSACTIONS = [\n    {\"id\": \"T1\", \"time\": \"2026-10-10 12:04\", \"amount\": 58, \"merchant\": \"Tesco\", \"mcc\": \"5411\", \"country\": \"GB\", \"card_present\": True, \"txns_last_hour\": 1},\n    {\"id\": \"T2\", \"time\": \"2026-10-10 02:13\", \"amount\": 1450, \"merchant\": \"CoinFast\", \"mcc\": \"6051\", \"country\": \"LT\", \"card_present\": False, \"txns_last_hour\": 4},\n    {\"id\": \"T3\", \"time\": \"2026-10-10 02:19\", \"amount\": 980, \"merchant\": \"LuckySpin\", \"mcc\": \"7995\", \"country\": \"MT\", \"card_present\": False, \"txns_last_hour\": 5},\n    {\"id\": \"T4\", \"time\": \"2026-10-10 18:40\", \"amount\": 240, \"merchant\": \"Ryanair\", \"mcc\": \"4511\", \"country\": \"IE\", \"card_present\": False, \"txns_last_hour\": 1},\n]\n\n\ndef score(t: dict) -> dict:\n    mu, sd = statistics.mean(HISTORY_AMOUNTS), statistics.stdev(HISTORY_AMOUNTS)\n    z = (t[\"amount\"] - mu) / sd\n    hour = int(t[\"time\"][11:13])\n    reasons, s = [], 0\n    if z > 3: s += 30; reasons.append(f\"amount z-score {z:.1f}\")\n    if t[\"mcc\"] in HIGH_RISK_MCC: s += 25; reasons.append(f\"high-risk MCC ({HIGH_RISK_MCC[t['mcc']]})\")\n    if t[\"country\"] != HOME_COUNTRY: s += 15; reasons.append(f\"foreign country {t['country']}\")\n    if not t[\"card_present\"]: s += 10; reasons.append(\"card-not-present\")\n    if t[\"txns_last_hour\"] >= 3: s += 20; reasons.append(f\"velocity {t['txns_last_hour']} txns/hour\")\n    if hour < 5: s += 10; reasons.append(\"unusual hour\")\n    band = \"BLOCK\" if s >= 70 else \"REVIEW\" if s >= 40 else \"APPROVE\"\n    return {\"id\": t[\"id\"], \"merchant\": t[\"merchant\"], \"amount\": t[\"amount\"], \"score\": s, \"action\": band, \"reasons\": reasons}\n\n\nSYSTEM = (\n    \"You are a card fraud analyst. For each scored transaction write (a) a 1-2 sentence analyst explanation and \"\n    \"(b) for BLOCK/REVIEW, a short SMS to the customer asking them to confirm the transaction (never ask for PIN, \"\n    \"OTP or full card number). Keep the decided actions.\"\n)\n\n\ndef main():\n    banner(\"13 - Card Fraud Detection Explainer (LangChain)\")\n    scored = [score(t) for t in TRANSACTIONS]\n    section(\"Scores\", json.dumps(scored, indent=2))\n    section(\"Explanations\", run_chain(SYSTEM, \"Scored transactions:\\n{s}\", s=json.dumps(scored, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Card transactions + spending history\"] --> PY[\"🐍 Python<br/>Fraud score: velocity, geo-jump, MCC, amount\"]\n    PY -->|\"✅ decision & numbers\"| CH[\"🔗 LangChain prompt<br/>explain, don't decide\"]\n    CH <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    CH --> OUT[\"📝 Fraud explanation + action\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class CH ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 8, "turns": [{"ask": "Score today's card transactions for fraud and tell me what action to take on each.", "steps": [{"icon": "🐍", "label": "Python · Scores", "body": "[\n  {\n    \"id\": \"T1\",\n    \"merchant\": \"Tesco\",\n    \"amount\": 58,\n    \"score\": 0,\n    \"action\": \"APPROVE\",\n    \"reasons\": []\n  },\n  {\n    \"id\": \"T2\",\n    \"merchant\": \"CoinFast\",\n    \"amount\": 1450,\n    \"score\": 110,\n    \"action\": \" tar Trading FZE\"},\n    {\"lc\": \"LC-303\", \"goods\": \"Frozen shrimp (kg)\", \"qty\": 40000, \"invoice_value\": 98000, \"origin\": \"VN\", \"via\": \"PA\", \"dest\": \"US\",\n     \"applicant\": \"Coastline Foods\", \"beneficiary\": \"Saigon Seafood Co\"},\n]\n\n\ndef analyse(t: dict) -> dict:\n    unit = t[\"invoice_value\"] / t[\"qty\"]\n    bench = BENCHMARK_UNIT_PRICE[t[\"goods\"]]\n    dev = (unit / bench - 1) * 100\n    flags = []\n    if dev > 50: flags.append(f\"Over-invoicing: unit price {unit:.2f} vs benchmark {bench} (+{dev:.0f}%)\")\n    if dev < -40: flags.append(f\"Under-invoicing: unit price {unit:.2f} vs benchmark {bench} ({dev:.0f}%)\")\n    if t[\"via\"] in TRANSHIPMENT_HUBS: flags.append(f\"Transhipment via {t['via']} not required for route\")\n    if \"FZE\" in t[\"beneficiary\"] and t[\"origin\"] != \"AE\": flags.append(\"Beneficiary free-zone entity, not the manufacturer\")\n    return {\"lc\": t[\"lc\"], \"unit_price\": round(unit, 2), \"deviation_pct\": round(dev), \"flags\": flags}\n\n\ndef main():\n    banner(\"14 - Trade-Based Money Laundering Detector (CrewAI)\")\n    results = [analyse(t) for t in TRADES]\n    section(\"Pricing & route analysis\", json.dumps(results, indent=2))\n\n    trade_analyst = make_agent(\"Trade Finance Analyst\", \"Assess commercial plausibility of each trade\",\n                               \"Trade operations expert who knows typical goods, pricing and shipping routes.\")\n    tbml = make_agent(\"TBML Specialist\", \"Identify trade-based money laundering risks and recommend actions\",\n                      \"Financial-crime specialist following FATF/Wolfsberg TBML red-flag guidance.\")\n    t1 = make_task(\"Trades:\\n{trades}\\n\\nAnalysis:\\n{analysis}\\n\\nComment on the commercial rationale of each trade.\",\n                   \"Per-LC commercial assessment.\", trade_analyst)\n    t2 = make_task(\"Rate each LC LOW / MEDIUM / HIGH TBML risk and recommend actions \"\n                   \"(e.g. request p oney_service_business\": 3}),\n    \"geography\": (0.25, {\"domestic\": 1, \"fatf_compliant\": 1, \"medium_risk\": 2, \"high_risk\": 3}),\n    \"product\": (0.20, {\"savings\": 1, \"credit_card\": 1, \"current_account\": 2, \"trade_finance\": 3, \"private_banking\": 3}),\n    \"channel\": (0.10, {\"branch\": 1, \"digital_verified\": 2, \"non_face_to_face\": 3}),\n    \"pep\": (0.20, {\"no\": 1, \"domestic_pep\": 3, \"foreign_pep\": 3, \"pep_associate\": 2}),\n}\n\nCUSTOMERS = [\n    {\"id\": \"K-01\", \"occupation\": \"salaried\", \"geography\": \"domestic\", \"product\": \"savings\", \"channel\": \"branch\", \"pep\": \"no\"},\n    {\"id\": \"K-02\", \"occupation\": \"jeweller\", \"geography\": \"medium_risk\", \"product\": \"current_account\", \"channel\": \"digital_verified\", \"pep\": \"no\"},\n    {\"id\": \"K-03\", \"occupation\": \"real_estate\", \"geography\": \"high_risk\", \"product\": \"private_banking\", \"channel\": \"non_face_to_face\", \"pep\": \"foreign_pep\"},\n]\n\n\ndef rate(c: dict) -> dict:\n    breakdown = {f: FACTORS[f][1][c[f]] for f in FACTORS}\n    score = sum(FACTORS[f][0] * s for f, s in breakdown.items())\n    rating = \"HIGH\" if score >= 2.2 or c[\"pep\"] != \"no\" else \"MEDIUM\" if score >= 1.6 else \"LOW\"\n    review = {\"HIGH\": \"12 months\", \"MEDIUM\": \"24 months\", \"LOW\": \"36 months\"}[rating]\n    return {\"id\": c[\"id\"], \"factor_scores\": breakdown, \"weighted_score\": round(score, 2), \"rating\": rating, \"next_review\": review}\n\n\nSYSTEM = (\n    \"You are a KYC/AML analyst. For each customer write a 3-4 sentence risk-rating justification for the KYC file, \"\n    \"naming the main drivers, and list due-diligence measures (SDD / CDD / EDD, source of wealth, senior approval for PEPs).\"\n)\n\n\ndef main():\n    banner(\"16 - Customer Risk Rating (LangChain)\")\n    ratings = [rate(c) for c in CUSTOMERS]\n    section(\"Ratings\", json.dumps(ratings, indent=2))\n    section(\"Justifications\", run_chain(SYSTEM, \"Cust
