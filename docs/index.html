d whether the overdraft limit covers it.\"\"\"\n    rows = forecast_cash.invoke({\"weeks\": 13})\n    low = min(rows, key=lambda r: r[\"closing_cash\"])\n    headroom = low[\"closing_cash\"] + OVERDRAFT_LIMIT / 1000\n    return {\"lowest_week\": low[\"week\"], \"lowest_cash_k\": low[\"closing_cash\"], \"overdraft_limit_k\": OVERDRAFT_LIMIT / 1000,\n            \"headroom_k\": round(headroom), \"breach\": headroom < 0}\n\n\nSYSTEM = (\n    \"You are a corporate banking treasury advisor. Use forecast_cash and funding_gap. Report: trend of inflows vs \"\n    \"outflows, the week cash turns negative (if any), funding gap vs overdraft, and recommend actions (working capital \"\n    \"line, invoice discounting, payables timing, sweeping surplus). Figures are in thousands.\"\n)\n\n\ndef main():\n    banner(\"42 - Corporate Cash Flow Forecaster (LangChain agent)\")\n    section(\"Treasury view\", run_agent(SYSTEM, [forecast_cash, funding_gap], \"Give me the 13-week cash outlook and any funding needs.\"))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "43_reconciliation_exception_agent", "title": "Reconciliation Exception Agent", "category": "ops", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Matches ledger vs. bank statement entries and investigates the breaks.", "how": "Python matches by amount/reference/date; a Recon Analyst agent classifies breaks and an Ops Lead agent assigns actions.", "today": "Operations teams match every entry in the bank's ledger against bank statements daily. Anything that does not match (a 'break') must be investigated.", "who": "Reconciliation / operations teams.", "why": "Breaks pile up quickly; unresolved ones can hide errors, fraud or losses.", "terms": ["Reconciliation", "Nostro account"], "code": "\"\"\"Reconciliation Exception Agent — CrewAI + Ollama.\n\nRun:  python 01_banking/43_reconciliation_exception_agent/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom datetime import date\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nLEDGER = [\n    {\"id\": \"GL-1\", \"date\": \"2026-10-01\", \"ref\": \"INV-1001\", \"amount\": 12500.00},\n    {\"id\": \"GL-2\", \"date\": \"2026-10-02\", \"ref\": \"INV-1002\", \"amount\": 8400.00},\n    {\"id\": \"GL-3\", \"date\": \"2026-10-03\", \"ref\": \"INV-1003\", \"amount\": 3150.00},\n    {\"id\": \"GL-4\", \"date\": \"2026-10-03\", \"ref\": \"PAY-SUP-77\", \"amount\": -9200.00},\n    {\"id\": \"GL-5\", \"date\": \"2026-10-05\", \"ref\": \"INV-1005\", \"amount\": 4999.00},\n]\nBANK = [\n    {\"id\": \"BK-1\", \"date\": \"2026-10-01\", \"ref\": \"INV-1001\", \"amount\": 12500.00},\n    {\"id\": \"BK-2\", \"date\": \"2026-10-04\", \"ref\": \"INV1002\", \"amount\": 8400.00},\n    {\"id\": \"BK-3\", \"date\": \"2026-10-03\", \"ref\": \"INV-1003\", \"amount\": 3135.00},\n    {\"id\": \"BK-4\", \"date\": \"2026-10-04\", \"ref\": \"PAY-SUP-77\", \"amount\": -9200.00},\n    {\"id\": \"BK-5\", \"date\": \"2026-10-04\", \"ref\": \"PAY-SUP-77\", \"amount\": -9200.00},\n    {\"id\": \"BK-6\", \"date\": \"2026-10-06\", \"ref\": \"BANK CHARGES\", \"amount\": -45.00},\n]\n\n\ndef norm(ref: str) -> str:\n    return ref.replace(\"-\", \"\").upper()\n\n\ndef reconcile():\n    matched, unmatched_bank = [], list(BANK)\n    breaks = []\n    for g in LEDGER:\n        hit = next((b for b in unmatched_bank if norm(b[\"ref\"]) == norm(g[\"ref\"]) and b[\"amount\"] == g[\"amount\"]), None)\n        if hit:\n            lag = (date.fromisoformat(hit[\"date\"]) - date.fromisoformat(g[\"date\"])).days\n            matched.append({\"gl\": g[\"id\"], \"bank\": hit[\"id\"], \"date_lag_days\": lag})\n            unmatched_bank.remove(hit)\n            continue\n        near = next((b for b in unmatched_bank if norm(b[\"ref\"]) == norm(g[\"ref\"])), None)\n        if near:\n            breaks.append({\"type\": \"AMOUNT_MISMATCH\", \"gl\": g, \"bank\": near, \"difference\": round(g[\"amount\"] - near[\"amount\"], 2)})\n            unmatched_bank.remove(near)\n        else:\n            breaks.append({\"type\": \"MISSING_IN_BANK\", \"gl\": g})\n    breaks += [{\"type\": \"MISSING_IN_LEDGER\", \"bank\": b} for b in unmatched_bank]\n    return matched, breaks\n\n\ndef main():\n    banner(\"43 - Reconciliation Exception Agent (CrewAI)\")\n    matched, breaks = reconcile()\n    section(\"Auto-matched\", json.dumps(matched, indent=2))\n    section(\"Breaks\", json.dumps(breaks, indent=2))\n    analyst = make_agent(\"Reconciliation Analyst\", \"Explain the probable root cause of every break\",\n                         \"Bank operations analyst who knows duplicates, FX/fee deductions, timing and reference errors.\")\n    lead = make_agent(\"Operations Team Lead\", \"Assign resolution actions, owners and priorities\",\n                      \"You run the nostro/GL reconciliation team and manage aged breaks.\")\n    t1 = make_task(\"Breaks:\\n{breaks}\\n\\nClassify each break's root cause (duplicate debit, short payment / fee, unrecorded bank charge, \"\n                   \"timing, reference format) with evidence.\", \"Per-break root cause.\", analyst)\n    t2 = make_task(\"Propose resolution per break: journal entry or bank claim, owner, priority, and an overall recon summary.\\n\\n\"\n                   \"Breaks with exact amounts (quote these; never invent numbers):\\n{breaks}\",\n                   \"Action table and summary.\", lead, context=[t1])\n    section(\"Resolution plan\", run_crew([analyst, lead], [t1, t2], {\"breaks\": json.dumps(breaks, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "44_trade_finance_lc_checker", "title": "Letter of Credit Document Checker", "category": "ops", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Checks LC presentation documents for discrepancies against UCP 600 terms.", "how": "Python compares invoice, bill of lading and LC fields; Document Checker and Trade Ops agents classify discrepancies.", "today": "Under a Letter of Credit, the bank pays the exporter only if their documents exactly match the LC terms. Checkers examine every document line by line.", "who": "Trade finance document checkers and trade operations managers.", "why": "Checking is meticulous manual work; missing a discrepancy means paying when the bank should not.", "terms": ["Letter of Credit (LC)", "UCP 600", "Discrepancy", "Bill of Lading (B/L)", "Incoterms (e.g. CIF)"], "code": "\"\"\"Letter of Credit Document Checker — CrewAI + Ollama.\n\nRun:  python 01_banking/44_trade_finance_lc_checker/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom datetime import date\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nLC = {\"number\": \"LC/2026/0458\", \"applicant\": \"Brightway Retail Ltd, Mumbai\", \"beneficiary\": \"Shenzhen Lumen Electronics Co\",\n      \"amount\": 120_000, \"currency\": \"USD\", \"tolerance_pct\": 5, \"goods\": \"5,000 units LED panel lights model LP-60\",\n      \"incoterm\": \"CIF Nhava Sheva\", \"latest_shipment\": \"2026-09-30\", \"expiry\": \"2026-10-20\", \"presentation_days\": 21,\n      \"port_loading\": \"Shenzhen\", \"port_discharge\": \"Nhava Sheva\", \"partial_shipment\": \"Not allowed\",\n      \"docs_required\": [\"Commercial invoice\", \"Full set clean on-board B/L\", \"Insurance certificate 110% CIF\", \"Packing list\"]}\n\nPRESENTATION = {\n    \"presented_on\": \"2026-10-16\",\n    \"invoice\": {\"beneficiary\": \"Shenzhen Lumen Electronics Co\", \"amount\": 126_500, \"currency\": \"USD\",\n                \"goods\": \"5,000 units LED panel lights model LP-60\", \"incoterm\": \"CIF Nhava Sheva\"},\n    \"bill_of_lading\": {\"on_board_date\": \"2026-09-22\", \"port_loading\": \"Shenzhen\", \"port_discharge\": \"Nhava Sheva\",\n                       \"clean\": False, \"clause\": \"3 cartons wet and torn\", \"originals\": \"3/3\"},\n    \"insurance\": {\"coverage\": 126_500, \"currency\": \"USD\", \"date\": \"2026-09-24\"},\n    \"packing_list\": {\"units\": 5000},\n}\n\n\ndef check() -> list[str]:\n    d, inv, bl, ins = [], PRESENTATION[\"invoice\"], PRESENTATION[\"bill_of_lading\"], PRESENTATION[\"insurance\"]\n    max_amt = LC[\"amount\"] * (1 + LC[\"tolerance_pct\"] / 100)\n    if inv[\"amount\"] > max_amt: d.append(f\"Invoice amount {inv['amount']:,} exceeds LC amount + tolerance {max_amt:,.0f}\")\n    if inv[\"goods\"] != LC[\"goods\"]: d.append(\"Goods description on invoice differs from LC\")\n    if bl[\"on_board_date\"] > LC[\"latest_shipment\"]: d.append(\"Late shipment\")\n    if not bl[\"clean\"]: d.append(f\"B/L is claused: '{bl['clause']}' (LC requires clean on-board B/L)\")\n    if ins[\"date\"] > bl[\"on_board_date\"]: d.append(f\"Insurance dated {ins['date']} after shipment date {bl['on_board_date']}\")\n    if ins[\"coverage\"] < 1.1 * inv[\"amount\"]: d.append(f\"Insurance cover {ins['coverage']:,} < 110% of invoice ({1.1 * inv['amount']:,.0f})\")\n    days = (date.fromisoformat(PRESENTATION[\"presented_on\"]) - date.fromisoformat(bl[\"on_board_date\"])).days\n    if days > LC[\"presentation_days\"]: d.append(f\"Presented {days} days after shipment (> {LC['presentation_days']})\")\n    if PRESENTATION[\"presented_on\"] > LC[\"expiry\"]: d.append(\"Presented after LC expiry\")\n    return d\n\n\ndef main():\n    banner(\"44 - Letter of Credit Document Checker (CrewAI)\")\n    disc = check()\n    section(\"Discrepancies found\", \"\\n\".join(disc) or \"None\")\n    checker = make_agent(\"LC Document Checker\", \"Examine documents strictly per UCP 600 and ISBP\",\n                         \"Senior trade documentation checker; you cite the relevant UCP 600 article where possible.\")\n    ops = make_agent(\"Trade Operations Manager\", \"Decide how to handle the presentation\",\n                     \"You decide between paying, refusing, or seeking applicant waiver, and draft the SWIFT MT734 refusal notice.\")\n    t1 = make_task(\"LC terms:\\n{lc}\\n\\nPresentation:\\n{pres}\\n\\nAutomated discrepancies:\\n{disc}\\n\\n\"\n                   \"Confirm each discrepancy, add any others, and classify as major/minor.\", \"Discrepancy list with UCP references.\", checker)\n    t2 = make_task(\"Recommend the handling and draft the refusal notice text listing all discrepancies.\",\n                   \"Decision + draft MT734 narrative.\", ops, context=[t1])\n    section(\"Decision\", run_crew([checker, ops], [t1, t2], {\"lc\": json.dumps(LC, indent=2),\n                                                             \"pres\": json.dumps(PRESENTATION, indent=2), \"disc\": \"\\n\".join(disc)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "45_fx_hedging_advisor", "title": "FX Hedging Advisor", "category": "ops", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Measures a corporate's FX exposure and suggests a hedging approach.", "how": "Agent uses `net_exposure` and `forward_rate` tools and compares forward vs. unhedged outcomes.", "today": "Companies that buy or sell abroad face currency risk. Bank FX sales teams help them measure it and lock in rates with forwards or options.", "who": "FX sales / treasury advisers for corporate clients.", "why": "Clients need clear explanations of risk in their own currency, and advice must be about protection, not speculation.", "terms": ["FX exposure / hedging", "FX forward"], "code": "\"\"\"FX Hedging Advisor — LangChain tool-calling agent + Ollama.\n\nRun:  python 01_banking/45_fx_hedging_advisor/app.py\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\n# Corporate client (home currency INR): foreign currency cash flows over next 6 months\nEXPOSURES = [\n    {\"currency\": \"USD\", \"type\": \"receivable\", \"amount\": 2_000_000, \"months\": 3},\n    {\"currency\": \"USD\", \"type\": \"payable\", \"amount\": 800_000, \"months\": 3},\n    {\"currency\": \"EUR\", \"type\": \"payable\", \"amount\": 1_200_000, \"months\": 6},\n]\nSPOT = {\"USD\": 84.20, \"EUR\": 91.50}\nRATES = {\"INR\": 6.5, \"USD\": 4.25, \"EUR\": 2.5}  # annual interest rates %\nVOL = {\"USD\": 4.5, \"EUR\": 6.5}  # annualised volatility %\n\n\n@tool\ndef net_exposure() -> dict:\n    \"\"\"Net foreign-currency exposure per currency and tenor (positive = net long / receivable).\"\"\"\n    out = {}\n    for e in EXPOSURES:\n        key = f\"{e['currency']}_{e['months']}m\"\n        out[key] = out.get(key, 0) + (e[\"amount\"] if e[\"type\"] == \"receivable\" else -e[\"amount\"])\n    return out\n\n\n@tool\ndef forward_rate(currency: str, months: int) -> str:\n    \"\"\"Forward rate (INR per unit) via covered interest parity, plus a 1-sigma move range for the unhedged spot.\"\"\"\n    s, t = SPOT[currency], months / 12\n    fwd = s * (1 + RATES[\"INR\"] / 100 * t) / (1 + RATES[currency] / 100 * t)\n    sigma = s * VOL[currency] / 100 * t ** 0.5\n    return f\"{currency} {months}m forward: {fwd:.2f} (spot {s}); 1-sigma spot range at maturity {s - sigma:.2f} - {s + sigma:.2f}\"\n\n\nSYSTEM = (\n    \"You are an FX sales advisor at a bank for a corporate client whose home currency is INR. The client's exposures \"\n    \"are already in the system: never ask the user for data. Always start by calling net_exposure, then call \"\n    \"forward_rate for each net exposure. Explain the risk of being unhedged in INR terms (use the 1-sigma range), and \"\n    \"recommend a hedge ratio and instrument (forward vs option) for each exposure, noting natural hedges. \"\n    \"Remind that hedging is for risk management, not speculation.\"\n)\n\n\ndef main():\n    banner(\"45 - FX Hedging Advisor (LangChain agent)\")\n    section(\"Advice\", run_agent(SYSTEM, [net_exposure, forward_rate], \"Analyse our FX exposures and recommend a hedging plan.\"))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "46_invoice_cheque_extractor", "title": "Invoice & Cheque Data Extractor", "category": "ops", "framework": "LangChain", "pattern": "Structured extraction", "description": "Extracts fields from invoices and cheques (OCR text) and validates them.", "how": "Pydantic schema extraction with Python validation (amount-in-words vs. figures, dates, IFSC).", "today": "Banks and their business clients process piles of invoices and cheques, reading the details and checking them before paying or clearing.", "who": "Payments / clearing operations, trade and accounts-payable teams.", "why": "Manual keying is slow, and mismatched amounts are a common source of errors and fraud.", "terms": ["Cheque truncation / OCR", "BIC / IBAN / IFSC", "GSTIN"], "code": "\"\"\"Invoice & Cheque Data Extractor — LangChain structured output + Ollama.\n\nInput is OCR text (plug in Tesseract / a vision model upstream).\n\nRun:  python 01_banking/46_invoice_cheque_extractor/app.py\n\"\"\"\n\nimport re\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import banner, run_structured, section\n\nCHEQUE_OCR = \"\"\"\nSTATE BANK OF INDIA   MG ROAD BRANCH   IFSC: SBIN0001234\n                                                     Date: 1 2 1 0 2 0 2 6\nPay  RAVI KUMAR ENTERPRISES                                  or Bearer\nRupees  Forty Five Thousand Six Hundred Only                 Rs. 45,600/-\nA/c No. 30012345678\n                                             For SUNRISE TRADERS  (Authorised Signatory)\nCheque No. 004512\n\"\"\"\n\nINVOICE_OCR = \"\"\"\nTAX INVOICE  No: SRT/26-27/0193   Date: 05/10/2026\nSeller: Sunrise Traders, GSTIN 27AAACS1234F1Z5\nBuyer: Ravi Kumar Enterprises, GSTIN 27AABCR5678K1Z2\n1. Steel brackets  200 x 150.00 = 30,000.00\n2. Fasteners box    40 x 236.00 =  9,440.00\nTaxable value 39,440.00   CGST 9% 3,549.60   SGST 9% 3,549.60\nInvoice Total 46,539.20\n\"\"\"\n\n\nclass Cheque(BaseModel):\n    bank: str\n    ifsc: str\n    cheque_number: str\n    date: str = Field(description=\"DD-MM-YYYY\")\n    payee: str\n    amount_in_words: str\n    amount_in_figures: float\n    account_number: str\n\n\nclass Invoice(BaseModel):\n    invoice_number: str\n    date: str\n    seller_gstin: str\n    buyer_gstin: str\n    taxable_value: float\n    total_tax: float\n    invoice_total: float\n\n\nWORDS = {\"one\": 1, \"two\": 2, \"three\": 3, \"four\": 4, \"five\": 5, \"six\": 6, \"seven\": 7, \"eight\": 8, \"nine\": 9, \"ten\": 10,\n         \"eleven\": 11, \"twelve\": 12, \"fifteen\": 15, \"twenty\": 20, \"thirty\": 30, \"forty\": 40, \"fifty\": 50, \"sixty\": 60,\n         \"seventy\": 70, \"eighty\": 80, \"ninety\": 90}\nSCALES = {\"hundred\": 100, \"thousand\": 1000, \"lakh\": 100_000, \"crore\": 10_000_000}\n\n\ndef words_to_number(text: str) -> int:\n    total = cur = 0\n    for w in re.findall(r\"[a-z]+\", text.lower()):\n        if w in WORDS:\n            cur += WORDS[w]\n        elif w == \"hundred\":\n            cur *= 100\n        elif w in SCALES:\n            total += cur * SCALES[w]\n            cur = 0\n    return total + cur\n\n\ndef main():\n    banner(\"46 - Invoice & Cheque Data Extractor (LangChain structured output)\")\n    sys_prompt = \"Extract fields exactly as printed. Remove spaces inside dates. Amounts as plain numbers.\"\n    c = run_structured(sys_prompt, CHEQUE_OCR, Cheque)\n    i = run_structured(sys_prompt, INVOICE_OCR, Invoice)\n    section(\"Cheque\", c.model_dump_json(indent=2))\n    section(\"Invoice\", i.model_dump_json(indent=2))\n\n    checks = {\n        \"cheque_words_match_figures\": words_to_number(c.amount_in_words) == round(c.amount_in_figures),\n        \"ifsc_format_valid\": bool(re.fullmatch(r\"[A-Z]{4}0[A-Z0-9]{6}\", c.ifsc)),\n        \"gstin_format_valid\": all(re.fullmatch(r\"\\d{2}[A-Z]{5}\\d{4}[A-Z]\\d[Z][A-Z0-9]\", g) for g in (i.seller_gstin, i.buyer_gstin)),\n        \"invoice_total_adds_up\": abs(i.taxable_value + i.total_tax - i.invoice_total) < 1,\n        \"cheque_vs_invoice_difference\": round(i.invoice_total - c.amount_in_figures, 2),\n    }\n    section(\"Validation\", checks)\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "47_financial_statement_analyzer", "title": "Financial Statement Analyzer", "category": "enterprise", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Analyses a company's income statement and balance sheet and writes an equity-style summary.", "how": "Ratios and YoY growth computed in Python; Financial Analyst and Report Writer agents interpret them.", "today": "Before lending to or investing in a company, analysts study its financial statements to judge profitability, debt and cash generation.", "who": "Credit analysts and equity / credit research analysts.", "why": "Headline growth can hide weak cash flow or rising debt; spotting this takes careful ratio analysis.", "terms": ["Financial statements", "EBITDA / EBIT", "Margins", "Leverage (debt-to-equity)", "Liquidity ratios (current ratio)", "Free cash flow"], "code": "\"\"\"Financial Statement Analyzer — CrewAI + Ollama.\n\nRun:  python 01_banking/47_financial_statement_analyzer/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nCOMPANY = \"Northwind Consumer Goods plc (fictional)\"\nFS = {  # millions\n    \"2024\": {\"revenue\": 4_820, \"cogs\": 2_990, \"opex\": 1_160, \"depreciation\": 140, \"interest\": 85, \"tax\": 115, \"net_income\": 330,\n             \"cash\": 410, \"receivables\": 690, \"inventory\": 820, \"total_assets\": 5_400, \"current_liabilities\": 1_350,\n             \"total_debt\": 1_600, \"equity\": 2_450, \"cfo\": 520, \"capex\": 260},\n    \"2025\": {\"revenue\": 5_150, \"cogs\": 3_310, \"opex\": 1_200, \"depreciation\": 150, \"interest\": 110, \"tax\": 98, \"net_income\": 282,\n             \"cash\": 280, \"receivables\": 860, \"inventory\": 1_010, \"total_assets\": 5_900, \"current_liabilities\": 1_610,\n             \"total_debt\": 1_980, \"equity\": 2_560, \"cfo\": 340, \"capex\": 300},\n}\n\n\ndef analyse(fs: dict) -> dict:\n    out = {}\n    for y, d in fs.items():\n        ebit = d[\"revenue\"] - d[\"cogs\"] - d[\"opex\"] - d[\"depreciation\"]\n        out[y] = {\"gross_margin_pct\": round((d[\"revenue\"] - d[\"cogs\"]) / d[\"revenue\"] * 100, 1),\n                  \"ebit_margin_pct\": round(ebit / d[\"revenue\"] * 100, 1), \"net_margin_pct\": round(d[\"net_income\"] / d[\"revenue\"] * 100, 1),\n                  \"roe_pct\": round(d[\"net_income\"] / d[\"equity\"] * 100, 1), \"interest_cover\": round(ebit / d[\"interest\"], 1),\n                  \"current_ratio\": round((d[\"cash\"] + d[\"receivables\"] + d[\"inventory\"]) / d[\"current_liabilities\"], 2),\n                  \"debt_to_equity\": round(d[\"total_debt\"] / d[\"equity\"], 2),\n                  \"dso_days\": round(d[\"receivables\"] / d[\"revenue\"] * 365), \"dio_days\": round(d[\"inventory\"] / d[\"cogs\"] * 365),\n                  \"free_cash_flow\": d[\"cfo\"] - d[\"capex\"], \"operating_cash_flow_to_net_income_pct\": round(d[\"cfo\"] / d[\"net_income\"] * 100)}\n    out[\"yoy_growth_pct\"] = {k: round((fs[\"2025\"][k] / fs[\"2024\"][k] - 1) * 100, 1) for k in (\"revenue\", \"net_income\", \"total_debt\", \"inventory\", \"receivables\")}\n    return out\n\n\ndef main():\n    banner(\"47 - Financial Statement Analyzer (CrewAI)\")\n    a = analyse(FS)\n    section(\"Ratios\", json.dumps(a, indent=2))\n    analyst = make_agent(\"Financial Analyst\", \"Interpret ratios and trends, spotting quality-of-earnings issues\",\n                         \"CFA charterholder who looks beyond headline growth to margins, working capital and cash.\")\n    writer = make_agent(\"Research Report Writer\", \"Write a clear, balanced company analysis\",\n                        \"You write concise research notes for credit and equity committees.\")\n    t1 = make_task(\"Company: {company}\\n\\nStatements:\\n{fs}\\n\\nRatios:\\n{ratios}\\n\\nAnalyse profitability, efficiency, liquidity, \"\n                   \"leverage and cash flow quality. Flag concerns.\", \"Analytical notes.\", analyst)\n    t2 = make_task(\"Write the report on {company}.\\n\\nExact ratios (quote these; never invent numbers):\\n{ratios}\", \"Sections: Summary (3 bullets), Performance, Balance sheet & liquidity, Cash flow, \"\n                   \"Key risks / red flags, Questions for management, Overall view (Positive / Neutral / Negative).\",\n                   writer, context=[t1])\n    section(\"Report\", run_crew([analyst, writer], [t1, t2], {\"company\": COMPANY, \"fs\": json.dumps(FS, indent=2), \"ratios\": json.dumps(a, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "48_earnings_call_analyzer", "title": "Earnings Call Analyzer", "category": "enterprise", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Extracts guidance, sentiment and risks from an earnings call transcript.", "how": "Transcript Analyst agent extracts key points; Sentiment Analyst agent rates management tone and risks.", "today": "After quarterly results, management hold an earnings call. Analysts and investors listen for changes in outlook and signs of trouble.", "who": "Equity research, investor relations and credit analysts.", "why": "Calls are long and the important signals are often subtle changes in wording.", "terms": ["Guidance", "NIM (Net Interest Margin)", "Delinquency / NPA / NPL"], "code": "\"\"\"Earnings Call Analyzer — CrewAI + Ollama.\n\nRun:  python 01_banking/48_earnings_call_analyzer/app.py\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nTRANSCRIPT = \"\"\"(Fictional Q3 FY26 earnings call - Meridian Bank)\nCEO: We delivered a solid quarter. Loan growth was 14% year on year, led by retail mortgages and SME. Net interest\nmargin compressed by 12 basis points to 3.42% as deposit costs caught up, but we expect margins to stabilise next\nquarter as rate cuts flow through to our deposit book.\nCFO: Operating expenses grew 11%, mainly technology and branch expansion. Cost-to-income is 46.8%. Credit costs rose to\n68 bps from 52 bps, driven by unsecured personal loans and credit cards where we've seen early delinquency tick up.\nWe've tightened underwriting in that segment. Gross NPA is 2.1%, up 15 bps. Provision coverage is 72%. CET1 is 13.4%.\nWe maintain FY guidance of 13-15% loan growth and a return on assets of 1.3-1.4%, though we now see the lower end as more likely.\nAnalyst 1: Can you quantify the unsecured stress? Is it spreading to other segments?\nCFO: Unsecured is 9% of the book. We're not seeing spillover to mortgages or SME; those remain very clean.\nAnalyst 2: Deposit growth was 9% versus loans at 14%. How will you fund growth?\nCEO: The LDR is at 88%. We'll lean on granular retail deposits, and may moderate loan growth if deposits lag. We won't chase\nexpensive bulk deposits.\n\"\"\"\n\n\ndef main():\n    banner(\"48 - Earnings Call Analyzer (CrewAI)\")\n    analyst = make_agent(\"Transcript Analyst\", \"Extract key financial metrics, guidance changes and management commitments\",\n                         \"Bank equity research analyst who catches subtle guidance changes.\")\n    sentiment = make_agent(\"Sentiment & Risk Analyst\", \"Assess management tone and highlight risks and evasive answers\",\n                           \"You read between the lines of management commentary and analyst Q&A.\")\n    t1 = make_task(\"Transcript:\\n{transcript}\\n\\nExtract: KPIs table, guidance (maintained/raised/lowered/softened), key themes.\",\n                   \"KPI table, guidance status, themes.\", analyst)\n    t2 = make_task(\"Assess tone (score -5 to +5 with reasons), hedging language, risks, and what to watch next quarter.\",\n                   \"Investor note: Tone score, Top 3 positives, Top 3 risks, Watch-list, One-line takeaway.\", sentiment, context=[t1])\n    section(\"Earnings call note\", run_crew([analyst, sentiment], [t1, t2], {\"transcript\": TRANSCRIPT}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "49_internal_audit_assistant", "title": "Internal Audit Assistant", "category": "enterprise", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Tests a sample of transactions against controls and drafts audit findings.", "how": "Python runs control tests (maker-checker, limits, SoD); Auditor and Audit Manager agents write findings with risk ratings.", "today": "Internal auditors test samples of transactions to check controls worked, e.g. that a different person approved each payment within their authority.", "who": "Internal audit.", "why": "Testing and report writing are labour-intensive; findings must follow a strict format for the audit committee.", "terms": ["Internal audit", "Maker-checker"], "code": "\"\"\"Internal Audit Assistant — CrewAI + Ollama.\n\nRun:  python 01_banking/49_internal_audit_assistant/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nAPPROVAL_LIMITS = {\"officer\": 50_000, \"manager\": 250_000, \"head\": 1_000_000}\nSAMPLE = [  # payments released in the quarter (sample)\n    {\"id\": \"P-01\", \"amount\": 42_000, \"maker\": \"u12\", \"checker\": \"u31\", \"checker_role\": \"officer\", \"vendor_in_master\": True, \"weekend\": False},\n    {\"id\": \"P-02\", \"amount\": 180_000, \"maker\": \"u12\", \"checker\": \"u12\", \"checker_role\": \"manager\", \"vendor_in_master\": True, \"weekend\": False},\n    {\"id\": \"P-03\", \"amount\": 310_000, \"maker\": \"u18\", \"checker\": \"u44\", \"checker_role\": \"manager\", \"vendor_in_master\": True, \"weekend\": False},\n    {\"id\": \"P-04\", \"amount\": 49_900, \"maker\": \"u20\", \"checker\": \"u31\", \"checker_role\": \"officer\", \"vendor_in_master\": False, \"weekend\": True},\n    {\"id\": \"P-05\", \"amount\": 49_800, \"maker\": \"u20\", \"checker\": \"u31\", \"checker_role\": \"officer\", \"vendor_in_master\": False, \"weekend\": True},\n    {\"id\": \"P-06\", \"amount\": 75_000, \"maker\": \"u15\", \"checker\": \"u44\", \"checker_role\": \"manager\", \"vendor_in_master\": True, \"weekend\": False},\n]\n\n\ndef test_controls(rows):\n    exc = []\n    for r in rows:\n        if r[\"maker\"] == r[\"checker\"]:\n            exc.append({\"id\": r[\"id\"], \"control\": \"Maker-checker / segregation of duties\", \"detail\": \"Same user made and approved\"})\n        if r[\"amount\"] > APPROVAL_LIMITS[r[\"checker_role\"]]:\n            exc.append({\"id\": r[\"id\"], \"control\": \"Delegation of authority\", \"detail\": f\"{r['amount']:,} > {r['checker_role']} limit\"})\n        if not r[\"vendor_in_master\"]:\n            exc.append({\"id\": r[\"id\"], \"control\": \"Vendor master\", \"detail\": \"Payee not in approved vendor master\"})\n    near = [r[\"id\"] for r in rows if 0.95 * APPROVAL_LIMITS[\"officer\"] <= r[\"amount\"] < APPROVAL_LIMITS[\"officer\"]]\n    if len(near) >= 2:\n        exc.append({\"id\": \",\".join(near), \"control\": \"Limit splitting\", \"detail\": \"Multiple payments just below officer limit\"})\n    return {\"sample_size\": len(rows), \"exceptions\": exc}\n\n\ndef main():\n    banner(\"49 - Internal Audit Assistant (CrewAI)\")\n    results = test_controls(SAMPLE)\n    section(\"Control testing\", json.dumps(results, indent=2))\n    auditor = make_agent(\"Internal Auditor\", \"Evaluate control exceptions and their root causes\",\n                         \"IIA-certified auditor focusing on payments and fraud risk.\")\n    manager = make_agent(\"Audit Manager\", \"Write audit findings with ratings and agreed actions\",\n                         \"You write findings in Condition / Criteria / Cause / Effect / Recommendation format.\")\n    t1 = make_task(\"Sample:\\n{sample}\\n\\nResults:\\n{results}\\n\\nEvaluate each exception, note patterns (e.g. same users), possible fraud indicators.\",\n                   \"Exception evaluation.\", auditor)\n    t2 = make_task(\"Write the audit findings.\\n\\nControl test exceptions (quote these exactly):\\n{results}\", \"Findings (Condition, Criteria, Cause, Effect, Recommendation, Rating High/Medium/Low), \"\n                   \"overall control environment opinion (Satisfactory / Needs improvement / Unsatisfactory).\", manager, context=[t1])\n    section(\"Audit report\", run_crew([auditor, manager], [t1, t2], {\"sample\": json.dumps(SAMPLE, indent=2), \"results\": json.dumps(results, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "50_operational_risk_analyzer", "title": "Operational Risk Incident Analyzer", "category": "enterprise", "framework": "LangChain", "pattern": "Structured extraction", "description": "Classifies operational-loss incidents into Basel event types and suggests root cause and controls.", "how": "Each incident is mapped to a structured schema (Basel event type, root cause, severity, control).", "today": "Every operational loss or near miss (an IT outage, a keying error, a forged signature) is logged, classified and analysed to prevent repeats.", "who": "Operational risk teams (Risk department).", "why": "Inconsistent classification makes loss data unreliable for reporting and capital calculations.", "terms": ["Operational risk", "Basel event types"], "code": "\"\"\"Operational Risk Incident Analyzer — LangChain structured output + Ollama.\n\nRun:  python 01_banking/50_operational_risk_analyzer/app.py\n\"\"\"\n\nimport sys\nfrom collections import Counter\nfrom pathlib import Path\nfrom typing import Literal\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import banner, run_structured, section\n\nINCIDENTS = [\n    (\"INC-101\", 42_000, \"Teller processed a withdrawal on a forged signature; customer reported unauthorised debit next day.\"),\n    (\"INC-102\", 180_000, \"Core banking batch job failed overnight; 12,000 salary credits delayed by 6 hours, compensation paid.\"),\n    (\"INC-103\", 7_500, \"Wrong FX rate keyed manually for a corporate remittance; difference absorbed by the bank.\"),\n    (\"INC-104\", 0, \"Phishing email led an employee to enter credentials; account locked by SOC within 20 minutes, no loss.\"),\n    (\"INC-105\", 250_000, \"Regulator fined the bank for late filing of currency transaction reports for two quarters.\"),\n    (\"INC-106\", 15_000, \"Branch ATM damaged by flood water; cash written off and repairs required.\"),\n]\n\n\nclass Incident(BaseModel):\n    basel_event_type: Literal[\"Internal Fraud\", \"External Fraud\", \"Employment Practices & Workplace Safety\",\n                              \"Clients, Products & Business Practices\", \"Damage to Physical Assets\",\n                              \"Business Disruption & System Failures\", \"Execution, Delivery & Process Management\"]\n    root_cause: Literal[\"people\", \"process\", \"systems\", \"external\"]\n    severity: Literal[\"low\", \"medium\", \"high\"]\n    near_miss: bool = Field(description=\"True if no financial loss occurred\")\n    control_failure: str = Field(description=\"Which control failed, one sentence\")\n    recommended_control: str = Field(description=\"Preventive or detective control to add, one sentence\")\n\n\ndef main():\n    banner(\"50 - Operational Risk Incident Analyzer (LangChain structured output)\")\n    system = (\n        \"You are an operational risk analyst. Classify the incident using the Basel II level-1 event types:\\n\"\n        \"- Internal Fraud: dishonest acts by employees for personal gain\\n\"\n        \"- External Fraud: theft, forgery, hacking or scams by third parties\\n\"\n        \"- Employment Practices & Workplace Safety: HR, discrimination, injury\\n\"\n        \"- Clients, Products & Business Practices: mis-selling, regulatory breaches, fines\\n\"\n        \"- Damage to Physical Assets: natural disasters, fire, flood, vandalism\\n\"\n        \"- Business Disruption & System Failures: IT outages, batch failures, utilities\\n\"\n        \"- Execution, Delivery & Process Management: keying errors, failed processing, data entry mistakes\\n\"\n        \"Honest mistakes and outages are never fraud. Describe the control failure in words, not yes/no.\"\n    )\n    results = []\n    for iid, loss, text in INCIDENTS:\n        r = run_structured(system, f\"Loss: {loss}. {text}\", Incident)\n        results.append((iid, loss, r))\n        section(f\"{iid} (loss {loss:,})\", f\"{text}\\n{r.model_dump_json(indent=2)}\")\n\n    by_type = Counter(r.basel_event_type for _, _, r in results)\n    loss_by_type = Counter()\n    for _, loss, r in results:\n        loss_by_type[r.basel_event_type] += loss\n    section(\"Summary\", \"\\n\".join(f\"{t}: {n} incident(s), loss {loss_by_type[t]:,}\" for t, n in by_type.most_common()))\n\n\nif __name__ == \"__main__\":\n    main()\n"}]}, {"folder": "02_retail", "name": "Retail", "icon": "🛒", "tagline": "Stores, e-commerce and consumer brands", "description": "AI agents for forecasting, pricing and customer insight in stores and e-commerce.", "industry_101": "**How a retailer makes money:** it buys products from suppliers (*cost*) and sells them for more (*price*). The\ndifference is the *gross margin*. Profit comes from selling enough volume at a healthy margin, while keeping stores,\nwarehouses and delivery costs under control.\n\n**What makes it hard:**\n1. **Inventory** is cash sitting on shelves. Too little means empty shelves and lost sales; too much means markdowns and waste.\n2. **Pricing** must beat competitors without destroying margin, and customers notice price swings.\n3. **Customers** compare everything online; reviews and service quality directly drive sales.\n", "categories": {"supply": "📦 Supply Chain & Inventory", "customer": "🙋 Customer Insight", "merch": "🏷️ Merchandising & Pricing"}, "areas": [["supply", "Supply Chain & Inventory", "Forecasts demand, orders from suppliers and keeps the right stock in the right place."], ["customer", "Customer Insight", "Listens to customers (reviews, complaints, behaviour) to improve products and service."], ["merch", "Merchandising & Pricing", "Decides what to sell, at what price and with which promotions."]], "glossary": {"Demand forecasting": ["Supply chain", "Predicting how many units will sell in future weeks, using past sales, trends, seasons and promotions."], "Replenishment": ["Supply chain", "Re-ordering stock from suppliers so shelves don't run empty."], "Lead time": ["Supply chain", "How long a supplier takes to deliver after an order is placed."], "Weeks of cover": ["Supply chain", "How many weeks current stock will last at forecast sales."], "Safety stock": ["Supply chain", "Extra stock held to protect against forecast errors and late deliveries."], "Reorder point": ["Supply chain", "The stock level at which a new order must be placed to arrive before running out."], "Stock-out": ["Supply chain", "When a product is unavailable: a lost sale and an unhappy customer."], "Promotion uplift": ["Supply chain", "The extra sales a promotion generates over normal demand."], "Customer reviews / sentiment": ["Customer", "Star ratings and comments; sentiment is whether they are positive, neutral or negative."], "Product defect": ["Customer", "A fault in the product itself (leaks, breakage), as opposed to a matter of taste."], "Product recall": ["Customer", "Withdrawing an unsafe product from sale and from customers. Safety complaints must be escalated fast."], "Gross margin": ["Pricing", "(Price - cost) / price. A 30% margin means 30p of every 1 of sales is left after paying for the product."], "Price elasticity": ["Pricing", "How much volume changes when price changes. Elasticity of -2 means a 1% price cut lifts volume about 2%."], "Competitive price index": ["Pricing", "Our price compared to competitors' average for the same product."], "Markdown": ["Pricing", "A permanent price cut, usually to clear excess or seasonal stock."], "Category manager": ["Pricing", "The person who owns a product category's range, pricing and profit."]}, "use_cases": [{"slug": "01_demand_forecasting_agent", "title": "Demand Forecasting & Replenishment Agent", "category": "supply", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Forecasts weekly demand per product and recommends what to reorder, flagging stock-out risks.", "how": "Tools compute trend-based forecasts with promotion uplift, weeks of cover, safety stock and order quantities in full cases; the agent explains priorities and actions for slow sellers.", "today": "Every week, replenishment analysts decide how much of each product to order from suppliers, based on recent sales, trends and upcoming promotions.", "who": "Replenishment / inventory analysts in the supply chain team.", "why": "Large retailers manage tens of thousands of products. Seasonal products (sunscreen in summer, scarves in winter) change fast, and both empty shelves and overstock cost money.", "terms": ["Demand forecasting", "Replenishment", "Lead time", "Weeks of cover", "Safety stock", "Reorder point", "Stock-out", "Promotion uplift"], "code": "\"\"\"Demand Forecasting & Replenishment Agent — LangChain tool-calling agent + Ollama.\n\nRun:  python 02_retail/01_demand_forecasting_agent/app.py\n      python 02_retail/01_demand_forecasting_agent/app.py \"Will SKU-102 run out before the next delivery?\"\n\"\"\"\n\nimport math\nimport statistics\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\n# Last 8 weeks of unit sales, current stock, supplier lead time and planned promotions\nPRODUCTS = {\n    \"SKU-101\": {\"name\": \"Organic oat milk 1L\", \"sales\": [410, 395, 430, 420, 445, 460, 452, 470], \"stock\": 900,\n                \"on_order\": 0, \"lead_time_weeks\": 1, \"case_size\": 12, \"promo_next_week\": False},\n    \"SKU-102\": {\"name\": \"Sunscreen SPF50 200ml\", \"sales\": [80, 95, 120, 150, 175, 210, 240, 260], \"stock\": 380,\n                \"on_order\": 0, \"lead_time_weeks\": 2, \"case_size\": 24, \"promo_next_week\": True},\n    \"SKU-103\": {\"name\": \"Wool scarf (grey)\", \"sales\": [60, 52, 41, 35, 30, 22, 18, 15], \"stock\": 640,\n                \"on_order\": 200, \"lead_time_weeks\": 4, \"case_size\": 10, \"promo_next_week\": False},\n}\nPROMO_UPLIFT = 0.35   # promotions lift demand ~35%\nSERVICE_Z = 1.65      # ~95% service level\n\n\n@tool\ndef list_products() -> dict:\n    \"\"\"List SKUs with product names.\"\"\"\n    return {sku: p[\"name\"] for sku, p in PRODUCTS.items()}\n\n\n@tool\ndef forecast_demand(sku: str, weeks: int = 4) -> dict:\n    \"\"\"Forecast weekly unit demand for a SKU using the recent trend, plus promotion uplift.\"\"\"\n    p = PRODUCTS[sku]\n    recent = p[\"sales\"][-4:]\n    trend = (recent[-1] - recent[0]) / 3  # units per week\n    base = statistics.mean(recent)\n    forecast = []\n    for w in range(1, weeks + 1):\n        f = max(base + trend * (w + 1.5), 0)\n        if w == 1 and p[\"promo_next_week\"]:\n            f *= 1 + PROMO_UPLIFT\n        forecast.append(round(f))\n    return {\"sku\": sku, \"trend_units_per_week\": round(trend, 1), \"weekly_forecast\": forecast,\n            \"promo_next_week\": p[\"promo_next_week\"]}\n\n\n@tool\ndef reorder_plan(sku: str) -> dict:\n    \"\"\"Weeks of stock cover, reorder point and recommended order quantity (rounded to full cases).\"\"\"\n    p = PRODUCTS[sku]\n    fc_info = forecast_demand.invoke({\"sku\": sku, \"weeks\": 12})\n    fc = fc_info[\"weekly_forecast\"]\n    lead, horizon = p[\"lead_time_weeks\"], p[\"lead_time_weeks\"] + 2   # order covers lead time + 2 weeks\n    lead_demand = sum(fc[:lead])\n    safety = SERVICE_Z * statistics.stdev(p[\"sales\"]) * math.sqrt(lead)\n    reorder_point = lead_demand + safety\n    available = p[\"stock\"] + p[\"on_order\"]\n    cover_weeks, left = 0.0, available\n    for f in fc:\n        if left >= f:\n            cover_weeks, left = cover_weeks + 1, left - f\n        else:\n            cover_weeks += left / f if f else 0\n            break\n    order_now = available < reorder_point\n    need = reorder_point + sum(fc[lead:horizon]) - available if order_now else 0\n    qty = math.ceil(need / p[\"case_size\"]) * p[\"case_size\"] if need > 0 else 0\n    trend = fc_info[\"trend_units_per_week\"]\n    if trend < 0 and cover_weeks >= 6:\n        status = \"SLOW SELLER / OVERSTOCK (consider markdown or cancelling open orders)\"\n    elif trend > 0.05 * statistics.mean(p[\"sales\"][-4:]):\n        status = \"GROWING DEMAND (do not discount)\"\n    else:\n        status = \"STEADY\"\n    return {\"sku\": sku, \"available_units\": available,\n            \"weeks_of_cover\": f\"{cover_weeks:.1f}\" if cover_weeks < 12 else \"12+\",\n            \"lead_time_weeks\": lead, \"reorder_point\": round(reorder_point),\n            \"order_now\": order_now, \"recommended_order_units\": qty,\n            \"stockout_risk_before_delivery\": available < lead_demand, \"demand_status\": status}\n\n\nSYSTEM = (\n    \"You are a retail replenishment analyst. Use list_products, then forecast_demand and reorder_plan for each SKU. \"\n    \"Copy numbers exactly from the tools. Give a table (SKU, product, weeks of cover, order now?, order units), flag \"\n    \"stock-out risks first, mention trends and promotions, and suggest actions for slow sellers (e.g. markdown, \"\n    \"cancel open orders).\"\n)\n\n\ndef main():\n    banner(\"Retail 01 - Demand Forecasting & Replenishment Agent (LangChain agent)\")\n    q = sys.argv[1] if len(sys.argv) > 1 else \"Review all products: what should we reorder this week and why?\"\n    section(\"Question\", q)\n    section(\"Answer\", run_agent(SYSTEM, [list_products, forecast_demand, reorder_plan], q))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "02_product_review_analyzer", "title": "Product Review Analyzer", "category": "customer", "framework": "LangChain", "pattern": "Structured extraction", "description": "Turns customer reviews into sentiment, complaint themes, defects and safety issues.", "how": "Each review is classified into a Pydantic schema, Python aggregates the counts, and an LLM chain writes the quality report with escalation of safety concerns.", "today": "Product and quality teams read customer reviews to spot recurring problems, fix product listings and catch safety issues early.", "who": "Product managers, quality assurance and customer care teams.", "why": "Popular products get thousands of reviews. Important signals, like a burning smell or a cracked blade, can be buried among comments about delivery or colour.", "terms": ["Customer reviews / sentiment", "Product defect", "Product recall"], "code": "\"\"\"Product Review Analyzer — LangChain structured output + Ollama.\n\nRun:  python 02_retail/02_product_review_analyzer/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom collections import Counter\nfrom pathlib import Path\nfrom typing import Literal\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import banner, run_chain, run_structured, section\n\nPRODUCT = \"AeroBlend 600W Personal Blender\"\nREVIEWS = [\n    (5, \"Makes smoothies in 30 seconds and is easy to clean. Love it!\"),\n    (2, \"Lid started leaking after two weeks. Juice everywhere on my counter.\"),\n    (4, \"Powerful for the size, but quite loud early in the morning.\"),\n    (1, \"Motor burned out after a month. Smelled of burning plastic. Very disappointed.\"),\n    (3, \"Does the job but the cup is smaller than the photos suggest.\"),\n    (2, \"Leaks from the bottom seal every time I blend ice.\"),\n    (5, \"Great value, delivery was fast and it crushes ice well.\"),\n    (1, \"Blade assembly cracked; I'm worried about plastic bits in my drink.\"),\n]\n\n\nclass Review(BaseModel):\n    sentiment: Literal[\"positive\", \"neutral\", \"negative\"]\n    themes: list[Literal[\"performance\", \"leaking\", \"durability\", \"noise\", \"size\", \"cleaning\", \"value\",\n                         \"delivery\"]] = Field(description=\"Only the themes the review actually talks about\")\n    product_defect: bool = Field(description=\"True if the review describes a product fault, not just a preference\")\n    safety_concern: bool = Field(description=\"True for burning smells, cracked blades, overheating, injury risk\")\n\n\nSYSTEM = (\n    \"You are a retail product quality analyst. Write a short report for the product and quality teams: overall \"\n    \"sentiment, top complaint themes with counts, any SAFETY issues that need urgent escalation (possible recall \"\n    \"review), and 3 concrete actions (supplier quality check, listing description fix, customer replies). \"\n    \"Use only the counts provided.\"\n)\n\n\ndef main():\n    banner(\"Retail 02 - Product Review Analyzer (LangChain structured output)\")\n    rows = []\n    for stars, text in REVIEWS:\n        r = run_structured(\"Classify this product review accurately.\", text, Review)\n        rows.append({\"stars\": stars, \"text\": text, **r.model_dump()})\n        section(f\"{stars}★ {text[:60]}\", r.model_dump())\n\n    summary = {\n        \"product\": PRODUCT,\n        \"reviews\": len(rows),\n        \"avg_stars\": round(sum(r[\"stars\"] for r in rows) / len(rows), 2),\n        \"sentiment\": dict(Counter(r[\"sentiment\"] for r in rows)),\n        \"theme_counts\": dict(Counter(t for r in rows for t in r[\"themes\"]).most_common()),\n        \"defect_reviews\": sum(r[\"product_defect\"] for r in rows),\n        \"safety_reviews\": [r[\"text\"] for r in rows if r[\"safety_concern\"]],\n    }\n    section(\"Summary\", json.dumps(summary, indent=2, ensure_ascii=False))\n    section(\"Quality report\", run_chain(SYSTEM, \"Summary:\\n{s}\", s=json.dumps(summary, indent=2, ensure_ascii=False)))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "03_dynamic_pricing_advisor", "title": "Dynamic Pricing Advisor", "category": "merch", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Recommends price changes from competitor prices, stock levels and elasticity, within margin guardrails.", "how": "Python proposes prices (30% margin floor, max 10% move) and estimates profit impact; a Pricing Analyst agent explains them and a Category Manager agent approves or adjusts and writes the pricing memo.", "today": "Pricing teams regularly review prices against competitors and stock levels: raise prices where there is room, cut to clear overstock, and protect margin.", "who": "Pricing analysts and category managers.", "why": "Every price change trades volume against margin, and customers notice price swings. Decisions must respect margin rules and be explainable.", "terms": ["Gross margin", "Price elasticity", "Competitive price index", "Markdown", "Category manager"], "code": "\"\"\"Dynamic Pricing Advisor — CrewAI + Ollama.\n\nPython proposes guard-railed prices (margin floor, max change); agents review and write the pricing memo.\n\nRun:  python 02_retail/03_dynamic_pricing_advisor/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nPRODUCTS = [  # elasticity: % change in volume for a 1% price change\n    {\"sku\": \"P-1\", \"name\": \"Wireless earbuds\", \"cost\": 21.0, \"price\": 49.99, \"competitor_prices\": [44.99, 46.50, 45.00],\n     \"weekly_units\": 320, \"weeks_of_stock\": 3.0, \"elasticity\": -1.8},\n    {\"sku\": \"P-2\", \"name\": \"Stainless water bottle 750ml\", \"cost\": 6.2, \"price\": 14.99, \"competitor_prices\": [17.99, 18.50, 16.99],\n     \"weekly_units\": 540, \"weeks_of_stock\": 6.0, \"elasticity\": -1.1},\n    {\"sku\": \"P-3\", \"name\": \"Fleece throw blanket\", \"cost\": 9.5, \"price\": 29.99, \"competitor_prices\": [27.99, 29.00, 31.50],\n     \"weekly_units\": 85, \"weeks_of_stock\": 22.0, \"elasticity\": -2.2},\n]\nMIN_MARGIN = 0.30      # never price below 30% gross margin\nMAX_CHANGE = 0.10      # move at most 10% at a time\n\n\ndef propose(p: dict) -> dict:\n    comp = sum(p[\"competitor_prices\"]) / len(p[\"competitor_prices\"])\n    gap = (p[\"price\"] / comp - 1) * 100\n    target = comp\n    reason = f\"Move toward competitor average ({gap:+.1f}% vs competitors)\"\n    if p[\"weeks_of_stock\"] > 12:          # overstock: price to clear\n        target = min(comp, p[\"price\"]) * 0.95\n        reason = f\"Overstock ({p['weeks_of_stock']} weeks of stock): cut to clear\"\n    elif p[\"weeks_of_stock\"] < 4:         # low stock: no need to discount\n        target = max(target, p[\"price\"])\n        reason = (f\"Low stock ({p['weeks_of_stock']} weeks): hold price even though it is {gap:+.1f}% vs \"\n                  f\"competitors, to avoid selling out\")\n    lo, hi = p[\"price\"] * (1 - MAX_CHANGE), p[\"price\"] * (1 + MAX_CHANGE)\n    floor = p[\"cost\"] / (1 - MIN_MARGIN)\n    new = round(max(min(max(target, lo), hi), floor), 2)\n    if new == round(hi, 2) and target > hi:\n        reason += f\"; capped at the {MAX_CHANGE:.0%} max move\"\n    change = new / p[\"price\"] - 1\n    units = p[\"weekly_units\"] * (1 + p[\"elasticity\"] * change)\n    profit_now = (p[\"price\"] - p[\"cost\"]) * p[\"weekly_units\"]\n    profit_new = (new - p[\"cost\"]) * units\n    return {\"sku\": p[\"sku\"], \"name\": p[\"name\"], \"current_price\": p[\"price\"], \"competitor_avg\": round(comp, 2),\n            \"proposed_price\": new, \"change_pct\": round(change * 100, 1), \"margin_pct\": round((new - p[\"cost\"]) / new * 100, 1),\n            \"expected_weekly_units\": round(units), \"weekly_gross_profit_now\": round(profit_now),\n            \"weekly_gross_profit_new\": round(profit_new), \"weeks_of_stock\": p[\"weeks_of_stock\"], \"pricing_reason\": reason}\n\n\ndef main():\n    banner(\"Retail 03 - Dynamic Pricing Advisor (CrewAI)\")\n    proposals = [propose(p) for p in PRODUCTS]\n    section(\"Guard-railed price proposals\", json.dumps(proposals, indent=2))\n\n    analyst = make_agent(\"Pricing Analyst\", \"Explain each proposed price using competitors, stock and elasticity\",\n                         \"Retail pricing analyst who balances volume, margin and price perception.\")\n    manager = make_agent(\"Category Manager\", \"Approve, adjust or reject each price change and write the pricing memo\",\n                         \"You own the category P&L and protect customer trust (no confusing price swings).\")\n    t1 = make_task(\"Proposals (exact figures):\\n{proposals}\\n\\nGuardrails: minimum margin 30%, max change 10% per move.\\n\\n\"\n                   \"Explain the rationale (start from pricing_reason) and risks of each proposal.\", \"Per-SKU rationale and risks.\", analyst)\n    t2 = make_task(\"Proposals (exact figures; quote these, never recalculate):\\n{proposals}\\n\\n\"\n                   \"Decide APPROVE / ADJUST / REJECT per SKU and write a short pricing memo. Base each reason on pricing_reason.\",\n                   \"Memo: decision table (SKU, current, proposed, decision, reason), expected profit impact, \"\n                   \"and notes for marketing and store teams.\", manager, context=[t1])\n    section(\"Pricing memo\", run_crew([analyst, manager], [t1, t2], {\"proposals\": json.dumps(proposals, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}]}, {"folder": "03_insurance", "name": "Insurance", "icon": "🛡️", "tagline": "Property & casualty, motor and home insurers", "description": "AI agents for claims handling, fraud detection, coverage questions and pricing.", "industry_101": "**How an insurer makes money:** customers pay a *premium* to transfer a risk (a car crash, a burglary) to the\ninsurer. The insurer pools many customers' premiums and pays the *claims* of the few who suffer a loss. Profit comes\nfrom pricing risk correctly (premiums > claims + costs) and from investing premiums before claims are paid.\n\n**What makes it hard:**\n1. **Pricing (underwriting):** charge each customer the right premium for their risk. Too low loses money; too high loses customers.\n2. **Claims:** pay genuine claims quickly and fairly, while catching fraud, which adds costs for every honest customer.\n3. **Clarity:** policies are long legal documents. Customers need clear answers about what they are covered for.\n", "categories": {"claims": "🧾 Claims & Fraud", "policy": "🙋 Policy & Customer Service", "underwriting": "📝 Underwriting & Pricing"}, "areas": [["claims", "Claims & Fraud", "Handles losses reported by customers, pays valid claims and investigates suspicious ones."], ["policy", "Policy & Customer Service", "Answers customers' questions about their cover and handles policy changes."], ["underwriting", "Underwriting & Pricing", "Decides which risks to accept and at what premium."]], "glossary": {"Premium": ["Basics", "The price a customer pays for an insurance policy, usually yearly or monthly."], "Policy wording / schedule": ["Basics", "The wording is the full contract (what is and isn't covered); the schedule lists this customer's chosen covers and limits."], "Excess (deductible)": ["Basics", "The amount the customer pays towards each claim before the insurer pays the rest."], "Sum insured": ["Basics", "The maximum the insurer will pay for a policy or item."], "Exclusion": ["Basics", "Something the policy specifically does not cover, e.g. wear and tear."], "Add-on cover": ["Basics", "Optional extra cover bought on top of the core policy, e.g. accidental damage."], "Claim": ["Claims", "A customer's request for payment after a loss covered by the policy."], "FNOL": ["Claims", "First Notice of Loss: the first report of a claim to the insurer."], "Claims triage": ["Claims", "Sorting new claims by complexity and risk: fast-track simple ones, send complex ones to experts."], "Adjuster": ["Claims", "The claims professional who assesses a claim and decides what the insurer pays."], "Insurance fraud": ["Claims", "Exaggerating or inventing a claim. Fraud costs insurers billions, raising premiums for everyone."], "Red flag": ["Claims", "A warning sign of possible fraud, e.g. a claim soon after the policy started or no proof of ownership."], "SIU": ["Claims", "Special Investigations Unit: the team that investigates suspected fraud."], "Subrogation": ["Claims", "Recovering what the insurer paid from a third party who caused the loss, e.g. the at-fault driver's insurer."], "Underwriting": ["Pricing", "Assessing a risk and deciding whether to insure it and on what terms."], "Rating factor": ["Pricing", "A characteristic that changes the premium, e.g. driver age, car group or postcode."], "Rating engine": ["Pricing", "The system that calculates a premium from a base rate and rating factors."], "Vehicle (insurance) group": ["Pricing", "A 1-50 scale ranking cars by repair cost, performance and security. Higher groups cost more to insure."], "Voluntary excess": ["Pricing", "An extra excess the customer chooses to pay on claims in exchange for a lower premium."]}, "use_cases": [{"slug": "01_claims_triage_fraud", "title": "Claims Triage & Fraud Detection", "category": "claims", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Triages new claims into fast-track, adjuster review or fraud investigation, and spots recovery opportunities.", "how": "Python applies red-flag rules (new policy, late reporting, near sum insured, prior claims) and decides the handling (pay, adjuster review, SIU referral), so no honest customer is flagged by the AI; a Claims Adjuster agent assesses each claim and an SIU Investigator agent writes evidence requests, customer messages and recovery actions.", "today": "When a customer reports a loss, claims handlers decide how to handle it: pay simple claims fast, send complex ones to an adjuster, and refer suspicious ones to the fraud team.", "who": "Claims handlers, adjusters and the Special Investigations Unit (SIU).", "why": "Honest customers expect quick payment, but fraud is expensive. Handlers must spot red flags without treating genuine customers as suspects, and must not miss chances to recover costs from at-fault third parties.", "terms": ["FNOL", "Claims triage", "Adjuster", "Insurance fraud", "Red flag", "SIU", "Subrogation", "Sum insured"], "code": "\"\"\"Claims Triage & Fraud Detection — CrewAI + Ollama.\n\nPython applies triage and fraud red-flag rules (auditable); agents assess and decide.\n\nRun:  python 03_insurance/01_claims_triage_fraud/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom datetime import date\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nCLAIMS = [\n    {\"id\": \"CLM-501\", \"type\": \"Home - escape of water\", \"policy_start\": \"2021-03-01\", \"loss_date\": \"2026-09-28\",\n     \"reported\": \"2026-09-29\", \"amount\": 1_850, \"sum_insured\": 250_000, \"prior_claims_3y\": 0,\n     \"description\": \"Washing machine hose burst, kitchen floor and cabinet plinths damaged. Plumber invoice attached.\"},\n    {\"id\": \"CLM-502\", \"type\": \"Home - theft\", \"policy_start\": \"2026-08-20\", \"loss_date\": \"2026-09-12\",\n     \"reported\": \"2026-10-03\", \"amount\": 14_200, \"sum_insured\": 15_000, \"prior_claims_3y\": 2,\n     \"description\": \"Burglary while on holiday. Laptop, two watches and jewellery taken. No receipts, no sign of forced entry.\"},\n    {\"id\": \"CLM-503\", \"type\": \"Motor - collision\", \"policy_start\": \"2024-06-10\", \"loss_date\": \"2026-10-01\",\n     \"reported\": \"2026-10-01\", \"amount\": 6_400, \"sum_insured\": 18_000, \"prior_claims_3y\": 1,\n     \"description\": \"Rear-ended at traffic lights. Third party admitted fault at scene; dashcam footage available.\"},\n]\n\n\ndef triage(c: dict) -> dict:\n    flags = []\n    policy_age = (date.fromisoformat(c[\"loss_date\"]) - date.fromisoformat(c[\"policy_start\"])).days\n    delay = (date.fromisoformat(c[\"reported\"]) - date.fromisoformat(c[\"loss_date\"])).days\n    if policy_age < 60: flags.append(f\"Loss {policy_age} days after policy start\")\n    if delay > 14: flags.append(f\"Reported {delay} days after loss\")\n    if c[\"amount\"] > 0.8 * c[\"sum_insured\"]: flags.append(\"Claim close to sum insured\")\n    if c[\"prior_claims_3y\"] >= 2: flags.append(f\"{c['prior_claims_3y']} prior claims in 3 years\")\n    if \"no receipts\" in c[\"description\"].lower(): flags.append(\"No proof of ownership\")\n    if \"no sign of forced entry\" in c[\"description\"].lower(): flags.append(\"No forced entry on a burglary claim\")\n    fraud_score = min(len(flags) * 20, 100)\n    if fraud_score >= 60:\n        route = \"SIU referral\"\n    elif c[\"amount\"] < 2_500 and not flags:\n        route = \"Fast-track payment\"\n    else:\n        route = \"Adjuster review\"\n    recovery = \"third party admitted fault\" in c[\"description\"].lower()\n    handling = {\"Fast-track payment\": \"PAY\", \"Adjuster review\": \"ADJUSTER REVIEW, THEN PAY IF VALID\",\n                \"SIU referral\": \"REFER TO SIU\"}[route]\n    return {\"id\": c[\"id\"], \"fraud_score\": fraud_score, \"red_flags\": flags or [\"none\"], \"route\": route,\n            \"final_handling\": handling, \"subrogation_opportunity\": recovery}\n\n\ndef main():\n    banner(\"Insurance 01 - Claims Triage & Fraud Detection (CrewAI)\")\n    results = [triage(c) for c in CLAIMS]\n    section(\"Triage (rules)\", json.dumps(results, indent=2))\n\n    adjuster = make_agent(\"Claims Adjuster\", \"Assess each claim's validity, coverage questions and next steps\",\n                          \"Experienced property and motor adjuster who treats honest customers fairly and quickly.\")\n    siu = make_agent(\"SIU Investigator\", \"Decide the handling of each claim, especially suspected fraud\",\n                     \"Special Investigations Unit lead; you never accuse customers, you gather evidence proportionately.\")\n    t1 = make_task(\"Claims:\\n{claims}\\n\\nRule-based triage (final, do not change the scores or routes):\\n{triage}\\n\\n\"\n                   \"For each claim: summarise it, note coverage questions and the evidence needed.\",\n                   \"Per-claim assessment.\", adjuster)\n    t2 = make_task(\"Triage (exact; final_handling is already decided by the rules and must be copied unchanged):\\n\"\n                   \"{triage}\\n\\nFor each claim state its final_handling, then the evidence to request, a polite customer \"\n                   \"message (never mention fraud or suspicion), and a recovery action against the third party only \"\n                   \"where subrogation_opportunity is true. Claims with no red flags must not be treated as suspicious.\",\n                   \"Per claim: final_handling (copied), evidence list, customer message, recovery action.\", siu, context=[t1])\n    section(\"Claims decisions\", run_crew([adjuster, siu], [t1, t2], {\"claims\": json.dumps(CLAIMS, indent=2),\n                                                                     \"triage\": json.dumps(results, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "02_policy_coverage_qa", "title": "Policy Coverage Q&A (RAG)", "category": "policy", "framework": "LangChain", "pattern": "RAG", "description": "Answers 'am I covered?' questions from the policy wording and the customer's schedule, with clause citations.", "how": "Relevant clauses are retrieved (the schedule and excess are always included); the LLM fills a coverage checklist (matching section, conditions met) and checks each exclusion sentence; Python decides COVERED / NOT COVERED from the customer's schedule; the LLM explains the decision with citations.", "today": "Customers call the helpline asking 'am I covered for this?'. Staff check the policy wording and the customer's schedule, then explain the answer and the excess.", "who": "Contact centre and claims helpline teams.", "why": "Policy wordings are long and full of exclusions and conditions. Answers depend on which add-ons the customer bought, and wrong answers lead to complaints.", "terms": ["Policy wording / schedule", "Exclusion", "Add-on cover", "Excess (deductible)"], "code": "\"\"\"Policy Coverage Q&A (RAG) — LangChain + Ollama.\n\nRetrieval finds the relevant clauses, the LLM fills a structured coverage checklist, Python decides\nCOVERED / NOT COVERED from the schedule, and the LLM explains the decision to the customer.\n\nTip: `ollama pull nomic-embed-text` for semantic retrieval (falls back to keywords).\n\nRun:  python 03_insurance/02_policy_coverage_qa/app.py\n      python 03_insurance/02_policy_coverage_qa/app.py \"Is accidental damage to my TV covered?\"\n\"\"\"\n\nimport re\nimport sys\nfrom pathlib import Path\nfrom typing import Literal\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import SimpleRetriever, banner, run_chain, run_structured, section\n\n# Sample home insurance policy wording (fictional) - replace with chunks of your own policy documents\nPOLICY = [\n    (\"Section 1.1 Escape of water\", \"We cover damage to your buildings and contents caused by water escaping from a \"\n     \"fixed water installation, washing machine or dishwasher. We do not cover the cost of repairing the appliance \"\n     \"or pipe itself, or damage from gradual leaks over time.\"),\n    (\"Section 1.2 Storm and flood\", \"We cover damage caused by storm or flood. We do not cover damage to gates, \"\n     \"fences, hedges or garden sheds caused by storm or flood.\"),\n    (\"Section 1.3 Theft\", \"We cover theft from your home involving forcible and violent entry or exit. Theft from \"\n     \"outside the home is only covered if you selected the Personal Possessions add-on.\"),\n    (\"Section 1.4 Accidental damage\", \"Accidental damage to contents (e.g. spilling paint, dropping a TV) is only \"\n     \"covered if Accidental Damage cover is shown in your schedule.\"),\n    (\"Section 2 Personal Possessions add-on\", \"Covers theft of or damage to personal possessions while away from \"\n     \"your home, including phones, jewellery and bicycles, anywhere in the UK and up to 60 days abroad. Bicycles over \"\n     \"1,000 must be named in your schedule. A bicycle stolen while left unattended is covered only if it was locked \"\n     \"to a fixed object such as a bike rack or railing.\"),\n    (\"Section 3 Excess\", \"You pay the first 250 of every claim, or 500 for escape of water claims.\"),\n    (\"Your schedule\", \"Policyholder: J. Patel. Buildings cover: INCLUDED. Contents cover: INCLUDED. \"\n     \"Personal Possessions add-on (Section 2): INCLUDED. Accidental Damage cover (Section 1.4): NOT INCLUDED. \"\n     \"Named items: Trek bicycle, value 1,450.\"),\n    (\"General exclusions\", \"We do not cover wear and tear, damage caused by pets, or loss while the home is \"\n     \"unoccupied for more than 60 consecutive days.\"),\n]\n\n# Which covers this customer bought (normally read from the policy system)\nINCLUDED = {\"Section 1.1 Escape of water\": True, \"Section 1.2 Storm and flood\": True, \"Section 1.3 Theft\": True,\n            \"Section 1.4 Accidental damage\": False, \"Section 2 Personal Possessions add-on\": True}\nEXCESS = {\"Section 1.1 Escape of water\": 500}  # every other claim: 250\n\nSection = Literal[\"Section 1.1 Escape of water\", \"Section 1.2 Storm and flood\", \"Section 1.3 Theft\",\n                  \"Section 1.4 Accidental damage\", \"Section 2 Personal Possessions add-on\", \"None of these\"]\n\n\nclass Checklist(BaseModel):\n    matching_section: Section = Field(\n        description=\"The ONE section whose cover describes this event. Theft or damage away from home = Section 2.\")\n    conditions_met: bool = Field(description=\"Does the event meet that section's conditions (e.g. bike locked to a fixed object)?\")\n    detail: str = Field(description=\"The condition that decided it, quoted briefly\")\n\n\nclass ExclusionCheck(BaseModel):\n    applies: bool = Field(description=\"True only if this exclusion sentence clearly describes the customer's event\")\n\n\nEXTRACT = \"Fill in the coverage checklist for the customer's event, using only the policy extracts.\"\nEXPLAIN = (\n    \"You are a friendly home insurance helpline assistant. The coverage decision below is FINAL. Explain it to the \"\n    \"customer in 3-4 sentences, citing the section in square brackets, and state the excess if covered. Do not \"\n    \"change the decision or invent amounts.\"\n)\n\n\ndef exclusions_for(section_name: str) -> list[str]:\n    \"\"\"The 'We do not cover...' sentences of a section, plus the general exclusions.\"\"\"\n    text = dict(POLICY).get(section_name, \"\")\n    own = [s for s in re.split(r\"(?<=\\.)\\s+\", text) if s.startswith(\"We do not cover\")]\n    return own + [dict(POLICY)[\"General exclusions\"]]\n\n\ndef decide(c: Checklist, event: str) -> dict:\n    \"\"\"Coverage decision: the matched cover must be in the schedule, its conditions met, and no exclusion applied.\"\"\"\n    included = INCLUDED.get(c.matching_section, False)\n    hit = None\n    if included and c.conditions_met:\n        for exclusion in exclusions_for(c.matching_section):\n            check = run_structured(\"Decide whether this insurance exclusion applies to the customer's event.\",\n                                   f\"Exclusion: {exclusion}\\nCustomer event: {event}\", ExclusionCheck)\n            if check.applies:\n                hit = exclusion\n                break\n    covered = included and c.conditions_met and hit is None\n    if c.matching_section == \"None of these\":\n        reason = \"no section of the policy covers this event\"\n    elif not included:\n        reason = f\"{c.matching_section} is not included in the customer's schedule\"\n    elif hit:\n        reason = f\"excluded: {hit}\"\n    else:\n        reason = c.detail\n    return {\"verdict\": \"COVERED\" if covered else \"NOT COVERED\", \"section\": c.matching_section, \"reason\": reason,\n            \"excess\": EXCESS.get(c.matching_section, 250) if covered else None}\n\n\ndef main():\n    banner(\"Insurance 02 - Policy Coverage Q&A (LangChain RAG)\")\n    # The schedule and excess apply to every question, so they are always included alongside the retrieved clauses\n    always = (\"Your schedule\", \"Section 3 Excess\")\n    pinned = \"\\n\".join(f\"[{s}] {t}\" for s, t in POLICY if s in always)\n    retriever = SimpleRetriever([f\"[{s}] {t}\" for s, t in POLICY if s not in always])\n    questions = sys.argv[1:] or [\n        \"My washing machine hose burst and flooded the kitchen. Am I covered?\",\n        \"I dropped my TV while moving it. Can I claim?\",\n        \"My named Trek bike was stolen outside a cafe; I had locked it to a railing.\",\n        \"A storm blew down my garden shed.\",\n    ]\n    for q in questions:\n        ctx = \"\\n\".join([pinned] + retriever.search(q, k=3))\n        checklist = run_structured(EXTRACT, f\"Policy extracts:\\n{ctx}\\n\\nCustomer event: {q}\", Checklist)\n        decision = decide(checklist, q)\n        answer = run_chain(EXPLAIN, \"Decision: {d}\\n\\nPolicy extracts:\\n{ctx}\\n\\nCustomer question: {q}\",\n                           d=decision, ctx=ctx, q=q)\n        section(f\"Q: {q}\", f\"**{decision['verdict']}** ({decision['section']})\\n\\n{answer}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "03_motor_quote_agent", "title": "Motor Insurance Quote Agent", "category": "underwriting", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Prices a car insurance policy, explains what drives the premium and answers what-if questions.", "how": "A rating-engine tool multiplies a base premium by rating factors (age, experience, car group, area, claims, mileage, excess); the agent explains the breakdown and re-prices what-ifs.", "today": "Underwriters and pricing teams set premiums using a rating engine: a base price adjusted by rating factors such as driver age, experience, car and area.", "who": "Pricing / underwriting teams; customers see the result as a quote.", "why": "Customers often don't understand why their quote is high. Clear explanations and 'what if' options (higher excess, lower mileage) help them choose and build trust.", "terms": ["Premium", "Underwriting", "Rating factor", "Rating engine", "Vehicle (insurance) group", "Voluntary excess", "Excess (deductible)"], "code": "\"\"\"Motor Insurance Quote Agent — LangChain tool-calling agent + Ollama.\n\nA simplified rating engine (base rate x factors) that the agent explains and uses for what-ifs.\n\nRun:  python 03_insurance/03_motor_quote_agent/app.py\n      python 03_insurance/03_motor_quote_agent/app.py \"I'm 24, licensed 3 years, group 18 car, no claims. Quote?\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nBASE_PREMIUM = 420.0\nEXCESS_FACTORS = {0: 1.0, 250: 0.95, 500: 0.9, 1000: 0.85}  # higher voluntary excess = lower premium\n\n\ndef age_factor(age: int) -> float:\n    return 2.2 if age < 21 else 1.6 if age < 25 else 1.0 if age < 70 else 1.3\n\n\n@tool\ndef rate_quote(driver_age: int, years_licensed: int, vehicle_group: int, area_risk: str = \"medium\",\n               claims_last_5y: int = 0, annual_mileage: int = 8000, voluntary_excess: int = 0) -> dict:\n    \"\"\"Price a motor insurance policy and return the premium with a factor-by-factor breakdown.\n    vehicle_group: 1 (cheap, low power) to 50 (high performance). area_risk: low, medium or high.\n    voluntary_excess: optional extra excess the customer chooses (0, 250, 500 or 1000); leave at 0 unless asked.\"\"\"\n    factors = {\n        \"driver_age\": age_factor(driver_age),\n        \"experience\": 1.4 if years_licensed < 2 else 1.15 if years_licensed < 5 else 1.0,\n        \"vehicle_group\": round(0.7 + vehicle_group / 50 * 1.3, 2),\n        \"area\": {\"low\": 0.85, \"medium\": 1.0, \"high\": 1.35}[area_risk],\n        \"claims_history\": round(1 + 0.25 * claims_last_5y, 2),\n        \"mileage\": 0.9 if annual_mileage < 5000 else 1.0 if annual_mileage <= 12000 else 1.2,\n        \"voluntary_excess\": EXCESS_FACTORS.get(voluntary_excess, 1.0),\n    }\n    premium = BASE_PREMIUM\n    for f in factors.values():\n        premium *= f\n    without_excess = premium / factors[\"voluntary_excess\"]\n    excess_options = {f\"voluntary_excess_{x}\": {\"annual_premium\": round(without_excess * f, 2),\n                                                \"annual_saving_vs_0\": round(without_excess * (1 - f), 2)}\n                      for x, f in EXCESS_FACTORS.items()}\n    return {\"annual_premium\": round(premium, 2), \"monthly_premium\": round(premium * 1.05 / 12, 2),\n            \"base_premium\": BASE_PREMIUM, \"factors\": factors,\n            \"biggest_driver\": max(factors, key=lambda k: factors[k]), \"excess_options\": excess_options}\n\n\nSYSTEM = (\n    \"You are a friendly motor insurance quote assistant. Use rate_quote for every price; copy the numbers exactly. \"\n    \"Explain the premium in plain language using the factor breakdown (what pushes it up or down). For voluntary \"\n    \"excess questions, quote excess_options exactly. For other what-ifs call rate_quote again with the changed \"\n    \"inputs and state the difference. Monthly price includes a \"\n    \"5% instalment charge. This is an indicative quote, subject to underwriting.\"\n)\n\n\ndef main():\n    banner(\"Insurance 03 - Motor Insurance Quote Agent (LangChain agent)\")\n    q = sys.argv[1] if len(sys.argv) > 1 else (\n        \"I'm 23, licensed 2 years, driving a group 22 car in a high-risk area, 1 claim in 5 years, 9,000 miles a year. \"\n        \"What's my quote, and how much would I save with a 500 voluntary excess?\")\n    section(\"Customer\", q)\n    section(\"Quote\", run_agent(SYSTEM, [rate_quote], q))\n\n\nif __name__ == \"__main__\":\n    main()\n"}]}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const IND = Object.fromEntries(DATA.industries.map(d => [d.folder, d]));
const ALL = DATA.industries.flatMap(d => d.use_cases.map(u => ({ ...u, ind: d })));
const app = document.getElementById("app");
const state = { industry: "all", category: "all", query: "" };

document.getElementById("repo-link").href = DATA.repo;
for (const id of ["readme-link", "footer-readme"]) document.getElementById(id).href = DATA.repo + "#readme";

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Minimal markdown: paragraphs, numbered/bullet lists, **bold**, *italic*, `code`
function md(text) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>");
  const out = [];
  let list = null;
  for (const line of text.split("\n")) {
    const m = line.match(/^\s*(\d+\.|[-*])\s+(.*)$/);
    if (m) {
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (list !== tag) { if (list) out.push(`</${list}>`); out.push(`<${tag}>`); list = tag; }
      out.push(`<li>${inline(m[2])}</li>`);
    } else {
      if (list) { out.push(`</${list}>`); list = null; }
      if (line.trim()) out.push(`<p>${inline(line)}</p>`);
    }
  }
  if (list) out.push(`</${list}>`);
  return `<div class="md">${out.join("")}</div>`;
}

function renderTabs() {
  const tabs = [{ key: "all", label: `All (${ALL.length})` },
    ...DATA.industries.map(d => ({ key: d.folder, label: `${d.icon} ${d.name} (${d.use_cases.length})` }))];
  document.getElementById("tabs").innerHTML = tabs.map(t =>
    `<button class="tab" role="tab" aria-selected="${state.industry === t.key}" data-ind="${t.key}">${esc(t.label)}</button>`).join("");
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  location.hash = b.dataset.ind === "all" ? "#/" : `#/${b.dataset.ind}`;
});

function matches(u) {
  if (state.industry !== "all" && u.ind.folder !== state.industry) return false;
  if (state.category !== "all" && u.category !== state.category) return false;
  if (!state.query) return true;
  const hay = [u.title, u.description, u.how, u.today, u.ind.name, u.ind.categories[u.category], u.framework, u.pattern, ...u.terms]
    .join(" ").toLowerCase();
  return state.query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function card(u) {
  return `<button class="card" data-link="#/${u.ind.folder}/${u.slug}">
    <div class="meta"><span>${u.ind.icon} ${esc(u.ind.name)} · ${esc(u.ind.categories[u.category])}</span><span>#${u.slug.slice(0, 2)}</span></div>
    <h3>${esc(u.title)}</h3>
    <p>${esc(u.description)}</p>
    <div class="badges"><span class="badge ${u.framework}">${u.framework}</span><span class="badge">${esc(u.pattern)}</span></div>
  </button>`;
}

function renderList() {
  const d = IND[state.industry];
  const hero = d
