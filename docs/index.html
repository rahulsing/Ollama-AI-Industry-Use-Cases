assessment provides a clear understanding of each claim, the necessary evidence, and the appropriate handling route based on the given rules."}]}}, {"slug": "02_policy_coverage_qa", "title": "Policy Coverage Q&A (RAG)", "category": "policy", "framework": "LangChain", "pattern": "RAG", "description": "Answers 'am I covered?' questions from the policy wording and the customer's schedule, with clause citations.", "how": "Relevant clauses are retrieved (the schedule and excess are always included); the LLM fills a coverage checklist (matching section, conditions met) and checks each exclusion sentence; Python decides COVERED / NOT COVERED from the customer's schedule; the LLM explains the decision with citations.", "today": "Customers call the helpline asking 'am I covered for this?'. Staff check the policy wording and the customer's schedule, then explain the answer and the excess.", "who": "Contact centre and claims helpline teams.", "why": "Policy wordings are long and full of exclusions and conditions. Answers depend on which add-ons the customer bought, and wrong answers lead to complaints.", "terms": ["Policy wording / schedule", "Exclusion", "Add-on cover", "Excess (deductible)"], "code": "\"\"\"Policy Coverage Q&A (RAG) — LangChain + Ollama.\n\nRetrieval finds the relevant clauses, the LLM fills a structured coverage checklist, Python decides\nCOVERED / NOT COVERED from the schedule, and the LLM explains the decision to the customer.\n\nTip: `ollama pull nomic-embed-text` for semantic retrieval (falls back to keywords).\n\nRun:  python 03_insurance/02_policy_coverage_qa/app.py\n      python 03_insurance/02_policy_coverage_qa/app.py \"Is accidental damage to my TV covered?\"\n\"\"\"\n\nimport re\nimport sys\nfrom pathlib import Path\nfrom typing import Literal\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import SimpleRetriever, banner, run_chain, run_structured, section\n\n# Sample home insurance policy wording (fictional) - replace with chunks of your own policy documents\nPOLICY = [\n    (\"Section 1.1 Escape of water\", \"We cover damage to your buildings and contents caused by water escaping from a \"\n     \"fixed water installation, washing machine or dishwasher. We do not cover the cost of repairing the appliance \"\n     \"or pipe itself, or damage from gradual leaks over time.\"),\n    (\"Section 1.2 Storm and flood\", \"We cover damage caused by storm or flood. We do not cover damage to gates, \"\n     \"fences, hedges or garden sheds caused by storm or flood.\"),\n    (\"Section 1.3 Theft\", \"We cover theft from your home involving forcible and violent entry or exit. Theft from \"\n     \"outside the home is only covered if you selected the Personal Possessions add-on.\"),\n    (\"Section 1.4 Accidental damage\", \"Accidental damage to contents (e.g. spilling paint, dropping a TV) is only \"\n     \"covered if Accidental Damage cover is shown in your schedule.\"),\n    (\"Section 2 Personal Possessions add-on\", \"Covers theft of or damage to personal possessions while away from \"\n     \"your home, including phones, jewellery and bicycles, anywhere in the UK and up to 60 days abroad. Bicycles over \"\n     \"1,000 must be named in your schedule. A bicycle stolen while left unattended is covered only if it was locked \"\n     \"to a fixed object such as a bike rack or railing.\"),\n    (\"Section 3 Excess\", \"You pay the first 250 of every claim, or 500 for escape of water claims.\"),\n    (\"Your schedule\", \"Policyholder: J. Patel. Buildings cover: INCLUDED. Contents cover: INCLUDED. \"\n     \"Personal Possessions add-on (Section 2): INCLUDED. Accidental Damage cover (Section 1.4): NOT INCLUDED. \"\n     \"Named items: Trek bicycle, value 1,450.\"),\n    (\"General exclusions\", \"We do not cover wear and tear, damage caused by pets, or loss while the home is \"\n     \"unoccupied for more than 60 consecutive days.\"),\n]\n\n# Which covers this customer bought (normally read from the policy system)\nINCLUDED = {\"Section 1.1 Escape of water\": True, \"Section 1.2 Storm and flood\": True, \"Section 1.3 Theft\": True,\n            \"Section 1.4 Accidental damage\": False, \"Section 2 Personal Possessions add-on\": True}\nEXCESS = {\"Section 1.1 Escape of water\": 500}  # every other claim: 250\n\nSection = Literal[\"Section 1.1 Escape of water\", \"Section 1.2 Storm and flood\", \"Section 1.3 Theft\",\n                  \"Section 1.4 Accidental damage\", \"Section 2 Personal Possessions add-on\", \"None of these\"]\n\n\nclass Checklist(BaseModel):\n    matching_section: Section = Field(\n        description=\"The ONE section whose cover describes this event. Theft or damage away from home = Section 2.\")\n    conditions_met: bool = Field(description=\"Does the event meet that section's conditions (e.g. bike locked to a fixed object)?\")\n    detail: str = Field(description=\"The condition that decided it, quoted briefly\")\n\n\nclass ExclusionCheck(BaseModel):\n    applies: bool = Field(description=\"True only if this exclusion sentence clearly describes the customer's event\")\n\n\nEXTRACT = \"Fill in the coverage checklist for the customer's event, using only the policy extracts.\"\nEXPLAIN = (\n    \"You are a friendly home insurance helpline assistant. The coverage decision below is FINAL. Explain it to the \"\n    \"customer in 3-4 sentences, citing the section in square brackets, and state the excess if covered. Do not \"\n    \"change the decision or invent amounts.\"\n)\n\n\ndef exclusions_for(section_name: str) -> list[str]:\n    \"\"\"The 'We do not cover...' sentences of a section, plus the general exclusions.\"\"\"\n    text = dict(POLICY).get(section_name, \"\")\n    own = [s for s in re.split(r\"(?<=\\.)\\s+\", text) if s.startswith(\"We do not cover\")]\n    return own + [dict(POLICY)[\"General exclusions\"]]\n\n\ndef decide(c: Checklist, event: str) -> dict:\n    \"\"\"Coverage decision: the matched cover must be in the schedule, its conditions met, and no exclusion applied.\"\"\"\n    included = INCLUDED.get(c.matching_section, False)\n    hit = None\n    if included and c.conditions_met:\n        for exclusion in exclusions_for(c.matching_section):\n            check = run_structured(\"Decide whether this insurance exclusion applies to the customer's event.\",\n                                   f\"Exclusion: {exclusion}\\nCustomer event: {event}\", ExclusionCheck)\n            if check.applies:\n                hit = exclusion\n                break\n    covered = included and c.conditions_met and hit is None\n    if c.matching_section == \"None of these\":\n        reason = \"no section of the policy covers this event\"\n    elif not included:\n        reason = f\"{c.matching_section} is not included in the customer's schedule\"\n    elif hit:\n        reason = f\"excluded: {hit}\"\n    else:\n        reason = c.detail\n    return {\"verdict\": \"COVERED\" if covered else \"NOT COVERED\", \"section\": c.matching_section, \"reason\": reason,\n            \"excess\": EXCESS.get(c.matching_section, 250) if covered else None}\n\n\ndef main():\n    banner(\"Insurance 02 - Policy Coverage Q&A (LangChain RAG)\")\n    # The schedule and excess apply to every question, so they are always included alongside the retrieved clauses\n    always = (\"Your schedule\", \"Section 3 Excess\")\n    pinned = \"\\n\".join(f\"[{s}] {t}\" for s, t in POLICY if s in always)\n    retriever = SimpleRetriever([f\"[{s}] {t}\" for s, t in POLICY if s not in always])\n    questions = sys.argv[1:] or [\n        \"My washing machine hose burst and flooded the kitchen. Am I covered?\",\n        \"I dropped my TV while moving it. Can I claim?\",\n        \"My named Trek bike was stolen outside a cafe; I had locked it to a railing.\",\n        \"A storm blew down my garden shed.\",\n    ]\n    for q in questions:\n        ctx = \"\\n\".join([pinned] + retriever.search(q, k=3))\n        checklist = run_structured(EXTRACT, f\"Policy extracts:\\n{ctx}\\n\\nCustomer event: {q}\", Checklist)\n        decision = decide(checklist, q)\n        answer = run_chain(EXPLAIN, \"Decision: {d}\\n\\nPolicy extracts:\\n{ctx}\\n\\nCustomer question: {q}\",\n                           d=decision, ctx=ctx, q=q)\n        section(f\"Q: {q}\", f\"**{decision['verdict']}** ({decision['section']})\\n\\n{answer}\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    QU[\"❓ Your question\"] --> R[\"🔎 Retriever<br/>finds the most relevant passages\"]\n    IN[\"📚 Policy wording + schedule\"] -->|\"🧮 embeddings\"| R\n    R -->|\"📎 top passages\"| G[\"🔗 LangChain<br/>answer only from passages\"]\n    G <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    G -->|\"📋 checklist\"| PY[\"🐍 Python<br/>COVERED / NOT COVERED decision\"]\n    PY -->|\"✍️ explained\"| OUT[\"📝 Answer with clause citations\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN,QU data\n    class PY rules\n    class R,G ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 27, "turns": [{"ask": "My washing machine hose burst and flooded the kitchen. Am I covered?", "steps": [], "answer": "**COVERED** (Section 1.1 Escape of water)\n\nYes, you are covered for this incident. According to Section 1.1 Escape of water in your policy, damage to buildings and contents caused by water escaping from a washing machine is covered. However, please note that the excess for escape of water claims is 500, so you will need to pay this amount out of pocket before we cover the rest of the claim."}, {"ask": "I dropped my TV while moving it. Can I claim?", "steps": [], "answer": "**NOT COVERED** (Section 1.4 Accidental damage)\n\nI'm sorry, but your claim for accidental damage to your TV is not covered under your policy. According to Section 1.4 Accidental damage, this coverage is not included in your schedule, so unfortunately, you won't be able to make a claim for this incident. There is no excess to pay in this case since the claim is not covered."}, {"ask": "My named Trek bike was stolen outside a cafe; I had locked it to a railing.", "steps": [], "answer": "**COVERED** (Section 2 Personal Possessions add-on)\n\nYour Trek bicycle, valued at 1,450, was covered under the Personal Possessions add-on (Section 2) because it was stolen while left unattended but locked to a fixed object outside your home. According to the policy, this meets the condition for coverage. However, please note that you will need to pay the excess of 250 for this claim."}, {"ask": "A storm blew down my garden shed.", "steps": [], "answer": "**NOT COVERED** (Section 1.2 Storm and flood)\n\nI'm sorry, but the damage to your garden shed caused by the storm is not covered under your policy. According to Section 1.2 Storm and flood, we do not cover damage to gates, fences, hedges, or garden sheds caused by storm or flood. There is no excess to pay in this case as the claim is not covered."}]}}, {"slug": "03_motor_quote_agent", "title": "Motor Insurance Quote Agent", "category": "underwriting", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Prices a car insurance policy, explains what drives the premium and answers what-if questions.", "how": "A rating-engine tool multiplies a base premium by rating factors (age, experience, car group, area, claims, mileage, excess); the agent explains the breakdown and re-prices what-ifs.", "today": "Underwriters and pricing teams set premiums using a rating engine: a base price adjusted by rating factors such as driver age, experience, car and area.", "who": "Pricing / underwriting teams; customers see the result as a quote.", "why": "Customers often don't understand why their quote is high. Clear explanations and 'what if' options (higher excess, lower mileage) help them choose and build trust.", "terms": ["Premium", "Underwriting", "Rating factor", "Rating engine", "Vehicle (insurance) group", "Voluntary excess", "Excess (deductible)"], "code": "\"\"\"Motor Insurance Quote Agent — LangChain tool-calling agent + Ollama.\n\nA simplified rating engine (base rate x factors) that the agent explains and uses for what-ifs.\n\nRun:  python 03_insurance/03_motor_quote_agent/app.py\n      python 03_insurance/03_motor_quote_agent/app.py \"I'm 24, licensed 3 years, group 18 car, no claims. Quote?\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nBASE_PREMIUM = 420.0\nEXCESS_FACTORS = {0: 1.0, 250: 0.95, 500: 0.9, 1000: 0.85}  # higher voluntary excess = lower premium\n\n\ndef age_factor(age: int) -> float:\n    return 2.2 if age < 21 else 1.6 if age < 25 else 1.0 if age < 70 else 1.3\n\n\n@tool\ndef rate_quote(driver_age: int, years_licensed: int, vehicle_group: int, area_risk: str = \"medium\",\n               claims_last_5y: int = 0, annual_mileage: int = 8000, voluntary_excess: int = 0) -> dict:\n    \"\"\"Price a motor insurance policy and return the premium with a factor-by-factor breakdown.\n    vehicle_group: 1 (cheap, low power) to 50 (high performance). area_risk: low, medium or high.\n    voluntary_excess: optional extra excess the customer chooses (0, 250, 500 or 1000); leave at 0 unless asked.\"\"\"\n    factors = {\n        \"driver_age\": age_factor(driver_age),\n        \"experience\": 1.4 if years_licensed < 2 else 1.15 if years_licensed < 5 else 1.0,\n        \"vehicle_group\": round(0.7 + vehicle_group / 50 * 1.3, 2),\n <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>

const RAW = DATA.repo.replace("https://github.com/", "https://raw.githubusercontent.com/") + "/main";  // lab screenshots
const app = document.getElementById("app");
const state = { industry: "all", category: "all", query: "" };

document.getElementById("repo-link").href = DATA.repo;
for (const id of ["readme-link", "footer-readme"]) document.getElementById(id).href = DATA.repo + "#readme";

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Minimal markdown: paragraphs, headings, numbered/bullet lists, tables, rules, **bold**, *italic*, `code`
function md(text) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>");
  const out = [];
  let list = null, table = null;
  const endList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const endTable = () => {
    if (!table) return;
    const rows = table.filter(r => !/^\|?[\s:|-]+\|?$/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim())));
    out.push(`<table>${rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("")}</table>`);
    table = null;
  };
  let fence = null;
  for (const line of text.split("\n")) {
    if (/^\s*```/.test(line)) {
      if (fence) { out.push(`<pre><code>${esc(fence.join("\n"))}</code></pre>`); fence = null; }
      else { endList(); endTable(); fence = []; }
      continue;
    }
    if (fence) { fence.push(line); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) { endList(); (table ??= []).push(line.trim()); continue; }
    endTable();
    const h = line.match(/^\s*#{1,6}\s+(.*)$/);
    if (h) { endList(); out.push(`<h4>${inline(h[1])}</h4>`); continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { endList(); out.push("<hr>"); continue; }
    const m = line.match(/^\s*(\d+\.|[-*•])\s+(.*)$/);
    if (m) {
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (list !== tag) { if (list) out.push(`</${list}>`); out.push(`<${tag}>`); list = tag; }
      out.push(`<li>${inline(m[2])}</li>`);
    } else {
      if (list) { out.push(`</${list}>`); list = null; }
      if (line.trim()) out.push(`<p>${inline(line)}</p>`);
    }
  }
  if (fence) out.push(`<pre><code>${esc(fence.join("\n"))}</code></pre>`);
  endTable();
  endList();
  return `<div class="md">${out.join("")}</div>`;
}

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict",
  fontFamily: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" });
let flowId = 0;
async function drawFlows() {
  for (const el of app.querySelectorAll(".flow[data-src]")) {
    try { el.innerHTML = (await mermaid.render(`flow${++flowId}`, el.dataset.src)).svg; }

}

// ------------------------------------------------------------------ "Try it": replay a recorded run
// Everything shown is from a real run of app.py (scripts/capture_samples.py); only the timing is replayed.
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let demo = null;

function demoHtml(d, u) {
  const c = u.chat;
  if (!c) return "";
  const asks = c.turns.length > 1 ? `<div class="asks" role="group" aria-label="Questions">${c.turns.map((t, i) =>
    `<button class="chip" data-turn="${i}" aria-pressed="${i === 0}" title="${esc(t.ask)}">${esc(t.ask)}</button>`).join("")}</div>` : "";
  const took = c.seconds ? `The real run took ${c.seconds} s on a laptop GPU; the replay is sped up. ` : "";
  return `<section class="panel full demo" id="demo">
    <div class="demo-head"><h2>▶ Try it</h2>
      <span class="model"><span class="dot"></span>🦙 Ollama · <code>${esc(c.model)}</code> · local</span></div>
    <div class="chat" id="chat" aria-live="polite">
      <div class="placeholder">Press <strong>▶ Run</strong> to ask the ${esc(u.title)} and watch it work.<br>
        <span class="note">A replay of a real recorded run: the same question, steps and answer you'd get locally.</span></div></div>
    ${asks}
    <div class="composer"><div class="ask" id="ask"></div>
      <button class="primary" id="run">▶ Run</button></div>
    <p class="note demo-foot">${took}LLM wording varies between runs; the numbers from Python don't.
      Run it yourself: <code>python ${esc(d.folder)}/${esc(u.slug)}/app.py</code></p></section>`;
}

function initDemo(u) {
  if (!u.chat) return;
  const turns = u.chat.turns;
  const $ = id => document.getElementById(id);
  const chat = $("chat"), run = $("run"), ask = $("ask");
  const state = demo = { sel: 0, busy: false, skip: null, done: new Set() };
  const alive = () => demo === state && document.body.contains(chat);
  const select = i => {
    state.sel = i;
    ask.textContent = turns[i].ask;
    document.querySelectorAll("#demo .chip").forEach(b => {
      b.setAttribute("aria-pressed", String(+b.dataset.turn === i));
      b.classList.toggle("done", state.done.has(+b.dataset.turn));
    });
  };
  const wait = ms => new Promise(r => {
    if (state.skip === true || reduceMotion) return r();
    const t = setTimeout(r, ms);
    state.skip = () => { clearTimeout(t); r(); };
  });
  const scroll = () => { chat.scrollTop = chat.scrollHeight; };
  const add = html => { chat.insertAdjacentHTML("beforeend", html); scroll(); return chat.lastElementChild; };

  async function play(turn) {
    chat.querySelector(".placeholder")?.remove();
    add(`<div class="msg-user">${esc(turn.ask)}</div>`);
    await wait(350);
    const bot = add(`<div class="msg-bot"><div class="avatar" aria-hidden="true">🦙</div><div class="bubble">
      <div class="who">${esc(u.chat.model)}</div><div class="steps"></div><div class="answer md"></div></div></div>`);
    const steps = bot.querySelector(".steps"), answer = bot.querySelector(".answer");
    for (const st of turn.steps) {
      if (!alive()) return;
      const el = document.createElement("details");
      el.className = "step";
      el.innerHTML = `<summary><span class="st"><span class="spin"></span></span>${esc(st.icon)} ${esc(st.label)}</summary>
        <div class="body">${st.code ? `<pre><code>${esc(st.body)}</code></pre>` : md(st.body)}</div>`;
      steps.append(el); scroll();
      await wait(st.label.includes("agent") ? 1400 : 800);
      el.querySelector(".st").innerHTML = `<span class="ok">✓</span>`;
    }
    if (!turn.steps.length) {
      answer.innerHTML = `<div class="thinking"><span class="spin"></span> Thinking…</div>`;
      await wait(700);
    }
    const tokens = turn.answer.match(/\S+\s*/g) || [];
    const per = Math.max(1, Math.ceil(tokens.length / 180));  // about 5 s of streaming at most
    answer.classList.add("typing");
    for (let i = per; i < tokens.length && alive() && state.skip !== true && !reduceMotion; i += per) {
      answer.innerHTML = md(tokens.slice(0, i).join(""));
      scroll();
      await wait(28);
    }
    answer.classList.remove("typing");
    answer.innerHTML = md(turn.answer);
    scroll();
  }

  run.addEventListener("click", async () => {
    if (state.busy) { const s = state.skip; state.skip = true; if (typeof s === "function") s(); return; }
    if (state.done.size === turns.length) {  // everything played: start over
      state.done.clear();
      chat.innerHTML = "";
      select(0);
    }
    state.busy = true; state.skip = null;
    run.textContent = "⏭ Skip";
    await play(turns[state.sel]);
    if (!alive()) return;
    state.busy = false;
    state.done.add(state.sel);
    const next = turns.findIndex((_, i) => !state.done.has(i));
    run.textContent = next === -1 ? "↻ Replay" : "▶ Run";
    select(next === -1 ? state.sel : next);
  });
  document.querySelectorAll("#demo .chip").forEach(b => b.addEventListener("click", () => { if (!state.busy) select(+b.dataset.turn); }));
  select(0);
}

function renderTabs() {

}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  location.hash = b.dataset.ind === "all" ? "#/" : `#/${b.dataset.ind}`;

function matches(u) {
  if (state.industry !== "all" && u.ind.folder !== state.industry) return false;
  if (state.category !== "all" && u.category !== state.category) return false;
  if (!state.query) return true;
  const hay = [u.title, u.description, u.how, u.today, u.ind.name, u.ind.categories[u.category], u.framework, u.pattern, ...u.terms]
    .join(" ").toLowerCase();
  return state.query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

}

function renderList() {
  const d = IND[state.industry];
  const hero = d
    ? `<div class="hero"><h1>${d.icon} ${esc(d.name)}</h1><p>${esc(d.tagline)}. ${esc(d.description)}</p>
         <p class="about-link" style="margin-top:8px"><a href="#/${d.folder}/about">🎓 New to ${esc(d.name.toLowerCase())}? How the industry works + glossary →</a></p></div>`
    : `<div class="hero"><h1>Simple AI agents for real business problems</h1>
         <p>Pick an industry, read the business problem in plain English, see how the AI solves it, and read the code.
         Every solution runs locally on an open-source model via Ollama.</p>
         <div class="stats"><span><b>${DATA.industries.length}</b>industries</span><span><b>${ALL.length}</b>solutions</span>
         <span><b>${ALL.filter(u => u.framework === "CrewAI").length}</b>CrewAI crews</span>
         <span><b>${ALL.filter(u => u.framework === "LangChain").length}</b>LangChain agents</span></div>
         <details class="how" open><summary>⚙️ How every solution works</summary>
           <p class="note">Python does the maths and rules (auditable), the AI explains and writes, and nothing leaves your machine.</p>
           ${flowBox(DATA.root_flow, "How every solution works")}</details>
         ${LABS.length ? `<a class="lab-banner" href="#/labs"><span aria-hidden="true">🧪</span><span><b>Hands-on labs:</b>
           ${esc(LABS[0].title)}. ${esc(LABS[0].tagline)}.</span><span style="margin-left:auto">Open →</span></a>` : ""}</div>`;
  const cats = d ? Object.entries(d.categories) : [];
  const chips = d ? `<div class="chips">${[["all", "All categories"], ...cats].map(([k, v]) =>
      `<button class="chip" aria-pressed="${state.category === k}" data-cat="${k}">${esc(v)}</button>`).join("")}</div>` : "";
  const items = ALL.filter(matches);
  app.innerHTML = `${hero}
    <div class="controls"><label class="search"><input id="q" type="search" placeholder="Search solutions, e.g. fraud, pricing, KYC, claims" value="${esc(state.query)}" aria-label="Search"></label></div>
    ${chips}
    <div class="grid">${items.length ? items.map(card).join("") : `<div class="empty">No solutions match your search.</div>`}</div>`;
  drawFlows();
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.query = q.value; const pos = q.selectionStart; renderList(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); });
}

app.addEventListener("click", e => {
  const c = e.target.closest("[data-link]"); if (c) { location.hash = c.dataset.link; return; }
  const chip = e.target.closest(".chip"); if (chip) { state.category = chip.dataset.cat; renderList(); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    navigator.clipboard.writeText(copy.dataset.copy).then(() => { copy.textContent = "Copied!"; setTimeout(() => copy.textContent = "Copy", 1500); });
  }
});

function renderDetail(d, u) {
  const run = `python ${d.folder}/${u.slug}/app.py`;
  const folderUrl = `${DATA.repo}/tree/main/${d.folder}/${u.slug}`;
  const terms = u.terms.map(t => `<dt>${esc(t)}</dt><dd>${esc(d.glossary[t][1])}</dd>`).join("");
  app.innerHTML = `<div class="detail">
    <a class="back" href="#/${d.folder}">← All ${esc(d.name)} solutions</a>
    <h1>${esc(u.title)}</h1>
    <div class="crumbs">${d.icon} ${esc(d.name)} · ${esc(d.categories[u.category])} ·
      <span class="badge ${u.framework}">${u.framework}</span> <span class="badge">${esc(u.pattern)}</span></div>
    <div class="cols">
      <section class="panel"><h2>${d.icon} The business problem</h2>
        <p><strong>In the business today:</strong> ${esc(u.today)}</p>
        <p><strong>Who does this work:</strong> ${esc(u.who)}</p>
        <p><strong>Why it's hard:</strong> ${esc(u.why)}</p></section>
      <section class="panel"><h2>🤖 What the AI does</h2>
        ${md(u.description)}
        <p><strong>How it works:</strong></p>${md(u.how)}</section>
      ${demoHtml(d, u)}
      <section class="panel full"><h2>🔀 How it flows</h2>${flowBox(u.flow, "Flow diagram for " + u.title)}</section>
      <section class="panel full terms"><h2>📖 Key terms</h2><dl>${terms}</dl>
        <p class="note" style="margin-top:10px"><a href="#/${d.folder}/about">Full ${esc(d.name)} primer & glossary →</a></p></section>
      <section class="panel full"><h2>▶ Run it locally</h2>
        <div class="run"><code>${esc(run)}</code><button class="btn" data-copy="${esc(run)}">Copy</button></div>
        <p class="note" style="margin-top:8px">Needs Python 3.10–3.13 and <a href="https://ollama.com" target="_blank" rel="noopener">Ollama</a>.
          Setup: <a href="${DATA.repo}#-quick-start" target="_blank" rel="noopener">Quick start</a>.</p></section>
      <section class="panel full"><div class="code-head"><h2 style="margin:0">💻 Implementation: app.py</h2>
          <span><button class="btn" data-copy="${esc(u.code)}">Copy</button> <a href="${folderUrl}" target="_blank" rel="noopener">View on GitHub ↗</a></span></div>
        <pre><code class="language-python">${esc(u.code)}</code></pre></section>
    </div></div>`;
  if (window.hljs) hljs.highlightElement(app.querySelector("pre code.language-python"));
  drawFlows();
  initDemo(u);
  window.scrollTo(0, 0);
}

function renderAbout(d) {
  const groups = {};
  for (const [t, [g, def]] of Object.entries(d.glossary)) (groups[g] ??= []).push([t, def]);
  const areas = d.areas.map(([key, name, what]) => {
    const n = d.use_cases.filter(u => u.category === key).length;
    return `<dt>${esc(d.categories[key].split(" ")[0])} ${esc(name)} <a href="#/${d.folder}" data-cat-link="${key}" class="note">(${n} solution${n === 1 ? "" : "s"})</a></dt><dd>${esc(what)}</dd>`;
  }).join("");
  const glossary = Object.entries(groups).map(([g, items]) => `<div class="glossary-group"><h3>${esc(g)}</h3><dl>${
    items.sort((a, b) => a[0].localeCompare(b[0])).map(([t, def]) => `<dt data-term="${esc((t + " " + def).toLowerCase())}">${esc(t)}</dt><dd>${esc(def)}</dd>`).join("")}</dl></div>`).join("");
  app.innerHTML = `<div class="detail">
    <a class="back" href="#/${d.folder}">← ${esc(d.name)} solutions</a>
    <h1>${d.icon} ${esc(d.name)}: how the industry works</h1>
    <div class="crumbs">A plain-English primer for people new to ${esc(d.name.toLowerCase())}</div>
    <div class="cols">
      <section class="panel">${md(d.industry_101)}</section>
      <section class="panel"><h2>Departments</h2><dl>${areas}</dl></section>
      <section class="panel full"><h2>📖 Glossary (${Object.keys(d.glossary).length} terms)</h2>
        <label class="search glossary-search"><input id="gq" type="search" placeholder="Filter terms" aria-label="Filter glossary"></label>
        <div id="glossary">${glossary}</div></section>
    </div></div>`;
  document.getElementById("gq").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll("#glossary dt").forEach(dt => {
      const show = dt.dataset.term.includes(q);
      dt.style.display = dt.nextElementSibling.style.display = show ? "" : "none";
    });
    document.querySelectorAll(".glossary-group").forEach(g =>
      g.style.display = [...g.querySelectorAll("dt")].some(dt => dt.style.display !== "none") ? "" : "none");
  });
  app.querySelectorAll("[data-cat-link]").forEach(a => a.addEventListener("click", () => { state.category = a.dataset.catLink; }));
  window.scrollTo(0, 0);
}

// ------------------------------------------------------------------ Hands-on labs (labs/catalog.py)
// Steps are [num, name, context added, score, what happened, screenshot]; all from a real recorded run.
const fmtScore = (v, max) => `${v} / ${max}`;

function renderLabs() {
  app.innerHTML = `<div class="hero"><h1>🧪 Hands-on labs</h1>
      <p>Longer, guided exercises that teach one AI engineering idea step by step, with a score after every step.
      Unlike the solutions, labs don't run on Ollama: each one says where it runs.</p></div>
    <div class="grid">${LABS.map(lab => `<button class="card" data-link="#/labs/${lab.slug}">
      <div class="meta"><span>${lab.icon} ${esc(lab.industry)} · 🧪 Lab</span><span>#${lab.slug.slice(0, 2)}</span></div>
      <h3>${esc(lab.title)}</h3><p>${esc(lab.tagline)}.</p>
      <div class="badges"><span class="badge lab">${esc(lab.runs_on)}</span><span class="badge">${lab.steps.length} steps</span><span class="badge">⏱ ${esc(lab.time)}</span></div>
    </button>`).join("")}</div>`;
  window.scrollTo(0, 0);
}

function renderLab(lab) {
  const max = lab.max_score, n = lab.steps.length;
  const folderUrl = `${DATA.repo}/tree/main/labs/${lab.slug}`, blobUrl = `${DATA.repo}/blob/main/labs/${lab.slug}`;
  const ticks = Array.from({ length: max + 1 }, (_, i) => i);
  app.innerHTML = `<div class="detail">
    <a class="back" href="#/labs">← All labs</a>
    <h1>${lab.icon} ${esc(lab.title)}</h1>
    <div class="crumbs">🧪 Hands-on lab · ${esc(lab.industry)} · <span class="badge lab">${esc(lab.runs_on)}</span>
      <span class="badge">${n} steps</span> <span class="badge">⏱ ${esc(lab.time)}</span></div>
    <div class="callout">ℹ️ This lab runs on <strong>${esc(lab.runs_on)}</strong> with ${esc(lab.llm)}.
      Everything below comes from a real run with <code>${esc(lab.model)}</code>, so you can follow it without running anything.</div>
    <div class="cols">
      <section class="panel"><h2>❌ The problem</h2><p>${esc(lab.problem)}</p></section>
      <section class="panel"><h2>💡 The idea</h2><p>${esc(lab.idea)}</p></section>
      <section class="panel full"><h2>📈 Score after each step</h2>
        <p class="note">Same 5 questions, same model, same prompt: only the context changes. Pick a step to see what was added.</p>
        <div class="scores">
          <div class="yaxis" aria-hidden="true">${ticks.map(t => `<span style="bottom:${t / max * 100}%">${t}</span>`).join("")}</div>
          <div class="plot" style="--n:${n}" role="group" aria-label="Score out of ${max} after each step">
            ${ticks.slice(1).map(t => `<div class="grid-line" style="bottom:${t / max * 100}%"></div>`).join("")}
            ${lab.steps.map(([num, name, , score], i) => `<button class="bar" data-step="${i}" aria-pressed="false"
                aria-label="Step ${num} ${esc(name)}: ${fmtScore(score, max)}">
              <span class="tip">${num} ${esc(name)} · ${fmtScore(score, max)}</span>
              <span class="val" style="bottom:${score / max * 100}%"></span><span class="fill" style="height:${score / max * 100}%"></span></button>`).join("")}
          </div></div>
        <div class="xlabels" style="--n:${n}" aria-hidden="true">${lab.steps.map(([num, name]) => `<span>${num}<span class="nm"><br>${esc(name)}</span></span>`).join("")}</div>
        <div class="stepview" id="stepview" aria-live="polite"></div></section>
      <section class="panel full"><h2>❓ The ${lab.questions.length} questions</h2><ol>${lab.questions.map(([topic, q]) =>
        `<li><strong>${esc(topic)}:</strong> ${esc(q)}</li>`).join("")}</ol></section>
      <section class="panel full"><h2>🔀 How the lab works</h2><pre><code>${esc(lab.flow)}</code></pre></section>
      <section class="panel full"><h2>📋 All steps</h2><div class="md"><table class="steptable">
        <tr><th>Step</th><th>Context added</th><th>Score</th><th>What changed</th></tr>
        ${lab.steps.map(([num, name, added, score, result], i) => `<tr data-row="${i}"><td>${num} ${esc(name)}</td><td>${esc(added)}</td>
          <td><strong>${fmtScore(score, max)}</strong></td><td>${esc(result)}</td></tr>`).join("")}</table></div></section>
      <section class="panel full"><h2>▶ Run it yourself</h2><ol class="setup">${lab.setup.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
        <p class="note">Local check of the context files, data traps and grader (no Databricks needed):</p>
        <div class="run"><code>${esc(lab.local_check)}</code><button class="btn" data-copy="${esc(lab.local_check)}">Copy</button></div>
        <p style="margin-top:12px"><a href="${blobUrl}/${lab.walkthrough}" target="_blank" rel="noopener">📸 Full walkthrough with screenshots ↗</a> ·
          <a href="${folderUrl}" target="_blank" rel="noopener">View the lab on GitHub ↗</a></p></section>
    </div></div>`;

  const view = document.getElementById("stepview");
  const show = i => {
    const [num, name, added, score, result, shot] = lab.steps[i];
    app.querySelectorAll(".bar").forEach((b, j) => {
      b.setAttribute("aria-pressed", String(j === i));
      // direct labels only on the start, the end and the selected step; hover shows the rest
      b.querySelector(".val").textContent = j === i || j === 0 || j === n - 1 ? String(lab.steps[j][3]) : "";
    });
    app.querySelectorAll(".xlabels > span").forEach((x, j) => x.classList.toggle("on", j === i));
    app.querySelectorAll(".steptable tr[data-row]").forEach(r => r.classList.toggle("on", +r.dataset.row === i));
    view.innerHTML = `<div><h3>Step ${num} · ${esc(name)}</h3>
        <p><strong>Score:</strong> ${fmtScore(score, max)}</p>
        <p><strong>Context added:</strong> ${esc(added)}</p>
        <p><strong>What happened:</strong> ${esc(result)}</p>
        <div class="stepnav"><button class="btn" data-go="${i - 1}" ${i === 0 ? "disabled" : ""}>← Previous</button>
          <button class="btn" data-go="${i + 1}" ${i === n - 1 ? "disabled" : ""}>Next →</button></div></div>
      <figure style="margin:0"><img src="${RAW}/labs/${lab.slug}/${lab.shots_dir}/${shot}" alt="Scorecard after step ${num} ${esc(name)}" loading="lazy">
        <figcaption class="note">Scorecard from the real run after step ${num}.</figcaption></figure>`;
  };
  app.querySelectorAll(".bar").forEach(b => b.addEventListener("click", () => show(+b.dataset.step)));
  view.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g && !g.disabled) show(+g.dataset.go); });
  show(n - 1);
  window.scrollTo(0, 0);
}

function route() {
  const [folder = "", slug = ""] = location.hash.replace(/^#\/?/, "").split("/");  // "#/<industry>/<use case>"
  if (folder === "labs" && LABS.length) {  // "#/labs/<lab>"
    state.industry = "labs";
    renderTabs();
    const lab = LABS.find(x => x.slug === slug);
    return lab ? renderLab(lab) : renderLabs();
  }
  const d = IND[folder];
  const prev = state.industry;
  state.industry = d ? folder : "all";
  if (state.industry !== prev && !(d && slug)) state.category = "all";
  renderTabs();
  if (d && slug === "about") return renderAbout(d);
  const u = d && d.use_cases.find(x => x.slug === slug);
  if (u) return renderDetail(d, { ...u, ind: d });
  renderList();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
