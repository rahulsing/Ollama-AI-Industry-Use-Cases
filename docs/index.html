e recall \"\n    \"review), and 3 concrete actions (supplier quality check, listing description fix, customer replies). \"\n    \"Use only the counts provided.\"\n)\n\n\ndef main():\n    banner(\"Retail 02 - Product Review Analyzer (LangChain structured output)\")\n    rows = []\n    for stars, text in REVIEWS:\n        r = run_structured(\"Classify this product review accurately.\", text, Review)\n        rows.append({\"stars\": stars, \"text\": text, **r.model_dump()})\n        section(f\"{stars}★ {text[:60]}\", r.model_dump())\n\n    summary = {\n        \"product\": PRODUCT,\n        \"reviews\": len(rows),\n        \"avg_stars\": round(sum(r[\"stars\"] for r in rows) / len(rows), 2),\n        \"sentiment\": dict(Counter(r[\"sentiment\"] for r in rows)),\n        \"theme_counts\": dict(Counter(t for r in rows for t in r[\"themes\"]).most_common()),\n        \"defect_reviews\": sum(r[\"product_defect\"] for r in rows),\n        \"safety_reviews\": [r[\"text\"] for r in rows if r[\"safety_concern\"]],\n    }\n    section(\"Summary\", json.dumps(summary, indent=2, ensure_ascii=False))\n    section(\"Quality report\", run_chain(SYSTEM, \"Summary:\\n{s}\", s=json.dumps(summary, indent=2, ensure_ascii=False)))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Customer reviews\"] --> EX[\"🧾 LangChain structured output<br/>text → Pydantic schema\"]\n    EX -->|\"validated fields\"| PY[\"🐍 Python<br/>Count themes, defects & safety issues\"]\n    PY --> OUT[\"📝 Quality report + escalations\"]\n    EX <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class EX ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 26, "turns": [{"ask": "What are customers saying about the AeroBlend 600W blender? Are there any safety issues?", "steps": [{"icon": "🧾", "label": "Extracted · 5★ Makes smoothies in 30 seconds and is easy to clean. Love it!", "body": "{'sentiment': 'positive', 'themes': ['performance', 'cleaning', 'size'], 'product_defect': False, 'safety_concern': False}", "code": true}, {"icon": "🧾", "label": "Extracted · 2★ Lid started leaking after two weeks. Juice everywhere on my", "body": "{'sentiment': 'negative', 'themes': ['leaking', 'size'], 'product_defect': True, 'safety_concern': False}", "code": true}, {"icon": "🧾", "label": "Extracted · 4★ Powerful for the size, but quite loud early in the morning.", "body": "{'sentiment': 'positive', 'themes': ['performance', 'noise'], 'product_defect': True, 'safety_concern': False}", "code": true}, {"icon": "🧾", "label": "Extracted · 1★ Motor burned out after a month. Smelled of burning plastic.", "body": "{'sentiment': 'negative', 'themes': ['performance', 'size', 'durability'], 'product_defect': True, 'safety_concern': True}", "code": true}, {"icon": "🧾", "label": "Extracted · 3★ Does the job but the cup is smaller than the photos suggest.", "body": "{'sentiment': 'neutral', 'themes': ['size', 'size'], 'product_defect': True, 'safety_concern': False}", "code": true}, {"icon": "🧾", "label": "Extracted · 2★ Leaks from the bottom seal every time I blend ice.", "body": "{'sentiment': 'negative', 'themes': ['leaking', 'performance'], 'product_defect': True, 'safety_concern': False}", "code": true}, {"icon": "🧾", "label": "Extracted · 5★ Great value, delivery was fast and it crushes ice well.", "body": "{'sentiment': 'positive', 'themes': ['value', 'delivery', 'performance'], 'product_defect': False, 'safety_concern': False}", "code": true}, {"icon": "🧾", "label": "Extracted · 1★ import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nPRODUCTS = [  # elasticity: % change in volume for a 1% price change\n    {\"sku\": \"P-1\", \"name\": \"Wireless earbuds\", \"cost\": 21.0, \"price\": 49.99, \"competitor_prices\": [44.99, 46.50, 45.00],\n     \"weekly_units\": 320, \"weeks_of_stock\": 3.0, \"elasticity\": -1.8},\n    {\"sku\": \"P-2\", \"name\": \"Stainless water bottle 750ml\", \"cost\": 6.2, \"price\": 14.99, \"competitor_prices\": [17.99, 18.50, 16.99],\n     \"weekly_units\": 540, \"weeks_of_stock\": 6.0, \"elasticity\": -1.1},\n    {\"sku\": \"P-3\", \"name\": \"Fleece throw blanket\", \"cost\": 9.5, \"price\": 29.99, \"competitor_prices\": [27.99, 29.00, 31.50],\n     \"weekly_units\": 85, \"weeks_of_stock\": 22.0, \"elasticity\": -2.2},\n]\nMIN_MARGIN = 0.30      # never price below 30% gross margin\nMAX_CHANGE = 0.10      # move at most 10% at a time\n\n\ndef propose(p: dict) -> dict:\n    comp = sum(p[\"competitor_prices\"]) / len(p[\"competitor_prices\"])\n    gap = (p[\"price\"] / comp - 1) * 100\n    target = comp\n    reason = f\"Move toward competitor average ({gap:+.1f}% vs competitors)\"\n    if p[\"weeks_of_stock\"] > 12:          # overstock: price to clear\n        target = min(comp, p[\"price\"]) * 0.95\n        reason = f\"Overstock ({p['weeks_of_stock']} weeks of stock): cut to clear\"\n    elif p[\"weeks_of_stock\"] < 4:         # low stock: no need to discount\n        target = max(target, p[\"price\"])\n        reason = (f\"Low stock ({p['weeks_of_stock']} weeks): hold price even though it is {gap:+.1f}% vs \"\n                  f\"competitors, to avoid selling out\")\n    lo, hi = p[\"price\"] * (1 - MAX_CHANGE), p[\"price\"] * (1 + MAX_CHANGE)\n    floor = p[\"cost\"] / (1 - MIN_MARGIN)\n    new = round(max(min(max(target, lo), hi), floor), 2)\n    if new == round(hi, 2) and target > hi:\n        reason += f\"; capped at the {MAX_CHANGE:.0%} max move\"\n    change = new / p[\"price\"] - 1\n    units = p[\"weekly_units\"] * (1 + p[\"elasticity\"] * change)\n    profit_now = (p[\"price\"] - p[\"cost\"]) * p[\"weekly_units\"]\n    profit_new = (new - p[\"cost\"]) * units\n    return {\"sku\": p[\"sku\"], \"name\": p[\"name\"], \"current_price\": p[\"price\"], \"competitor_avg\": round(comp, 2),\n            \"proposed_price\": new, \"change_pct\": round(change * 100, 1), \"margin_pct\": round((new - p[\"cost\"]) / new * 100, 1),\n            \"expected_weekly_units\": round(units), \"weekly_gross_profit_now\": round(profit_now),\n            \"weekly_gross_profit_new\": round(profit_new), \"weeks_of_stock\": p[\"weeks_of_stock\"], \"pricing_reason\": reason}\n\n\ndef main():\n    banner(\"Retail 03 - Dynamic Pricing Advisor (CrewAI)\")\n    proposals = [propose(p) for p in PRODUCTS]\n    section(\"Guard-railed price proposals\", json.dumps(proposals, indent=2))\n\n    analyst = make_agent(\"Pricing Analyst\", \"Explain each proposed price using competitors, stock and elasticity\",\n                         \"Retail pricing analyst who balances volume, margin and price perception.\")\n    manager = make_agent(\"Category Manager\", \"Approve, adjust or reject each price change and write the pricing memo\",\n                         \"You own the category P&L and protect customer trust (no confusing price swings).\")\n    t1 = make_task(\"Proposals (exact figures):\\n{proposals}\\n\\nGuardrails: minimum margin 30%, max change 10% per move.\\n\\n\"\n                   \"Explain the rationale (start from pricing_reason) and risks of each proposal.\", \"Per-SKU rationale and risks.\", analyst)\n    t2 = make_task(\"Proposals (exact figures; quote these, never recalculate):\\n{proposals}\\n\\n\"\n                   \"Decide APPROVE / ADJUST / REJECT per SKU and write a short pricing memo. Base each reason on pricing_reason.\",\n                   \"Memo: decision table (SKU, current, proposed, decision, reason), expected profit impact, \"\n                   \"and notes for marketing and store teams.\", manager, context=[t1])\n    section(\"Pricing memo\", run_crew([analyst, manager], [t1, t2], {\"proposals\": json.dumps(proposals, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Prices, competitors & stock\"] --> PY[\"🐍 Python<br/>Guard-railed prices: 30% margin floor, max 10% move\"]\n    subgraph CREW[\"🤖 CrewAI crew: agents work in turn\"]\n        A1[\"🧑‍💼 Pricing Analyst\"]\n        A2[\"👔 Category Manager\"]\n        A1 -->|\"hands over\"| A2\n    end\n    style CREW fill:none,stroke:#7c3aed,stroke-dasharray:5 4\n    PY -->|\"✅ facts\"| A1\n    CREW <-.->|\"💬 prompts\"| LLM([\"🦙 Ollama\"])\n    A2 --> OUT[\"📝 Pricing memo\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class A1,A2 ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 34, "turns": [{"ask": "Should we change prices on our earbuds, water bottles and other lines this week?", "steps": [{"icon": "🐍", "label": "Python · Guard-railed price proposals", "body": "[\n  {\n    \"sku\": \"P-1\",\n    \"name\": \"Wireless earbuds\",\n    \"current_price\": 49.99,\n    \"competitor_avg\": 45.5,\n    \"proposed_price\": 49.99,\n    \"change_pct\": 0.0,\n    \"margin_pct\": 58.0,\n    \"expected_weekly_units\": 320,\n    \"weekly_gross_profit_now\": 9277,\n    \"weekly_gross_profit_new\": 9277,\n    \"weeks_of_stock\": 3.0,\n    \"pricing_reason\": \"Low stock (3.0 weeks): hold price even though it is +9.9% vs competitors, to avoid selling out\"\n  },\n  {\n    \"sku\": \"P-2\",\n    \"name\": \"Stainless water bottle 750ml\",\n    \"current_price\": 14.99,\n    \"competitor_avg\": 17.83,\n    \"proposed_price\": 16.49,\n    \"change_pct\": 10.0,\n    \"margin_pct\": 62.4,\n    \"expected_weekly_units\": 481,\n    \"weekly_gross_profit_now\": 4747,\n    \"weekly_gross_profit_new\": 4945,\n    \"weeks_of_stock\": 6.0,\n    \"pricing_reason\": \"Move toward competitor average (-15.9% vs competitors); capped at the 10% max move\"\n  },\n  {\n    \"sku\": \"P-3\",\n    \"name\": \"Fleece throw blanket\",\n    \"current_price\": 29.99,\n    \"competitor_avg\": 29.5,\n    \"proposed_price\": 28.02,\n    \"change_pct\": -6.6,\n    \"margin_pct\": 66.1,\n    \"expected_weekly_units\": 97,\n    \"weekly_gross_profit_now\": 1742,\n    \"weekly_gross_profit_new\": 1802,\n    \"weeks_of_stock\": 22.0,\n    \"pricing_reason\": \"Overstock (22.0 weeks of stock): cut to clear\"\n  }\n]", "code": true}, {"icon": "🧑‍💼", "label": "Pricing Analyst (agent)", "body": "### SKU P-1: Wireless Earbuds\n\n**Rationale:**\n- **Pricing Reason:** Low stock (3.0 weeks): hold price even though it is +9.9% vs competitors, to avoid selling out.\n- **Current Price:** $49.99\n- **Competitor Average:** $45.50\n- **Proposed Price:** $49.99\n- **Change Pct:** 0.0%\n- **Margin Pct:** 58.0%\n- **Expected Weekly Units:** 320\n- **Weekly Gross Profit Now:** $9,277\n- **Weekly Gross Profit New:** $9,277\n- **Weeks of Stock:** 3.0\n\n**Risks:**\n- **Stock Management Risk:** Holding the price despite the competitor's lower average could lead to a potential stockout if demand increases. This might result in lost sales and customer dissatisfaction.\n- **Competitive Risk:** Competitors might lower their prices further, potentially drawing customers away from our product.\n- **Customer Perception Risk:** Keeping the price high might make the product seem overpriced compared to competitors, potentially affecting customer perception and sales.\n\n### SKU P-2: Stainless Water Bottle 750ml\n\n**Rationale:**\n- **Pricing Reason:** Move toward competitor average (-15.9% vs competitors); capped at the 10% max move.\n- **Current Price:** $14.99\n- **Competitor Average:** $17.83\n- **Proposed Price:** $16.49\n- **Change Pct:** 10.0%\n- **Margin Pct:** 62.4%\n- **Expected Weekly Units:** 481\n- **Weekly Gross Profit Now:** $4,747\n- **Weekly Gross Profit New:** $4,945\n- **Weeks of Stock:** 6.0\n\n**Risks:**\n- **Price Sensitivity Risk:** A 10% increase in price might be perceived as too high by some customers, potentially leading to a decrease in sales.\n- **Competitor Response Risk:** Competitors might match or undercut the new price, leading to a price war that could reduce overall profitability.\n- **Market Saturation Risk:** If the market is already saturated, the increase in price might not be enough to justify the higher margin, leading to lower sales volumes.\n\n### SKU P-3: Fleece Throw Blanket\n\n**Rationale:**\n- **Pricing Reason:** Overstock (22.0 weeks of stock): cut to clear.\n- **Current Price:** $29.99\n- **Competitor Average:** $29.50\n- **Proposed Price:** $28.02\n- **Change Pct:** -6.6%\n- **Margin Pct:** 66.1%\n- **Expected Weekly Units:** 97\n- **Weekly Gross Profit Now:** $1,742\n- **Weekly Gross Profit New:** $1,802\n- **Weeks of Stock:** 22.0\n\n**Risks:**\n- **Sales Volume Risk:** Cutting the price significantly might attract more customers, but it could also lead to a decrease in the perceived value of the product, potentially affecting long-term sales.\n- **Profitability Risk:** While the margin is high, the lower price might reduce the overall profitability if the sales volume does not increase significantly.\n- **Customer Perception Risk:** Customers might perceive the lower price as a sign of poor quality, which could negatively impact brand perception and future sales.\n\n### Summary\n\n- **SKU P-1:** Maintain current price to avoid stockouts, but monitor competitor actions and customer demand.\n- **SKU P-2:** Gradual price increase to align with competitors, but be prepared for potential price competition.\n- **SKU P-3:** Significant price reduction to clear overstock, but be cautious of the impact on perceived value and long-term sales.", "code": false}], "answer": "### Pricing Memo\n\n| SKU | Current Price | Proposed Price | Decision | Reason | Expected Profit Impact | Notes for Marketing and Store Teams |\n|-----|--------------|----------------|----------|--------|------------------------|-------------------------------------|\n| P-1 | $49.99        | $49.99         | APPROVE  | Low stock (3.0 weeks): hold price even though it is +9.9% vs competitors, to avoid selling out. | No change in weekly gross profit. | Monitor competitor actions and customer demand. |\n| P-2 | $14.99        | $16.49         | APPROVE  | Move toward competitor average (-15.9% vs competitors); capped at the 10% max move. | Increase in weekly gross profit by $198. | Be prepared for potential price competition. |\n| P-3 | $29.99        | $28.02         | APPROVE  | Overstock (22.0 weeks of stock): cut to clear. | Increase in weekly gross profit by $60. | Cautiously promote the clearance to avoid perceived quality issues. |\n\n**Notes for Marketing and Store Teams:**\n- For SKU P-1, ensure that stock levels are closely monitored and consider promotional activities to boost sales if demand increases.\n- For SKU P-2, prepare for potential price competition and consider highlighting the quality and features of the product to justify the new price.\n- For SKU P-3, emphasize the clearance sale and offer additional value-added promotions to attract customers. Monitor customer feedback to ensure the price reduction does not negatively impact brand perception.\n\nThis memo outlines the decisions and reasons for the proposed price changes, along with expected profit impacts and strategic notes for the marketing and store teams."}]}}, {"slug": "04_promotion_performance_analyzer", "title": "Promotion Performance Analyzer", "category": "merch", "framework": "LangChain", "pattern": "Chain", "description": "Measures whether last month's promotions really made money and which to repeat, rework or drop.", "how": "Python computes each promotion's incremental profit after the post-promotion dip, cannibalisation of sister products and marketing spend, and the extra supplier funding needed to break even; an LLM chain writes the review.", "today": "After each promotion, the promotions team checks whether it was worth it before deciding to run it again. Often they only look at how many extra units sold.", "who": "Promotions analysts, category managers and supplier account teams.", "why": "Volume is easy to see but profit is not: customers stock up and buy less later, shoppers switch from our other products, and the discount and marketing cost money. A promotion can double sales and still lose money.", "terms": ["Incremental profit", "Promotion uplift", "Post-promotion dip", "Cannibalisation", "Supplier funding", "Gross margin"], "code": "\"\"\"Promotion Performance Analyzer — LangChain chain + Ollama.\n\nPython measures each promotion's true incremental profit (after the post-promo dip, cannibalisation and\nmarketing spend); the LLM writes the post-promotion review.\n\nRun:  python 02_retail/04_promotion_performance_analyzer/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\n# One-week promotions from last month. baseline = normal weekly units (4-week average before the promo)\nPROMOS = [\n    {\"id\": \"PR-01\", \"product\": \"Coffee beans 1kg\", \"mechanic\": \"25% off\", \"price\": 18.00, \"promo_price\": 13.50,\n     \"unit_cost\": 10.00, \"supplier_funding_per_unit\": 1.50, \"baseline_units\": 120, \"promo_units\": 410,\n     \"post_weeks\": 2, \"post_units\": 150, \"cannibalised\": {\"product\": \"Coffee beans 500g\", \"units\": 60, \"unit_margin\": 3.20},\n     \"marketing_spend\": 800},\n    {\"id\": \"PR-02\", \"product\": \"Pasta sauce 500g\", \"mechanic\": \"2 for 5.00\", \"price\": 3.20, \"promo_price\": 2.50,\n     \"unit_cost\": 1.60, \"supplier_funding_per_unit\": 0.40, \"baseline_units\": 300, \"promo_units\": 900,\n     \"post_weeks\": 2, \"post_units\": 560, \"cannibalised\": {\"product\": \"Own-brand pasta sauce\", \"units\": 90, \"unit_margin\": 0.90},\n     \"marketing_spend\": 300},\n    {\"id\": \"PR-03\", \"product\": \"Kitchen towels 4-pack\", \"mechanic\": \"10% off\", \"price\": 6.00, \"promo_price\": 5.40,\n     \"unit_cost\": 3.50, \"supplier_funding_per_unit\": 0.00, \"baseline_units\": 200, \"promo_units\": 230,\n     \"post_weeks\": 2, \"post_units\": 400, \"cannibalised\": None, \"marketing_spend\": 250},\n]\n\n\ndef evaluate(p: dict) -> dict:\n    \"\"\"Incremental profit = promo-week profit - normal profit - post-promo dip - cannibalisation - marketing.\"\"\"\n    normal_margin = p[\"price\"] - p[\"unit_cost\"]\n    promo_margin = p[\"promo_price\"] - p[\"unit_cost\"] + p[\"supplier_funding_per_unit\"]\n    uplift = p[\"promo_units\"] / p[\"baseline_units\"] - 1\n    baseline_profit = p[\"baseline_units\"] * normal_margin\n    promo_profit = p[\"promo_units\"] * promo_margin\n    dip_units = max(p[\"baseline_units\"] * p[\"post_weeks\"] - p[\"post_units\"], 0)  # customers stocked up\n    dip_loss = dip_units * normal_margin\n    c = p[\"cannibalised\"]\n    cannibal_loss = c[\"units\"] * c[\"unit_margin\"] if c else 0\n    net = promo_profit - baseline_profit - dip_loss - cannibal_loss - p[\"marketing_spend\"]\n    drags = {\"post-promotion dip\": dip_loss, \"cannibalisation\": cannibal_loss, \"marketing spend\": p[\"marketing_spend\"]}\n    biggest = max(drags, key=drags.get)\n    if net > 0:\n        verdict = \"REPEAT\"\n    elif uplift >= 1.0:\n        verdict = \"REWORK\"   # strong traffic driver, but the economics don't work yet\n    else:\n        verdict = \"DROP\"     # too shallow to move volume\n    return {\"id\": p[\"id\"], \"product\": p[\"product\"], \"mechanic\": p[\"mechanic\"],\n            \"volume_uplift_pct\": round(uplift * 100), \"promo_week_profit\": round(promo_profit),\n            \"normal_week_profit\": round(baseline_profit), \"post_promo_dip_units\": dip_units,\n            \"post_promo_dip_loss\": round(dip_loss), \"cannibalisation_loss\": round(cannibal_loss),\n            \"cannibalised_product\": c[\"product\"] if c else None, \"marketing_spend\": p[\"marketing_spend\"],\n            \"incremental_profit\": round(net), \"biggest_drag_on_profit\": f\"{biggest} ({round(drags[biggest])})\",\n            \"verdict\": verdict,\n            \"extra_supplier_funding_per_unit_to_break_even\": round(-net / p[\"promo_units\"], 2) if verdict == \"REWORK\" else None}\n\n\nSYSTEM = (\n    \"You are a retail promotions analyst writing a post-promotion review for the category manager. Use ONLY the \"\n    \"figures given; never recalculate. Every figure is money (profit or cost) except volume_uplift_pct and the \"\n    \"fields ending in _units. For each promotion state the verdict (REPEAT / REWORK / DROP), the incremental \"\n    \"profit and biggest_drag_on_profit. For REWORK, suggest fixes: shallower discount, more supplier funding \"\n    \"(quote extra_supplier_funding_per_unit_to_break_even), or a different mechanic. End with 3 lessons drawn from \"\n    \"these results for next quarter's promotion calendar. Keep it under 300 words.\"\n)\n\n\ndef main():\n    banner(\"Retail 04 - Promotion Performance Analyzer (LangChain chain)\")\n    results = [evaluate(p) for p in PROMOS]\n    section(\"Incremental profit by promotion\", json.dumps(results, indent=2))\n    section(\"Post-promotion review\", run_chain(SYSTEM, \"Promotion results:\\n{r}\", r=json.dumps(results, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Promotion sales & costs\"] --> PY[\"🐍 Python<br/>Incremental profit after dip, cannibalisation & spend\"]\n    PY -->|\"✅ decision & numbers\"| CH[\"🔗 LangChain prompt<br/>explain, don't decide\"]\n    CH <-.->|\"💬\"| LLM([\"🦙 Ollama\"])\n    CH --> OUT[\"📝 Post-promotion review\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules fill:#d1fae5,stroke:#059669,color:#064e3b\n    classDef ai fill:#ede9fe,stroke:#7c3aed,color:#3b0764\n    classDef llm fill:#1f2937,stroke:#111827,color:#ffffff\n    classDef out fill:#fef3c7,stroke:#d97706,color:#78350f\n    classDef human fill:#f3f4f6,stroke:#6b7280,color:#111827\n    class IN data\n    class PY rules\n    class CH ai\n    class LLM llm\n    class OUT out\n    class HU human", "chat": {"model": "qwen2.5:7b-instruct", "seconds": 8, "turns": [{"ask": "How did last month's promotions perform? Which should we run again?", "steps": [{"icon": "🐍", "label": "Python · Incremental profit by promotion", "body": "[\n  {\n    \"id\": \"PR-01\",\n    \"product\": \"Coffee beans 1kg\",\n    \"mechanic\": \"25% off\",\n    \"volume_uplift_pct\": 242,\n    \"promo_week_profit\": 2050,\n    \"normal_week_profit\": 960,\n    \"post_promo_dip_units\": 90,\n    \"post_promo_dip_loss\": 720,\n    \"cannibalisation_loss\": 192,\n    \"cannibalised_product\": \"Coffee beans 500g\",\n    \"marketing_spend\": 800,\n    \"incremental_profit\": -622,\n    \"biggest_drag_on_profit\": \"marketing spend (800)\",\n    \"verdict\": \"REWORK\",\n    \"extra_supplier_funding_per_unit_to_break_even\": 1.52\n  },\n  {\n    \"id\": \"PR-02\",\n    \"product\": \"Pasta sauce 500g\",\n    \"mechanic\": \"2 for 5.00\",\n    \"volume_uplift_pct\": 200,\n    \"promo_week_profit\": 1170,\n    \"normal_week_profit\": 480,\n    \"post_promo_dip_units\": 40,\n    \"post_promo_dip_loss\": 64,\n    \"cannibalisation_loss\": 81,\n    \"cannibalised_product\": \"Own-brand pasta sauce\",\n    \"marketing_spend\": 300,\n    \"incremental_profit\": 245,\n    \"biggest_drag_on_profit\": \"marketing spend (300)\",\n    \"verdict\": \"REPEAT\",\n    \"extra_supplier_funding_per_unit_to_break_even\": null\n  },\n  {\n    \"id\": \"PR-03\",\n    \"product\": \"Kitchen towels 4-pack\",\n    \"mechanic\": \"10% off\",\n    \"volume_uplift_pct\": 15,\n    \"promo_week_profit\": 437,\n    \"normal_week_profit\": 500,\n    \"post_promo_dip_units\": 0,\n    \"post_promo_dip_loss\": 0,\n    \"cannibalisation_loss\": 0,\n    \"cannibalised_product\": null,\n    \"marketing_spend\": 250,\n    \"incremental_profit\": -313,\n    \"biggest_drag_on_profit\": \"marketing spend (250)\",\n    \"verdict\": \"DROP\",\n    \"extra_supplier_funding_per_unit_to_break_even\": null\n  }\n]", "code": true}], "answer": "### Promotion Review Summary\n\n1. **PR-01 (Coffee beans 1kg)**\n   - **Verdict:** REWORK\n   - **Incremental Profit:** -622\n   - **Biggest Drag on Profit:** marketing spend (800)\n   - **Fix Suggestion:** Increase supplier funding by 1.52 per unit to break even.\n\n2. **PR-02 (Pasta sauce 500g)**\n   - **Verdict:** REPEAT\n   - **Incremental Profit:** 245\n   - **Biggest Drag on Profit:** marketing spend (300)\n   - **Fix Suggestion:** None needed, as the promotion is already profitable.\n\n3. **PR-03 (Kitchen towels 4-pack)**\n   - **Verdict:** DROP\n   - **Incremental Profit:** -313\n   - **Biggest Drag on Profit:** marketing spend (250)\n   - **Fix Suggestion:** None needed, as the promotion is not profitable.\n\n### Lessons for Next Quarter\n\n1. **Optimize Marketing Spend:** High marketing spend can significantly impact profitability. Consider more targeted marketing strategies to reduce costs without compromising sales.\n2. **Balance Discounts with Profitability:** Shallow discounts can be more effective in maintaining profit margins while still driving sales. Evaluate the impact of deeper discounts on overall profitability.\n3. **Monitor Cannibalization:** Ensure that promotions do not negatively impact sales of other products. Target promotions to specific product lines to avoid cannibalization and maintain overall category health."}]}}, {"slug": "05_range_review_assistant", "title": "Range Review & Assortment Planner", "category": "merch", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Decides which products to delist, keep or give more shelf space in a category range review.", "how": "Python ranks products on profit per shelf facing and checks how much demand would switch to other products (delist only if 70%+ transfers and no unique need is left unserved); a Category Analyst agent explains the evidence and a Senior Buyer agent writes the range review memo.", "today": "Once or twice a year each category has a range review: buyers decide which products to drop, keep or give more shelf space, and tell the suppliers.", "who": "Buyers and category managers, supported by category analysts.", "why": "Shelf space is limited and every product wants more of it. Dropping a product on sales alone can upset loyal shoppers who have no alternative, while weak products quietly waste space.", "terms": ["Range review", "Facing", "Transferable demand", "Delist", "Stock-out", "Category manager"], "code": "\"\"\"Range Review & Assortment Planner — CrewAI + Ollama.\n\nPython scores every product on profit per shelf facing and how much of its demand would transfer to other\nproducts if it were delisted; agents explain the evidence and write the range review decisions.\n\nRun:  python 02_retail/05_range_review_assistant/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\n# Breakfast cereal aisle, last 12 weeks. transferable = share of buyers who would switch to another product\n# on the shelf if this one were removed (from loyalty-card switching data). unique_need = only option for a need.\nCATEGORY = \"Breakfast cereals\"\nPRODUCTS = [\n    {\"sku\": \"C-01\", \"name\": \"Honey oat clusters 500g\", \"weekly_sales\": 1450, \"margin_pct\": 32, \"facings\": 4, \"transferable\": 0.55, \"oos_rate\": 0.07, \"unique_need\": None},\n    {\"sku\": \"C-02\", \"name\": \"Corn flakes 750g\", \"weekly_sales\": 1680, \"margin_pct\": 24, \"facings\": 5, \"transferable\": 0.60, \"oos_rate\": 0.02, \"unique_need\": None},\n    {\"sku\": \"C-03\", \"name\": \"Choco puffs 375g\", \"weekly_sales\": 920, \"margin_pct\": 30, \"facings\": 3, \"transferable\": 0.70, \"oos_rate\": 0.01, \"unique_need\": None},\n    {\"sku\": \"C-04\", \"name\": \"Gluten-free granola 400g\", \"weekly_sales\": 200, \"margin_pct\": 38, \"facings\": 3, \"transferable\": 0.15, \"oos_rate\": 0.03, \"unique_need\": \"gluten-free\"},\n    {\"sku\": \"C-05\", \"name\": \"Bran flakes 500g\", \"weekly_sales\": 310, \"margin_pct\": 26, \"facings\": 3, \"transferable\": 0.85, \"oos_rate\": 0.00, \"unique_need\": None},\n    {\"sku\": \"C-06\", \"name\": \"Fruit muesli 1kg\", \"weekly_sales\": 640, \"margin_pct\": 35, \"facings\": 2, \"transferable\": 0.40, \"oos_rate\": 0.09, \"unique_need\": None},\n    {\"sku\": \"C-07\", \"name\": \"Frosted rings 300g\", \"weekly_sales\": 240, \"margin_pct\": 28, \"facings\": 3, \"transferable\": 0.80, \"oos_rate\": 0.00, \"unique_need\": None},\n    {\"sku\": \"C-08\", \"name\": \"Protein crunch 350g\", \"weekly_sales\": 380, \"margin_pct\": 40, \"facings\": 2, \"transferable\": 0.35, \"oos_rate\": 0.04, \"unique_need\": None},\n]\nBOTTOM_N = 3                    # delist candidates come from the 3 weakest products on profit per facing\nMIN_TRANSFER_TO_DELIST = 0.70   # most buyers must have an alternative they already accept\nOOS_TO_EXPAND = 0.05            # out of stock more than 5% of the time -> needs more space\n\n\ndef score(products: list[dict]) -> list[dict]:\n    rows = []\n    for p in products:\n        profit = p[\"weekly_sales\"] * p[\"margin_pct\"] / 100\n        rows.append({**p, \"weekly_profit\": round(profit), \"profit_per_facing\": round(profit / p[\"facings\"])})\n    ranked = sorted(rows, key=lambda r: r[\"profit_per_facing\"])\n    bottom = {r[\"sku\"] for r in ranked[:BOTTOM_N]}\n    for r in rows:\n        if r[\"sku\"] in bottom and r[\"transferable\"] >= MIN_TRANSFER_TO_DELIST and not r[\"unique_need\"]:\n            r[\"proposal\"] = \"DELIST\"\n            r[\"profit_kept_by_switching\"] = round(r[\"weekly_profit\"] * r[\"transferable\"])\n            r[\"profit_at_risk\"] = r[\"weekly_profit\"] - r[\"profit_kept_by_switching\"]\n        elif r[\"oos_rate\"] > OOS_TO_EXPAND:\n            r[\"proposal\"] = \"ADD A FACING\"\n        elif r[\"sku\"] in bottom and r[\"unique_need\"]:\n            r[\"proposal\"] = f\"KEEP (only {r['unique_need']} option)\"\n        else:\n            r[\"proposal\"] = \"KEEP\"\n    return rows\n\n\ndef main():\n    banner(\"Retail 05 - Range Review & Assortment Planner (CrewAI)\")\n    rows = score(PRODUCTS)\n    freed = sum(r[\"facings\"] for r in rows if r[\"proposal\"] == \"DELIST\")\n    wanted = sum(1 for r in rows if r[\"proposal\"] == \"ADD A FACING\")\n    facts = {\"category\": CATEGORY, \"products\": rows, \"facings_freed_by_delists\": freed,\n             \"facings_requested_by_expansions\": wanted, \"facings_left_over\": freed - wanted,\n             \"weekly_profit_at_risk_from_delists\": sum(r.get(\"profit_at_risk\", 0) for r in rows),\n             \"rules\": f\"DELIST = bottom {BOTTOM_N} on profit per facing AND at least {MIN_TRANSFER_TO_DELIST:.0%} of demand \"\n                      f\"transfers AND no unique need; ADD A FACING = out of stock more than {OOS_TO_EXPAND:.0%} of the time\"}\n    section(\"Range scorecard\", json.dumps(facts, indent=2))\n\n    analyst = make_agent(\"Category Analyst\", \"Explain the evidence behind each range proposal\",\n                         \"Retail category analyst who uses loyalty-card switching data, not gut feel.\")\n    buyer = make_agent(\"Senior Buyer\", \"Make the final range decisions and write the range review memo\",\n                       \"You own the cereal aisle: you protect shoppers' choice and the category's profit.\")\n    t1 = make_task(\"Range scorecard (exact figures):\\n{facts}\\n\\nFor each product explain its proposal in one line, \"\n                   \"using profit per facing, transferable demand, out-of-stock rate and any unique need.\",\n                   \"One line of evidence per SKU.\", analyst)\n    t2 = make_task(\"Range scorecard (exact figures; quote these, never recalculate):\\n{facts}\\n\\n\"\n                   \"Confirm or change each proposal and write the range review memo.\",\n                   \"Memo from the Senior Buyer to the Category Director, with no date, signature or placeholder lines \"\n                   \"like [Insert Name]: decision table (SKU, product, decision, reason), \"\n                   \"how to use the facings_left_over (e.g. trial a new product or give best sellers more space), \"\n                   \"the weekly profit at risk from delists, and talking points for the suppliers of delisted products.\",\n                   buyer, context=[t1])\n    section(\"Range review memo\", run_crew([analyst, buyer], [t1, t2], {\"facts\": json.dumps(facts, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n", "flow": "flowchart LR\n    IN[\"📄 Range sales, space & switching\"] --> PY[\"🐍 Python<br/>Profit per facing + transferable demand rules\"]\n    subgraph CREW[\"🤖 CrewAI crew: agents work in turn\"]\n        A1[\"🧑‍💼 Category Analyst\"]\n        A2[\"🤖 Senior Buyer\"]\n        A1 -->|\"hands over\"| A2\n    end\n    style CREW fill:none,stroke:#7c3aed,stroke-dasharray:5 4\n    PY -->|\"✅ facts\"| A1\n    CREW <-.->|\"💬 prompts\"| LLM([\"🦙 Ollama\"])\n    A2 --> OUT[\"📝 Range review memo\"]\n    OUT --> HU[\"🧑‍⚖️ Human review\"]\n    classDef data fill:#e0f2fe,stroke:#0284c7,color:#0c4a6e\n    classDef rules  {"icon": "🧑‍💼", "label": "Category Analyst (agent)", "body": "Sure, here is the detailed explanation for each product's proposal based on the provided criteria:\n\n1. **SKU C-01 (Honey oat clusters 500g):**\n   - **Proposal:** ADD A FACING\n   - **Evidence:** Out-of-stock rate is 7%, and profit per facing is $116, which is relatively high, but the out-of-stock rate is above 5%, triggering the \"ADD A FACING\" rule.\n\n2. **SKU C-02 (Corn flakes 750g):**\n   - **Proposal:** KEEP\n   - **Evidence:** Profit per facing is $81, which is reasonable, and the out-of-stock rate is only 2%, and it has high transferable demand (60%), with no unique need.\n\n3. **SKU C-03 (Choco puffs 375g):**\n   - **Proposal:** KEEP\n   - **Evidence:** Profit per facing is $92, which is high, and the out-of-stock rate is only 1%, and it has high transferable demand (70%), with no unique need.\n\n4. **SKU C-04 (Gluten-free granola 400g):**\n   - **Proposal:** KEEP (only gluten-free option)\n   - **Evidence:** Profit per facing is $25, but it is the only gluten-free option, and the out-of-stock rate is 3%, with high transferable demand (15%), and no unique need.\n\n5. **SKU C-05 (Bran flakes 500g):**\n   - **Proposal:** DELIST\n   - **Evidence:** Profit per facing is $27, but it is at the bottom of the profit per facing list, with 85% transferable demand, and no unique need, and it is never out of stock.\n\n6. **SKU C-06 (Fruit muesli 1kg):**\n   - **Proposal:** ADD A FACING\n   - **Evidence:** Out-of-stock rate is 9%, and profit per facing is $112, which is relatively high, but the out-of-stock rate is above 5%, triggering the \"ADD A FACING\" rule.\n\n7. **SKU C-07 (Frosted rings 300g):**\n   - **Proposal:** DELIST\n   - **Evidence:** Profit per facing is $22, but it is at the bottom of the profit per facing list, with 80% transferable demand, and no unique need, and it is never out of stock.\n\n8. **SKU C-08 (Protein crunch 350g):**\n   - **Proposal:** KEEP\n   - **Evidence:** Profit per fa
