S = {\"retail_stable\": (20_000, 0.05), \"retail_less_stable\": (15_000, 0.10), \"operational_wholesale\": (6_000, 0.25),\n            \"non_operational_wholesale\": (9_000, 0.40), \"committed_credit_lines\": (12_000, 0.10)}\nINFLOWS = {\"performing_loans_maturing\": (1_600, 0.50), \"interbank_maturing\": (600, 1.0)}\n\nASF = {\"capital\": (5_800, 1.0), \"retail_deposits\": (28_000, 0.90), \"wholesale_funding_lt1y\": (11_500, 0.50), \"long_term_debt\": (4_000, 1.0)}\nRSF = {\"hqla_l1\": (8_600, 0.0), \"residential_mortgages\": (12_000, 0.65), \"corporate_loans_gt1y\": (15_000, 0.85),\n       \"retail_loans\": (9_000, 0.85), \"other_assets\": (2_500, 1.0)}\n\n\ndef weighted(d):  # sum of amount * factor\n    return sum(a * f for a, f in d.values())\n\n\ndef compute() -> dict:\n    l1 = HQLA[\"cash_central_bank\"][0] + HQLA[\"govt_bonds_L1\"][0]\n    l2 = weighted({k: v for k, v in HQLA.items() if \"L2\" in k})\n    hqla = l1 + min(l2, l1 * 40 / 60)  # Level 2 cap: 40% of HQLA\n    out, inf = weighted(OUTFLOWS), weighted(INFLOWS)\n    net = out - min(inf, 0.75 * out)\n    return {\"hqla\": round(hqla), \"gross_outflows\": round(out), \"capped_inflows\": round(min(inf, 0.75 * out)),\n            \"lcr_pct\": round(hqla / net * 100, 1), \"asf\": round(weighted(ASF)), \"rsf\": round(weighted(RSF)),\n            \"nsfr_pct\": round(weighted(ASF) / weighted(RSF) * 100, 1), \"limits\": {\"lcr_min\": 100, \"nsfr_min\": 100,\n                                                                                    \"internal_lcr_trigger\": 120,\n                                                                                    \"internal_nsfr_trigger\": 110}}\n\n\nSYSTEM = (\n    \"You are the Treasury liquidity risk manager writing for ALCO. Using the metrics, write: headline (RAG status), \"\n    \"LCR and NSFR vs regulatory minimum and internal trigger, top drivers of outflows/RSF, and 3 concrete actions \"\n    \"(e.g. term out wholesale funding, grow stable retail deposits, add Level 1 HQLA). Keep numbers exact and use only \"\n    \"the limits provided - do not invent targets. RAG: Red below regulatory minimum, Amber below internal trigger, else Green.\"\n)\n\n\ndef main():\n    banner(\"20 - Liquidity LCR / NSFR Monitor (LangChain)\")\n    m = compute()\n    section(\"Metrics\", json.dumps(m, indent=2))\n    section(\"ALCO note\", run_chain(SYSTEM, \"Metrics:\\n{m}\\n\\nInputs:\\n{i}\", m=json.dumps(m, indent=2),\n                                   i=json.dumps({\"outflows\": OUTFLOWS, \"rsf\": RSF}, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "21_regulatory_change_tracker", "title": "Regulatory Change Impact Analyzer", "category": "regulatory", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Reads a new regulatory circular and maps obligations to impacted business units and controls.", "how": "Regulatory Analyst agent extracts obligations; Compliance Impact agent maps them to the bank's process inventory and gaps.", "today": "Regulators publish new rules constantly. Compliance must work out what each new rule requires, which teams and systems are affected, and what must change by the deadline.", "who": "Compliance and regulatory change management teams.", "why": "Legal text is dense, and missing one obligation can lead to enforcement action.", "terms": ["Regulatory circular", "Regulatory reporting"], "code": "\"\"\"Regulatory Change Impact Analyzer — CrewAI + Ollama.\n\nRun:  python 01_banking/21_regulatory_change_tracker/app.py\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nCIRCULAR = \"\"\"\nCIRCULAR 2026/14 - Strengthening Digital Lending and Customer Protection (fictional, for demo)\n1. Regulated entities shall provide a Key Fact Statement (KFS) with the all-in annual percentage rate (APR)\n   to every digital loan applicant before contract execution.\n2         \"then a 5-line executive summary.\", impact, context=[t1])\n    section(\"Impact assessment\", run_crew([reg, impact], [t1, t2], {\"circular\": CIRCULAR, \"inventory\": PROCESS_INVENTORY}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "22_stress_testing_narrator", "title": "Stress Testing Scenario Narrator", "category": "regulatory", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Applies macro stress scenarios to a portfolio and writes the stress-test narrative for the board.", "how": "Python shocks PD/LGD by scenario; an Economist agent describes scenarios and a Risk Reporter agent explains capital impact.", "today": "Banks simulate severe recessions to check they would still have enough capital, then explain the results to the board and regulator.", "who": "Stress testing / ICAAP teams (Risk), economists, the board risk committee.", "why": "Results must be turned into a clear story of what breaks, why, and what management would do.", "terms": ["Stress testing", "ICAAP", "PD / LGD / EAD", "Capital ratio"], "code": "\"\"\"Stress Testing Scenario Narrator — CrewAI + Ollama.\n\nRun:  python 01_banking/22_stress_testing_narrator/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nPORTFOLIO = {  # EAD (millions), baseline PD, LGD\n    \"Residential mortgages\": (12_000, 0.008, 0.20),\n    \"Commercial real estate\": (3_000, 0.020, 0.40),\n    \"SME loans\": (6_000, 0.030, 0.45),\n    \"Large corporate\": (14_000, 0.012, 0.40),\n    \"Credit cards\": (2_500, 0.045, 0.80),\n}\nCET1, RWA, PPNR = 3_900, 40_000, 650  # capital, RWA, pre-provision net revenue\n\nSCENARIOS = {\n    \"Baseline\": {\"gdp\": 2.5, \"unemployment\": 4.5, \"house_prices\": 3, \"pd_mult\": 1.0, \"lgd_add\": 0.00, \"ppnr_mult\": 1.0},\n    \"Adverse\": {\"gdp\": -1.5, \"unemployment\": 7.5, \"house_prices\": -12, \"pd_mult\": 2.0, \"lgd_add\": 0.05, \"ppnr_mult\": 0.8},\n    \"Severely adverse\": {\"gdp\": -4.0, \"unemployment\": 10.0, \"house_prices\": -25, \"pd_mult\": 3.5, \"lgd_add\": 0.10, \"ppnr_mult\": 0.6},\n}\n\n\ndef run_scenario(s: dict) -> dict:\n    losses = {k: ead * min(pd * s[\"pd_mult\"], 1) * min(lgd + s[\"lgd_add\"], 1) for k, (ead, pd, lgd) in PORTFOLIO.items()}\n    total = sum(losses.values())\n    cet1_after = CET1 - total + PPNR * s[\"ppnr_mult\"]\n    return {\"losses_by_portfolio\": {k: round(v) for k, v in losses.items()}, \"total_credit_loss\": round(total),\n            \"cet1_ratio_start\": round(CET1 / RWA * 100, 2), \"cet1_ratio_end\": round(cet1_after / RWA * 100, 2),\n            \"hurdle_pct\": 7.0}\n\n\ndef main():\n    banner(\"22 - Stress Testing Scenario Narrator (CrewAI)\")\n    results = {name: {\"macro\": {k: v for k, v in s.items() if k in (\"gdp\", \"unemployment\", \"house_prices\")},\n                      **run_scenario(s)} for name, s in SCENARIOS.items()}\n    section(\"Stress results\", json.dumps(results, indent=2))\n    table = [\"| Scenario | Credit loss (m) | CET1 start | CET1 end | vs 7% hurdle |\", \"|---|---|---|---|---|\"]\n    for name, r in results.items():\n        verdict = \"PASS\" if r[\"cet1_ratio_end\"] >= r[\"hurdle_pct\"] else \"FAIL\"\n        table.append(f\"| {name} | {r['total_credit_loss']:,} | {r['cet1_ratio_start']}% | {r['cet1_ratio_end']}% | {verdict} |\")\n    table = \"\\n\".join(table)\n    section(\"Results table\", table)\n\n    economist = make_agent(\"Chief Economist\", \"Describe macro scenarios in plain business language\",\n                           \"You design stress scenarios and explain their transmission to bank portfolios.\")\n    reporter = make_agent(\"Stress Testing Lead\", \"Write the board-level stress testing summary\",\n                          \"You present ICAAP stress results to the board risk committee.\")\n    t1 = make_task(\"Scenario results:\\n{results}\\n\\nDescribe each scenario's narrative and how it hits each portfolio.\",\n                   \"Scenario narratives with transmission channels.\", economist)\n    t2 = make_task(\"Write the board summary. The results table below is final and is shown to the board separately: \"\n                   \"do not reproduce or recalculate it, just refer to its figures.\\n\\n{table}\\n\\n\"\n                   \"Losses by portfolio (millions) per scenario:\\n{results}\",\n                   \"Sections: Key messages, Most vulnerable portfolios (cite their loss amounts), \"\n                   \"Management actions (capital, risk appetite, hedging).\", reporter, context=[t1])\n    section(\"Board summary\", run_crew([economist, reporter], [t1, t2],\n                                      {\"results\": json.dumps(results, indent=2), \"table\": table}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "23_ifrs9_ecl_calculator", "title": "IFRS 9 ECL Calculator & Explainer", "category": "regulatory", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Stages loans (1/2/3) and calculates expected credit loss, then explains drivers.", "how": "Agent calls `stage_loan` and `calculate_ecl` tools; explains SICR triggers and 12-month vs. lifetime ECL.", "today": "Under IFRS 9, banks set aside provisions for loans they expect to go bad, based on each loan's stage and probability of default.", "who": "Credit risk / impairment team and Finance.", "why": "Provisions directly hit profit; auditors challenge every staging decision and number.", "terms": ["IFRS 9", "ECL (Expected Credit Loss)", "PD / LGD / EAD", "IFRS 9 stages", "SICR"], "code": "\"\"\"IFRS 9 ECL Calculator & Explainer — LangChain tool-calling agent + Ollama.\n\nRun:  python 01_banking/23_ifrs9_ecl_calculator/app.py\n      python 01_banking/23_ifrs9_ecl_calculator/app.py \"Why is LN-3 in stage 2?\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nLOANS = {\n    \"LN-1\": {\"ead\": 500_000, \"dpd\": 0, \"pd_12m\": 0.010, \"pd_lifetime\": 0.040, \"pd_12m_at_origination\": 0.009, \"lgd\": 0.35, \"watchlist\": False, \"forborne\": False},\n    \"LN-2\": {\"ead\": 250_000, \"dpd\": 45, \"pd_12m\": 0.060, \"pd_lifetime\": 0.180, \"pd_12m_at_origination\": 0.020, \"lgd\": 0.40, \"watchlist\": False, \"forborne\": False},\n    \"LN-3\": {\"ead\": 800_000, \"dpd\": 10, \"pd_12m\": 0.035, \"pd_lifetime\": 0.120, \"pd_12m_at_origination\": 0.012, \"lgd\": 0.45, \"watchlist\": True, \"forborne\": False},\n    \"LN-4\": {\"ead\": 120_000, \"dpd\": 120, \"pd_12m\": 1.000, \"pd_lifetime\": 1.000, \"pd_12m_at_origination\": 0.030, \"lgd\": 0.60, \"watchlist\": False, \"forborne\": True},\n}\n\n\n@tool\ndef list_loans() -> list:\n    \"\"\"List all loan ids in the portfolio.\"\"\"\n    return list(LOANS)\n\n\n@tool\ndef stage_loan(loan_id: str) -> dict:\n    \"\"\"Determine the IFRS 9 stage of a loan and the triggers that caused it.\"\"\"\n    l = LOANS[loan_id]\n    triggers = []\n    if l[\"dpd\"] > 90 or l[\"pd_12m\"] >= 1:\n        return {\"loan\": loan_id, \"stage\": 3, \"triggers\": [\"Credit-impaired: >90 DPD / default\"]}\n    if l[\"dpd\"] > 30: triggers.append(\">30 DPD backstop\")\n    if l[\"pd_12m\"] / l[\"pd_12m_at_origination\"] >= 2.5: triggers.append(\"PD increased >=2.5x since origination (SICR)\")\n    if l[\"watchlist\"]: triggers.append(\"On credit watchlist\")\n    if l[\"forborne\"]: triggers.append(\"Forbearance granted\")\n    return {\"loan\": loan_id, \"stage\": 2 if triggers else 1, \"triggers\": triggers or [\"No SICR\"]}\n\n\n@tool\ndef calculate_ecl(loan_id: str, stage: int) -> dict:\n    \"\"\"Calculate ECL = PD x LGD x EAD (12-month PD for stage 1, lifetime PD for stages 2 and 3).\"\"\"\n    l = LOANS[loan_id]\n    pd = l[\"pd_12m\"] if stage == 1 else l[\"pd_lifetime\"]\n    ecl = pd * l[\"lgd\"] * l[\"ead\"]\n    return {\"loan\": loan_id, \"stage\": stage, \"pd_used\": pd, \"lgd\": l[\"lgd\"], \"ead\": l[\"ead\"],\n            \"ecl\": round(ecl), \"coverage\": f\"{ecl / l['ead'] * 100:.2f}%\"}\n\n\n@tool\ndef portfolio_ecl() -> dict:\n    \"\"\"Stage every loan and calculate ECL for the whole portfolio, including totals. Use for portfolio questions.\"\"\"\n    rows = []\n    for loan_id in LOANS:\n        s = stage_loan.invoke({\"loan_id\": loan_id})\n        e = calculate_ecl.invoke({\"loan_id\": loan_id, \"stage\": s[\"stage\"]})\n        rows.append({**e, \"triggers\": s[\"triggers\"]})\n    total_ead = sum(r[\"ead\"] for r in rows)\n    total_ecl = sum(r[\"ecl\"] for r in rows)\n    return {\"loans\": rows, \"total_ecl\": total_ecl, \"total_ead\": total_ead,\n            \"portfolio_coverage\": f\"{total_ecl / total_ead * 100:.2f}%\"}\n\n\nSYSTEM = (\n    \"You are an IFRS 9 impairment analyst. For whole-portfolio questions call portfolio_ecl; for a single loan use \"\n    \"stage_loan and calculate_ecl. Copy numbers exactly from tool results - never add or recompute them yourself. \"\n    \"Present a table: loan, stage, triggers, ECL, coverage %. State the total ECL from the tool, then explain \"\n    \"12-month vs lifetime ECL (both are forward-looking) and the main drivers in plain language.\"\n)\n\n\ndef main():\n    banner(\"23 - IFRS 9 ECL Calculator & Explainer (LangChain agent)\")\n    q = sys.argv[1] if len(sys.argv) > 1 else \"Calculate the ECL for the whole portfolio and explain it.\"\n    section(\"Question\", q)\n    section(\"Answer\", run_agent(SYSTEM, [portfolio_ecl, list_loans, stage_loan, calculate_ecl], q))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "24_policy_qa_rag", "title": "Bank Policy & Procedure Q&A (RAG)", "category": "regulatory", "framework": "LangChain", "pattern": "RAG", "description": "Answers staff questions from internal credit, KYC and operations policies with citations.", "how": "Policy snippets are embedded with Ollama embeddings, retrieved by similarity and answered with source references.", "today": "Bank staff constantly need answers from long internal policy manuals: 'can I approve this?', 'what do I do with this cash deposit?'.", "who": "Front-line staff, operations and compliance (as the help desk).", "why": "Policies are long and scattered; wrong answers lead to breaches; compliance teams answer the same questions repeatedly.", "terms": ["KYC (Know Your Customer)", "PEP", "CTR (Currency Transaction Report)", "Structuring (smurfing)"], "code": "\"\"\"Bank Policy & Procedure Q&A (RAG) — LangChain + Ollama embeddings.\n\nTip: `ollama pull nomic-embed-text` for semantic retrieval (falls back to keywords).\n\nRun:  python 01_banking/24_policy_qa_rag/app.py\n      python 01_banking/24_policy_qa_rag/app.py \"Do I need senior approval to onboard a PEP?\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import SimpleRetriever, banner, run_chain, section\n\nPOLICIES = [  # (source, text) - replace with chunks from your own policy PDFs\n    (\"Credit Policy 4.2\", \"Unsecured personal loans are capped at 20x net monthly income and a maximum tenure of 60 months. \"\n                          \"DTI including the new loan must not exceed 50%.\"),\n    (\"Credit Policy 7.1\", \"Any credit exception beyond policy requires approval one level above the normal sanctioning \"\n                          \"authority and must be reported to the Credit Risk Committee monthly.\"),\n    (\"KYC Policy 3.4\", \"Politically Exposed Persons (PEPs) require Enhanced Due Diligence, source of wealth verification \"\n                       \"and approval by senior management (Head of Compliance) before onboarding.\"),\n    (\"KYC Policy 5.1\", \"Periodic KYC review frequency: high-risk customers every 1 year, medium every 2 years, low every 3 years.\"),\n    (\"Ops Manual 2.8\", \"Cash transactions of 10,000 or more must .", "today": "Banks use statistical models (e.g. credit scores) to make decisions. An independent team must test each model regularly and report whether it still works.", "who": "Model validation / Model Risk Management team.", "why": "Validation reports are long and technical; findings must be rated and explained to non-specialists.", "terms": ["Model risk", "Gini / KS / PSI", "PD / LGD / EAD"], "code": "\"\"\"Model Risk Validation Assistant — CrewAI + Ollama.\n\nComputes Gini, KS, PSI and calibration in pure Python, then agents draft an\nSR 11-7 style validation report.\n\nRun:  python 01_banking/25_model_risk_validator/app.py\n\"\"\"\n\nimport json\nimport math\nimport random\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nrandom.seed(7)\n\n\ndef synthetic(n: int, shift: float = 0.0):\n    \"\"\"(score, default_flag) pairs: higher score = higher predicted PD.\"\"\"\n    rows = []\n    for _ in range(n):\n        latent = random.gauss(0, 1) + shift\n        pd = 1 / (1 + math.exp(-(latent * 1.2 - 3)))\n        rows.append((pd, 1 if random.random() < pd * 1.15 else 0))\n    return rows\n\n\ndef auc(rows):\n    pos = [s for s, y in rows if y]\n    neg = [s for s, y in rows if not y]\n    wins = sum((p > n) + 0.5 * (p == n) for p in pos for n in neg[:2000])\n    return wins / (len(pos) * len(neg[:2000]))\n\n\ndef ks(rows):\n    rows = sorted(rows)\n    P = sum(y for _, y in rows); N = len(rows) - P\n    cp = cn = best = 0\n    for _, y in rows:\n        cp += y; cn += 1 - y\n        best = max(best, abs(cp / P - cn / N))\n    return best\n\n\ndef psi(dev, cur, bins=10):\n    edges = sorted(s for s, _ in dev)\n    cuts = [edges[int(len(edges) * i / bins)] for i in range(1, bins)]\n    def dist(rows):\n        c = [0] * bins\n        for s, _ in rows:\n            c[sum(s > x for x in cuts)] += 1\n        return [max(v / len(rows), 1e-4) for v in c]\n    a, b = dist(dev), dist(cur)\n    return sum((y - x) * math.log(y / x) for x, y in zip(a, b))\n\n\ndef main():\n    banner(\"25 - Model Risk Validation Assistant (CrewAI)\")\n    dev, oot = synthetic(3000), synthetic(3000, shift=0.35)\n    a_dev, a_oot = auc(dev), auc(oot)\n    metrics = {\n        \"model\": \"Retail PD Scorecard v3 (logistic regression)\",\n        \"gini_development\": round(2 * a_dev - 1, 3), \"gini_out_of_time\": round(2 * a_oot - 1, 3),\n        \"ks_out_of_time\": round(ks(oot), 3), \"psi_dev_vs_oot\": round(psi(dev, oot), 3),\n        \"avg_predicted_pd_oot\": round(sum(s for s, _ in oot) / len(oot), 4),\n        \"observed_default_rate_oot\": round(sum(y for _, y in oot) / len(oot), 4),\n        \"thresholds\": {\"gini_min\": 0.40, \"psi_amber\": 0.10, \"psi_red\": 0.25, \"calibration_tolerance_rel\": 0.10},\n    }\n    section(\"Validation metrics\", json.dumps(metrics, indent=2))\n\n    # RAG status is a threshold rule, so Python decides it\n    th = metrics[\"thresholds\"]\n    calib_gap = abs(metrics[\"avg_predicted_pd_oot\"] / metrics[\"observed_default_rate_oot\"] - 1)\n    rag = {\n        \"discrimination (Gini OOT)\": \"GREEN\" if metrics[\"gini_out_of_time\"] >= th[\"gini_min\"] else \"RED\",\n        \"stability (PSI)\": \"RED\" if metrics[\"psi_dev_vs_oot\"] >= th[\"psi_red\"]\n        else \"AMBER\" if metrics[\"psi_dev_vs_oot\"] >= th[\"psi_amber\"] else \"GREEN\",\n        \"calibration (predicted vs observed PD)\": f\"{'GREEN' if calib_gap <= th['calibration_tolerance_rel'] else 'AMBER'} \"\n                                                  f\"(relative gap {calib_gap:.0%})\",\n    }\n    section(\"Test results (RAG)\", json.dumps(rag, indent=2))\n\n    validator = make_agent(\"Model Validator\", \"Assess discrimination, stability and calibration against thresholds\",\n                           \"Independent model validation quant; you are objective and evidence-based.\")\n    mrm = make_agent(\"Head of Model Risk Management\", \"Rate findings and conclude the validation\",\n                     \"You own the model risk framework (SR 11-7 / SS1/23) and decide model use conditions.\")\n    t1 = make_task(\"Metrics:\\n{metrics}\\n\\nFinal RAG status per test (do not change):\\n{rag}\\n\\n\"\n                   \"Explain what each result means and likely causes of any AMBER/RED result.\",\n                   \"Test-by-test explanation.\", validator)\n    t2 = make_task(\"Write the validation report summary.\\n\\nExact metrics (quote these; never invent numbers):\\n{metrics}\\n\\n\"\n                   \"Final RAG status per test (do not change):\\n{rag}\",\n                   \"Sections: Scope, Summary of tests (table), Findings with severity (High/Medium/Low) and remediation \"\n                   \"for every AMBER/RED test, Overall rating (Fit for use / Fit with conditions / Not fit), \"\n                   \"Monitoring recommendations.\", mrm, context=[t1])\n    section(\"Validation report\", run_crew([validator, mrm], [t1, t2],\n                                          {\"metrics\": json.dumps(metrics, indent=2), \"rag\": json.dumps(rag, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "26_wealth_advisor_agent", "title": "AI Wealth Advisor", "category": "wealth", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Builds a goals-based investment plan for a client with suitability checks.", "how": "Client Profiler, Portfolio Strategist and Compliance Reviewer agents collaborate to produce a personalised plan.", "today": "Wealth advisers understand a client's goals (education, retirement, a home), assess their risk tolerance, recommend a portfolio and document why it is suitable.", "who": "Financial advisers / relationship managers, checked by compliance.", "why": "Good advice is personal and time-consuming, so it is usually only available to wealthier clients.", "terms": ["Wealth management", "Asset allocation", "Risk profile", "Suitability", "SIP"], "code": "\"\"\"AI Wealth Advisor — CrewAI + Ollama.\n\nThree agents: Client Profiler -> Portfolio Strategist -> Compliance Reviewer.\n\nRun:  python 01_banking/26_wealth_advisor_agent/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nCLIENT = {\n    \"name\": \"Arjun & Meera Nair\", \"ages\": [38, 36], \"dependants\": \"2 children (6 and 9)\",\n    \"annual_household_income\": 6_000_000, \"monthly_expenses\": 150_000,\n    \"assets\": {\"savings_account\": 900_000, \"fixed_deposits\": 1_500_000, \"equity_stocks\": 1_200_000,\n               \"employer_provident_fund\": 2_100_000, \"gold\": 600_000},\n    \"liabilities\": {\"home_loan_outstanding\": 4_800_000, \"home_loan_emi\": 52_000},\n    \"insurance\": {\"term_life_cover\": 10_000_000, \"health_cover\": 1_000_000},\n    \"goals\": [{\"goal\": \"Children's higher education\", \"years\": 10, \"today_cost\": 4_000_000},\n              {\"goal\": \"Retirement corpus\", \"years\": 22, \"today_cost\": 30_000_000},\n              {\"goal\": \"Family vacation home\", \"years\": 10, \"today_cost\": 5_000_000}],\n    \"risk_questionnaire_score\": 62, \"investment_experience\": \"5 years in direct equity and mutual funds\",\n    \"preferences\": \"No tobacco/alcohol companies; prefers low-cost index funds\",\n}\n\nMODEL_PORTFOLIOS = {\n    \"Conservative (score <40)\": {\"equity\": 25, \"debt\": 60, \"gold\": 10, \"cash\": 5},\n    \"Moderate (40-65)\": {\"equity\": 50, \"debt\": 35, \"gold\": 10, \"cash\": 5},\n    \"Growth (65-80)\": {\"equity\": 70, \"debt\": 20, \"gold\": 5, \"cash\": 5},\n    \"Aggressive (>80)\": {\"equity\": 85, \"debt\": 10, \"gold\": 5, \"cash\": 0},\n}\n\n\ndef future_value(cost: float, years: int, inflation: float = 0.06) -> float:\n    return cost * (1 + inflation) ** years\n\n\ndef monthly_sip(target: float, years: int, annual_return: float) -> float:\n    \"\"\"Monthly investment needed to reach `target` in `years` at `annual_return`.\"\"\"\n    r, n = annual_return / 12, years * 12\n    return target * r / ((1 + r) ** n - 1)\n\n\ndef main():\n    banner(\"26 - AI Wealth Advisor (CrewAI)\")\n    goals = []\n    for g in CLIENT[\"goals\"]:\n        target = future_value(g[\"today_cost\"], g[\"years\"])\n        expected_return = 0.10 if g[\"years\"] > 7 else 0.08  # equity-heavy for long horizons\n        goals.append({**g, \"inflated_cost\": round(target), \"assumed_return_pct\": expected_return * 100,\n                      \"required_monthly_sip\": round(monthly_sip(target, g[\"years\"], expected_return))})\n    surplus = CLIENT[\"annual_household_income\"] / 12 * 0.7 - CLIENT[\"monthly_expenses\"] - CLIENT[\"liabilities\"][\"home_loan_emi\"]\n    required = sum(g[\"required_monthly_sip\"] for g in goals)\n    net_worth = sum(CLIENT[\"assets\"].values()) - CLIENT[\"liabilities\"][\"home_loan_outstanding\"]\n    facts = {\"goals\": goals, \"net_worth\": net_worth, \"est_monthly_investable_surplus_post_tax\": round(surplus),\n             \"total_required_monthly_sip\": required, \"monthly_shortfall\": round(max(required - surplus, 0)),\n             \"existing_investable_assets\": sum(v for k, v in CLIENT[\"assets\"].items() if k != \"savings_account\"),\n             \"emergency_fund_months\": round(CLIENT[\"assets\"][\"savings_account\"] / CLIENT[\"monthly_expenses\"], 1)}\n    section(\"Computed facts\", json.dumps(facts, indent=2))\n\n    profiler = make_agent(\"Client Profiler\", \"Build a precise financial and risk profile of the client\",\n                          \"Certified financial planner who reads between the lines of client data.\")\n    strategist = make_agent(\"Portfolio Strategist\", \"Design a goals-based asset allocation and SIP plan\",\n                            \"Investment strategist who favours diversified, low-cost, tax-efficient portfolios.\")\n    compliance = make_agent(\"Compliance Reviewer\", \"Ensure advice is suitable, balanced and properly disclosed\",\n                            \"You check suitability, concentration, risk disclosures and that no returns are guaranteed.\")\n    t1 = make_task(\"Client:\\n{client}\\n\\nComputed facts:\\n{facts}\\n\\nProfile the client: net worth, cash flow, \"\n                   \"protection adequacy, risk capacity vs. tolerance.\", \"Client profile summary.\", profiler)\n    t2 = make_task(\"Model portfolios:\\n{models}\\n\\nComputed facts (use these figures; never do your own arithmetic):\\n{facts}\\n\\n\"\n                   \"The goals need more than the client can save (see monthly_shortfall). Prioritise the goals, decide how \"\n                   \"to use existing assets and the monthly surplus, suggest which goals to resize or delay, and recommend \"\n                   \"an allocation per goal. Also immediate actions (emergency fund, insurance, debt).\",\n                   \"Prioritised goal-wise plan with allocations, using only the computed figures.\", strategist, context=[t1])\n    t3 = make_task(\"Review the plan for suitability and produce the final client-ready advice letter with risk disclosures.\\n\\n\"\n                   \"Exact computed facts (quote these; never invent numbers):\\n{facts}\",\n                   \"Final advice letter: summary, plan per goal, actions, risks & disclaimers.\", compliance, context=[t1, t2])\n    section(\"Advice\", run_crew([profiler, strategist, compliance], [t1, t2, t3], {\n        \"client\": json.dumps(CLIENT, indent=2), \"facts\": json.dumps(facts, indent=2), \"models\": json.dumps(MODEL_PORTFOLIOS, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "27_portfolio_rebalancer", "title": "Portfolio Rebalancing Agent", "category": "wealth", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Detects drift from target allocation and proposes tax-aware rebalancing trades.", "how": "Agent uses `current_allocation` and `rebalance_trades` tools and explains each trade.", "today": "Markets move, so a client's portfolio drifts away from its agreed mix (e.g. too much in equities after a rally). Advisers rebalance by selling some winners and buying underweight assets, minding taxes.", "who": "Portfolio managers and advisers.", "why": "Rebalancing too little lets risk creep up; doing it carelessly triggers unnecessary taxes and costs.", "terms": ["Rebalancing", "Asset allocation", "Capital gains tax"], "code": "\"\"\"Portfolio Rebalancing Agent — LangChain tool-calling agent + Ollama.\n\nRun:  python 01_banking/27_portfolio_rebalancer/app.py\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nHOLDINGS = {  # ticker: (asset_class, units, price, cost_basis_per_unit, held_months)\n    \"VTI\": (\"US equity\", 420, 285.0, 190.0, 40),\n    \"VXUS\": (\"Intl equity\", 300, 64.0, 58.0, 30),\n    \"BND\": (\"Bonds\", 260, 72.5, 78.0, 26),\n    \"VNQ\": (\"REITs\", 90, 88.0, 92.0, 8),\n    \"CASH\": (\"Cash\", 9000, 1.0, 1.0, 0),\n}\nTARGET = {\"US equity\": 45, \"Intl equity\": 20, \"Bonds\": 25, \"REITs\": 5, \"Cash\": 5}\nBAND = 5  # rebalance if drift > 5pp\n\n\n@tool\ndef current_allocation() -> dict:\n    \"\"\"Current market value and weight by asset class, with drift vs target (percentage points).\"\"\"\n    values = {}\n    for asset, units, price, *_ in HOLDINGS.values():\n        values[asset] = values.get(asset, 0) + units * price\n    total = sum(values.values())\n    by_class = {a: {\"value\": round(v), \"weight_pct\": round(v / total * 100, 1), \"target_pct\": TARGET[a],\n                    \"drift_pp\": round(v / total * 100 - TARGET[a], 1)} for a, v in values.items()}\n    breach = any(abs(c[\"drift_pp\"]) > BAND for c in by_class.values())\n    return {\"total_value\": round(total), \"by_class\": by_class, \"rebalance_needed\": breach,\n            \"next_step\": \"Call rebalance_trades to get the exact trades.\" if breach else \"No action needed.\"}\n\n\n@tool\ndef rebalance_trades() -> list:\n    \"\"\"Trades (buy/sell amounts per ticker) to restore target weights, with estimated capital gain/loss on sells.\"\"\"\n    total = sum(u * p for _, u, p, *_ in HOLDINGS.values())\n    trades = []\n    for t, (asset, units, price, cost, months) in HOLDINGS.items():\n        diff = TARGET[asset] / 100 * total - units * price\n        if abs(diff) < 100 or t == \"CASH\":\n            continue\n        trade = {\"ticker\": t, \"action\": \"BUY\" if diff > 0 else \"SELL\", \"amount\": round(abs(diff)), \"units\": round(abs(diff) / price, 1)}\n        if diff < 0:\n            gain = (price - cost) * abs(diff) / price\n            trade.update(est_gain=round(gain), term=\"long-term\" if months >= 12 else \"short-term\")\n        trades.append(trade)\n    return trades\n\n\nSYSTEM = (\n    f\"You are a portfolio manager. Rebalancing band is +/-{BAND}pp. Use current_allocation to check drift; if any class \"\n    \"breaches the band, you MUST call rebalance_trades and present exactly those trades - never invent trade amounts \"\n    \"or tax outcomes. Explain each trade, highlight tax impact using est_gain and term (prefer realising losses, avoid \"\n    \"short-term gains), and suggest using cash/new contributions to reduce selling. End with a short client summary.\"\n)\n\n\ndef main():\n    banner(\"27 - Portfolio Rebalancing Agent (LangChain agent)\")\n    section(\"Recommendation\", run_agent(SYSTEM, [current_allocation, rebalance_trades], \"Review my portfolio and rebalance if needed.\"))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "28_risk_profiling_agent", "title": "Investor Risk Profiling Agent", "category": "wealth", "framework": "LangChain", "pattern": "Chain", "description": "Scores a risk questionnaire and explains the resulting risk profile to the clie = \"Conservative\" if pct < 30 else \"Moderately conservative\" if pct < 50 else \"Moderate\" if pct < 70 else \"Aggressive\"\n    # Inconsistency check: wants growth but cannot tolerate losses\n    flags = []\n    if pts[\"Primary objective\"] >= 5 and pts[\"Reaction to a 20% portfolio fall\"] <= 1:\n        flags.append(\"Wants maximum growth but would sell everything after a 20% fall\")\n    if pts[\"Investment experience\"] <= 2 and pts[\"Primary objective\"] >= 5:\n        flags.append(\"Aggressive objective with limited investment experience\")\n    return {\"points\": pts, \"score_pct\": pct, \"profile\": profile, \"inconsistencies\": flags}\n\n\nSYSTEM = (\n    \"You are a wealth relationship manager. Explain the client's risk profile in plain, friendly language \"\n    \"(max 150 words). If there are inconsistencies, explain them gently, recommend the more cautious profile until \"\n    \"discussed, and list 3 follow-up questions to ask the client.\"\n)\n\n\ndef main():\n    banner(\"28 - Investor Risk Profiling Agent (LangChain)\")\n    result = score(ANSWERS)\n    section(\"Score\", json.dumps(result, indent=2))\n    section(\"Client explanation\", run_chain(SYSTEM, \"Answers:\\n{a}\\n\\nResult:\\n{r}\",\n                                            a=json.dumps(ANSWERS, indent=2), r=json.dumps(result, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "29_market_news_summarizer", "title": "Market News Briefing for RMs", "category": "wealth", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Summarises market news and maps it to client holdings for relationship managers.", "how": "Market Analyst agent summarises themes; RM Briefing agent links them to each client's portfolio with talking points.", "today": "Every morning, relationship managers need to know what happened in markets and which of their clients are affected, so they can call them proactively.", "who": "Relationship managers, investment strategists.", "why": ngs: float, monthly_saving: float,\n                    monthly_expense_today: float, annual_return_pct: float = 7.0, inflation_pct: float = 3.0,\n                    post_retirement_return_pct: float = 5.0, years_in_retirement: int = 25) -> dict:\n    \"\"\"Full retirement calculation: required corpus, projected corpus, gap and the monthly saving needed.\n    Call again with different inputs for what-if questions (e.g. a later retire_age).\"\"\"\n    years = retire_age - current_age\n    r, n = annual_return_pct / 1200, years * 12\n    growth = (1 + r) ** n\n    projected = current_savings * growth + monthly_saving * (growth - 1) / r\n\n    first_year_expense = monthly_expense_today * 12 * (1 + inflation_pct / 100) ** years\n    real = (1 + post_retirement_return_pct / 100) / (1 + inflation_pct / 100) - 1\n    required = first_year_expense * (1 - (1 + real) ** -years_in_retirement) / real * (1 + real)\n\n    required_total_saving = max(required - current_savings * growth, 0) * r / (growth - 1)\n    return {\n        \"years_to_retirement\": years,\n        \"required_corpus\": round(required),\n        \"projected_corpus\": round(projected),\n        \"gap\": round(max(required - projected, 0)),\n        \"on_track\": projected >= required,\n        \"required_total_monthly_saving\": round(required_total_saving),\n        \"extra_monthly_saving_needed\": round(max(required_total_saving - monthly_saving, 0)),\n        \"assumptions\": f\"{annual_return_pct}% return before retirement, {post_retirement_return_pct}% after, \"\n                       f\"{inflation_pct}% inflation, {years_in_retirement} years in retirement\",\n    }\n\n\nSYSTEM = (\n    \"You are a retirement planning assistant. Call retirement_plan for every calculation and copy its numbers exactly - \"\n    \"never do arithmetic yourself. First answer the user's exact scenario (their stated retirement age): required \"\n    \"corpus, projected corpus, gap, extra monthly saving needed. Then give 3 \"\n    \"practical levers (retire later, save more, adjust allocation); you may call retirement_plan again to quantify a \"\n    \"lever such as a later retirement age. Note assumptions and that this is not personal advice.\"\n)\n\n\ndef main():\n    banner(\"30 - Retirement Planning Assistant (LangChain agent)\")\n    q = sys.argv[1] if len(sys.argv) > 1 else (\n        \"I'm 40, have 150,000 saved, save 1,000 a month and spend 3,500 a month. Can I retire at 60?\")\n    section(\"Question\", q)\n    section(\"Plan\", run_agent(SYSTEM, [retirement_plan], q))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "31_esg_investment_screener", "title": "ESG Investment Screener", "category": "wealth", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Screens a fund universe against ESG preferences and exclusions.", "how": "Python applies exclusions and score thresholds; ESG Analyst and Advisor agents explain trade-offs and shortlist funds.", "today": "More clients want investments that match their values, such as no tobacco or weapons and low carbon. Advisers screen funds and explain the trade-offs.", "who": "Investment advisers and ESG / product teams.", "why": "ESG data is messy and greenwashing is a regulatory risk.", "terms": ["ESG", "Asset allocation", "Suitability"], "code": "\"\"\"ESG Investment Screener — CrewAI + Ollama.\n\nRun:  python 01_banking/31_esg_investment_screener/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nFUNDS = [  # fictional fund universe\n    {\"fund\": \"Global Clean Energy Fund\", \"esg_score\": 82, \"carbon_intensity\": 45, \"fossil_fuel_pct\": 0, \"weapons_pct\": 0, \"tobacco_pct\": 0, \"ter_pct\": 0.85, \"return_5y_pct\": 9.1},\n    {\"fund\": \"World Index Tracker\", \"esg_score\": 58, \"carbon_intensity\": 140, \"fossil_fuel_pct\": 6, \"weapons_pct\": 1, \"tobacco_pct\": 1, \"ter_pct\": 0.12, \"return_5y_pct\": 10.4},\n    {\"fund\": \"ESG Leaders Equity\", \"esg_score\": 76, \"carbon_intensity\": 70, \"fossil_fuel_pct\": 1, \"weapons_pct\": 0, \"tobacco_pct\": 0, \"ter_pct\": 0.30, \"return_5y_pct\": 9.8},\n    {\"fund\": \"Emerging Markets Value\", \"esg_score\": 41, \"carbon_intensity\": 310, \"fossil_fuel_pct\": 14, \"weapons_pct\": 0, \"tobacco_pct\": 3, \"ter_pct\": 0.55, \"return_5y_pct\": 7.2},\n    {\"fund\": \"Green Bond Fund\", \"esg_score\": 79, \"carbon_intensity\": 30, \"fossil_fuel_pct\": 0, \"weapons_pct\": 0, \"tobacco_pct\": 0, \"ter_pct\": 0.25, \"return_5y_pct\": 3.4},\n    {\"fund\": \"Aerospace & Defence Opportunities\", \"esg_score\": 49, \"carbon_intensity\": 120, \"fossil_fuel_pct\": 0, \"weapons_pct\": 35, \"tobacco_pct\": 0, \"ter_pct\": 0.65, \"return_5y_pct\": 12.0},\n]\nPREFS = {\"min_esg_score\": 70, \"max_carbon_intensity\": 100, \"exclude\": [\"weapons\", \"tobacco\"], \"max_fossil_fuel_pct\": 2,\n         \"client_goal\": \"Long-term growth with balanced risk; values climate action\"}\n\n\ndef screen(f: dict):\n    reasons = []\n    if f[\"esg_score\"] < PREFS[\"min_esg_score\"]: reasons.append(f\"ESG score {f['esg_score']} < {PREFS['min_esg_score']}\")\n    if f[\"carbon_intensity\"] > PREFS[\"max_carbon_intensity\"]: reasons.append(f\"carbon intensity {f['carbon_intensity']}\")\n    for x in PREFS[\"exclude\"]:\n        if f[f\"{x}_pct\"] > 0: reasons.append(f\"{x} exposure {f[f'{x}_pct']}%\")\n    if f[\"fossil_fuel_pct\"] > PREFS[\"max_fossil_fuel_pct\"]: reasons.append(f\"fossil fuel {f['fossil_fuel_pct']}%\")\n    return {\"fund\": f[\"fund\"], \"passes\": not reasons, \"fail_reasons\": reasons}\n\n\ndef main():\n    banner(\"31 - ESG Investment Screener (CrewAI)\")\n    results = [screen(f) for f in FUNDS]\n    section(\"Screening\", json.dumps(results, indent=2))\n    esg = make_agent(\"ESG Analyst\", \"Explain ESG screening outcomes and trade-offs\",\n                     \"Sustainable-investing analyst who knows SFDR, exclusions vs best-in-class and greenwashing risks.\")\n    advisor = make_agent(\"Investment Advisor\", \"Build a shortlist that meets the client's values and financial goals\",\n                         \"You balance values, diversification, cost and expected return.\")\n    t1 = make_task(\"Funds:\\n{funds}\\n\\nPreferences:\\n{prefs}\\n\\nScreening:\\n{results}\\n\\n\"\n                   \"Explain why funds passed/failed and the return/cost trade-offs of applying these exclusions.\",\n                   \"ESG analysis.\", esg)\n    t2 = make_task(\"Recommend a shortlist and a simple allocation among passing funds only, noting diversification gaps.\\n\\n\"\n                   \"Screening results (only funds with passes=true may be recommended):\\n{results}\",\n                   \"Shortlist with allocation %, rationale, and trade-offs to discuss with the client.\", advisor, context=[t1])\n    section(\"Recommendation\", run_crew([esg, advisor], [t1, t2], {\n        \"funds\": json.dumps(FUNDS, indent=2), \"prefs\": json.dumps(PREFS, indent=2), \"results\": json.dumps(results, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "32_suitability_checker", "title": "Suitability & Mis-selling Checker", "category": "wealth", "framework": "LangChain", "pattern": "Structured extraction", "description": "Checks whether a recommended product is suitable for a client's profile before sale.", "how": "Rules compare product risk vs. client risk, horizon and concentration; LLM returns a structured suitability verdict.", "today": "Before a product is sold, a check confirms it suits the client's risk profile, knowledge, time horizon and need for cash.", "who": "Sales supervisors and compliance / conduct teams.", "why": "Mis-selling (especially to elderly or vulnerable customers) leads to compensation and fines.", "terms": ["Suitability", "Mis-selling", "Vulnerable customer", "Risk profile"], "code": "\"\"\"Suitability & Mis-selling Checker — rules + LangChain structured output.\n\nRun:  python 01_banking/32_suitability_checker/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\nfrom typing import Literal\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel\n\nfrom common import banner, run_structured, section\n\nCLIENT = {\"name\": \"Mrs. Lata Desai\", \"age\": 71, \"risk_profile\": \"Conservative (2/5)\", \"horizon_years\": 2,\n          \"liquid_net_worth\": 3_000_000, \"income_need\": \"Regular monthly income\", \"experience\": \"Fixed deposits only\"}\n\nPROPOSALS = [\n    {\"product\": \"Structured note linked to small-cap index, capital at risk, 5-year lock-in\", \"risk_rating\": 5, \"lock_in_years\": 5, \"amount\": 1_800_000},\n    {\"product\": \"Senior citizen savings scheme (government-backed)\", \"risk_rating\": 1, \"lock_in_years\": 5, \"amount\": 1_000_000},\n    {\"product\": \"Short-duration high-quality debt fund\", \"risk_rating\": 2, \"lock_in_years\": 0, \"amount\": 800_000},\n]\n\n\ndef rules(p: dict) -> list[str]:\n    client_risk = 2\n    issues = []\n    if p[\"risk_rating\"] > client_risk: issues.append(f\"Product risk {p['risk_rating']} > client risk {client_risk}\")\n    if p[\"lock_in_years\"] > CLIENT[\"horizon_years\"]: issues.append(f\"Lock-in {p['lock_in_years']}y exceeds horizon {CLIENT['horizon_years']}y\")\n    if p[\"amount\"] / CLIENT[\"liquid_net_worth\"] > 0.5: issues.append(\"Concentration >50% of liquid net worth\")\n    if \"structured\" in p[\"product\"].lower() and \"Fixed deposits only\" in CLIENT[\"experience\"]:\n        issues.append(\"Complex product for inexperienced client\")\n    return issues\n\n\nclass Verdict(BaseModel):\n    verdict: Literal[\"SUITABLE\", \"SUITABLE_WITH_CONDITIONS\", \"NOT_SUITABLE\"]\n    vulnerable_customer: bool\n    reasons: list[str]\n    required_actions: list[str]\n\n\ndef main():\n    banner(\"32 - Suitability & Mis-selling Checker (LangChain structured output)\")\n    system = (\"You are a suitability reviewer at a bank. Consider the rule findings, client vulnerability (age, experience), \"\n              \"liquidity needs and complexity. Rule breaches on risk or horizon should normally mean NOT_SUITABLE.\")\n    for p in PROPOSALS:\n        findings = rules(p)\n        v = run_structured(system, json.dumps({\"client\": CLIENT, \"proposal\": p, \"rule_findings\": findings}), Verdict)\n        section(p[\"product\"], f\"Rule findings: {findings or 'none'}\\n{v.model_dump_json(indent=2)}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "33_customer_support_agent", "title": "Banking Customer Support Agent", "category": "retail", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Answers balance, transaction and card questions and can block a lost card.", "how": "Agent uses `get_balance`, `recent_transactions`, `block_card` and `branch_hours` tools over a mock core-banking API.", "today": "Contact centres handle millions of simple requests: balances, recent transactions, blocking a lost card, branch hours.", "who": "Contact centre / customer service.", "why": "Simple requests clog queues; customers want 24/7 instant help, done securely.", "terms": ["Retail banking"], "code": "\"\"\"Banking Customer Support Agent — LangChain tool-calling agent + Ollama.\n\nInteractive chat over a mock core-banking API.\n\nRun:  python 01_banking/33_customer_support_agent/app.py            (demo questions)\n      python 01_banking/33_customer_support_agent/app.py --chat     (interactive)\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain.agents import create_agent\nfrom langchain_core.tools import tool\n\nfrom common import banner, get_llm, section\n\nCUSTOMER_ID = \"CUST-1001\"  # assume the user is already authenticated in the app\nACCOUNTS = {\"SAV-221\": {\"type\": \"Savings\", \"balance\": 4_215.40}, \"CUR-993\": {\"type\": \"Current\", \"balance\": 812.10}}\nTXNS = [(\"2026-10-09\", \"SAV-221\", -64.20, \"Amazon\"), (\"2026-10-08\", \"SAV-221\", 2_800.00, \"Salary ACME Ltd\"),\n        (\"2026-10-07\", \"CUR-993\", -120.00, \"Electric Co Direct Debit\"), (\"2026-10-06\", \"SAV-221\", -18.75, \"Coffee House\")]\nCARDS = {\"4821\": {\"type\": \"Debit\", \"status\": \"Active\"}, \"7710\": {\"type\": \"Credit\", \"status\": \"Active\"}}\n\n\n@tool\ndef get_balance(account_id: str = \"\") -> dict:\n    \"\"\"Get balances. Leave account_id empty for all accounts.\"\"\"\n    return {account_id: ACCOUNTS[account_id]} if account_id in ACCOUNTS else ACCOUNTS\n\n\n@tool\ndef recent_transactions(limit: int = 5) -> list:\n    \"\"\"Most recent transactions across accounts (date, account, amount, description).\"\"\"\n    return TXNS[:limit]\n\n\n@tool\ndef block_card(last4: str, reason: str) -> str:\n    \"\"\"Block a card immediately by its last 4 digits. reason: lost, stolen or suspected_fraud.\"\"\"\n    if last4 not in CARDS:\n        return f\"No card ending {last4}.\"\n    CARDS[last4][\"status\"] = \"Blocked\"\n    return f\"Card ending {last4} blocked ({reason}). Replacement dispatched in 5 working days. Ref BLK-{last4}-2026.\"\n\n\n@tool\ndef branch_hours(city: str) -> str:\n    \"\"\"Branch opening hours for a city.\"\"\"\n    return f\"{city.title()} branches: Mon-Fri 9:30-16:30, Sat 9:30-13:00. 24/7 phone support: 0800 123 456.\"\n\n\nSYSTEM = (\n    f\"You are a helpful, concise banking support assistant for authenticated customer {CUSTOMER_ID}. \"\n    \"Use tools to answer; never invent balances. Before blocking a card, confirm which card if ambiguous. \"\n    \"Never ask for PINs, passwords or OTPs. For complaints or anything you cannot do, offer to connect a human agent.\"\n)\n\n\ndef main():\n    banner(\"33 - Banking Customer Support Agent (LangChain agent)\")\n    agent = create_agent(model=get_llm(), tools=[get_balance, recent_transactions, block_card, branch_hours], system_prompt=SYSTEM)\n    history = []\n\n    def ask(q: str) -> str:\n        history.append({\"role\": \"user\", \"content\": q})\n        out = agent.invoke({\"messages\": history})\n        history[:] = out[\"messages\"]\n        return out[\"messages\"][-1].content\n\n    if \"--chat\" in sys.argv:\n        print(\"Type 'exit' to quit.\")\n        while (q := input(\"\\nYou: \").strip()).lower() not in {\"exit\", \"quit\"}:\n            print(f\"Bot: {ask(q)}\")\n        return\n    for q in [\"What's my total balance?\", \"Show my last 3 transactions\",\n              \"I lost my debit card ending 4821, please block it\", \"What time does the Leeds branch open on Saturday?\"]:\n        section(f\"You: {q}\", f\"Bot: {ask(q)}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "34_complaint_classifier", "title": "Complaint Classifier & Router", "category": "retail", "framework": "LangChain", "pattern": "Structured extraction", "description": "Classifies complaints by product, issue, severity and regulatory reportability and routes them.", "how": "Structured output schema plus routing table; SLA computed from severity.", "today": "Complaints arrive by email, phone and social media. Each must be categorised, prioritised and routed to the right team within regulatory deadlines.", "who": "Complaints handling teams, with conduct/compliance oversight.", "why": "Misrouted or late complaints breach rules; complaints from vulnerable customers need urgent attention.", "terms": ["Customer complaint handling", "Vulnerable customer", "Mis-selling"], "code": "\"\"\"Complaint Classifier & Router — LangChain structured output + Ollama.\n\nRun:  python 01_banking/34_complaint_classifier/app.py\n\"\"\"\n\nimport sys\nfrom pathlib import Path\nfrom typing import Literal\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom pydantic import BaseModel, Field\n\nfrom common import banner, run_structured, section\n\nCOMPLAINTS = [\n    \"I was charged a 35 overdraft fee twice for the same transaction and nobody at the branch could explain why. Refund it!\",\n    \"My father has dementia and someone at your bank sold him a 10-year insurance-linked investment. He doesn't understand it.\",\n    \"The mobile app keeps logging me out when I try to pay bills. Very annoying.\",\n    \"Money was taken from my account for a purchase I never made in another country, and my card is still with me.\",\n    \"Your loan agent called me 6 times a day and threatened to tell my employer about my missed EMI.\",\n]\n\nROUTING = {\"fees_charges\": \"Retail Ops - Fees\", \"mis_selling\": \"Conduct & Compliance\", \"digital_banking\": \"Digital Support\",\n           \"fraud_dispute\": \"Fraud Operations\", \"collections_conduct\": \"Collections Oversight\", \"other\": \"Customer Service\"}\nSLA_DAYS = {\"low\": 15, \"medium\": 10, \"high\": 3, \"critical\": 1}\n\n\nclass Complaint(BaseModel):\n    product: Literal[\"current_account\", \"credit_card\", \"debit_card\", \"loan\", \"investment_insurance\", \"mobile_app\", \"other\"]\n    category: Literal[\"fees_charges\", \"mis_selling\", \"digital_banking\", \"fraud_dispute\", \"collections_conduct\", \"other\"]\n    severity: Literal[\"low\", \"medium\", \"high\", \"critical\"]\n    vulnerable_customer: bool\n    regulatory_reportable: bool = Field(description=\"True for mis-selling, harassment, unauthorised transactions\")\n    sentiment: Literal[\"neutral\", \"frustrated\", \"angry\", \"distressed\"]\n    summary: str = Field(description=\"One-sentence summary\")\n\n\ndef main():\n    banner(\"34 - Complaint Classifier & Router (LangChain structured output)\")\n    system = (\n        \"Classify the banking complaint. Categories: fees_charges = disputed fees/interest; mis_selling = a product \"\n        \"sold that was unsuitable or not understood; digital_banking = app/online issues; fraud_dispute = unauthorised \"\n        \"transactions or scams; collections_conduct = debt collection behaviour. Vulnerable customers, harassment and \"\n        \"fraud are at least 'high' severity.\"\n    )\n    for text in COMPLAINTS:\n        c = run_structured(system, text, Complaint)\n        section(text[:70] + \"...\", f\"{c.model_dump_json(indent=2)}\\n-> Route: {ROUTING[c.category]} | SLA: {SLA_DAYS[c.severity]} day(s)\"\n                + (\" | FLAG: regulatory log\" if c.regulatory_reportable else \"\"))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "35_personal_finance_coach", "title": "Personal Finance Coach", "category": "retail", "framework": "LangChain", "pattern": "Chain", "description": "Analyses spending and gives personalised saving tips and a budget.", "how": "Transactions are categorised and summarised in Python; the LLM coaches against the 50/30/20 rule.", "today": "Banks increasingly help customers manage money, analysing spending and suggesting budgets and savings inside the banking app.", "who": "Digital banking / customer engagement teams.", "why": "Customers want personal, practical advice, not generic tips.", "terms": ["50/30/20 rule", "Retail banking"], "code": "\"\"\"Personal Finance Coach — LangChain chain + Ollama.\n\nRun:  python 01_banking/35_personal_finance_coach/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom collections import defaultdict\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\nINCOME = 5200  # monthly take-home\nTXNS = [(\"Rent\", 1650), (\"Tesco\", 210), (\"Uber Eats\", 64), (\"Deliveroo\", 48), (\"Netflix\", 15), (\"Spotify\", 11),\n        (\"Disney+\", 9), (\"Gym\", 55), (\"Electric\", 95), (\"Amazon\", 180), (\"Zara\", 140), (\"Uber Eats\", 52),\n        (\"Car loan\", 320), (\"Petrol\", 140), (\"Restaurants\", 230), (\"Sainsbury\", 175), (\"Phone\", 35), (\"ISA transfer\", 200),\n        (\"Pub\", 85), (\"Amazon\", 95), (\"Deliveroo\", 41), (\"Council tax\", 160), (\"Water\", 38)]\n\nCATEGORY = {\"Rent\": \"needs\", \"Electric\": \"needs\", \"Council tax\": \"needs\", \"Water\": \"needs\", \"Phone\": \"needs\",\n            \"Tesco\": \"needs\", \"Sainsbury\": \"needs\", \"Car loan\": \"needs\", \"Petrol\": \"needs\",\n            \"ISA transfer\": \"savings\"}  # everything else = wants\n\n\ndef analyse() -> dict:\n    by_bucket, by_merchant = defaultdict(float), defaultdict(float)\n    for m, amt in TXNS:\n        by_bucket[CATEGORY.get(m, \"wants\")] += amt\n        by_merchant[m] += amt\n    subs = {m: by_merchant[m] for m in (\"Netflix\", \"Spotify\", \"Disney+\", \"Gym\")}\n    takeaway = by_merchant[\"Uber Eats\"] + by_merchant[\"Deliveroo\"]\n    return {\"income\": INCOME, \"spent\": round(sum(a for _, a in TXNS)),\n            \"pct_of_income\": {k: round(v / INCOME * 100) for k, v in by_bucket.items()},\n            \"target_50_30_20\": {\"needs\": 50, \"wants\": 30, \"savings\": 20},\n            \"top_wants\": sorted(((m, a) for m, a in by_merchant.items() if CATEGORY.get(m, \"wants\") == \"wants\"), key=lambda x: -x[1])[:5],\n            \"subscriptions_total\": sum(subs.values()), \"takeaway_total\": takeaway}\n\n\nSYSTEM = (\n    \"You are a warm, practical personal finance coach inside a banking app. Using the analysis, give: a 2-line summary \"\n    \"vs the 50/30/20 rule, 4 specific saving tips with estimated monthly savings, a suggested monthly budget table, and one \"\n    \"encouraging closing line. No product sales, no investment advice.\"\n)\n\n\ndef main():\n    banner(\"35 - Personal Finance Coach (LangChain)\")\n    a = analyse()\n    section(\"Spending analysis\", json.dumps(a, indent=2))\n    section(\"Coaching\", run_chain(SYSTEM, \"Analysis:\\n{a}\", a=json.dumps(a, indent=2)))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "36_next_best_offer", "title": "Next Best Offer / Cross-sell", "category": "retail", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Recommends the next best product for each customer with a personalised message.", "how": "Python scores product propensity; a Marketing Analyst agent picks offers and a Copywriter agent drafts compliant messages.", "today": "Banks try to offer each customer the product they most likely need next (e.g. a credit card for a new salaried customer) at the right time and channel.", "who": "Marketing / CRM analytics teams.", "why": "Irrelevant offers annoy customers and can be seen as pushy or unfair.", "terms": ["Cross-sell / Next Best Offer", "Retail banking"], "code": "\"\"\"Next Best Offer / Cross-sell — CrewAI + Ollama.\n\nRun:  python 01_banking/36_next_best_offer/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nCUSTOMERS = [\n    {\"id\": \"R-1\", \"age\": 27, \"products\": [\"savings\"], \"salary_credit\": True, \"avg_balance\": 6200, \"card_spend_m\": 0,\n     \"events\": [\"Salary increased 20%\"], \"travel_spend_pct\": 0},\n    {\"id\": \"R-2\", \"age\": 35, \"products\": [\"savings\", \"credit_card\"], \"salary_credit\": True, \"avg_balance\": 28000, \"card_spend_m\": 1800,\n     \"events\": [\"Searched 'home loan' in app twice\"], \"travel_spend_pct\": 8},\n    {\"id\": \"R-3\", \"age\": 52, \"products\": [\"savings\", \"fixed_deposit\"], \"salary_credit\": False, \"avg_balance\": 95000, \"card_spend_m\": 0,\n     \"events\": [\"FD of 60,000 maturing in 10 days\"], \"travel_spend_pct\": 0},\n]\n\nPRODUCTS = [\"credit_card\", \"travel_card\", \"home_loan\", \"mutual_fund_sip\", \"term_insurance\", \"personal_loan\"]\n\n\ndef propensity(c: dict) -> dict:\n    s = {p: 0.1 for p in PRODUCTS if p not in c[\"products\"]}\n    if \"credit_card\" in s and c[\"salary_credit\"] and c[\"age\"] < 40: s[\"credit_card\"] += 0.5\n    if \"home_loan\" in s and any(\"home loan\" in e for e in c[\"events\"]): s[\"home_loan\"] += 0.7\n    if \"mutual_fund_sip\" in s and (c[\"avg_balance\"] > 20000 or any(\"FD\" in e for e in c[\"events\"])): s[\"mutual_fund_sip\"] += 0.5\n    if \"travel_card\" in s and c[\"travel_spend_pct\"] > 5: s[\"travel_card\"] += 0.4\n    if \"term_insurance\" in s and 25 <= c[\"age\"] <= 50: s[\"term_insurance\"] += 0.3\n    if any(\"Salary increased\" in e for e in c[\"events\"]): s[\"mutual_fund_sip\"] = s.get(\"mutual_fund_sip\", 0.1) + 0.3\n    return dict(sorted(((k, round(v, 2)) for k, v in s.items()), key=lambda x: -x[1])[:3])\n\n\ndef main():\n    banner(\"36 - Next Best Offer (CrewAI)\")\n    scores = {c[\"id\"]: propensity(c) for c in CUSTOMERS}\n    section(\"Propensity (top 3)\", json.dumps(scores, indent=2))\n    marketer = make_agent(\"Marketing Analyst\", \"Pick the single best offer per customer and the best channel and timing\",\n                          \"CRM analytics lead; you prioritise customer need over product push.\")\n    writer = make_agent(\"Compliance-aware Copywriter\", \"Write short personalised, fair and non-pushy offer messages\",\n                        \"You write bank marketing copy that is clear, not misleading and includes key terms.\")\n    t1 = make_task(\"Customers:\\n{customers}\\n\\nPropensity scores:\\n{scores}\\n\\nChoose next best offer, channel (app push, email, RM call) and timing.\",\n                   \"Per customer: offer, why, channel, timing.\", marketer)\n    t2 = make_task(\"Write the message for each customer (max 40 words, include an opt-out note).\",\n                   \"Per customer message ready to send.\", writer, context=[t1])\n    section(\"Campaign\", run_crew([marketer, writer], [t1, t2], {\"customers\": json.dumps(CUSTOMERS, indent=2),\n                                                                 \"scores\": json.dumps(scores, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "37_churn_retention_agent", "title": "Customer Churn Retention Agent", "category": "retail", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Identifies customers likely to leave and designs retention actions.", "how": "Churn signals scored in Python; Retention Analyst and Customer Success agents propose save offers.", "today": "Banks watch for customers about to leave (salary stops arriving, balances drop, complaints rise) and try to keep the valuable ones.", "who": "Customer analytics and retention / customer success teams.", "why": "Winning back a customer after they leave is much harder than keeping them.", "terms": ["Churn / attrition", "Retail banking"], "code": "\"\"\"Customer Churn Retention Agent — CrewAI + Ollama.\n\nRun:  python 01_banking/37_churn_retention_agent/app.py\n\"\"\"\n\nimport json\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nCUSTOMERS = [\n    {\"id\": \"C-11\", \"tenure_years\": 8, \"balance_trend_3m_pct\": -62, \"salary_credit_stopped\": True, \"logins_trend_pct\": -70,\n     \"complaints_90d\": 2, \"products\": 3, \"value_segment\": \"Affluent\", \"note\": \"Complained about FX fees twice\"},\n    {\"id\": \"C-12\", \"tenure_years\": 2, \"balance_trend_3m_pct\": 5, \"salary_credit_stopped\": False, \"logins_trend_pct\": 10,\n     \"complaints_90d\": 0, \"products\": 2, \"value_segment\": \"Mass\", \"note\": \"\"},\n    {\"id\": \"C-13\", \"tenure_years\": 4, \"balance_trend_3m_pct\": -35, \"salary_credit_stopped\": False, \"logins_trend_pct\": -40,\n     \"complaints_90d\": 1, \"products\": 1, \"value_segment\": \"Mass affluent\", \"note\": \"Asked about mortgage rates, then went quiet\"},\n]\n\n\ndef churn_risk(c: dict) -> dict:\n    s = 0\n    s += 30 if c[\"salary_credit_stopped\"] else 0\n    s += min(25, max(0, -c[\"balance_trend_3m_pct\"]) * 0.4)\n    s += min(20, max(0, -c[\"logins_trend_pct\"]) * 0.25)\n    s += c[\"complaints_90d\"] * 10\n    s += 10 if c[\"products\"] <= 1 else 0\n    return {\"id\": c[\"id\"], \"churn_score\": round(s), \"risk\": \"HIGH\" if s >= 60 else \"MEDIUM\" if s >= 30 else \"LOW\"}\n\n\ndef main():\n    banner(\"37 - Customer Churn Retention Agent (CrewAI)\")\n    risks = [churn_risk(c) for c in CUSTOMERS]\n    section(\"Churn risk\", json.dumps(risks, indent=2))\n    analyst = make_agent(\"Retention Analyst\", \"Diagnose likely churn reasons per customer\",\n                         \"Customer analytics specialist who reads behavioural signals.\")\n    success = make_agent(\"Customer Success Manager\", \"Design personalised save actions within budget\",\n                         \"You decide retention offers (fee waivers, rate matches, RM outreach) proportional to customer value.\")\n    t1 = make_task(\"Customers:\\n{customers}\\n\\nRisk:\\n{risks}\\n\\nDiagnose likely churn drivers for MEDIUM/HIGH risk customers.\",\n                   \"Per-customer diagnosis.\", analyst)\n    t2 = make_task(\"Design a retention play per at-risk customer: action, offer, owner, channel, script opener (1 sentence), success metric.\",\n                   \"Retention plan.\", success, context=[t1])\n    section(\"Retention plan\", run_crew([analyst, success], [t1, t2], {\"customers\": json.dumps(CUSTOMERS, indent=2),\n                                                                       \"risks\": json.dumps(risks, indent=2)}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "38_dispute_chargeback_assistant", "title": "Dispute & Chargeback Assistant", "category": "retail", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Guides a card dispute, determines the reason code and drafts the chargeback case.", "how": "Agent uses `lookup_transaction` and `reason_code_rules` tools and drafts the dispute summary.", "today": "When a customer disputes a card payment (item never arrived, cancelled subscription still charged), the bank raises a chargeback through Visa/Mastercard.", "who": "Card disputes / chargeback operations.", "why": "Each network has strict reason codes, deadlines and evidence rules; mistakes mean the bank loses the dispute.", "terms": ["Chargeback", "Reason code", "MCC"], "code": "\"\"\"Dispute & Chargeback Assistant — LangChain tool-calling agent + Ollama.\n\nRun:  python 01_banking/38_dispute_chargeback_assistant/app.py\n      python 01_banking/38_dispute_chargeback_assistant/app.py \"I cancelled my gym membership but TX-903 still charged me\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nTRANSACTIONS = {\n    \"TX-901\": {\"date\": \"2026-09-18\", \"merchant\": \"SkyHigh Airlines\", \"amount\": 640.00, \"network\": \"Visa\", \"status\": \"posted\"},\n    \"TX-902\": {\"date\": \"2026-09-22\", \"merchant\": \"TechMart Online\", \"amount\": 899.00, \"network\": \"Mastercard\", \"status\": \"posted\"},\n    \"TX-903\": {\"date\": \"2026-10-01\", \"merchant\": \"FitLife Gym\", \"amount\": 49.99, \"network\": \"Visa\", \"status\": \"posted\"},\n}\n\nREASON_CODES = {  # simplified\n    \"goods_not_received\": {\"Visa\": \"13.1\", \"Mastercard\": \"4855\", \"evidence\": \"Expected delivery date, merchant contact attempts\", \"window_days\": 120},\n    \"cancelled_recurring\": {\"Visa\": \"13.2\", \"Mastercard\": \"4841\", \"evidence\": \"Cancellation confirmation/date\", \"window_days\": 120},\n    \"not_as_described\": {\"Visa\": \"13.3\", \"Mastercard\": \"4853\", \"evidence\": \"Description vs. received item, return proof\", \"window_days\": 120},\n    \"duplicate_charge\": {\"Visa\": \"12.6.1\", \"Mastercard\": \"4834\", \"evidence\": \"Both transaction references\", \"window_days\": 120},\n    \"fraud_card_absent\": {\"Visa\": \"10.4\", \"Mastercard\": \"4837\", \"evidence\": \"Customer declaration, card blocked\", \"window_days\": 120},\n}\n\n\n@tool\ndef lookup_transaction(txn_id: str) -> dict:\n    \"\"\"Look up a card transaction by id (e.g. TX-901).\"\"\"\n    return TRANSACTIONS.get(txn_id.upper(), {\"error\": \"not found\"})\n\n\n@tool\ndef reason_code_rules(dispute_type: str, network: str) -> dict:\n    \"\"\"Get chargeback reason code, required evidence and time window. dispute_type is one of:\n    goods_not_received, cancelled_recurring, not_as_described, duplicate_charge, fraud_card_absent.\"\"\"\n    r = REASON_CODES.get(dispute_type)\n    return {\"reason_code\": r[network], \"evidence_required\": r[\"evidence\"], \"window_days\": r[\"window_days\"]} if r else {\"error\": \"unknown type\"}\n\n\nSYSTEM = (\n    \"You are a card disputes specialist. Look up the transaction, classify the dispute type, get the reason code rules, \"\n    \"then reply with: dispute type, reason code, evidence the customer must provide, whether a temporary credit applies, \"\n    \"and a short dispute case summary for the back office. If the merchant should be contacted first, say so.\"\n)\n\n\ndef main():\n    banner(\"38 - Dispute & Chargeback Assistant (LangChain agent)\")\n    q = sys.argv[1] if len(sys.argv) > 1 else (\n        \"I ordered a laptop from TechMart Online (TX-902) on 22 Sept, it was due 29 Sept and never arrived. The merchant ignores my emails.\")\n    section(\"Customer\", q)\n    section(\"Assistant\", run_agent(SYSTEM, [lookup_transaction, reason_code_rules], q))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "39_multilingual_faq_rag", "title": "Multilingual Banking FAQ (RAG)", "category": "retail", "framework": "LangChain", "pattern": "RAG", "description": "Answers product FAQs in the customer's language (e.g. Hindi, Spanish, French).", "how": "Translates the question to English, retrieves matching FAQ content, and answers in the language the question was asked in.", "today": "Customers ask the same product questions (fees, limits, PIN reset) in many languages.", "who": "Customer service and digital channels.", "why": "Maintaining FAQs and staff in every language is expensive.", "terms": ["Retail banking"], "code": "\"\"\"Multilingual Banking FAQ (RAG) — LangChain + Ollama.\n\nRun:  python 01_banking/39_multilingual_faq_rag/app.py\n      python 01_banking/39_multilingual_faq_rag/app.py \"¿Cuál es el límite diario de retiro en cajero?\"\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import SimpleRetriever, banner, run_chain, section\n\nFAQ = [\n    \"Daily ATM withdrawal limit: 1,000 on Classic debit cards and 2,500 on Platinum debit cards.\",\n    \"International transfers (SWIFT) cost 15 per transfer and arrive in 1-3 working days. Cut-off time is 3 pm.\",\n    \"To reset your mobile banking PIN: open the app, tap 'Forgot PIN', verify with your debit card and OTP.\",\n    \"Savings account interest is 3.5% per year, calculated daily and paid quarterly.\",\n    \"Minimum average monthly balance for a regular savings account is 1,000; a fee of 10 applies if not maintained.\",\n    \"Fixed deposits can be broken early with a 1% penalty on the applicable interest rate.\",\n    \"Lost or stolen cards can be blocked 24/7 in the app under Cards > Block, or by calling 0800 123 456.\",\n    \"Home loan pre-approval needs ID proof, last 3 payslips, 6 months bank statements and the property details.\",\n]\n\nSYSTEM = (\n    \"You are a multilingual bank assistant. Detect the language of the question and answer ONLY in that language, \"\n    \"using ONLY the FAQ context. If the context doesn't contain the answer, say so politely in that language and \"\n    \"suggest calling 0800 123 456. Keep answers under 80 words.\"\n)\n\n\ndef main():\n    banner(\"39 - Multilingual Banking FAQ (LangChain RAG)\")\n    retriever = SimpleRetriever(FAQ)\n    questions = sys.argv[1:] or [\n        \"ATM se ek din mein kitna paisa nikaal sakte hain?\",           # Hinglish\n        \"¿Cuánto cuesta una transferencia internacional?\",            # Spanish\n        \"Comment réinitialiser mon code PIN de l'application ?\",       # French\n        \"मेरा कार्ड खो गया है, क्या करूं?\",                                 # Hindi\n    ]\n    for q in questions:\n        # Translate to English for retrieval: the FAQ is English and the keyword fallback is English-only\n        english_q = run_chain(\"Translate the user's text to English. Output only the translation.\", \"{q}\", q=q)\n        ctx = \"\\n\".join(retriever.search(english_q, k=3))\n        section(f\"Q: {q}\", run_chain(SYSTEM, \"FAQ context:\\n{ctx}\\n\\nQuestion: {q}\", ctx=ctx, q=q))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "40_call_center_qa", "title": "Call Center QA Analyzer", "category": "retail", "framework": "CrewAI", "pattern": "Multi-agent", "description": "Scores call transcripts for compliance, empathy and resolution and coaches the agent.", "how": "QA Auditor agent scores against a checklist; Coach agent writes improvement feedback.", "today": "Quality teams listen to a sample of calls to check agents verified customers securely, handled fraud correctly and treated customers well.", "who": "Contact centre quality assurance and team leaders.", "why": "Only a tiny fraction of calls can be reviewed manually; security failures can enable fraud.", "terms": ["Call quality assurance (QA)", "Card fraud / CNP", "Vulnerable customer"], "code": "\"\"\"Call Center QA Analyzer — CrewAI + Ollama.\n\nRun:  python 01_banking/40_call_center_qa/app.py\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, make_agent, make_task, run_crew, section\n\nTRANSCRIPT = \"\"\"\nAgent: Thanks for calling City Bank, this is Sam. How can I help?\nCustomer: Hi, there's a charge of 250 on my credit card I don't recognise. It says 'XYZ Digital'.\nAgent: Okay. Can you give me your full card number and the CVV so I can check?\nCustomer: Um, sure, it's 4111... wait, do you need the CVV?\nAgent: Yeah it's fine, it's just for verification.\nCustomer: I'd rather not.\nAgent: Fine. I'll verify you another way. Date of birth and postcode please.\nCustomer: 12 March 1984, LS1 4AB.\nAgent: Thanks. Yes I see it. It's probably a subscription you forgot. Not much I can do really.\nCustomer: I never signed up for anything! I'm really worried.\nAgent: Well, you can raise a dispute but it takes ages. Anything else?\nCustomer: Can you at least block the card?\nAgent: Okay, blocked. New card in 5 days. Bye.\n\"\"\"\n\nCHECKLIST = \"\"\"\n1. Greeting & identification of agent (5)\n2. Secure verification - must NEVER ask for full card number, CVV, PIN or OTP (25, critical)\n3. Listening & empathy (15)\n4. Correct handling of suspected fraud: offer block, raise dispute/fraud claim, explain next steps & timelines (25)\n5. Accurate information, no assumptions (10)\n6. Ownership & resolution (10)\n7. Closing: summary, reference number, anything else (10)\n\"\"\"\n\n\ndef main():\n    banner(\"40 - Call Center QA Analyzer (CrewAI)\")\n    auditor = make_agent(\"QA Auditor\", \"Score the call objectively against the QA checklist\",\n                         \"Contact-centre quality lead in a regulated bank. A critical fail on security means the call fails overall.\")\n    coach = make_agent(\"Team Coach\", \"Turn QA results into constructive, specific coaching\",\n                       \"Supportive coach who gives specific 'say this instead' examples.\")\n    t1 = make_task(\"Transcript:\\n{transcript}\\n\\nChecklist (max points):\\n{checklist}\\n\\nScore each item with evidence quotes.\",\n                   \"Score table with evidence, total /100, critical fails, overall PASS/FAIL.\", auditor)\n    t2 = make_task(\"Write coaching feedback for the agent.\",\n                   \"Strengths, top 3 improvements with better phrasing examples, and any compliance escalation needed.\",\n                   coach, context=[t1])\n    section(\"QA report\", run_crew([auditor, coach], [t1, t2], {\"transcript\": TRANSCRIPT, \"checklist\": CHECKLIST}))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "41_swift_payment_validator", "title": "SWIFT Payment Repair Assistant", "category": "ops", "framework": "LangChain", "pattern": "Chain", "description": "Validates MT103 payment messages and suggests repairs for failed STP.", "how": "Python parses fields and validates BIC/IBAN/amount format; the LLM explains failures and proposes repairs.", "today": "International payments travel as SWIFT messages. If a field is wrong (bad BIC, invalid IBAN), the payment fails automatic processing and someone must repair it by hand.", "who": "Payments operations teams.", "why": "Manual repairs are slow and costly, and some repairs need customer confirmation.", "terms": ["SWIFT / MT103", "STP (Straight-Through Processing)", "BIC / IBAN / IFSC", "Charges code (OUR/SHA/BEN)"], "code": "\"\"\"SWIFT Payment Repair Assistant — Python validation + LangChain chain.\n\nRun:  python 01_banking/41_swift_payment_validator/app.py\n\"\"\"\n\nimport json\nimport re\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom common import banner, run_chain, section\n\nMT103 = \"\"\"{1:F01BANKGB2LAXXX0000000000}{2:I103DEUTDEFFXXXXN}{4:\n:20:REF20261012-001\n:23B:CRED\n:32A:261012EUR15000,5\n:50K:/GB29NWBK60161331926819\nACME TRADING LTD\n1 HIGH STREET LONDON\n:59:/DE89370400440532013001\nMULLER MASCHINENBAU GMBH\n:57A:DEUTDEFFX\n:70:INVOICE 4471 MACHINE PARTS\n:71A:SHAR\n-}\"\"\"\n\n\ndef iban_valid(iban: str) -> bool:\n    s = iban[4:] + iban[:4]\n    digits = \"\".join(str(int(c, 36)) for c in s)\n    return int(digits) % 97 == 1\n\n\ndef validate(msg: str) -> dict:\n    fields = dict(re.findall(r\":(\\d{2}[A-Z]?):([^:]*?)(?=\\n:|\\n-})\", msg, re.S))\n    issues = []\n    for tag in [\"20\", \"23B\", \"32A\", \"50K\", \"59\", \"71A\"]:\n        if tag not in fields:\n            issues.append(f\"Mandatory field :{tag}: missing\")\n    m = re.match(r\"(\\d{6})([A-Z]{3})([\\d,]+)$\", fields.get(\"32A\", \"\").strip())\n    if not m:\n        issues.append(\":32A: format must be YYMMDD + CCY + amount\")\n    elif m.group(2) == \"EUR\" and len(m.group(3).split(\",\")[-1]) > 2:\n        issues.append(f\":32A: amount {m.group(3)} has more than 2 decimals\")\n    if bic := fields.get(\"57A\", \"\").strip():\n        if not re.fullmatch(r\"[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?\", bic):\n            issues.append(f\":57A: BIC '{bic}' must be 8 or 11 characters (got {len(bic)})\")\n    for tag in [\"50K\", \"59\"]:\n        acct = fields.get(tag, \"\").strip().splitlines()[0].lstrip(\"/\") if tag in fields else \"\"\n        if acct and not iban_valid(acct):\n            issues.append(f\":{tag}: IBAN {acct} fails checksum\")\n    if fields.get(\"71A\", \"\").strip() not in {\"OUR\", \"SHA\", \"BEN\"}:\n        issues.append(f\":71A: charges code '{fields.get('71A', '').strip()}' invalid (OUR/SHA/BEN)\")\n    return {\"fields\": {k: v.strip() for k, v in fields.items()}, \"issues\": issues}\n\n\nSYSTEM = (\n    \"You are a payments operations specialist. For each validation issue explain why the MT103 would fail STP and \"\n    \"propose the exact corrected field value. Only obvious typos are safe to repair without the customer \"\n    \"(e.g. 'SHAR' -> 'SHA', a BIC with one stray character). Never change who bears charges, amounts, accounts or \"\n    \"IBANs: mark those 'Needs customer confirmation'. Finish with the repaired field list.\"\n)\n\n\ndef main():\n    banner(\"41 - SWIFT Payment Repair Assistant (LangChain)\")\n    v = validate(MT103)\n    section(\"Validation\", json.dumps(v, indent=2))\n    if v[\"issues\"]:\n        section(\"Repair suggestions\", run_chain(SYSTEM, \"Message:\\n{msg}\\n\\nIssues:\\n{issues}\", msg=MT103, issues=\"\\n\".join(v[\"issues\"])))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"slug": "42_cash_flow_forecaster", "title": "Corporate Cash Flow Forecaster", "category": "ops", "framework": "LangChain", "pattern": "Tool-calling agent", "description": "Forecasts a corporate client's 13-week cash position and highlights funding gaps.", "how": "Agent uses `forecast_cash` and `funding_gap` tools on historical inflows/outflows.", "today": "Corporate bankers help business clients forecast cash for the coming weeks to spot shortfalls and arrange funding in time.", "who": "Corporate relationship managers and transaction banking / treasury advisers.", "why": "Running out of cash, even for a week, can sink a profitable business.", "terms": ["Cash flow forecasting", "Working capital"], "code": "\"\"\"Corporate Cash Flow Forecaster — LangChain tool-calling agent + Ollama.\n\nRun:  python 01_banking/42_cash_flow_forecaster/app.py\n\"\"\"\n\nimport statistics\nimport sys\nfrom pathlib import Path\n\nsys.path.append(str(Path(__file__).resolve().parents[2]))\nfrom langchain_core.tools import tool\n\nfrom common import banner, run_agent, section\n\nOPENING_CASH = 1_200_000\nOVERDRAFT_LIMIT = 500_000\n# last 12 weeks of history (thousands)\nINFLOWS = [820, 760, 910, 700, 880, 790, 640, 610, 590, 650, 600, 580]\nOUTFLOWS = [780, 800, 820, 760, 850, 900, 780, 720, 750, 690, 740, 760]\nKNOWN_EVENTS = {5: (\"Payroll bonus\", -450), 9: (\"Tax payment\", -380), 11: (\"Large customer receipt\", 300)}  # week: (desc, k)\n\n\n@tool\ndef forecast_cash(weeks: int = 13) -> list:\n    \"\"\"13-week cash forecast (thousands) using recent trend plus known events; returns week, net flow, closing cash.\"\"\"\n    trend_in = statistics.mean(INFLOWS[-4:])\n    trend_out = statistics.mean(OUTFLOWS[-4:])\n    cash, rows = OPENING_CASH / 1000, []\n    for w in range(1, weeks + 1):\n        event = KNOWN_EVENTS.get(w, (\"\", 0))\n        net = trend_in - trend_out + event[1]\n        cash += net\n        rows.append({\"week\": w, \"net_flow\": round(net), \"closing_cash\": round(cash), \"event\": event[0]})\n    return rows\n\n\n@tool\ndef funding_gap() -> dict:\n    \"\"\"Identify the lowest projected cash point an
